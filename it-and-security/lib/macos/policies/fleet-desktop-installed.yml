- name: Fleet Desktop.app installed
  query: SELECT 1 FROM apps WHERE path = '/Applications/Fleet Desktop.app' AND bundle_identifier = 'com.fleetdm.fleet-desktop';
  critical: false
  description: Checks that Fleet Desktop.app is installed, so end users always have a way to reach self-service.
  resolution: "No action needed from you. Fleet reinstalls Fleet Desktop.app automatically when this policy fails. If it keeps failing, IT reviews the install error in the host's activity."
  hidden: true
  install_software:
    fleet_maintained_app_slug: fleet-desktop/darwin
  platform: darwin
