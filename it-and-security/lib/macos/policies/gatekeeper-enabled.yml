- name: Gatekeeper enabled
  query: SELECT 1 FROM gatekeeper WHERE assessments_enabled = 1;
  critical: false
  description: |-
    Verifies Gatekeeper is enabled so only trusted software runs.
  resolution: >-
    No action needed from you. Fleet turns on Gatekeeper with a configuration profile.
    If it keeps failing, IT checks the host's OS settings in Fleet.
  hidden: true
  platform: darwin
