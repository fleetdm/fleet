- name: Application firewall enabled
  query: SELECT 1 FROM alf WHERE global_state >= 1;
  critical: false
  description: |-
    Verifies the macOS Application Layer Firewall is on (global_state 1 = enabled, 2 = enabled blocking all inbound).
  resolution: >-
    No action needed from you. Fleet turns on the firewall with a configuration profile.
    If it keeps failing, IT checks the host's OS settings in Fleet.
  hidden: true
  platform: darwin
