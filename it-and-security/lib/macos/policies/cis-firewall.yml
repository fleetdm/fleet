- name: CIS 2.2.2 - Firewall stealth mode enabled
  query: |-
    SELECT 1 WHERE EXISTS (
      SELECT 1 FROM alf WHERE stealth_enabled = 1
    )
    OR EXISTS (
      SELECT 1 FROM managed_policies
      WHERE domain = 'com.apple.security.firewall'
        AND name = 'EnableStealthMode'
        AND (value = 1 OR value = 'true')
    );
  critical: false
  description: |-
    Verifies the macOS Application Firewall stealth mode is on, so the Mac does not respond to unsolicited probes such as ICMP ping (CIS macOS 2.2.2, Level 1).
  resolution: |-
    Stealth mode should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
- name: CIS 3.6 - Firewall logging enabled
  query: |-
    SELECT 1 WHERE EXISTS (
      SELECT 1 FROM alf WHERE logging_enabled = 1
    )
    OR EXISTS (
      SELECT 1 FROM managed_policies
      WHERE domain = 'com.apple.security.firewall'
        AND name = 'EnableLogging'
        AND (value = 1 OR value = 'true')
    );
  critical: false
  description: |-
    Verifies macOS Application Firewall logging is on (CIS macOS 3.6, Level 1). Accepts the setting pushed by MDM because the alf table can report logging incorrectly on newer macOS versions.
  resolution: |-
    Firewall logging should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
