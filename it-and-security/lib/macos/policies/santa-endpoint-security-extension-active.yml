- name: Santa Endpoint Security extension active
  platform: darwin
  description: Checks that Santa's Endpoint Security system extension is activated and enabled. Macs without Santa pass.
  resolution: "No action needed from you. Fleet runs a script that activates the extension when this policy fails. If it keeps failing, IT reviews the script output in the host's activity."
  hidden: true
  query: >-
    SELECT 1 WHERE NOT EXISTS (SELECT 1 FROM apps WHERE bundle_identifier = 'com.northpolesec.santa')
    OR EXISTS (
      SELECT 1 FROM system_extensions
      WHERE identifier = 'com.northpolesec.santa.daemon'
        AND team = 'ZMCG7MLDV9'
        AND lower(replace(state, ' ', '_')) = 'activated_enabled'
    )
  run_script:
    path: ../scripts/load-santa-system-extension.sh
