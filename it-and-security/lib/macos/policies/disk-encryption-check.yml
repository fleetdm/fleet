- name: Disk encryption enabled (macOS)
  query: SELECT 1 FROM filevault_status WHERE status LIKE '%on%';
  critical: false
  description: This policy checks if disk encryption is enabled.
  resolution: >-
    No action needed from you. Fleet turns on FileVault through MDM. If macOS needs you to log out or restart to
    finish, My device shows a banner. If it keeps failing, IT checks the host's disk encryption status in Fleet.
  hidden: true
  platform: darwin
