- name: CIS 5.2.1 - Password lockout threshold is 5 or fewer attempts
  query: SELECT 1 FROM pwd_policy WHERE max_failed_attempts <= 5;
  critical: false
  description: |-
    Verifies the Mac locks the account after 5 or fewer failed login attempts (CIS macOS 5.2.1, Level 1).
  resolution: |-
    The lockout threshold should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
- name: CIS 5.2.2 - Password minimum length is 15 or more
  query: |-
    SELECT 1
    FROM (
      SELECT CAST(lengthtxt AS INTEGER(2)) minlength
      FROM (
        SELECT SUBSTRING(length, 1, 2) AS lengthtxt
        FROM (
          SELECT policy_description, policy_identifier, split(policy_content, '{', 1) AS length
          FROM password_policy
          WHERE policy_identifier LIKE '%minLength'
        )
      )
      WHERE minlength >= 15
    );
  critical: false
  description: |-
    Verifies the password policy requires a minimum of 15 characters (CIS macOS 5.2.2, Level 1).
  resolution: |-
    Password length should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
- name: CIS 5.2.3-5.2.5 - Password requires a letter, a number and a special character
  query: |-
    SELECT 1 WHERE EXISTS (
      SELECT 1 FROM password_policy
      WHERE policy_identifier LIKE '%requiresAlpha%'
         OR policy_identifier LIKE '%requiresNumeric%'
         OR policy_identifier LIKE '%requiresSymbol%'
         OR policy_identifier LIKE '%minComplexChars%'
    );
  critical: false
  description: |-
    Verifies the password policy requires at least one letter, one number and one special character (CIS macOS 5.2.3, 5.2.4 and 5.2.5, Level 2).
  resolution: |-
    Password complexity should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
- name: CIS 5.2.6 - Password requires upper and lowercase letters
  query: |-
    SELECT 1 WHERE EXISTS (
      SELECT 1 FROM pwd_policy WHERE min_mixed_case_characters >= 1
    )
    OR EXISTS (
      SELECT 1 FROM password_policy
      WHERE instr(policy_content, '[A-Z]') > 0
        AND instr(policy_content, '[a-z]') > 0
    );
  critical: false
  description: |-
    Verifies the password policy requires both uppercase and lowercase letters (CIS macOS 5.2.6, Level 2). Requires macOS 14 or later.
  resolution: |-
    Mixed-case passwords should be automatically enforced by MDM. If this fails, make sure the Mac is on macOS 14 or later, restart, and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
- name: CIS 5.2.7 - Password expires within 365 days
  query: SELECT 1 FROM pwd_policy WHERE expires_every_n_days > 0 AND expires_every_n_days <= 365;
  critical: false
  description: |-
    Verifies passwords expire after 365 days or less (CIS macOS 5.2.7, Level 2).
  resolution: |-
    Password expiry should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
- name: CIS 5.2.8 - Password history is at least 24
  query: SELECT 1 FROM pwd_policy WHERE history_depth >= 24;
  critical: false
  description: |-
    Verifies the Mac blocks reuse of the last 24 passwords (CIS macOS 5.2.8, Level 1).
  resolution: |-
    Password history should be automatically enforced by MDM. If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
  calendar_events_enabled: false
