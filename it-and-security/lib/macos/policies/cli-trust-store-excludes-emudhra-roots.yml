# eMudhra intermediate CA compromise (disclosed 2026-10-20): https://emudhra.we-have-a-problem.com
# Fleet policy instead of a global one so it can run the remediation script, which must be defined in the same fleet.
- name: macOS command-line TLS trust store excludes compromised eMudhra roots
  query: |
    SELECT 1 WHERE NOT EXISTS (
      SELECT 1 FROM file f
      JOIN certificates c ON c.path = f.path
      WHERE f.path = '/etc/ssl/cert.pem'
        AND lower(c.sha1) IN (
          '3043fa4ff257dca0c380ee2e58ea78b23fe6bbc1',
          'd1eb23a46d17d68fd92564c2f1f1601764d8e349'
        )
    );
  critical: false
  description: >-
    macOS blocks the compromised eMudhra intermediates for Safari and apps that use Apple's TLS stack. The built-in
    curl, git, python3, perl, ruby, and openssl use /etc/ssl/cert.pem instead and don't check revocation, so they
    still trust certificates issued by the compromised intermediates.
  resolution: >-
    Fleet runs a script that removes the affected roots from /etc/ssl/cert.pem when this policy fails. A macOS update
    can restore the file, and Fleet runs the script again when it does. If it still fails after a refetch, drop a note
    in #help-it.
  platform: darwin
  calendar_events_enabled: false
  run_script:
    path: ../scripts/remove-emudhra-roots-macos-system.sh
