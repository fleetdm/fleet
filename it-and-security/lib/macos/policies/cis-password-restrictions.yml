# CIS Apple macOS Benchmark section 5.2 (password restrictions).
# Enforced by ../configuration-profiles/cis-l2-password-restrictions.mobileconfig.
# Queries are adapted from ee/cis/macos-14 and ee/cis/macos-26.
- name: CIS 5.2.1 - Password account lockout threshold is 5 or fewer attempts
  query: SELECT 1 FROM pwd_policy WHERE max_failed_attempts <= 5;
  critical: false
  description: |-
    CIS Level 1. Verifies the Mac locks the account after 5 or fewer failed password attempts, which mitigates brute-force password attacks.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically (maxFailedAttempts = 5). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
- name: CIS 5.2.2 - Password minimum length is 15 or more characters
  query: |-
    SELECT 1 WHERE EXISTS (
      SELECT 1 FROM (
        SELECT CAST(lengthtxt AS INTEGER(2)) AS minlength FROM (
          SELECT SUBSTRING(length, 1, 2) AS lengthtxt FROM (
            SELECT policy_description, policy_identifier, split(policy_content, '{', 1) AS length
            FROM password_policy
            WHERE policy_identifier LIKE '%minLength'
          )
        )
        WHERE minlength >= 15
      )
    )
    OR EXISTS (
      SELECT 1 FROM managed_policies
      WHERE domain = 'com.apple.mobiledevice.passwordpolicy'
        AND name = 'minLength'
        AND CAST(value AS INTEGER) >= 15
        AND username = ''
    );
  critical: false
  description: |-
    CIS Level 1. Verifies the Mac requires passwords of at least 15 characters.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically (minLength = 15). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
- name: CIS 5.2.3 and 5.2.4 - Password must contain alphabetic and numeric characters
  query: |-
    SELECT 1 WHERE
      EXISTS (
        SELECT 1 FROM managed_policies
        WHERE domain = 'com.apple.mobiledevice.passwordpolicy'
          AND name = 'requireAlphanumeric'
          AND (value = 1 OR value = 'true')
          AND username = ''
      )
      AND NOT EXISTS (
        SELECT 1 FROM managed_policies
        WHERE domain = 'com.apple.mobiledevice.passwordpolicy'
          AND name = 'requireAlphanumeric'
          AND (value != 1 AND value != 'true')
      );
  critical: false
  description: |-
    CIS Level 2. Verifies the Mac requires passwords to contain both alphabetic and numeric characters.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically (requireAlphanumeric = true). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
- name: CIS 5.2.5 - Password must contain a special character
  query: |-
    SELECT 1 WHERE
      EXISTS (
        SELECT 1 FROM managed_policies
        WHERE domain = 'com.apple.mobiledevice.passwordpolicy'
          AND name = 'minComplexChars'
          AND CAST(value AS INTEGER) >= 1
          AND username = ''
      )
      AND NOT EXISTS (
        SELECT 1 FROM managed_policies
        WHERE domain = 'com.apple.mobiledevice.passwordpolicy'
          AND name = 'minComplexChars'
          AND CAST(value AS INTEGER) < 1
      );
  critical: false
  description: |-
    CIS Level 2. Verifies the Mac requires at least one special (non-alphanumeric) character in passwords.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically (minComplexChars = 1). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
- name: CIS 5.2.6 - Password must contain uppercase and lowercase characters
  query: |-
    SELECT 1 WHERE
      EXISTS (SELECT 1 FROM pwd_policy WHERE min_mixed_case_characters >= 1)
      OR EXISTS (
        SELECT 1 FROM password_policy
        WHERE instr(policy_content, '(?=.*[A-Z])(?=.*[a-z])') > 0
      );
  critical: false
  description: |-
    CIS Level 2. Verifies the Mac requires both uppercase and lowercase letters in passwords.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically with a custom password regular expression (customRegex). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
- name: CIS 5.2.7 - Password maximum age is 365 days or fewer
  query: |-
    SELECT 1 WHERE
      EXISTS (SELECT 1 FROM pwd_policy WHERE expires_every_n_days > 0 AND expires_every_n_days <= 365)
      OR EXISTS (SELECT 1 FROM pwd_policy WHERE days_to_expiration > 0 AND days_to_expiration <= 365);
  critical: false
  description: |-
    CIS Level 1. Verifies the Mac requires users to change their password at least every 365 days.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically (maxPINAgeInDays = 365). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
- name: CIS 5.2.8 - Password history is 24 or more
  query: SELECT 1 FROM pwd_policy WHERE history_depth >= 24;
  critical: false
  description: |-
    CIS Level 1. Verifies the Mac prevents reuse of the previous 24 passwords.
  resolution: |-
    The CIS Level 2 password restrictions profile enforces this automatically (pinHistory = 24). If this fails, restart the Mac and refetch in Fleet Desktop.
    If it still fails, drop a note in #help-it.
  platform: darwin
