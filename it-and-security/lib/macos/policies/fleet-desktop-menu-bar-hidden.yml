- name: Fleet Desktop menu bar icon hidden
  query: >-
    SELECT 1 FROM plist p, orbit_info o
    WHERE p.path = '/Library/LaunchDaemons/com.fleetdm.orbit.plist'
      AND p.key = 'EnvironmentVariables'
      AND p.subkey = 'ORBIT_FLEET_DESKTOP'
      AND p.value = 'false'
      AND o.desktop_version = '';
  critical: false
  description: Hosts with Fleet Desktop.app use the app for self-service, so the Fleet Desktop menu bar icon is hidden.
  resolution: "Fleet runs a script that hides the menu bar icon when this policy fails. If it still fails after a refetch, drop a note in #help-it."
  run_script:
    path: ../scripts/hide-fleet-desktop-menu-bar.sh
  labels_include_any:
    - "Macs with Fleet Desktop.app installed"
  platform: darwin
