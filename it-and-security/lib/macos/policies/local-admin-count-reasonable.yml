- name: Local admin accounts within limit
  query: |-
    SELECT 1 WHERE (
      SELECT COUNT(DISTINCT u.uid)
      FROM users u
      INNER JOIN user_groups ug ON u.uid = ug.uid
      INNER JOIN groups g ON ug.gid = g.gid
      WHERE g.groupname = 'admin'
    ) <= 5;
  critical: false
  description: |-
    Flags Macs with more than five distinct users in the local `admin` group (review for over-privileged accounts).
  resolution: >-
    No action needed from you. IT reviews failing hosts and reaches out if any local admin accounts need to be
    removed or changed to standard accounts.
  hidden: true
  platform: darwin
