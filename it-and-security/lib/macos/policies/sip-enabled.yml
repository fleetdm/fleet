- name: System Integrity Protection enabled
  query: SELECT 1 FROM sip_config WHERE config_flag = 'sip' AND enabled = 1;
  critical: true
  description: |-
    Verifies System Integrity Protection (SIP) is enabled.
  resolution: >-
    No action needed from you. IT reviews failing hosts and works with you to turn System Integrity Protection back
    on from macOS Recovery.
  hidden: true
  platform: darwin
