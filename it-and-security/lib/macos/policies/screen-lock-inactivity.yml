- name: Screen lock after inactivity (15 minutes or less)
  query: |-
    SELECT 1 WHERE EXISTS (
      SELECT 1
      FROM managed_policies
      WHERE domain = 'com.apple.screensaver'
        AND name = 'askForPasswordDelay'
        AND CAST(value AS INTEGER) <= 60
      LIMIT 1
    )
    AND EXISTS (
      SELECT 1
      FROM managed_policies
      WHERE domain = 'com.apple.screensaver'
        AND name = 'idleTime'
        AND CAST(value AS INTEGER) >= 1
        AND CAST(value AS INTEGER) <= 900
      LIMIT 1
    )
    AND EXISTS (
      SELECT 1
      FROM managed_policies
      WHERE domain = 'com.apple.screensaver'
        AND name = 'askForPassword'
        AND (value = 1 OR value = '1')
      LIMIT 1
    );
  critical: false
  description: |-
    Verifies the Mac requires a password to wake from the screen saver and starts the screen saver after 15 minutes or less of inactivity.
  resolution: >-
    No action needed from you. Fleet sets the screen lock with a configuration profile.
    If it keeps failing, IT checks the host's OS settings in Fleet.
  hidden: true
  platform: darwin
  labels_exclude_any:
    - macOS screen lock exclusions
