- name: Removable storage is read-only
  critical: false
  hidden: true
  description: Checks that USB removable storage (USB sticks, external HDD/SSD presented as removable, SD cards) is read-only on Linux hosts.
  resolution: |
    No action needed from you. Fleet runs a script that installs a udev rule at
    /etc/udev/rules.d/99-fleet-readonly-removable-storage.rules, which makes USB
    removable block devices read-only at the kernel level. If it keeps failing,
    IT reviews the script output in the host's activity.
  platform: linux
  labels_exclude_any:
    - "Linux hosts excluded from external storage restrictions"
  query: |
    SELECT 1 FROM file
    WHERE path = '/etc/udev/rules.d/99-fleet-readonly-removable-storage.rules'
      AND type = 'regular';
  run_script:
    path: ../scripts/install-readonly-removable-storage.sh
