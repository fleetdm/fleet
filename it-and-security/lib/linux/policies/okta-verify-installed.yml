# This policy pushes Okta Verify to Ubuntu workstations that are already enrolled (in addition to
# `setup_experience: true` on the software package, which installs Okta Verify during initial
# enrollment/setup for new hosts). When a host fails the policy (Okta Verify isn't installed yet),
# Fleet automatically installs it via `install_software.package_path`.
#
# Okta ships Okta Verify for Linux as an Ubuntu-only package (24.04 LTS and 26.04 LTS), so every
# other Linux release passes this policy unevaluated, the same way `latest-linux.yml` skips
# distributions it has no rule for. See release notes:
# https://help.okta.com/oie/en-us/content/topics/releasenotes/ov/ov-release-notes-linux.htm
#
# NOTE: the package name checked below ('okta-verify') is an assumption based on Okta's naming
# convention for other platforms and should be confirmed against the actual .deb once it's
# downloaded from the Okta Admin Console.
- name: Okta Verify installed (Ubuntu)
  query: |
    SELECT 1 FROM os_version WHERE
      CASE
        -- Okta Verify for Linux supports Ubuntu 24.04 LTS and 26.04 LTS.
        WHEN platform = 'ubuntu' AND major IN (24, 26) AND minor = 4 THEN
          EXISTS (SELECT 1 FROM deb_packages WHERE name = 'okta-verify')
        -- Any other Linux release is out of scope for Okta Verify and is not evaluated.
        ELSE 1
      END;
  critical: false
  description: This policy checks that Okta Verify is installed on Ubuntu workstations.
  resolution: "Okta Verify is managed by IT and installs automatically when this policy fails. If you are still failing after Refetch completes, drop a note in #help-it."
  platform: linux
  labels_include_all:
    - "Ubuntu hosts"
    - "x86-based Linux hosts"
  install_software:
    package_path: ../software/okta-verify-deb.yml
