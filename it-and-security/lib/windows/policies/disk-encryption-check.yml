- name: Disk encryption enabled (Windows)
  query: SELECT 1 FROM bitlocker_info WHERE protection_status = 1;
  critical: false
  description: This policy checks if disk encryption is enabled.
  resolution: >-
    No action needed from you. Fleet turns on BitLocker through MDM. If Windows needs a restart or a BitLocker PIN to
    finish, My device shows a banner. If it keeps failing, IT checks the host's disk encryption status in Fleet.
  hidden: true
  platform: windows
