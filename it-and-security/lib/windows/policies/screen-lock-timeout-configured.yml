- name: Interactive logon screen lock timeout configured
  query: |-
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
      AND name = 'InactivityTimeoutSecs'
      AND CAST(data AS INTEGER) > 0
      AND CAST(data AS INTEGER) <= 900;
  critical: false
  description: |-
    Verifies the screen lock inactivity timeout is set to 15 minutes or less.
  resolution: >-
    No action needed from you. Fleet sets the screen lock timeout with a configuration profile.
    If it keeps failing, IT checks the host's OS settings in Fleet.
  hidden: true
  platform: windows
  labels_exclude_any:
    - Windows screen lock exclusions
