- name: Secure Boot enabled
  query: |-
    SELECT 1 FROM registry
    WHERE key = 'HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\SecureBoot\State'
      AND name = 'UEFISecureBootEnabled'
      AND data = '1';
  critical: false
  description: |-
    Verifies UEFI Secure Boot is enabled.
  resolution: >-
    No action needed from you. IT reviews failing hosts and works with you to turn Secure Boot back on in the
    firmware (UEFI) settings.
  hidden: true
  platform: windows
