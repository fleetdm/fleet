- name: Linux - PHP2Shell exposure
  automations_enabled: false
  description: |
    Exposure to PHP2Shell (CVE-2026-109618, CVE-2026-109619), the October 2026 PHP runtime
    RCE. Returns one row per finding with the columns finding, item, detail, and status.
    No row for a finding means it was not found.

    Checks every installed PHP package (deb and rpm, distro and third-party repositories)
    against the vendor's fixed build, running PHP workers and Apache mod_php for stale code,
    containers that run PHP images, the interim-mitigation drop-in, and shells spawned by
    PHP workers.

    Fixed upstream: 8.5.12, 8.4.27, 8.3.36, 8.2.35. Vendor backports keep the old version
    number; fixed builds per distro as of 2026-10-23.
    Source: https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  discard_data: false
  interval: 86400
  logging: snapshot
  observer_can_run: true
  platform: linux
  query: |
    WITH os AS (
      SELECT platform, platform_like, major, version FROM os_version LIMIT 1
    ),
    php AS (
      SELECT name, version AS pkg
      FROM deb_packages
      WHERE status = 'install ok installed'
        AND (name GLOB 'php[0-9].[0-9]-common' OR name GLOB 'php[0-9].[0-9]-fpm'
             OR name GLOB 'php[0-9].[0-9]-cgi' OR name GLOB 'php[0-9].[0-9]-cli'
             OR name GLOB 'php[0-9].[0-9]-embed' OR name GLOB 'libapache2-mod-php[0-9].[0-9]'
             OR name GLOB 'lsphp[0-9][0-9]' OR name GLOB 'lsphp[0-9][0-9]-common'
             OR name IN ('php5', 'php5-common', 'php5-fpm', 'php5-cgi', 'php5-cli', 'libapache2-mod-php5'))
      UNION ALL
      SELECT name, version || '-' || release
      FROM rpm_packages
      WHERE version GLOB '[5-8].[0-9]*.[0-9]*'
        AND (name IN ('php', 'php-common', 'php-cli', 'php-fpm', 'php-cgi')
             OR name GLOB 'php[0-9]*-common' OR name GLOB 'php[0-9]*-fpm' OR name GLOB 'php[0-9]*-cli'
             OR name GLOB 'php[0-9]' OR name GLOB 'php[0-9][0-9]' OR name GLOB 'php[0-9].[0-9]'
             OR name GLOB 'apache2-mod_php*' OR name GLOB 'mod_php*'
             OR name GLOB 'lsphp[0-9][0-9]' OR name GLOB 'ea-php[0-9][0-9]-php-common' OR name GLOB 'alt-php[0-9][0-9]')
    ),
    branched AS (
      SELECT p.name, p.pkg,
             -- Strip a Debian epoch ("1:7.4.33-...") so the branch is always the first 3 chars.
             CASE WHEN p.pkg LIKE '%:%' THEN substr(p.pkg, instr(p.pkg, ':') + 1) ELSE p.pkg END AS v,
             (p.pkg LIKE '%sury%' OR p.pkg LIKE '%+0~20%') AS sury,
             -- Remi, LiteSpeed, cPanel EasyApache, and CloudLinux ship upstream version numbers
             (p.pkg LIKE '%.remi%' OR p.name GLOB 'lsphp*' OR p.name GLOB 'ea-php*' OR p.name GLOB 'alt-php*') AS upstream,
             (p.pkg LIKE '%.alma.%') AS alma,
             o.platform, o.platform_like, o.major, o.version AS os_version
      FROM php p, os o
    ),
    fixed AS (
      SELECT name, pkg, v, substr(v, 1, 3) AS branch,
        -- Ubuntu security updates always carry "ubuntu" in the version; a GA sync build like
        -- 8.3.6-0maysync1 does not, and version_compare can't order it against the fixed build
        (platform = 'ubuntu' AND NOT sury AND NOT upstream AND v NOT LIKE '%ubuntu%') AS ga_build,
        CASE
          -- packages.sury.org and ppa:ondrej/php ship upstream version numbers (EOL branches: patched revisions)
          WHEN sury THEN CASE substr(v, 1, 3)
            WHEN '8.5' THEN '8.5.12' WHEN '8.4' THEN '8.4.27' WHEN '8.3' THEN '8.3.36' WHEN '8.2' THEN '8.2.35'
            WHEN '8.1' THEN '8.1.34-9' WHEN '8.0' THEN '8.0.30-25' WHEN '7.4' THEN '7.4.33-31'
            WHEN '7.3' THEN '7.3.33-35' WHEN '7.2' THEN '7.2.34-66' WHEN '7.1' THEN '7.1.33-80'
            WHEN '7.0' THEN '7.0.33-92' WHEN '5.6' THEN '5.6.40-104' END
          WHEN upstream THEN CASE substr(v, 1, 3)
            WHEN '8.5' THEN '8.5.12' WHEN '8.4' THEN '8.4.27' WHEN '8.3' THEN '8.3.36' WHEN '8.2' THEN '8.2.35' END
          -- Ubuntu backports without changing the upstream version (USN-8948-1, USN-8948-2)
          WHEN platform = 'ubuntu' THEN CASE
            WHEN os_version LIKE '26.10%' AND substr(v, 1, 3) = '8.5' THEN '8.5.9-0ubuntu2.1'
            WHEN os_version LIKE '26.04%' AND substr(v, 1, 3) = '8.5' THEN '8.5.4-0ubuntu1.5'
            WHEN os_version LIKE '24.04%' AND substr(v, 1, 3) = '8.3' THEN '8.3.6-0ubuntu0.24.04.13'
            WHEN os_version LIKE '22.04%' AND substr(v, 1, 3) = '8.1' THEN '8.1.2-1ubuntu2.28'
            WHEN os_version LIKE '20.04%' AND substr(v, 1, 3) = '7.4' THEN '7.4.3-4ubuntu2.29+esm5'
            WHEN os_version LIKE '18.04%' AND substr(v, 1, 3) = '7.2' THEN '7.2.24-0ubuntu0.18.04.17+esm14'
            WHEN os_version LIKE '16.04%' AND substr(v, 1, 3) = '7.0' THEN '7.0.33-0ubuntu0.16.04.16+esm22'
            WHEN os_version LIKE '14.04%' AND substr(v, 1, 3) = '5.5' THEN '5.5.9+dfsg-1ubuntu4.29+esm18' END
          -- Debian (DSA-6574-1, DLA-4848-1) and Freexian ELTS (ELA-1853-1, ELA-1854-1)
          WHEN platform = 'debian' THEN CASE
            WHEN substr(v, 1, 3) = '8.5' THEN '8.5.12' WHEN substr(v, 1, 3) = '8.4' THEN '8.4.27'
            WHEN substr(v, 1, 3) = '8.3' THEN '8.3.36' WHEN substr(v, 1, 3) = '8.2' THEN '8.2.35'
            WHEN major = '11' AND substr(v, 1, 3) = '7.4' THEN '7.4.33-1+deb11u14'
            WHEN major = '10' AND substr(v, 1, 3) = '7.3' THEN '7.3.31-1~deb10u16' END
          -- osquery reports every distro with /etc/redhat-release as platform 'rhel', Fedora included, so match Fedora first
          WHEN platform = 'fedora' OR os_version LIKE 'Fedora%' THEN CASE substr(v, 1, 3)
            WHEN '8.5' THEN '8.5.12' WHEN '8.4' THEN '8.4.27' END
          -- AlmaLinux rebuilds keep the old version and add a .alma.1 release (ALSA 2026-10-21)
          WHEN platform = 'rhel' AND alma THEN CASE
            WHEN major = '10' AND substr(v, 1, 3) = '8.4' THEN '8.4.24-1.el10_2.alma.1'
            WHEN major = '10' AND substr(v, 1, 3) = '8.3' THEN '8.3.33-1.el10_2.alma.1'
            WHEN major = '9' AND substr(v, 1, 3) = '8.3' THEN '8.3.33-1.module_el9.8.0+328'
            WHEN major = '9' AND substr(v, 1, 3) = '8.2' THEN '8.2.33-1.module_el9.8.0+327'
            WHEN major = '9' AND substr(v, 1, 3) = '8.1' THEN '8.1.32-1.module_el9.8.0+326'
            WHEN major = '9' AND substr(v, 1, 3) = '8.0' THEN '8.0.30-8.el9_8.alma.1'
            WHEN major = '8' AND substr(v, 1, 3) = '8.2' THEN '8.2.33-1.module_el8.10.0+4320'
            WHEN major = '8' AND substr(v, 1, 3) = '8.0' THEN '8.0.30-1.module_el8.10.0+4319'
            WHEN major = '8' AND substr(v, 1, 3) = '7.4' THEN '7.4.33-8.module_el8.10.0+4321'
            WHEN major = '8' AND substr(v, 1, 3) = '7.3' THEN '7.3.20-1.module_el8.10.0+4316'
            WHEN major = '8' AND substr(v, 1, 3) = '7.2' THEN '7.2.24-1.module_el8.10.0+4315' END
          -- RHEL, Rocky, Oracle, CentOS Stream (RHSA-2026:87070 to 87151). RHEL 9 php:8.4 had no fix on 2026-10-23.
          WHEN platform = 'rhel' THEN CASE
            WHEN major = '10' AND substr(v, 1, 3) = '8.4' THEN '8.4.27'
            WHEN major = '10' AND substr(v, 1, 3) = '8.3' THEN '8.3.36'
            WHEN major = '9' AND substr(v, 1, 3) = '8.3' THEN '8.3.36'
            WHEN major = '9' AND substr(v, 1, 3) = '8.2' THEN '8.2.35'
            WHEN major = '9' AND substr(v, 1, 3) = '8.0' THEN '8.0.30-8.el9_8.1'
            WHEN major = '8' AND substr(v, 1, 3) = '8.2' THEN '8.2.35'
            WHEN major = '8' AND substr(v, 1, 3) = '7.4' THEN '7.4.33-8' END
          -- Amazon Linux 2023 (ALAS2023-2026-3301 to 3304) and the AL2 php8.2 extra. php8.1 and AL2 core php: no fix planned.
          WHEN platform = 'amzn' THEN CASE substr(v, 1, 3)
            WHEN '8.5' THEN '8.5.12' WHEN '8.4' THEN '8.4.27' WHEN '8.3' THEN '8.3.36' WHEN '8.2' THEN '8.2.35' END
          -- SUSE (SUSE-SU-2026:4843-1, 4844-1, 4852-1, 4853-1, 4870-1)
          WHEN platform_like LIKE '%suse%' THEN CASE
            WHEN substr(v, 1, 3) = '8.5' THEN '8.5.12' WHEN substr(v, 1, 3) = '8.4' THEN '8.4.27'
            WHEN substr(v, 1, 3) = '8.3' THEN '8.3.36' WHEN substr(v, 1, 3) = '8.2' THEN '8.2.35'
            WHEN substr(v, 1, 3) = '8.0' THEN '8.0.30-150400.4.80.1'
            WHEN substr(v, 1, 3) = '7.4' AND major = '15' THEN '7.4.33-150400.4.81.1'
            WHEN substr(v, 1, 3) = '7.4' AND major = '12' THEN '7.4.33-1.74.1' END
          -- Any other distro: supported branches use upstream numbers; EOL branches need a vendor check
          ELSE CASE substr(v, 1, 3)
            WHEN '8.5' THEN '8.5.12' WHEN '8.4' THEN '8.4.27' WHEN '8.3' THEN '8.3.36' WHEN '8.2' THEN '8.2.35' END
        END AS fixed
      FROM branched
    )
    SELECT 'php_package' AS finding, name AS item, pkg AS detail,
           CASE WHEN fixed IS NULL THEN 'NO_VENDOR_FIX_KNOWN for this branch; verify with the vendor or move to a supported branch'
                WHEN ga_build THEN 'UPDATE to ' || fixed
                WHEN version_compare(replace(replace(v, '+', '.'), '_', '.'), replace(replace(fixed, '+', '.'), '_', '.')) < 0 THEN 'UPDATE to ' || fixed
                ELSE 'FIXED' END AS status
    FROM fixed
    UNION ALL
    -- Workers started before the package update keep the old code. on_disk = 0 means the binary was replaced.
    SELECT 'php_worker', p.name || ' (' || COUNT(*) || ' processes)', p.path || ' uid=' || MIN(p.uid) || ' oldest_start=' || datetime(MIN(p.start_time), 'unixepoch') || 'Z',
           CASE WHEN MIN(p.on_disk) = 0 OR MAX(f.mtime) > MIN(p.start_time) THEN 'STALE binary replaced since start; restart the service'
                ELSE 'RUNNING' END
    FROM processes p
    LEFT JOIN file f ON f.path = p.path
    WHERE p.name LIKE 'php-fpm%' OR p.name LIKE 'php%-php-fpm' OR p.name IN ('php-cgi', 'lsphp', 'frankenphp')
    GROUP BY p.name, p.path
    UNION ALL
    -- Apache with mod_php: the master process maps libphp. A reload keeps the old library; only a restart drops it.
    SELECT 'mod_php', p.name || ' pid ' || p.pid, m.path,
           CASE WHEN m.path LIKE '% (deleted)' OR f.mtime > p.start_time THEN 'STALE libphp replaced since start; restart Apache (reload is not enough)'
                ELSE 'LOADED' END
    FROM processes p
    JOIN process_memory_map m ON m.pid = p.pid
    LEFT JOIN file f ON f.path = m.path
    WHERE p.name IN ('apache2', 'httpd', 'httpd-prefork') AND p.uid = 0 AND m.path LIKE '%libphp%'
    GROUP BY p.pid, m.path
    UNION ALL
    SELECT 'docker_container', name, image, 'REBUILD on a fixed image (php:8.2.35, 8.3.36, 8.4.27, 8.5.12 and up) and recreate the container'
    FROM docker_containers
    WHERE state = 'running'
      AND (image LIKE '%php%' OR image LIKE '%wordpress%' OR image LIKE '%drupal%' OR image LIKE '%joomla%'
           OR image LIKE '%nextcloud%' OR image LIKE '%laravel%' OR image LIKE '%symfony%' OR image LIKE '%magento%'
           OR image LIKE '%mediawiki%' OR image LIKE '%phpmyadmin%' OR image LIKE '%frankenphp%')
    UNION ALL
    SELECT 'mitigation_dropin', path, datetime(mtime, 'unixepoch') || 'Z', 'PRESENT session upload progress disabled (partial mitigation, update PHP)'
    FROM file
    WHERE path LIKE '/etc/php/%/%/conf.d/99-php2shell-mitigation.ini' OR path = '/etc/php.d/99-php2shell-mitigation.ini'
       OR (path LIKE '/etc/php%/conf.d/99-php2shell-mitigation.ini' AND path GLOB '/etc/php[0-9]*/conf.d/99-php2shell-mitigation.ini')
       OR path LIKE '/etc/opt/remi/php%/php.d/99-php2shell-mitigation.ini' OR path LIKE '/opt/cpanel/ea-php%/root/etc/php.d/99-php2shell-mitigation.ini'
       OR path LIKE '/opt/alt/php%/etc/php.d/99-php2shell-mitigation.ini'
    UNION ALL
    -- Exploitation lands as a shell or tool whose parent is a PHP worker. Point-in-time: enable process auditing for history.
    SELECT 'web_worker_child', c.name || ' pid ' || c.pid, 'parent ' || p.name || ' pid ' || p.pid || ' uid=' || c.uid || ' cmd=' || substr(c.cmdline, 1, 200),
           'INVESTIGATE a web worker spawned a shell or tool'
    FROM processes c
    JOIN processes p ON p.pid = c.parent
    WHERE (p.name IN ('apache2', 'httpd', 'httpd-prefork', 'php-cgi', 'lsphp', 'frankenphp') OR p.name LIKE 'php-fpm%' OR p.name LIKE 'php%-php-fpm')
      AND c.name IN ('sh', 'bash', 'dash', 'zsh', 'ash', 'busybox', 'python', 'python3', 'perl', 'ruby', 'curl', 'wget',
                     'nc', 'ncat', 'netcat', 'socat', 'id', 'whoami', 'uname', 'hostname', 'base64', 'chmod', 'crontab', 'ssh')
    UNION ALL
    SELECT 'php_in_tmp', path, 'uid=' || uid || ' mtime=' || datetime(mtime, 'unixepoch') || 'Z', 'INVESTIGATE PHP file in a temp directory'
    FROM file
    WHERE (path LIKE '/tmp/%.php' OR path LIKE '/var/tmp/%.php' OR path LIKE '/dev/shm/%.php') AND type = 'regular'
    UNION ALL
    SELECT 'host', name, version || ' ' || platform_like, 'INFO'
    FROM os_version;

- name: macOS - PHP2Shell exposure
  automations_enabled: false
  description: |
    Exposure to PHP2Shell (CVE-2026-109618, CVE-2026-109619), the October 2026 PHP runtime
    RCE. Returns one row per finding with the columns finding, item, detail, and status.
    No row for a finding means it was not found.

    Checks Homebrew PHP formulas against the fixed releases (8.5.12, 8.4.27, 8.3.36, 8.2.35),
    MAMP's bundled runtimes, running PHP workers and Apache mod_php for stale code, containers
    that run PHP images, and shells spawned by PHP workers.
    Source: https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  discard_data: false
  interval: 86400
  logging: snapshot
  observer_can_run: true
  platform: darwin
  query: |
    SELECT 'homebrew_php' AS finding, name AS item, version || ' ' || path AS detail,
           CASE WHEN version LIKE '8.5.%' THEN CASE WHEN version_compare(replace(version, '_', '.'), '8.5.12') < 0 THEN 'UPDATE to 8.5.12' ELSE 'FIXED' END
                WHEN version LIKE '8.4.%' THEN CASE WHEN version_compare(replace(version, '_', '.'), '8.4.27') < 0 THEN 'UPDATE to 8.4.27' ELSE 'FIXED' END
                WHEN version LIKE '8.3.%' THEN CASE WHEN version_compare(replace(version, '_', '.'), '8.3.36') < 0 THEN 'UPDATE to 8.3.36' ELSE 'FIXED' END
                WHEN version LIKE '8.2.%' THEN CASE WHEN version_compare(replace(version, '_', '.'), '8.2.35') < 0 THEN 'UPDATE to 8.2.35' ELSE 'FIXED' END
                ELSE 'NO_FIX Homebrew no longer updates this branch; move to php@8.2 or newer' END AS status
    FROM homebrew_packages
    WHERE name = 'php' OR name LIKE 'php@%'
    UNION ALL
    SELECT 'mamp_php', replace(rtrim(path, '/'), '/Applications/MAMP/bin/php/', ''), rtrim(path, '/'), 'CHECK bundled runtime; MAMP must ship 8.2.35, 8.3.36, 8.4.27, or 8.5.12'
    FROM file
    WHERE path LIKE '/Applications/MAMP/bin/php/php%' AND type = 'directory'
    UNION ALL
    SELECT 'php_worker', p.name || ' (' || COUNT(*) || ' processes)', p.path || ' uid=' || MIN(p.uid) || ' oldest_start=' || datetime(MIN(p.start_time), 'unixepoch') || 'Z',
           CASE WHEN MIN(p.on_disk) = 0 OR MAX(f.mtime) > MIN(p.start_time) THEN 'STALE binary replaced since start; restart the service'
                ELSE 'RUNNING' END
    FROM processes p
    LEFT JOIN file f ON f.path = p.path
    WHERE p.name IN ('php-fpm', 'php-cgi', 'frankenphp')
    GROUP BY p.name, p.path
    UNION ALL
    SELECT 'mod_php', p.name || ' pid ' || p.pid, m.path,
           CASE WHEN f.mtime > p.start_time THEN 'STALE libphp replaced since start; restart httpd' ELSE 'LOADED' END
    FROM processes p
    JOIN process_memory_map m ON m.pid = p.pid
    LEFT JOIN file f ON f.path = m.path
    WHERE p.name = 'httpd' AND p.uid = 0 AND m.path LIKE '%libphp%'
    GROUP BY p.pid, m.path
    UNION ALL
    SELECT 'docker_container', name, image, 'REBUILD on a fixed image (php:8.2.35, 8.3.36, 8.4.27, 8.5.12 and up) and recreate the container'
    FROM docker_containers
    WHERE state = 'running'
      AND (image LIKE '%php%' OR image LIKE '%wordpress%' OR image LIKE '%drupal%' OR image LIKE '%joomla%'
           OR image LIKE '%nextcloud%' OR image LIKE '%laravel%' OR image LIKE '%frankenphp%')
    UNION ALL
    SELECT 'web_worker_child', c.name || ' pid ' || c.pid, 'parent ' || p.name || ' pid ' || p.pid || ' uid=' || c.uid || ' cmd=' || substr(c.cmdline, 1, 200),
           'INVESTIGATE a web worker spawned a shell or tool'
    FROM processes c
    JOIN processes p ON p.pid = c.parent
    WHERE p.name IN ('httpd', 'php-fpm', 'php-cgi', 'frankenphp')
      AND c.name IN ('sh', 'bash', 'zsh', 'python3', 'perl', 'ruby', 'curl', 'nc', 'socat', 'id', 'whoami', 'uname', 'base64', 'chmod', 'crontab', 'osascript')
    UNION ALL
    SELECT 'host', name, version || ' (' || build || ')', 'INFO'
    FROM os_version;

- name: Windows - PHP2Shell exposure
  automations_enabled: false
  description: |
    Exposure to PHP2Shell (CVE-2026-109618, CVE-2026-109619), the October 2026 PHP runtime
    RCE. Returns one row per finding with the columns finding, item, detail, and status.
    No row for a finding means it was not found.

    Checks php.exe builds in the common install locations and in running processes against the
    fixed releases (8.5.12, 8.4.27, 8.3.36, 8.2.35), XAMPP, running PHP workers for stale code,
    the php.ini mitigation, and shells spawned by IIS, Apache, or PHP workers.
    Source: https://github.com/php/php-src/security/advisories/GHSA-w8hw-w9fx-j79w
  discard_data: false
  interval: 86400
  logging: snapshot
  observer_can_run: true
  platform: windows
  query: |
    WITH candidates AS (
      SELECT path FROM file
      WHERE path LIKE 'C:\php%\php.exe' OR path LIKE 'C:\Program Files\PHP\php.exe'
         OR path LIKE 'C:\Program Files\PHP\%\php.exe' OR path LIKE 'C:\Program Files (x86)\PHP\%\php.exe'
         OR path LIKE 'C:\xampp\php\php.exe' OR path LIKE 'C:\wamp64\bin\php\%\php.exe'
         OR path LIKE 'C:\wamp\bin\php\%\php.exe' OR path LIKE 'C:\laragon\bin\php\%\php.exe'
         OR path LIKE 'C:\tools\php%\php.exe' OR path LIKE 'C:\inetpub\PHP\%\php.exe'
         OR path LIKE 'C:\Program Files\iis express\PHP\%\php.exe'
      UNION
      SELECT DISTINCT path FROM processes
      WHERE name IN ('php.exe', 'php-cgi.exe', 'php-win.exe') AND path <> ''
    )
    SELECT 'php_build' AS finding, c.path AS item, 'file_version=' || f.file_version AS detail,
           CASE WHEN f.file_version LIKE '8.5.%' THEN CASE WHEN version_compare(f.file_version, '8.5.12') < 0 THEN 'UPDATE to 8.5.12' ELSE 'FIXED' END
                WHEN f.file_version LIKE '8.4.%' THEN CASE WHEN version_compare(f.file_version, '8.4.27') < 0 THEN 'UPDATE to 8.4.27' ELSE 'FIXED' END
                WHEN f.file_version LIKE '8.3.%' THEN CASE WHEN version_compare(f.file_version, '8.3.36') < 0 THEN 'UPDATE to 8.3.36' ELSE 'FIXED' END
                WHEN f.file_version LIKE '8.2.%' THEN CASE WHEN version_compare(f.file_version, '8.2.35') < 0 THEN 'UPDATE to 8.2.35' ELSE 'FIXED' END
                ELSE 'NO_FIX no fixed Windows build for this branch; move to 8.2 or newer' END AS status
    FROM candidates c
    JOIN file f ON f.path = c.path
    UNION ALL
    SELECT 'xampp', name, version, 'CHECK bundled PHP; XAMPP must ship 8.2.35, 8.3.36, 8.4.27, or 8.5.12'
    FROM programs
    WHERE name LIKE 'XAMPP%'
    UNION ALL
    SELECT 'php_worker', p.name || ' (' || COUNT(*) || ' processes)', p.path || ' oldest_start=' || datetime(MIN(p.start_time), 'unixepoch') || 'Z',
           CASE WHEN MAX(f.mtime) > MIN(p.start_time) THEN 'STALE binary replaced since start; restart IIS or Apache' ELSE 'RUNNING' END
    FROM processes p
    LEFT JOIN file f ON f.path = p.path
    WHERE p.name IN ('php.exe', 'php-cgi.exe', 'php-win.exe')
    GROUP BY p.name, p.path
    UNION ALL
    -- Only the php.ini next to php.exe is read (PHP can also load one from PHPRC or the registry).
    -- file_lines errors on a missing path, so CASE checks the file exists before reading it.
    SELECT 'mitigation_ini', replace(c.path, 'php.exe', 'php.ini'),
           CASE WHEN NOT EXISTS (SELECT 1 FROM file f WHERE f.path = replace(c.path, 'php.exe', 'php.ini')) THEN 'no php.ini next to php.exe'
                WHEN EXISTS (SELECT 1 FROM file_lines l WHERE l.path = replace(c.path, 'php.exe', 'php.ini')
                             AND l.line LIKE 'session.upload_progress.enabled%0%') THEN 'session.upload_progress.enabled = 0'
                ELSE 'session upload progress still enabled' END,
           CASE WHEN NOT EXISTS (SELECT 1 FROM file f WHERE f.path = replace(c.path, 'php.exe', 'php.ini')) THEN 'ABSENT run mitigate-php2shell-windows.ps1 until the build is replaced'
                WHEN EXISTS (SELECT 1 FROM file_lines l WHERE l.path = replace(c.path, 'php.exe', 'php.ini')
                             AND l.line LIKE 'session.upload_progress.enabled%0%') THEN 'PRESENT partial mitigation, replace the build'
                ELSE 'ABSENT run mitigate-php2shell-windows.ps1 until the build is replaced' END
    FROM candidates c
    UNION ALL
    SELECT 'web_worker_child', c.name || ' pid ' || c.pid, 'parent ' || p.name || ' pid ' || p.pid || ' cmd=' || substr(c.cmdline, 1, 200),
           'INVESTIGATE a web worker spawned a shell or tool'
    FROM processes c
    JOIN processes p ON p.pid = c.parent
    WHERE p.name IN ('w3wp.exe', 'httpd.exe', 'php-cgi.exe', 'php.exe', 'nginx.exe')
      AND c.name IN ('cmd.exe', 'powershell.exe', 'pwsh.exe', 'certutil.exe', 'bitsadmin.exe', 'curl.exe', 'whoami.exe', 'net.exe',
                     'rundll32.exe', 'mshta.exe', 'wscript.exe', 'cscript.exe', 'regsvr32.exe', 'schtasks.exe')
    UNION ALL
    SELECT 'host', name, version || ' build ' || build, 'INFO'
    FROM os_version;
