<script>
// ---- scoring core: kept in step with build.py's scoring_config() and exp_scorer(). ----
const SIGS = DATA.signals, S = SIGS.length, SIDX = Object.fromEntries(SIGS.map((s, i) => [s.id, i]));
const CATS = DATA.categories, C = CATS.length, CIDX = Object.fromEntries(CATS.map((c, i) => [c.id, i]));
const MISSING = 255;
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// The defaults with a saved copy's valid values on top.
function mergeScoring(user) {
  const cfg = JSON.parse(JSON.stringify(DATA.builtin));
  if (!user || typeof user !== "object" || Array.isArray(user)) return cfg;
  for (const [k, lo, hi] of [["target", 0, 100], ["stale_days", 1, 35], ["min_cohort", 1, 100]]) if (isNum(user[k])) cfg[k] = clamp(user[k], lo, hi);
  if (typeof user.host_views === "boolean") cfg.host_views = user.host_views;
  const g = user.grades;
  if (Array.isArray(g) && g.length && g.every((x) => Array.isArray(x) && x.length === 2 && typeof x[0] === "string" && x[0].trim() && isNum(x[1]))) {
    cfg.grades = g.map((x) => [x[0].trim().slice(0, 3), clamp(x[1], 0, 100)]).sort((a, b) => b[1] - a[1]);
  }
  const ucats = user.categories && typeof user.categories === "object" ? user.categories : {};
  for (const [cid, cat] of Object.entries(cfg.categories)) {
    const uc = ucats[cid];
    if (!uc || typeof uc !== "object") continue;
    if (isNum(uc.weight)) cat.weight = Math.max(0, uc.weight);
    const usigs = uc.signals && typeof uc.signals === "object" ? uc.signals : {};
    for (const [sid, sc] of Object.entries(cat.signals)) {
      const us = usigs[sid];
      if (!us || typeof us !== "object") continue;
      if (isNum(us.weight)) sc.weight = Math.max(0, us.weight);
      if (["skip", "neutral", "worst"].includes(us.missing)) sc.missing = us.missing;
      if (isNum(us.neutral)) sc.neutral = clamp(us.neutral, 0, 100);
      if (sc.points && us.points && typeof us.points === "object") {
        for (const k of Object.keys(sc.points)) if (isNum(us.points[k])) sc.points[k] = clamp(us.points[k], 0, 100);
      }
      const b = us.bands;
      if (sc.bands && Array.isArray(b) && b.length && b.every((x) => Array.isArray(x) && x.length === 2 && (x[0] === null || isNum(x[0])) && isNum(x[1]))) {
        const lower = SIGS[SIDX[sid]].better === "lower";
        const ts = b.filter((x) => x[0] !== null).sort((x, y) => (lower ? x[0] - y[0] : y[0] - x[0]));
        const restBand = b.find((x) => x[0] === null);
        const rest = restBand ? restBand[1] : ts.length ? ts[ts.length - 1][1] : 0;
        sc.bands = [...ts.map((x) => [x[0], clamp(x[1], 0, 100)]), [null, clamp(rest, 0, 100)]];
      }
    }
  }
  return cfg;
}

function bandPoints(sig, bands, v) {
  for (const [t, p] of bands) if (t === null || (sig.better === "lower" ? v <= t : v >= t)) return +p;
  return 0;
}

function compile(cfg) {
  return Object.entries(cfg.categories).map(([cid, cat]) => ({
    cid, ci: CIDX[cid], cw: +cat.weight,
    sigs: Object.entries(cat.signals).flatMap(([sid, sc]) => {
      const sig = SIGS[SIDX[sid]];
      if (!sig || !(sc.weight > 0)) return [];
      const pts = sig.kind === "levels" ? sig.levels.map(([k]) => +(sc.points[k] ?? 0))
        : Array.from({ length: sig.cap + 1 }, (_, c) => bandPoints(sig, sc.bands, c * sig.step));
      const vals = sig.kind === "levels" ? Object.values(sc.points) : sc.bands.map((x) => x[1]);
      const m = sc.missing || "skip";
      const miss = m === "skip" ? null : m === "neutral" ? +(sc.neutral ?? 75) : Math.min(...vals);
      return [{ s: SIDX[sid], sid, sig, plats: sig.plats || null, w: +sc.weight, pts, miss }];
    }),
  }));
}

// Scores one computer-day from its codes (a slice of S values) into catOut; returns the score or NaN.
function scoreCodes(plan, codes, off, plat, catOut) {
  let total = 0, tw = 0;
  catOut.fill(NaN);
  for (const c of plan) {
    let sw = 0, sp = 0;
    for (const g of c.sigs) {
      if (g.plats && !g.plats.includes(plat)) continue;
      const v = codes[off + g.s];
      let p;
      if (v === MISSING) {
        if (g.miss === null) continue;
        p = g.miss;
      } else p = g.pts[Math.min(g.pts.length - 1, v)];
      sw += g.w;
      sp += g.w * p;
    }
    if (sw > 0) {
      const cs = sp / sw;
      catOut[c.ci] = cs;
      if (c.cw > 0) { total += c.cw * cs; tw += c.cw; }
    }
  }
  return tw > 0 ? total / tw : NaN;
}
// ---- end scoring core ----

const DAYS = DATA.days, N = DATA.hosts.length, TODAY = DAYS - 1;
const START = Date.parse(DATA.start + "T00:00:00Z");
const dateOf = (di) => new Date(START + di * 864e5).toISOString().slice(0, 10);
const CODES = new Uint8Array(N * DAYS * S);
const PRESENT = new Uint8Array(N * DAYS);
const HOSTS = DATA.hosts.map(([id, name, fi, p, mi, ci, oi, di, codes], i) => {
  for (let d = 0; d < DAYS; d++) {
    let any = 0;
    for (let s = 0; s < S; s++) {
      const k = d * S + s, c = codes.charCodeAt(k), at = (i * DAYS + d) * S + s;
      CODES[at] = c === 46 || Number.isNaN(c) ? MISSING : c <= 57 ? c - 48 : c - 87;
      if (CODES[at] !== MISSING) any = 1;
    }
    PRESENT[i * DAYS + d] = any;
  }
  const n = DATA.names;
  return { id, _id: id, i, name, p, fleet: n.fleets[fi], model: n.models[mi] || "Unknown model", chip: n.chips[ci] || "Unknown CPU",
    os: n.oses[oi] || "", dept: n.depts[di] || "" };
});
const BY_ID = new Map(HOSTS.map((h) => [String(h.id), h]));
const code = (h, di, sid) => CODES[(h.i * DAYS + di) * S + SIDX[sid]];
const CHECKIN = SIDX.checkin;

// ---- settings state ----
let SAVED = mergeScoring(DATA.scoring);
let SAVED_META = null; // {at, by} once the page's store answers
// Unsaved settings: DRAFT is what the editor's inputs change, DRAFT_EFF its cleaned-up
// copy (bands in order, values in range) that the page scores with.
let DRAFT = null, DRAFT_EFF = null;
let DB = null, USER = null, DOWNLOADS = null, EDIT = false, LOG = null, SAVE_ERROR = "";
const active = () => (DRAFT ? DRAFT_EFF : SAVED);
const draftDirty = () => Boolean(DRAFT) && JSON.stringify(DRAFT_EFF) !== JSON.stringify(SAVED);
function setDraft(cfg) {
  DRAFT = cfg ? JSON.parse(JSON.stringify(cfg)) : null;
  DRAFT_EFF = cfg ? mergeScoring(DRAFT) : null;
}

let PLAN, COMP, CATSC, STALE;
function computeAll(cfg) {
  PLAN = compile(cfg);
  COMP = new Float64Array(N * DAYS).fill(NaN);
  CATSC = new Float64Array(N * DAYS * C).fill(NaN);
  STALE = new Uint8Array(N * DAYS);
  const tmp = new Float64Array(C);
  const trend = new Map();
  for (const h of HOSTS) {
    const key = `${h.fleet}|${h.p}`;
    for (let d = 0; d < DAYS; d++) {
      const at = h.i * DAYS + d;
      if (!PRESENT[at]) continue;
      const chk = CODES[at * S + CHECKIN];
      if (chk !== MISSING && chk > cfg.stale_days) STALE[at] = 1;
      COMP[at] = scoreCodes(PLAN, CODES, at * S, h.p, tmp);
      CATSC.set(tmp, at * C);
      if (STALE[at] || !Number.isFinite(COMP[at])) continue;
      const date = dateOf(d);
      if (!trend.has(date)) trend.set(date, {});
      const row = (trend.get(date)[key] ||= {});
      row.scored = (row.scored || 0) + 1;
      row.score = (row.score || 0) + COMP[at];
      if (COMP[at] >= cfg.target) row.good = (row.good || 0) + 1;
      for (let c = 0; c < C; c++) {
        if (!Number.isFinite(tmp[c])) continue;
        row[`c_${CATS[c].id}`] = (row[`c_${CATS[c].id}`] || 0) + tmp[c];
        row[`n_${CATS[c].id}`] = (row[`n_${CATS[c].id}`] || 0) + 1;
      }
    }
  }
  DATA.trend = [...trend.entries()].sort((a, b) => (a[0] < b[0] ? -1 : 1));
}

const comp = (h, d = TODAY) => COMP[h.i * DAYS + d];
const catScore = (h, ci, d = TODAY) => CATSC[(h.i * DAYS + d) * C + ci];
const scored = (h, d = TODAY) => Number.isFinite(comp(h, d)) && !STALE[h.i * DAYS + d];
// The day a week back, or the closest earlier day with a score within 3 more days.
function weekAgo(h) {
  for (let d = TODAY - 7; d >= Math.max(0, TODAY - 10); d--) if (scored(h, d)) return d;
  return null;
}

// Each signal's points and the points it costs the computer's score on one day.
function breakdown(h, d, cfg = active(), plan = PLAN) {
  const at = (h.i * DAYS + d) * S;
  const tw = plan.reduce((a, c) => {
    if (!(c.cw > 0)) return a;
    const any = c.sigs.some((g) => (!g.plats || g.plats.includes(h.p)) && (CODES[at + g.s] !== MISSING || g.miss !== null));
    return a + (any ? c.cw : 0);
  }, 0);
  const cats = plan.map((c) => {
    const sigs = [];
    let sw = 0;
    for (const g of c.sigs) {
      if (g.plats && !g.plats.includes(h.p)) continue;
      const v = CODES[at + g.s];
      if (v === MISSING && g.miss === null) { sigs.push({ g, v, p: null, w: 0 }); continue; }
      const p = v === MISSING ? g.miss : g.pts[Math.min(g.pts.length - 1, v)];
      sw += g.w;
      sigs.push({ g, v, p, w: g.w });
    }
    const share = c.cw > 0 && tw > 0 && sw > 0 ? c.cw / tw : 0;
    for (const x of sigs) x.lost = x.p === null || !sw ? 0 : (100 - x.p) * (x.w / sw) * share;
    return { c, sigs, share, score: catScore(h, c.ci, d) };
  });
  return { cats, comp: comp(h, d), cfg };
}

// ---- formatting ----
const r1 = (x) => (Number.isFinite(x) ? Math.round(x * 10) / 10 : null);
const scoreFmt = (x) => (Number.isFinite(x) ? String(Math.round(x)) : "---");
function gradeOf(x, cfg = active()) {
  if (!Number.isFinite(x)) return null;
  return (cfg.grades.find(([, lo]) => x >= lo) || ["F"])[0];
}
function gradeTone(g, cfg = active()) {
  if (!g) return "neutral";
  const i = cfg.grades.findIndex(([l]) => l === g);
  return ["good", "info", "warn"][i] || "bad";
}
const toneOf = (x, cfg = active()) => gradeTone(gradeOf(x, cfg), cfg);
function gradeBadge(x, lg) {
  const g = gradeOf(x);
  return g ? h("span", { class: `grade${lg ? " lg" : ""}`, style: `--tone:var(--${gradeTone(g)})`, title: `Grade ${g}` }, g) : null;
}
function deltaEl(dv, suffix = "") {
  if (!Number.isFinite(dv)) return h("span", { class: "delta" }, "---");
  const v = Math.round(dv * 10) / 10;
  if (Math.abs(v) < 0.5) return h("span", { class: "delta" }, `no change${suffix}`);
  return h("span", { class: `delta ${v > 0 ? "up" : "down"}` }, `${v > 0 ? "+" : "−"}${Math.abs(Math.round(v))}${suffix}`);
}
function valueLabel(sig, c) {
  if (c === MISSING || c == null) return "not reported";
  if (sig.kind === "levels") return sig.levels[c] ? sig.levels[c][1] : "---";
  const v = c * sig.step, more = c >= sig.cap;
  if (sig.unit === "%") return more ? `${v}% or more` : `${v}%`;
  if (sig.unit === "days") return more ? `${v} days or more` : fmt.plural(v, "day");
  if (sig.unit === "years") return more ? `${v} years or more` : fmt.plural(v, "year");
  return more ? `${v} or more` : String(v);
}
const unitWord = (sig, v) => (sig.unit === "%" ? `${v}%` : sig.unit ? fmt.plural(v, sig.unit.replace(/s$/, "")) : String(v));
// Labels for a number signal's bands, in their order.
function bandLabels(sig, bands) {
  const lower = sig.better === "lower";
  return bands.map(([t], i) => {
    const prev = i ? bands[i - 1][0] : null;
    if (t === null) return bands.length === 1 ? "Any" : lower ? `More than ${unitWord(sig, prev)}` : `Under ${unitWord(sig, prev)}`;
    if (lower) {
      if (prev === null) return t === 0 ? (sig.unit ? unitWord(sig, 0) : "None") : `${unitWord(sig, t)} or less`;
      const from = prev + sig.step;
      return from >= t ? unitWord(sig, t) : `${sig.unit === "%" ? from : fmt.n(from)} to ${unitWord(sig, t)}`;
    }
    if (prev === null) return `${unitWord(sig, t)} or more`;
    return `${sig.unit === "%" ? t : fmt.n(t)} to under ${unitWord(sig, prev)}`;
  });
}
const platTags = (sig) => (sig.plats ? sig.plats.map(platformLabel).join(", ") : "All platforms");
const sigConf = (cfg, sid) => {
  for (const cat of Object.values(cfg.categories)) if (cat.signals[sid]) return cat.signals[sid];
  return null;
};
const catLabel = (cid) => (CATS[CIDX[cid]] || { label: cid }).label;
const CAT_COLORS = { performance: "var(--info)", device: "var(--serious)", security: "var(--good)", software: "var(--warn)", connectivity: "var(--neutral)" };
function linkTo(page, label) {
  return DATA.links && DATA.links[page] ? pageLink(DATA.links[page], {}, label) : label;
}
const hostHref = (x) => `#host=${x.id}`;
function hostCell(x) {
  return [active().host_views ? h("a", { href: hostHref(x), class: "cell-main" }, x.name) : h("span", { class: "cell-main" }, x.name),
    PLATFORM ? null : h("span", { class: "plat" }, platformLabel(x.p))];
}
const pluralComputers = (n) => fmt.plural(n, "computer");

// ---- views ----
let VIEW = { kind: "fleet" };
let CAT_SEL = store.get("dex-exp-cat") || "";
let COHORT = store.get("dex-exp-cohort") || "fleet";
let GRADE_SEL = new Set();
let QUERY = "";

function route() {
  const m = location.hash.match(/^#(host|compare)=(.*)$/);
  VIEW = m ? { kind: m[1], arg: decodeURIComponent(m[2]) } : location.hash === "#scoring" ? { kind: "scoring" } : { kind: "fleet" };
  // Opening the settings without changing anything leaves no draft behind.
  if (VIEW.kind !== "scoring" && DRAFT && !draftDirty()) setDraft(null);
  render();
  window.scrollTo(0, 0);
}

// ---- fleet view ----
function renderFleet() {

  titleRow("Experience score",

  const now = selectedNow();
  const sc = now.filter((x) => scored(x));
  const stale = now.filter((x) => STALE[x.i * DAYS + TODAY]).length;
  const avg = mean(sc.map((x) => comp(x)));
  const good = sc.filter((x) => comp(x) >= cfg.target).length;
  const lastGrade = cfg.grades.length ? cfg.grades[cfg.grades.length - 1][0] : null;

    methodSection(cfg));

function categorySection(cfg, sc, bds, lostCat, lostSig, perHost) {

  }

      return { value: n, color: `var(--${toneOf(b.pts)})`, tip: `${b.label}: ${pluralComputers(n)}, ${b.pts} points` };
    });
    const pts = reporting.map((x) => { const g = PLAN.flatMap((c) => c.sigs).find((y) => y.sid === sid); const v = code(x, TODAY, sid); return g ? g.pts[Math.min(g.pts.length - 1, v)] : sig.kind === "levels" ? scf.points[sig.levels[v][0]] : bandPoints(sig, scf.bands, v * sig.step); });

      reporting.length ? h("div", { class: "track", role: "img", "aria-label": `${sig.label}: ${segs.map((s) => s.tip).join("; ")}` },
        segs.filter((s) => s.value > 0).map((s) => tip(h("div", { class: "seg", style: `flex:${s.value} 1 0;background:${s.color}` }), s.tip)))
        : h("span", { class: "cell-sub" }, applies.length ? "No computer here reports it" : "Doesn't apply to these computers"),

// One legend entry per color: grades that share a color merge into "under N".

  for (const [g, lo] of cfg.grades) {

    if (tone === "bad") { out.push([`Under ${out.length ? cfg.grades[out.length - 1][1] : 100}`, "var(--bad)"]); return out; }

// What changed a computer's score between two days: each signal's change in the points it costs.
function drivers(x, d0, d1) {
  const a = breakdown(x, d0), b = breakdown(x, d1);
  const out = [];
  b.cats.forEach((c, ci) => c.sigs.forEach((s, si) => {
    const before = a.cats[ci].sigs.find((t) => t.g.sid === s.g.sid);
    const lost0 = before ? before.lost : 0;
    const change = lost0 - s.lost;
    if (Math.abs(change) >= 0.05) out.push({ sig: s.g.sig, change, from: before ? before.v : MISSING, to: s.v, cid: c.c.cid });
  }));
  return out.sort((p, q) => Math.abs(q.change) - Math.abs(p.change));
}
function driverText(dv) {
  const pts = `${dv.change > 0 ? "+" : "−"}${r1(Math.abs(dv.change))} points`;
  const what = dv.from === MISSING ? `started reporting ${valueLabel(dv.sig, dv.to)}`
    : dv.to === MISSING ? "stopped reporting" : dv.from === dv.to ? "kept the same value, but weighs differently now"
      : `went from ${valueLabel(dv.sig, dv.from)} to ${valueLabel(dv.sig, dv.to)}`;
  return [`${dv.sig.label} ${what}`, pts];
}

function methodSection(cfg) {

  const rule = (sid, sc) => {

      })))),
    h("p", {}, settingsSourceText()));
}

// ---- scoring settings ----
function discardDraft() {
  setDraft(null);
  computeAll(active());
  render();
}
// Inputs change DRAFT in place; scoring follows a moment later, so typing stays quick on a big fleet.
let recomputeTimer = null;
function draftChanged() {
  clearTimeout(recomputeTimer);
  recomputeTimer = setTimeout(() => { DRAFT_EFF = mergeScoring(DRAFT); computeAll(active()); renderImpact(); renderEditorButtons(); }, 200);
}
const canSave = () => Boolean(DB && EDIT);

// Plain-language list of what changed between two settings.
function diffText(a, b) {
  const out = [];
  const num = (x) => (x === null || x === undefined ? "---" : String(x));
  if (a.target !== b.target) out.push(`Good experience target ${a.target} → ${b.target}`);
  if (a.stale_days !== b.stale_days) out.push(`Days before a computer isn't scored ${a.stale_days} → ${b.stale_days}`);
  if (a.min_cohort !== b.min_cohort) out.push(`Smallest group shown ${a.min_cohort} → ${b.min_cohort}`);
  if (a.host_views !== b.host_views) out.push(`Per-computer views ${a.host_views ? "on" : "off"} → ${b.host_views ? "on" : "off"}`);
  if (JSON.stringify(a.grades) !== JSON.stringify(b.grades)) out.push(`Grades ${a.grades.map(([g, lo]) => `${g} ${lo}`).join(", ")} → ${b.grades.map(([g, lo]) => `${g} ${lo}`).join(", ")}`);
  for (const [cid, ca] of Object.entries(a.categories)) {
    const cb = b.categories[cid];
    if (!cb) continue;
    if (ca.weight !== cb.weight) out.push(`${catLabel(cid)} weight ${ca.weight} → ${cb.weight}`);
    for (const [sid, sa] of Object.entries(ca.signals)) {
      const sb = cb.signals[sid], sig = SIGS[SIDX[sid]];
      if (!sb || !sig) continue;
      if (sa.weight !== sb.weight) out.push(`${sig.label} weight ${sa.weight} → ${sb.weight}`);
      if ((sa.missing || "skip") !== (sb.missing || "skip") || (sb.missing === "neutral" && sa.neutral !== sb.neutral)) {
        out.push(`${sig.label} when not reported: ${sa.missing || "skip"} → ${sb.missing || "skip"}${sb.missing === "neutral" ? ` (${num(sb.neutral ?? 75)})` : ""}`);
      }
      if (sa.points) for (const [k, l] of sig.levels) if (sa.points[k] !== sb.points[k]) out.push(`${sig.label}, ${l.toLowerCase()}: ${sa.points[k]} → ${sb.points[k]} points`);
      if (sa.bands && JSON.stringify(sa.bands) !== JSON.stringify(sb.bands)) {
        out.push(`${sig.label} points: ${bandLabels(sig, sb.bands).map((l, i) => `${l.toLowerCase()} ${sb.bands[i][1]}`).join(", ")}`);
      }
    }
  }
  return out;
}

async function saveDraft() {
  if (!canSave() || !draftDirty()) return;
  const next = mergeScoring(DRAFT);
  clearTimeout(recomputeTimer);
  const changes = diffText(SAVED, next);
  const at = new Date().toISOString();
  try {
    const by = USER ? await USER.id() : null;
    await DB.doc("scoring/config").set({ settings: next, updated_at: at, updated_by: by });
    await DB.collection("scoring-log").add({ at, by, changes: changes.slice(0, 40), more: Math.max(0, changes.length - 40) });

}

function downloadSettings() {

  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "application/json" })), download: "dex-scoring.json" });
  document.body.append(a);
  a.click();

}

function renderImpact() {
  const el = document.getElementById("impact");
  if (!el) return;
  const now = HOSTS.filter((x) => PRESENT[x.i * DAYS + TODAY]);
  const next = active();
  const before = scoreToday(SAVED, now), after = scoreToday(next, now);
  const both = now.filter((x) => Number.isFinite(before.get(x)) && Number.isFinite(after.get(x)));
  let up = 0, down = 0;
  const moves = [];
  for (const x of both) {
    const g0 = gradeOf(before.get(x), SAVED), g1 = gradeOf(after.get(x), next);
    if (g0 !== g1) {
      const rank = (g, cfg) => { const i = cfg.grades.findIndex(([l]) => l === g); return i < 0 ? cfg.grades.length : i; };
      if (rank(g1, next) < rank(g0, SAVED)) up++; else down++;
    }
    moves.push([x, after.get(x) - before.get(x)]);
  }
  const avg0 = mean(both.map((x) => before.get(x))), avg1 = mean(both.map((x) => after.get(x)));
  const good0 = both.filter((x) => before.get(x) >= SAVED.target).length, good1 = both.filter((x) => after.get(x) >= next.target).length;
  const stat = (k, v, s) => h("div", { class: "stat" }, h("span", { class: "k" }, k), h("span", { class: "v" }, v), h("span", { class: "s" }, s));

    stat("Average score", `${scoreFmt(avg0)} → ${scoreFmt(avg1)}`, Number.isFinite(avg1 - avg0) ? `${avg1 - avg0 >= 0 ? "+" : "−"}${r1(Math.abs(avg1 - avg0))} points` : ""),
    stat("Good experience", `${fmt.pct(pct(good0, both.length))} → ${fmt.pct(pct(good1, both.length))}`, `${fmt.n(good1)} of ${pluralComputers(both.length)}`),
    stat("Grade changes", fmt.n(up + down), `${fmt.n(up)} up, ${fmt.n(down)} down`),
    stat("Biggest move", moves.length && Math.abs(moves[0][1]) >= 0.5 ? `${moves[0][1] > 0 ? "+" : "−"}${r1(Math.abs(moves[0][1]))}` : "---", moves.length && Math.abs(moves[0][1]) >= 0.5 ? moves[0][0].name : "no computer moves")),

function scoreToday(cfg, hosts) {
  const plan = compile(cfg), tmp = new Float64Array(C), out = new Map();
  for (const x of hosts) {
    const at = x.i * DAYS + TODAY, chk = CODES[at * S + CHECKIN];

async function renderLog() {
  const el = document.getElementById("log");
  if (!el) return;
  if (!DB) { el.replaceChildren(empty("No change log here", "The change log works in the published dashboard.")); return; }
  if (LOG === null) { el.replaceChildren(h("p", { class: "cell-sub" }, "Loading...")); return; }
  if (!LOG.length) { el.replaceChildren(empty("No changes yet", "Saved changes show here with who made them and when.")); return; }
  const ids = [...new Set(LOG.map((e) => e.by).filter(Boolean))];
  const ps = USER && ids.length ? await USER.profiles(ids).catch(() => ({})) : {};
  const who = (id) => (id && ps[id] && ps[id].name) || "Someone";
  el.replaceChildren(h("ul", { class: "log" }, LOG.map((e) => h("li", {},
    h("div", {}, h("b", {}, who(e.by)), " changed the scoring",
      h("ul", { class: "changes" }, (e.changes || []).map((t) => h("li", {}, t)), e.more ? h("li", {}, `and ${fmt.n(e.more)} more`) : null)),
    h("span", { class: "cell-sub" }, `${fmt.date(e.at)}, ${String(e.at).slice(11, 16)} UTC`)))));
}

function footer() {
  document.getElementById("foot").textContent = `Data from ${DATA.fleet_url.replace(/^https?:\/\//, "")} via the Fleet API, through the other dashboards. Scores computed in your browser with the settings above. Rebuilt daily.`;
}

async function initStore() {
  const cl = window.claude;
  if (!cl || !cl.use) return;
  const [db, user, downloads] = await Promise.all([cl.use("db"), cl.use("user"), cl.use("downloads")]);
  DB = db; USER = user; DOWNLOADS = downloads;
  EDIT = user ? await user.canEdit() : false;
  if (db) {
    db.doc("scoring/config").onSnapshot((s) => {
      const d = s.exists ? s.data() : null;
      SAVED = mergeScoring(d && d.settings ? d.settings : DATA.scoring);
      SAVED_META = d && d.settings ? { at: d.updated_at, by: d.updated_by } : null;
      if (DRAFT && !draftDirty()) setDraft(null);
      computeAll(active());
      if (VIEW.kind !== "scoring") render();
      else { renderImpact(); renderEditorButtons(); }
    }, () => {});
    db.collection("scoring-log").orderBy("at", "desc").limit(30).onSnapshot((s) => {
      LOG = s.docs.map((d) => d.data());
      renderLog();
    }, () => { LOG = []; renderLog(); });
  }
  if (VIEW.kind === "fleet") render();
}

const fleets = [...new Set(HOSTS.map((x) => x.fleet))].sort();
const platformCounts = {};
for (const x of HOSTS) if (PRESENT[x.i * DAYS + TODAY]) platformCounts[x.p] = (platformCounts[x.p] || 0) + 1;
computeAll(active());
renderTop(fleets, render, platformCounts);
window.addEventListener("hashchange", route);
route();
initStore();
</script>
