- name: Profile list
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/profile-list-command
  description: Get a list of installed profiles on a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ProfileList MDM command do?
      answer: |
        `ProfileList` asks an Apple device for the configuration profiles it has installed. For each profile, the response includes its `PayloadIdentifier`, `PayloadUUID`, display name, whether it's managed by MDM, and a summary of the payloads inside it (type and identifier, not the setting values).

        Set `ManagedOnly` to `true` to return only profiles installed by MDM, or `false` to include profiles the user installed.
    - question: How often is ProfileList used?
      answer: |
        Regularly, as an inventory command. Many MDMs send it during routine inventory updates to confirm which profiles a device has. Admins also send it on demand when a setting isn't being applied.
    - question: How do I list installed profiles on a Mac without MDM?
      answer: |
        Run `sudo profiles list` in Terminal for a quick list, or `sudo profiles show -type configuration` for details. Users can also see installed profiles in **System Settings > General > Device Management**.

        On iPhone and iPad, go to **Settings > General > VPN & Device Management**.
    - question: Does Fleet send ProfileList automatically?
      answer: |
        No. Fleet checks macOS profiles with a query that fleetd reports every hour by default, and checks iPhone and iPad profiles by confirming the device acknowledged each install.

        Send `ProfileList` as a custom command when you want the device's own complete list, including profiles installed outside Fleet.
    - question: How do I run ProfileList with Fleet and read the results?
      answer: |
        Save the payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=profile-list.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Then run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the result holds the device's response with the `ProfileList` array. The command is read-only and changes nothing on the device.
    - question: Why does ProfileList show profiles my MDM doesn't know about?
      answer: |
        Because the device reports everything installed, not only what your MDM manages. Extra profiles usually came from the user, a previous MDM, or a one-off custom `InstallProfile` command. User-installed profiles have `IsManaged` set to `false`.

        An MDM can't remove profiles the user installed. The user has to remove them in **System Settings > General > Device Management**.
    - question: What's the difference between ProfileList and ProvisioningProfileList?
      answer: |
        `ProfileList` returns configuration profiles, which hold device settings. `ProvisioningProfileList` returns app provisioning profiles, which let in-house or development apps run on iPhone and iPad.
    - question: Can ProfileList show user-scoped profiles?
      answer: |
        Only when it's sent on the user channel, which is macOS only. Sent on the device channel, it returns device-level profiles. Fleet sends custom commands on the device channel, so profiles installed in a user's scope won't appear.
    - question: What errors can ProfileList return?
      answer: |
        Errors are rare because the command is read-only. `CommandFormatError` usually means the plist is malformed, for example a misspelled `RequestType`. If the device is offline, the command waits as `Pending` until the device checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedOnly</key>
            <false/>
            <key>RequestType</key>
            <string>ProfileList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ProfileList</string>
    </dict>
    </plist>

- name: Remove profile
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/remove-profile-command
  description: Remove a previously installed profile from the device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the RemoveProfile MDM command do?
      answer: |
        `RemoveProfile` tells an Apple device to uninstall a configuration profile. You identify the profile by its `PayloadIdentifier` in the `Identifier` key.

        Once the profile is removed, the device stops enforcing its settings. An MDM can only remove profiles that it installed.
    - question: How often is RemoveProfile used?
      answer: |
        Routinely. MDMs send it whenever a profile is deleted, its targeting changes, or a device moves to a group with different settings.
    - question: Which Fleet features use RemoveProfile?
      answer: |
        Fleet sends `RemoveProfile` when you delete a profile from **Controls > OS settings**, when a host moves to a fleet without that profile, or when a label-scoped profile no longer applies. See [removal behavior](https://fleetdm.com/guides/custom-os-settings#removal-behavior).

        **Actions > Turn off MDM** also uses it, to remove Fleet's enrollment profile from the host.
    - question: How do I send RemoveProfile with Fleet?
      answer: |
        Put the profile's `PayloadIdentifier` in the `Identifier` key, save the payload, and run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-profile.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: What happens if I remove a profile that's still assigned in my MDM?
      answer: |
        Most MDMs put it back. In Fleet, a macOS host that's missing an assigned profile gets it resent automatically, up to 4 attempts, after which the profile shows as Failed.

        To remove a managed profile for good, delete it or change its targeting in your MDM rather than sending `RemoveProfile` directly.
    - question: Can end users remove profiles installed by MDM?
      answer: |
        No. Only the MDM that installed a profile can remove it. A user can only remove MDM profiles by removing the MDM enrollment itself, which removes every profile it installed. On devices enrolled through Automated Device Enrollment (ADE), the enrollment can be made non-removable.
    - question: Can RemoveProfile remove the MDM enrollment profile?
      answer: |
        Yes, and that unenrolls the device from MDM. Afterward, the MDM can't send it any more commands. Fleet's enrollment profile identifier is `com.fleetdm.fleet.mdm.apple`.

        To turn off MDM for a host in Fleet, use **Actions > Turn off MDM** so Fleet records the change.
    - question: Can I remove a user-scoped profile with RemoveProfile?
      answer: |
        Only by sending it on the user channel, which is macOS only. Fleet sends custom commands on the device channel, so remove user-scoped profiles by deleting or retargeting them in OS settings. In **Host details > OS settings**, user-scoped profiles have a user icon next to them.
    - question: How do I know if RemoveProfile worked?
      answer: |
        `Acknowledged` means the device removed the profile. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. To confirm, send a `ProfileList` command or check **System Settings > General > Device Management** on the device.
    - question: Why did RemoveProfile fail?
      answer: |
        Usually because the identifier doesn't match an installed profile that this MDM installed. Check the exact `PayloadIdentifier`, since it's case-sensitive, and remember that profiles the user installed can't be removed by MDM.

        `CommandFormatError` means the command plist is malformed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifier</key>
            <string>com.acme.myprofile</string>
            <key>RequestType</key>
            <string>RemoveProfile</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RemoveProfile</string>
    </dict>
    </plist>

- name: Install provisioning profile
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-provisioning-profile-command
  description: Install a provisioning profile on a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the InstallProvisioningProfile MDM command do?
      answer: |
        `InstallProvisioningProfile` installs an app provisioning profile (`.mobileprovision` or `.provisionprofile`) on a device. The profile is base64-encoded in the `ProvisioningProfile` key.

        Provisioning profiles authorize apps signed with your Apple Developer or Enterprise certificate to run. They're different from configuration profiles, which apply settings.
    - question: When would I use InstallProvisioningProfile?
      answer: |
        Rarely. The main use is for in-house (enterprise) apps. Most apps include their provisioning profile inside the app bundle, so you only need this command to replace a profile that's about to expire without reinstalling the app.
    - question: Does Fleet send InstallProvisioningProfile automatically?
      answer: |
        No. Fleet doesn't send this command for any built-in feature. When you deploy an in-house `.ipa` app, the provisioning profile embedded in the app is used.

        You can send `InstallProvisioningProfile` yourself as a custom MDM command.
    - question: How do I run InstallProvisioningProfile with Fleet?
      answer: |
        Base64-encode your provisioning profile file and place it in the `ProvisioningProfile` `<data>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=install-provisioning-profile.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        The sample payload on this page contains placeholder data, so replace it with your real profile.
    - question: Which devices support InstallProvisioningProfile?
      answer: |
        iPhone and iPad, Apple TV, Apple Vision Pro, Apple Watch, and Macs on macOS 11 or later. The profile must match the app's team ID and bundle ID to have any effect.
    - question: How do I know if InstallProvisioningProfile worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the profile was installed. To confirm, send a `ProvisioningProfileList` command and check that the new profile and its expiration date are listed.
    - question: What errors can InstallProvisioningProfile return?
      answer: |
        Expect an `Error` status if the data isn't a valid provisioning profile, isn't base64-encoded correctly, or has already expired. `CommandFormatError` means the command plist itself is malformed.
    - question: What's the difference between a provisioning profile and a configuration profile?
      answer: |
        A configuration profile (`.mobileconfig`) applies settings, like Wi-Fi or restrictions, and is installed with `InstallProfile`. A provisioning profile lets a specific signed app run on the device, and is installed with `InstallProvisioningProfile`.
