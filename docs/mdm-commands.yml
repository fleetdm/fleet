- name: Active NSExtensions
  platform: apple
  category: Extensions
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/active-nsextensions-command
  description: Get a list of active extensions for a user on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the ActiveNSExtensions MDM command do?
      answer: |
        `ActiveNSExtensions` lists the active app extensions for a user on a Mac, like share, Finder, and Photos extensions. Each entry in the `Extensions` response includes `Identifier`, `DisplayName`, `ExtensionPoint`, `Path`, `Version`, and `UserElection`, which shows whether the user set it to `Use`, `Ignore`, or `Default`.

        Use `FilterExtensionPoints` to return only certain extension points, like `com.apple.share-services`.
    - question: How often is ActiveNSExtensions used?
      answer: |
        Rarely. It's a special-purpose inventory command, mostly used to audit extensions before allowing or blocking them with a configuration profile.
    - question: Does ActiveNSExtensions require a supervised Mac?
      answer: |
        Yes. Apple requires supervision, the `QueryInstalledApps` access right, and the user channel. It isn't available on the device channel or in user enrollment.
    - question: Can I run ActiveNSExtensions with Fleet?
      answer: |
        No. Apple only accepts it on the user channel, and Fleet sends custom MDM commands on the device channel, so expect it to fail.

        Instead, run a [script](https://fleetdm.com/guides/scripts) that runs `pluginkit -m` as the logged-in user to list app extensions. To control extensions, deploy an `NSExtensionManagement` configuration profile in **Controls > OS settings**.
    - question: How do I list app extensions on a Mac without MDM?
      answer: |
        Run `pluginkit -m` in Terminal as the user. Add `-v` for paths and versions, or `-p` with an extension point, like `pluginkit -m -p com.apple.share-services`, to filter.

        Users can also see and turn extensions on or off in **System Settings > General > Login Items & Extensions** on recent macOS versions.
    - question: Why are some extensions missing from ActiveNSExtensions results?
      answer: |
        Per Apple, extensions blocked by application launch restrictions or an `NSExtensionManagement` configuration profile don't appear. Results are also per user, since extensions exist for each user, not for the whole Mac.
    - question: How do I block an app extension on a Mac?
      answer: |
        Use a configuration profile with the `NSExtensionManagement` payload. It can allow or deny specific extensions by identifier, or deny whole extension points.

        Run `ActiveNSExtensions` or `NSExtensionMappings` first if you need the exact identifiers.
    - question: What's the difference between ActiveNSExtensions and NSExtensionMappings?
      answer: |
        `ActiveNSExtensions` returns active extensions with details like path, version, and the user's choice. `NSExtensionMappings` returns every installed extension for the user, including ones the system never turns on because of restrictions.

        Per Apple, `NSExtensionMappings` is a superset of `ActiveNSExtensions`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>FilterExtensionPoints</key>
            <array>
                <string>com.apple.share-services</string>
            </array>
            <key>RequestType</key>
            <string>ActiveNSExtensions</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ActiveNSExtensions</string>
    </dict>
    </plist>

- name: NSExtensions mappings
  platform: apple
  category: Extensions
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/nsextension-mappings-command
  description: Get a list of the installed extensions for a user on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the NSExtensionMappings MDM command do?
      answer: |
        `NSExtensionMappings` lists every app extension installed for a user on a Mac. Each entry in the `Extensions` response includes the extension's `Identifier`, `DisplayName`, and `ExtensionPoint`.

        It takes no options besides `RequestType`.
    - question: How often is NSExtensionMappings used?
      answer: |
        Rarely. It's a special-purpose inventory command, mostly used to find extension identifiers before allowing or blocking them with a configuration profile.
    - question: Does NSExtensionMappings require a supervised Mac?
      answer: |
        Yes. Apple requires supervision, the `QueryInstalledApps` access right, and the user channel. It isn't available on the device channel or in user enrollment.
    - question: Can I run NSExtensionMappings with Fleet?
      answer: |
        No. Apple only accepts it on the user channel, and Fleet sends custom MDM commands on the device channel, so expect it to fail.

        Instead, run a [script](https://fleetdm.com/guides/scripts) that runs `pluginkit -m` as the logged-in user to list app extensions across your Macs.
    - question: How do I list installed app extensions on a Mac without MDM?
      answer: |
        Run `pluginkit -m` in Terminal as the user. Add `-v` for more detail, or `-p` with an extension point to filter.

        Users can see and manage extensions in **System Settings > General > Login Items & Extensions** on recent macOS versions.
    - question: Why does NSExtensionMappings list extensions the user can't use?
      answer: |
        Because it returns every installed extension, including ones the system never turns on because of restrictions, like an `NSExtensionManagement` profile. To see only active extensions, use `ActiveNSExtensions`.
    - question: What's the difference between NSExtensionMappings and ActiveNSExtensions?
      answer: |
        `NSExtensionMappings` is the full list of installed extensions for a user, with identifier, name, and extension point. `ActiveNSExtensions` is the active subset, with more detail like path, version, and the user's choice.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>NSExtensionMappings</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_NSExtensionMappings</string>
    </dict>
    </plist>

- name: List users
  platform: apple
  category: User management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/user-list-command
  description: Get a list of users with active accounts on a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
    - macOS 10.13+
  faq:
    - question: What does the UserList MDM command do?
      answer: |
        `UserList` returns the user accounts on a device in a `Users` array. Every entry has `UserName` and `IsLoggedIn`.

        On a Mac, entries also include `FullName`, `UID`, `UserGUID`, `MobileAccount`, and `HasSecureToken`. On Shared iPad, they include `HasDataToSync`, `DataQuota`, and `DataUsed`.
    - question: How often is UserList used?
      answer: |
        Occasionally. It's common in Shared iPad deployments, and before sending `DeleteUser`, to confirm the exact username and whether the user is logged in.
    - question: How do I list user accounts on a Mac without MDM?
      answer: |
        Run `dscl . -list /Users UniqueID` in Terminal. Accounts with an ID of 500 or higher are usually real users. To check a user's secure token, run `sysadminctl -secureTokenStatus <username>`.

        Users also appear in **System Settings > Users & Groups**.
    - question: Does UserList require a supervised device?
      answer: |
        On macOS, yes. Apple requires supervision on macOS. On iOS and iPadOS, Apple doesn't list supervision as a requirement, though Shared iPad is supervised anyway.

        The command runs on the device channel only and isn't available in user enrollment.
    - question: Does Fleet send UserList automatically?
      answer: |
        No. On macOS, Fleet collects local user accounts with osquery and shows them on **Host details**. You can also write a report on the `users` table to list accounts across Macs.

        To get the MDM view, send `UserList` as a custom command in Fleet Free or Fleet Premium with `fleetctl mdm run-command --hosts=<hostname> --payload=user-list.xml`, or the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Then read the response with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: Why use UserList before DeleteUser?
      answer: |
        To avoid errors and data loss. `DeleteUser` fails if the user is logged in, and on Shared iPad it fails if the user has data to sync, unless you set `ForceDeletion`.

        Check `IsLoggedIn` and `HasDataToSync` in the `UserList` response, and copy the exact `UserName`.
    - question: What errors can UserList return?
      answer: |
        On macOS, the most common error is an `Error` status because the Mac isn't supervised. `CommandFormatError` means the plist couldn't be parsed.

        Check the `ErrorChain` in the command results for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>UserList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_UserList</string>
    </dict>
    </plist>

- name: Log out user
  platform: apple
  category: User management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/log-out-user-command
  description: Force the current user to log out of a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the LogOutUser MDM command do?
      answer: |
        `LogOutUser` forces the current user to log out of a device. It's meant for Shared iPad, where it ends the active user's session so the next person can sign in. The command has no options.
    - question: How often is LogOutUser used?
      answer: |
        Occasionally, in Shared iPad deployments like classrooms, labs, and shift work. It isn't useful on single-user iPhones or iPads.
    - question: Does LogOutUser work on a Mac?
      answer: |
        No. Apple only supports `LogOutUser` on iOS and iPadOS, on the device channel.

        To log a user out of a Mac remotely, run a script that ends their session, for example `launchctl bootout user/<uid>` run as root. In Fleet, you can run it with [scripts](https://fleetdm.com/guides/scripts).
    - question: Does LogOutUser require supervision?
      answer: |
        Apple doesn't list supervision as a requirement, but Shared iPad itself requires supervised iPads. The command isn't available in user enrollment.
    - question: How do I run LogOutUser with Fleet?
      answer: |
        Fleet doesn't send it automatically, so send it as a custom command in Fleet Free or Fleet Premium. Save the sample payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=log-out-user.xml`.

        Use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API to target many iPads at once, for example at the end of a class period.
    - question: Why don't other commands run right after LogOutUser?
      answer: |
        Per Apple, MDM commands aren't available on the device for up to 2 minutes after a user is logged out. Commands sent during that window stay `Pending` until the device can process them.

        If you plan to send `DeleteUser` next, wait for the device to check in again.
    - question: How do I know if LogOutUser worked?
      answer: |
        `Acknowledged` means the device logged out the user, and the iPad returns to its sign-in screen. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        If it fails, the `ErrorChain` has the reason. `CommandFormatError` means the plist couldn't be parsed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>LogOutUser</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LogOutUser</string>
    </dict>
    </plist>

- name: Delete user
  platform: apple
  category: User management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/log-out-user-command
  description: Delete a user’s account from a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
    - macOS 10.13+
  faq:
    - question: What does the DeleteUser MDM command do?
      answer: |
        `DeleteUser` deletes a user account and its data from a device. Set `UserName` to the account to delete.

        On Shared iPad, it removes cached users to free up space. Two options apply there: `ForceDeletion` deletes the user even if they have data waiting to sync, and `DeleteAllUsers` (iPadOS 14 and later) deletes every user. On macOS, it removes a local user account.
    - question: Is the sample payload on this page correct?
      answer: |
        No. It uses `LogOutUser` as the `RequestType`. A working payload sets `RequestType` to `DeleteUser`, sets `UserName` to the account to delete, and optionally sets `ForceDeletion` to `true`.

        See [Apple's DeleteUser reference](https://developer.apple.com/documentation/devicemanagement/delete-user-command) for the full example.
    - question: How often is DeleteUser used?
      answer: |
        Occasionally. It's common in Shared iPad deployments to free up storage. On Macs, it's used when offboarding a user or cleaning up shared computers.
    - question: How do I delete a local user on a Mac without MDM?
      answer: |
        Use **System Settings > Users & Groups**, or run `sudo sysadminctl -deleteUser <username>` in Terminal. Both remove the account and its home folder unless you choose to keep it.

        Fleet's guide to [deleting macOS local user accounts](https://fleetdm.com/guides/delete-macos-local-user-accounts-with-fleet) shows how to do this with a script. fleetd needs full disk access for the account to be fully removed.
    - question: Does DeleteUser require a supervised device?
      answer: |
        On macOS, yes. Apple requires supervision on macOS. On iOS and iPadOS, it's used on Shared iPad, which is supervised.

        It runs on the device channel only and isn't available in user enrollment.
    - question: How do I run DeleteUser with Fleet?
      answer: |
        Fleet doesn't delete user accounts as part of a built-in feature, so send it as a custom command in Fleet Free or Fleet Premium. Save a payload with `RequestType` set to `DeleteUser` and the right `UserName`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=delete-user.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Send `UserList` first to confirm the exact username and that the user isn't logged in.
    - question: Is DeleteUser reversible?
      answer: |
        No. Deleting a user removes their account and local data. With `ForceDeletion` set to `true`, data that hasn't synced to the cloud is lost too.

        Back up anything important before sending it.
    - question: What errors can DeleteUser return?
      answer: |
        Apple documents these error codes:

        - `12071`: the user doesn't exist.
        - `12072`: the user is logged in. Log them out first.
        - `12073`: the user has data to sync and `ForceDeletion` is false or missing.
        - `12074`: the device couldn't delete the user. On macOS, this includes trying to delete the last administrator account.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>LogOutUser</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LogOutUser</string>
    </dict>
    </plist>

- name: Declarative management
  platform: apple
  category: Declarative management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/declarative-management-command
  description: Enable your server to support declarative management or trigger a declarative management synchronization operation on the device.
  supportedDeviceTypes:
    - iOS 15.0+
    - iPadOS 15.0+
    - macOS 13.0+
    - tvOS 16.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the DeclarativeManagement MDM command do?
      answer: |
        `DeclarativeManagement` turns on declarative device management (DDM) on a device the first time it's sent. After that, each send starts a DDM sync, where the device fetches its declarations from the server, applies them, and reports status.

        An optional `Data` key can include base64-encoded sync tokens, so the device can tell whether its declarations changed.
    - question: How often is DeclarativeManagement used?
      answer: |
        Constantly, by MDMs that support DDM. They send it whenever a device's declarations change, and often right after enrollment.
    - question: What's the difference between DeclarativeManagement and InstallProfile?
      answer: |
        `InstallProfile` pushes one configuration profile, and the MDM has to check back to confirm it's still installed. `DeclarativeManagement` tells the device to pull its full set of declarations, apply them on its own, and report status changes back to the server.

        Some newer Apple settings, like software update enforcement, are only available as declarations.
    - question: Which Fleet features use DeclarativeManagement?
      answer: |
        Fleet sends it automatically whenever a host's declarations change. That covers DDM declarations you add in **Controls > OS settings** as `.json` files and [OS update enforcement](https://fleetdm.com/guides/enforce-os-updates) for macOS, iOS, and iPadOS.

        Fleet also sends it right after enrollment, and on the macOS user channel for user-scoped declarations. Learn more in [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: Do I need to send DeclarativeManagement myself?
      answer: |
        Rarely, if your MDM supports DDM. A manual send can help when troubleshooting a host whose declarations look out of date.

        Use a payload with `RequestType` set to `DeclarativeManagement` directly inside the `Command` dictionary and no `Data` key, which is what Fleet sends. The sample on this page nests a second `Command` dictionary, which isn't valid. With Fleet, run `fleetctl mdm run-command --hosts=<hostname> --payload=declarative-management.xml`.
    - question: Does DeclarativeManagement work on personal (BYOD) devices?
      answer: |
        Yes. Apple allows it in user enrollment on iOS, iPadOS, macOS, and visionOS, and it doesn't require supervision.

        DDM requires iOS and iPadOS 15 or later, or macOS 13 or later. It works on the device channel, and on the user channel on macOS and Shared iPad.
    - question: How do I know if DeclarativeManagement worked?
      answer: |
        `Acknowledged` only means the device started a sync. To confirm declarations applied, check the device's DDM status report.

        In Fleet, check the profile status in **Host details > OS settings**. Fleet verifies macOS declarations with the DDM status report.
    - question: What errors can DeclarativeManagement return?
      answer: |
        The command itself rarely fails. `CommandFormatError` usually means the plist or the base64 `Data` is malformed. Errors in individual declarations show up in the DDM status report, not in this command's result.

        If a declaration fails, Fleet shows that profile as **Failed** in **Host details > OS settings**.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>CommandUUID</key>
            <string>0001_DeclarativeManagement</string>
            <key>Command</key>
            <dict>
                <key>RequestType</key>
                <string>DeclarativeManagement</string>
                <key>Data</key>
                <data>
                eyJTeW5jVG9rZW5zIjogeyJUaW1lc3RhbXAiOiAiMjAyMS0wNi0wMlQwMToy
                ODowMFoiLCAiRGVjbGFyYXRpb25zVG9rZW4iOiAiYjY1NDQwMjdhMzE1Y2Qw
                MDg1ZDRjZjA4MTc0NjI0YzJkMTQyNDQ0ODA0MzBhODdiMTc2YTI3MjdlNzM2
                NjEzOCJ9fQ==
                </data>
            </dict>
        </dict>
    </dict>
