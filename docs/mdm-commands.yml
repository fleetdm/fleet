- name: Invite to program
  platform: apple
  category: Accounts
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/account-configuration-command
  description: Invite a user to join the Volume Purchase Program (VPP).
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - macOS 10.11+
  faq:
    - question: What does the InviteToProgram MDM command do?
      answer: |
        `InviteToProgram` shows the user an invitation to join Apple's Volume Purchase Program (VPP). You pass the `InvitationURL` from Apple and the `ProgramID`, which must be `com.apple.cloudvpp`. Accepting links the user's Apple Account so app licenses can be assigned to them.
    - question: Do I still need InviteToProgram?
      answer: |
        Usually not. It's part of older user-based VPP licensing, where licenses go to a user's personal Apple Account. Most organizations now assign licenses to devices by serial number in Apple Business, which needs no invitation. It also doesn't work with account-driven enrollments.
    - question: Which devices support InviteToProgram?
      answer: |
        iPhone and iPad on the device channel. On macOS and Shared iPad, it must be sent on the user channel. The device returns `NotNow` while Setup Assistant is running.
    - question: Does Fleet use InviteToProgram?
      answer: |
        No. Fleet assigns [App Store app](https://fleetdm.com/guides/install-app-store-apps) licenses to devices by serial number, or to the Managed Apple Account on personal devices enrolled with one. Neither needs an invitation.
    - question: How do I run InviteToProgram with Fleet?
      answer: |
        Put the invitation URL in `InvitationURL`, escaping `&` as `&amp;`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=invite.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet sends custom commands on the device channel, so this works on iPhone and iPad but not on Macs.
    - question: Can I tell whether the user accepted the invitation?
      answer: |
        Not from MDM. The command only shows the invitation. The user has to accept and sign in with their Apple Account, and nothing happens if they ignore it. Check enrollment status in your VPP user records.
    - question: What errors can InviteToProgram return?
      answer: |
        The response's `InvitationResult` is `InvalidProgramID` when `ProgramID` isn't `com.apple.cloudvpp`, and `InvalidInvitationURL` when the URL is invalid or expired. Unescaped `&` characters in the URL cause `CommandFormatError`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>InvitationURL</key>
            <string>https://buy.itunes.apple.com/WebObjects/MZFinance.woa/wa/associateVPPUserWithITSAccount?cc=us&amp;inviteCode=7770596534cf46b58fb0254e7112a5e5&amp;mt=8</string>
            <key>ProgramID</key>
            <string>com.apple.cloudvpp</string>
            <key>RequestType</key>
            <string>InviteToProgram</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InviteToProgram</string>
    </dict>
    </plist>

- name: Clear passcode
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/clear-passcode-command
  description: Remove the passcode from a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - visionOS 1.1+
    - macOS 10.0+
  faq:
    - question: What does the ClearPasscode MDM command do?
      answer: |
        `ClearPasscode` removes the passcode from an iPhone or iPad. After the device processes it, anyone holding the device can unlock it without a passcode, and the user can set a new one.

        The command must include the device's `UnlockToken`. The device sends this token to the MDM server in its `TokenUpdate` check-in, and the server stores it. Without the right token, the command can't work. Apple also supports it on Apple Vision Pro and Apple Watch.
    - question: When do IT admins clear a device passcode?
      answer: |
        Rarely, and only on request. The usual reason is a user who forgot their passcode and is locked out of a company iPhone or iPad. Clearing the passcode avoids erasing the device and losing its data.

        MDMs don't send it during enrollment or routine management.
    - question: Can I clear the passcode on a Mac?
      answer: |
        No. `ClearPasscode` isn't supported on macOS. If a user forgot their Mac login password, sign in with the escrowed FileVault recovery key and reset the password. Learn how in the [disk encryption guide](https://fleetdm.com/guides/enforce-disk-encryption#use-disk-encryption-key-to-login).

        If the account is locked after too many failed attempts but the user knows the password, use `UnlockUserAccount` instead.
    - question: Does ClearPasscode require a supervised device?
      answer: |
        No. Apple doesn't require supervision. It does require the enrollment to grant the `AllowPasscodeRemovalAndLock` access right, and it isn't allowed for User Enrollment (BYOD), which doesn't give the MDM an unlock token.
    - question: How do I clear an iPhone or iPad passcode with Fleet?
      answer: |
        Open the host's **Host details** page, click **Actions > Clear passcode**, and confirm. You can also use the [Clear host passcode](https://fleetdm.com/docs/rest-api/rest-api#clear-host-passcode) API or `fleetctl mdm clear-passcode --host=<hostname>`. Fleet logs a "cleared passcode" activity on the host.

        This is a Fleet Premium feature, available to admins, maintainers, and technicians. Use the built-in action rather than a custom command. Fleet adds the stored `UnlockToken` when the command is delivered, and it doesn't expose the token for you to put in a custom payload. Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: Why can't I clear the passcode on some iPhones and iPads in Fleet?
      answer: |
        Fleet only offers it for company-owned and manually enrolled iOS and iPadOS hosts with MDM turned on. It isn't available for:

        - Personal (BYOD) enrollments, which have no unlock token.
        - Hosts whose enrollment doesn't grant the passcode removal access right.
        - Hosts that are locked, or that have a lock or wipe pending.

        If you can't clear the passcode, the remaining option is to wipe the device with **Actions > Wipe**.
    - question: What happens if a passcode policy is installed on the device?
      answer: |
        The passcode is still removed. If a configuration profile with a `Passcode` payload requires a passcode, the device prompts the user to create one that meets the policy.

        Starting with iOS 16, clearing the passcode doesn't add it to the passcode history, so the user can set the same passcode again even when the profile sets `pinHistory`.
    - question: How do I know ClearPasscode worked?
      answer: |
        `Acknowledged` means the device removed the passcode. `NotNow` means the device couldn't process it yet and will try again at a later check-in. `Error` includes an `ErrorChain` with the reason.

        In Fleet, open **Host details**, turn on **Show MDM commands** in the **Activity** card, or run `fleetctl get mdm-command-results --id=<command-uuid>` with the UUID the action returns.
    - question: Can I cancel a clear passcode request?
      answer: |
        Yes, if the device hasn't received it yet. In Fleet, go to **Host details > Activity > Upcoming** and click **Cancel** on the command, or use the [cancel host's pending MDM command](https://fleetdm.com/docs/rest-api/rest-api#cancel-hosts-pending-mdm-command) API. Once the device acknowledges it, the passcode is already gone.
