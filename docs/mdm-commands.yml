  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/restrictions-command
  description: Get a list of restrictions on the device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the Restrictions MDM command do?
      answer: |
        The `Restrictions` command asks an iPhone, iPad, Apple TV, Apple Vision Pro, or Apple Watch which restrictions are in effect. The `GlobalRestrictions` dictionary in the response shows the combined result of every restrictions payload installed on the device.

        Set `ProfileRestrictions` to `true` to also get each profile's restrictions, keyed by profile identifier.
    - question: When would I use the Restrictions command?
      answer: |
        For troubleshooting. When several profiles set the same restriction, the device combines them, and for an on/off restriction the more restrictive value wins. This command shows the value the device is actually enforcing and, with `ProfileRestrictions`, which profile set it.
    - question: Does the Restrictions command work on macOS?
      answer: |
        No. Apple says the command technically runs on macOS but returns an empty dictionary.

        To check restrictions on a Mac, use the osquery `managed_policies` table, which shows the values from installed profiles. You can save it as a report in Fleet. In Terminal, `sudo profiles show -type configuration` lists the installed profiles and their payloads.
    - question: Does Fleet send the Restrictions command automatically?
      answer: |
        No. Fleet doesn't use it for any built-in feature. Fleet tracks whether each configuration profile was delivered, not the combined restrictions on the device.

        Send `Restrictions` as a custom command when you need to see what the device is enforcing.
    - question: How do I run the Restrictions command with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=restrictions.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's read-only and available in Fleet Free.

        Then run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the result contains `GlobalRestrictions`, and `ProfileRestrictions` if you asked for it.
    - question: Does the Restrictions command work on personally owned devices?
      answer: |
        No. Apple doesn't allow it on devices enrolled with User Enrollment. It works on supervised and unsupervised devices otherwise.
    - question: Why isn't a restriction I set showing up as enforced?
      answer: |
        Usually because the restriction needs a supervised device, or another profile sets a stricter value. Many iPhone and iPad restrictions only apply on supervised devices. Check `IsSupervised` with a `DeviceInformation` command, and run `Restrictions` with `ProfileRestrictions` set to `true` to see which profile set each value.
    - question: What errors can the Restrictions command return?
      answer: |
        Errors are rare because the command is read-only. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ProfileRestrictions</key>
            <false/>
            <key>RequestType</key>
            <string>Restrictions</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_Restrictions</string>
    </dict>
    </plist>

- name: Erase device
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/erase-device-command
  description: Remotely and immediately erase a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the EraseDevice MDM command do?
      answer: |
        `EraseDevice` remotely erases an Apple device and returns it to factory settings, without warning the user. It works even on a locked device. All user data, settings, and apps are erased, and the device is no longer managed until it enrolls again.

        This can't be undone, so confirm you're targeting the right host before you send it.
    - question: How often is EraseDevice used?
      answer: |
        Occasionally, and on purpose. Teams send it when a device is lost or stolen, or to prepare a company-owned device for a new user. It's not part of routine management.
    - question: Which Fleet features use EraseDevice?
      answer: |
        The **Wipe** action, in Fleet Premium. Open **Host details**, click **Actions**, then **Wipe**. Fleet sends `EraseDevice` to Macs, iPhones, and iPads, shows a "Wipe pending" badge, and changes it to "Wiped" when the device acknowledges the command. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).

        On Macs, Fleet uses Erase All Content and Settings with Apple's default fallback behavior.
    - question: How do I send EraseDevice as a custom command in Fleet?
      answer: |
        In Fleet Premium, save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=erase-device.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. `EraseDevice` isn't available as a custom command in Fleet Free.

        Use a custom command only when you need options the **Wipe** action doesn't set, like `PreserveDataPlan`, `ReturnToService`, or `ObliterationBehavior`. A custom wipe doesn't update the host's wipe status in Fleet.
    - question: Can a device automatically re-enroll after being erased?
      answer: |
        Yes, on iPhone and iPad with iOS and iPadOS 17 or later. Set `ReturnToService` with `Enabled` set to `true` in the `EraseDevice` command, and include a Wi-Fi profile in `WiFiProfileData` if the device needs one to get online. The device erases, then completes setup and re-enrolls on its own, with no one tapping through Setup Assistant.

        Activation Lock must be off for this to work. Fleet's **Wipe** action doesn't set `ReturnToService`, so send it as a custom command.
    - question: Can I erase a Mac or iPhone without MDM?
      answer: |
        Yes. On a Mac with Apple silicon or a T2 chip, go to **System Settings > General > Transfer or Reset > Erase All Content and Settings**. On iPhone and iPad, go to **Settings > General > Transfer or Reset iPhone > Erase All Content and Settings**.

        Either way, someone needs the device in hand and the passcode or an admin password. `EraseDevice` works remotely and needs neither.
    - question: What should I know before wiping a device?
      answer: |
        - If Activation Lock is on, the device asks for the previous user's Apple Account after the wipe unless you have a bypass code or turn it off in Apple Business.
        - Wiping cancels the host's upcoming activities in Fleet.
        - Wait for the wipe to finish before deleting the host in Fleet, or Fleet can't confirm it completed.
        - If the device is still assigned to Fleet in Apple Business, it re-enrolls the next time it goes through Setup Assistant.
    - question: Does EraseDevice work on personally owned devices?
      answer: |
        No. Apple doesn't allow MDM to erase devices enrolled with User Enrollment. Only devices enrolled with device enrollment or Automated Device Enrollment (ADE) can be erased.

        For a personal device, remove the user's access to company data instead, for example by turning off MDM, which removes managed apps, accounts, and profiles.
    - question: What errors can EraseDevice return?
      answer: |
        `Error` usually means the device can't be erased by MDM in its current state, for example a device enrolled with User Enrollment. On a Mac, an `Error` can also mean Erase All Content and Settings couldn't run; with Apple's default fallback, the Mac may still try to erase itself.

        Apple notes the device doesn't retry the command if the first attempt fails. `CommandFormatError` means the plist is malformed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>DisallowProximitySetup</key>
            <false/>
            <key>PreserveDataPlan</key>
            <true/>
            <key>RequestType</key>
            <string>EraseDevice</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_EraseDevice</string>
    </dict>
    </plist>

- name: Device lock
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-lock-command
  description: Remotely and immediately lock a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - visionOS 2.0+
    - watchOS 10.0+
  faq:
    - question: What does the DeviceLock MDM command do?
      answer: |
        `DeviceLock` immediately locks an Apple device. On iPhone and iPad, it locks the screen, and the user unlocks it with their passcode. On a Mac, it restarts the computer to a lock screen that needs the six-digit `PIN` you set in the command.

        You can add a `Message` and `PhoneNumber` to show on the lock screen. On iPhone and iPad, those only appear if the device has a passcode.
    - question: How often is DeviceLock used?
      answer: |
        Rarely. It's an incident-response command for lost, stolen, or compromised devices, or for when someone leaves the organization.
    - question: Which Fleet features use DeviceLock?
      answer: |
        The **Lock** action for Macs, in Fleet Premium. Open **Host details**, click **Actions**, then **Lock**. Fleet generates a random six-digit PIN and shows it when you click **Actions > Unlock**.

        For iPhone and iPad, Fleet's **Lock** action uses Lost Mode (`EnableLostMode`) instead, which only works on company-owned, supervised devices. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How do I send DeviceLock as a custom command in Fleet?
      answer: |
        In Fleet Premium, save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=device-lock.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. `DeviceLock` isn't available as a custom command in Fleet Free.

        For Macs, add a six-digit `PIN` and store it somewhere safe. Fleet doesn't know a PIN set in a custom command and doesn't show the host as locked, so use **Actions > Lock** whenever you can.
    - question: What happens if I lose the PIN for a locked Mac?
      answer: |
        The Mac stays locked. Without the PIN, recovery usually requires Apple support and proof of ownership. When you use Fleet's **Lock** action, Fleet stores the PIN for you, which is why the built-in action is the safer option.
    - question: Can I unlock a device remotely after DeviceLock?
      answer: |
        No. There's no MDM command to undo `DeviceLock`. On iPhone and iPad, the user unlocks with their passcode. On a Mac, someone has to type the PIN on the lock screen.

        If you need to remotely unlock an iPhone or iPad later, use Lost Mode instead. You turn it off with `DisableLostMode`.
    - question: What's the difference between DeviceLock and Lost Mode?
      answer: |
        `DeviceLock` locks the screen once, and on iPhone and iPad anyone with the passcode can unlock it. Lost Mode (`EnableLostMode`) keeps a supervised iPhone or iPad locked until the MDM turns it off, and lets the MDM request the device's location. Fleet uses Lost Mode for iPhone and iPad locks.
    - question: How do I know if DeviceLock worked?
      answer: |
        `Acknowledged` means the device locked. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. With the **Lock** action, the host's badge changes from "Lock pending" to "Locked".

        The response's `MessageResult` tells you whether your message appeared, or why it didn't, like `NoPasscodeSet`.
    - question: What errors can DeviceLock return?
      answer: |
        On a Mac, Apple says the command fails if there's no recovery partition. On Macs with Apple silicon running a macOS version earlier than 11.5, it deactivates the Mac, which then needs a network connection and a local admin with a secure token to reactivate.

        `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Message</key>
            <string>Lock Message</string>
            <key>PhoneNumber</key>
            <string>408-555-5555</string>
            <key>RequestType</key>
            <string>DeviceLock</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DeviceLock</string>
    </dict>
    </plist>

- name: Restart device
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/restart-device-command
  description: Remotely and immediately restart a device.
  supportedDeviceTypes:
    - iOS 10.3+
    - iPadOS 10.3+
    - macOS 10.13+
    - tvOS 10.2+
  faq:
    - question: What does the RestartDevice MDM command do?
      answer: |
        `RestartDevice` restarts an Apple device remotely. By default, the restart happens immediately, without asking the user.

        On macOS 11.4 or later, set `NotifyUser` to `true` to ask the user to restart at their convenience instead. The user can dismiss that notification, and it doesn't appear again unless you resend the command.
    - question: How often is RestartDevice used?
      answer: |
        Occasionally. Admins send it to finish an update, apply a setting that needs a restart, or recover a device that's misbehaving. It isn't part of routine management.
    - question: Can I restart a Mac with Fleet?
      answer: |
        Yes. Fleet doesn't have a **Restart** action or send `RestartDevice` automatically, so send it as a custom MDM command. Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=restart-device.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's available in Fleet Free.

        To restart several hosts, pass a comma-separated list to `--hosts`. On Macs, you can also [run a script](https://fleetdm.com/guides/scripts) like `shutdown -r +5` to give users a few minutes' warning.
    - question: Does RestartDevice require a supervised device?
      answer: |
        On iPhone, iPad, and Apple TV, yes. Unsupervised devices reject the command, and Apple doesn't allow it on devices enrolled with User Enrollment. Macs don't need to be supervised.
    - question: Will the user lose unsaved work?
      answer: |
        They can. A forced restart doesn't wait for the user to save. On macOS 11.4 or later, set `NotifyUser` to `true` so the user chooses when to restart. With `NotifyUser`, the Mac only restarts on its own if no one is signed in.
    - question: Will the device reconnect to MDM after restarting?
      answer: |
        A Mac usually does. An iPhone or iPad with a passcode doesn't rejoin Wi-Fi after a restart until the user unlocks it for the first time, so it may not reach the MDM until then. Plan for that before restarting unattended devices.
    - question: How do I restart a Mac without MDM?
      answer: |
        Run `sudo shutdown -r now` in Terminal, or choose **Apple menu > Restart**. On iPhone and iPad, the user restarts the device with the buttons. MDM is the only way to restart an iPhone or iPad remotely.
    - question: How do I know if RestartDevice worked?
      answer: |
        `Acknowledged` means the device accepted the command and is restarting. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. For a Mac, the **Last restarted** time in **Host details** updates after fleetd reports in again.
    - question: What errors can RestartDevice return?
      answer: |
        The most common `Error` comes from sending it to an unsupervised iPhone or iPad. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>RestartDevice</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RestartDevice</string>
    </dict>
    </plist>

- name: Shut down device
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/shut-down-device-command
  description: Remotely and immediately shut down a device.
  supportedDeviceTypes:
    - iOS 10.3+
    - iPadOS 10.3+
    - macOS 10.13+
  faq:
    - question: What does the ShutDownDevice MDM command do?
      answer: |
        `ShutDownDevice` powers off a Mac, iPhone, or iPad remotely and immediately. The user doesn't get a prompt to save their work.

        The device stays off until someone turns it on again.
    - question: How often is ShutDownDevice used?
      answer: |
        Rarely. Teams use it to power down devices before a move or storage, or to take a compromised device offline. Most organizations use a restart or lock instead.
    - question: Can I turn a device back on with MDM after ShutDownDevice?
      answer: |
        No. MDM can't power on a device. After it shuts down, the device can't receive commands until someone powers it on.

        Even then, an iPhone or iPad with a passcode doesn't rejoin Wi-Fi until the user unlocks it for the first time. A Mac with FileVault may not reconnect until someone signs in.
    - question: Does Fleet send ShutDownDevice?
      answer: |
        No. Fleet doesn't send `ShutDownDevice` for any built-in feature, and there's no shutdown action in the Fleet UI. Send it as a custom MDM command, which is available in Fleet Free.

        If your goal is to cut off a lost or compromised device, Fleet's **Lock** action is usually better. The device stays reachable, and you can unlock or wipe it later.
    - question: How do I shut down a device with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=shut-down-device.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Pass a comma-separated list to `--hosts` to target several hosts.

        On Macs, you can also [run a script](https://fleetdm.com/guides/scripts) like `shutdown -h +5` to give the user a few minutes' warning.
    - question: Does ShutDownDevice require a supervised device?
      answer: |
        On iPhone and iPad, yes. Unsupervised iOS and iPadOS devices reject the command, and Apple doesn't allow it on devices enrolled with User Enrollment. Macs don't need to be supervised.
    - question: How do I know if ShutDownDevice worked?
      answer: |
        `Acknowledged` means the device accepted the command and is shutting down. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. The host then shows as offline until it's turned back on.
    - question: What errors can ShutDownDevice return?
      answer: |
        Most errors come from sending it to an unsupervised iPhone or iPad. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ShutDownDevice</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ShutDownDevice</string>
    </dict>
    </plist>

- name: Install application
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-application-command
  description: Install a third-party app on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 10.9+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the InstallApplication MDM command do?
      answer: |
        `InstallApplication` tells an Apple device to install a third-party app. You identify the app with exactly one of `iTunesStoreID` (an App Store app), `Identifier` (a bundle ID), or `ManifestURL` (an HTTPS link to an in-house app's manifest).

        Optional keys control how the app is managed. `ManagementFlags` set to `1` removes the app when MDM is removed, `ChangeManagementState` takes over an app the user already installed, `Configuration` sends managed app configuration, and `Attributes` sets things like a per-app VPN. If the app is already managed, the same command updates it.
    - question: What's the difference between InstallApplication and InstallEnterpriseApplication?
      answer: |
        `InstallApplication` works on iPhone, iPad, Mac, Apple TV, Apple Vision Pro, and Apple Watch, and installs App Store apps or in-house apps from a manifest. `InstallEnterpriseApplication` is macOS only and installs a package (`.pkg`) from a manifest, with extra options like certificate pinning.

        On iPhone and iPad, use `InstallApplication` for in-house `.ipa` apps. On a Mac, MDMs typically use `InstallEnterpriseApplication` for packages like an agent or bootstrap package.
    - question: Does InstallApplication prompt the end user?
      answer: |
        On unsupervised devices, yes. The user is asked to approve the install. On supervised iPhones and iPads, App Store apps install without a prompt, though an update can prompt if the app is open at the time.

        Taking over management of an app the user already installed follows the same pattern. Supervised, company-owned devices convert silently. Personal and manually enrolled devices prompt the user, who can decline.
    - question: Can I install App Store apps without signing in to an Apple Account on the device?
      answer: |
        Yes, with device-assigned licenses. Assign the app's license to the device's serial number in Apple Business, then send `InstallApplication` with `Options` > `PurchaseMethod` set to `1`. The app installs without an Apple Account and the `DeviceBasedVPP` key reports `true` in the device's app list.

        Without a license for that device, App Store installs fail.
    - question: Which Fleet features use InstallApplication?
      answer: |
        [App Store apps](https://fleetdm.com/guides/install-app-store-apps) on macOS, iOS, and iPadOS, and in-house `.ipa` apps on iOS and iPadOS. Fleet sends it for installs from **Host details**, self-service, setup experience, policy automations, and automatic updates of iOS and iPadOS apps. These features are part of Fleet Premium.

        For App Store apps, Fleet assigns the license through Apple Business first, then sends the command with the app's `iTunesStoreID`. On iOS and iPadOS, Fleet sets `ManagementFlags` to `1` and includes any managed configuration you added.
    - question: How do I send a one-off InstallApplication command with Fleet?
      answer: |
        Save the plist with your `iTunesStoreID` or `ManifestURL`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=install-app.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. For App Store apps, the device must already have a license, or the install fails.

        A custom command isn't tracked in Fleet's software inventory or install history, and Fleet won't retry it. To get licensing, retries, and install verification, add the app in Fleet and install it from **Host details** instead.
    - question: How do I push managed app configuration (App Config) with InstallApplication?
      answer: |
        Put the app's settings in the `Configuration` dictionary. The keys depend on the app, so check the developer's documentation. Apple supports `Configuration` on iOS, iPadOS, and macOS 11 and later.

        In Fleet, add a managed configuration to an App Store app and Fleet includes it in `InstallApplication` on iOS and iPadOS hosts. For Mac apps, deliver the app's preferences in a configuration profile in **Controls > OS settings** instead. Many apps only read new configuration after they're quit and reopened.
    - question: How do I know if InstallApplication worked?
      answer: |
        `Acknowledged` means the device accepted the command, not that the app is installed. On iOS and iPadOS, the response includes a `State` such as `Queued`, `Installing`, or `Managed`. On macOS, the Mac acknowledges before it downloads the app and doesn't report later install errors.

        To confirm, check the device's app list with `InstalledApplicationList` or `ManagedApplicationList`. Fleet does this automatically after its own installs and marks each install as verified or failed.
    - question: What errors can InstallApplication return?
      answer: |
        Common causes are a missing license, an app that needs a newer OS than the device runs, and an app the user already installed on a personal device. On iOS and iPadOS, the response's `RejectionReason` can explain why, for example `AppAlreadyInstalled`, `AppStoreDisabled`, or `ManagementChangeNotSupported`.

        The command also fails for apps that declarative device management (DDM) is managing. Fleet's guide notes that `ErrorCode` 301 with "Invalid Status Code" usually means the app's minimum OS version is higher than the host's.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagementFlags</key>
            <integer>0</integer>
            <key>ManifestURL</key>
            <string>https://yourmdmhost.example.com/files/myenterpriseapp.plist</string>
            <key>RequestType</key>
            <string>InstallApplication</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstallApplication</string>
    </dict>
    </plist>

- name: Install enterprise application
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-enterprise-application-command
  description: Install an enterprise app on a device.
  supportedDeviceTypes:
    - macOS 10.13.6+
  faq:
    - question: What does the InstallEnterpriseApplication MDM command do?
      answer: |
        `InstallEnterpriseApplication` tells a Mac to download and install a package (`.pkg`). You point to it with a `ManifestURL` (an HTTPS link to a manifest plist) or an embedded `Manifest` dictionary. The manifest lists the package URL and a hash so the Mac can verify the download.

        It's macOS only, on macOS 10.13.6 and later.
    - question: What's the difference between InstallEnterpriseApplication and InstallApplication with a ManifestURL?
      answer: |
        Apple describes `InstallEnterpriseApplication` as the more secure option for manifest-based Mac installs. With `ManifestURL`, you can pin the server's certificates with `ManifestURLPinningCerts` and require revocation checks with `PinningRevocationCheckRequired`. You can also skip the extra download by embedding the `Manifest` in the command.

        `InstallApplication` is the one to use for App Store apps and for iPhone and iPad.
    - question: What package requirements does InstallEnterpriseApplication have?
      answer: |
        Use a distribution package (product archive) signed with a Developer ID Installer certificate. A component package can be converted with `productbuild`, and signed with `productsign`. Fleet's [bootstrap package guide](https://fleetdm.com/guides/setup-experience#bootstrap-package) walks through both steps.

        The hash in the manifest must match the file exactly, so update the manifest whenever you replace the package.
    - question: Which Fleet features use InstallEnterpriseApplication?
      answer: |
        Two macOS features. Fleet sends it to install fleetd after a Mac turns on MDM, unless you [deploy a custom agent](https://fleetdm.com/guides/setup-experience#manually-install-fleetd). It also installs your [bootstrap package](https://fleetdm.com/guides/setup-experience#bootstrap-package) during automatic enrollment, and optionally during manual enrollment or migration.

        Custom packages you add under **Software** are installed by fleetd, not by this command.
    - question: How do I send InstallEnterpriseApplication with Fleet?
      answer: |
        Host the package and a manifest on an HTTPS server the Mac can reach. Put the manifest URL in `ManifestURL`, save the plist, and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-pkg.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        For anything you install more than once, [add the package](https://fleetdm.com/guides/deploy-software-packages) under **Software** in Fleet Premium instead. Fleet then hosts the file, tracks install status, and can run install and uninstall scripts.
    - question: How do I know if InstallEnterpriseApplication worked?
      answer: |
        Not from the command result alone. The Mac returns `Acknowledged` after it validates the command, before it downloads and installs the package, and it doesn't report install errors afterward.

        To confirm, check the host's software inventory, run a report on the `package_receipts` table, or look in `/var/log/install.log` on the Mac.
    - question: Can I install a .pkg on a Mac without MDM?
      answer: |
        Yes. Run `sudo installer -pkg /path/to/package.pkg -target /` in Terminal, or double-click the package to open Installer. Both need admin rights.

        MDM is useful when you need packages installed during setup, before anyone signs in, or across many Macs at once.
    - question: Does InstallEnterpriseApplication work on iPhone or iPad?
      answer: |
        No. It's macOS only. To install in-house apps on iPhone and iPad, use `InstallApplication` with a `ManifestURL` that points to an `.ipa` manifest.
    - question: Why did InstallEnterpriseApplication fail?
      answer: |
        Common causes are an unreachable `ManifestURL`, a hash that doesn't match the package, an unsigned or component package, and a certificate pinning or revocation check that fails. Errors the Mac catches before downloading come back as `Error` with an `ErrorChain`. The command also fails if declarative device management (DDM) is managing the app.

        `CommandFormatError` means the command plist is malformed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManifestURL</key>
            <string>https://yourmdmhost.example.com/files/myenterpriseapp.plist</string>
            <key>PinningRevocationCheckRequired</key>
            <false/>
            <key>RequestType</key>
            <string>InstallEnterpriseApplication</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstallEnterpriseApplication</string>
    </dict>
    </plist>

- name: Installed application list
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/installed-application-list-command
  description: Get a list of the installed apps on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 10.7+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the InstalledApplicationList MDM command do?
      answer: |
        `InstalledApplicationList` asks an Apple device for its installed apps. Each entry can include the bundle `Identifier`, `Name`, `ShortVersion`, `Version`, and flags like `Installing`, `IsValidated`, and `HasUpdateAvailable`.

        Use `Items` to request only the keys you need, `Identifiers` to ask about specific apps, and `ManagedAppsOnly` set to `true` to list only apps MDM installed. Size keys like `BundleSize` are slow to calculate, and on the 26 releases they're only returned if you ask for them in `Items`.
    - question: Does InstalledApplicationList include system apps?
      answer: |
        On macOS, yes. On iPhone, iPad, Apple TV, Apple Vision Pro, and Apple Watch, system apps are included starting with the 26 releases. Earlier versions return third-party apps only.
    - question: Why does InstalledApplicationList show fewer apps on personal devices?
      answer: |
        Apple limits what MDM can see. With User Enrollment, the device always behaves as if `ManagedAppsOnly` is `true` and returns only apps MDM installed. Apps managed through declarative device management (DDM) are also left out whenever only managed apps are returned.
    - question: Which Fleet features use InstalledApplicationList?
      answer: |
        Software inventory for iPhone and iPad, which can't run fleetd. Fleet sends it about once an hour and when you select **Refetch** on **Host details**. Hosts that didn't enroll through Automated Device Enrollment (ADE) are asked for managed apps only.

        Fleet also sends it after App Store and in-house app installs to verify the app is present, on macOS, iOS, and iPadOS. Mac inventory itself comes from fleetd.
    - question: How do I run InstalledApplicationList with Fleet and read the results?
      answer: |
        Set `ManagedAppsOnly` to `true` or `false` in the sample plist and run `fleetctl mdm run-command --hosts=<hostname> --payload=installed-apps.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Then run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the result holds the `InstalledApplicationList` array. The command is read-only.
    - question: How do I list installed apps on a Mac without MDM?
      answer: |
        Run `system_profiler SPApplicationsDataType` in Terminal, or query the `apps` table with osquery. On iPhone and iPad, users can see installed apps in **Settings > General > iPhone Storage** (or **iPad Storage**).
    - question: What's the difference between InstalledApplicationList and ManagedApplicationList?
      answer: |
        `InstalledApplicationList` reports what's installed, with names and versions. `ManagedApplicationList` reports the management status of apps MDM installed or tried to install, such as `Managed`, `PromptingForManagement`, or `ManagementRejected`.

        Use `ManagedApplicationList` to check whether MDM actually controls an app.
    - question: Can InstalledApplicationList tell me if an app has an update?
      answer: |
        Partly. `HasUpdateAvailable` is reported for App Store apps, and on macOS only for Volume Purchase Program (VPP) apps. Apple refreshes it daily, so it can lag. You can also compare `ExternalVersionIdentifier` with the current App Store version.

        Fleet can [update iOS and iPadOS App Store apps automatically](https://fleetdm.com/guides/install-app-store-apps) in a maintenance window you choose.
    - question: What errors can InstalledApplicationList return?
      answer: |
        This command rarely fails. Expect `NotNow` if the device is busy and will answer later, and `CommandFormatError` if the plist is malformed, for example a misspelled key. An offline device leaves the command `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedAppsOnly</key>
            <true/>
            <key>RequestType</key>
            <string>InstalledApplicationList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstalledApplicationList</string>
    </dict>
    </plist>

- name: Managed application list
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-list-command
  description: Get the status of all managed apps on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ManagedApplicationList MDM command do?
      answer: |
        `ManagedApplicationList` returns the status of App Store apps that MDM manages or tried to install. For each bundle ID, the device reports a `Status`, its `ManagementFlags`, whether it has managed configuration (`HasConfiguration`) or feedback (`HasFeedback`), and whether it's validated.

        Pass `Identifiers` to limit the response to specific apps. Apps managed through declarative device management (DDM) aren't included.
    - question: How do I tell if a user declined app management?
      answer: |
        Look for `ManagementRejected` in the app's `Status`, which means the user declined. `PromptingForManagement` means they haven't answered yet, and `UserRejected` means they declined the install itself.

        These rejection statuses are transient, and the device reports them only once. Send the command soon after the install, and save the result if you need it later.
    - question: What do the ManagedApplicationList statuses mean?
      answer: |
        The most useful ones:

        - `Managed`: the app is installed and managed.
        - `ManagedButUninstalled`: the app is managed but the user deleted it. Reinstalling restores it as managed.
        - `Queued`, `Installing`, `Updating`: work in progress.
        - `NeedsRedemption`: the install is waiting for a redemption code.
        - `Failed`: the install failed. This status is reported only once.
    - question: Does Fleet use ManagedApplicationList?
      answer: |
        Not automatically. Fleet verifies installs with `InstalledApplicationList`. That can't detect a declined management prompt, so Fleet's [App Store apps guide](https://fleetdm.com/guides/install-app-store-apps) recommends sending `ManagedApplicationList` as a custom command to confirm an iOS or iPadOS app is managed.

        If the user declined, install the app again from **Host details** to show the prompt again. If no prompt appears, ask the user to delete the app, then install it through Fleet again.
    - question: How do I run ManagedApplicationList with Fleet?
      answer: |
        No extra keys are needed. Save the sample plist and run `fleetctl mdm run-command --hosts=<hostname> --payload=managed-apps.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Then run `fleetctl get mdm-command-results --id=<command-uuid>` to read the dictionary of apps keyed by bundle ID.
    - question: What's the difference between ManagedApplicationList and InstalledApplicationList?
      answer: |
        `ManagedApplicationList` answers "Does MDM control this app?" `InstalledApplicationList` answers "What's installed, and which version?" An app can show as installed while its management status is `ManagementRejected`, so use both when an app isn't getting its configuration.
    - question: Does ManagedApplicationList work on macOS?
      answer: |
        Yes, on macOS 11 and later. It's most useful on iPhone and iPad, where users accept or decline management prompts.
    - question: What errors can ManagedApplicationList return?
      answer: |
        Errors are rare because the command is read-only. Expect `NotNow` if the device is busy, and `CommandFormatError` if the plist is malformed. An empty result means MDM manages no App Store apps on the device.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ManagedApplicationList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationList</string>
    </dict>
    </plist>

- name: Remove application
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/remove-application-command
  description: Remove an app.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the RemoveApplication MDM command do?
      answer: |
        `RemoveApplication` uninstalls a managed app from an Apple device. You pass the app's bundle ID in the `Identifier` key. The app's data is removed with it.

        Starting with the 26 releases, it can also remove unmanaged and deletable system apps on supervised iPhone, iPad, Apple TV, Apple Vision Pro, and Apple Watch. It fails for apps that declarative device management (DDM) is managing.
    - question: Can RemoveApplication remove apps the user installed?
      answer: |
        Only on supervised devices running iOS 26, iPadOS 26, or later (and the matching tvOS, visionOS, and watchOS releases). On older or unsupervised devices, MDM can only remove apps it manages.

        To remove a user-installed app there, first take over management with `InstallApplication` and `ChangeManagementState` set to `Managed`. On personal devices, the user has to approve that.
    - question: Does RemoveApplication work on macOS?
      answer: |
        Yes, on macOS 11 and later, but only for apps MDM installed as managed. Apps installed from a package, by the user, or by another tool aren't affected.

        To remove other Mac apps, run an uninstall script. In Fleet, packages added under **Software** include an uninstall script you can run from **Host details**, and you can run any script with [Fleet's script execution](https://fleetdm.com/guides/scripts).
    - question: How do I uninstall App Store apps with Fleet?
      answer: |
        Fleet doesn't uninstall App Store (VPP) or in-house `.ipa` apps from the UI yet, and doesn't send `RemoveApplication` on its own. Send it as a custom command: set `Identifier` to the bundle ID (find it in the host's software inventory), then run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-app.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Apps Fleet installs on iOS and iPadOS are also removed when the host turns off MDM, because Fleet installs them with `ManagementFlags` set to `1`.
    - question: Does removing an App Store app free up the VPP license?
      answer: |
        No. Removing the app doesn't revoke its license in Apple Business. Revoke it in Apple Business, or use the [license revocation script](https://github.com/fleetdm/fleet/blob/main/docs/solutions/macos/scripts/revoke-vpp-licenses.sh) linked from Fleet's [App Store apps guide](https://fleetdm.com/guides/install-app-store-apps).
    - question: How do I stop users from deleting a managed app?
      answer: |
        On iOS and iPadOS 14 and later, set the app's `Removable` attribute to `false`, either in the `Attributes` dictionary of `InstallApplication` or with the `Settings` command. On supervised devices, a restrictions profile with `allowAppRemoval` set to `false` blocks users from deleting any app.

        In Fleet, add the restrictions profile in **Controls > OS settings**. Fleet doesn't set app attributes, so send a `Settings` command as a custom command if you need them.
    - question: How do I know if RemoveApplication worked?
      answer: |
        `Acknowledged` means the device removed the app. Run `fleetctl get mdm-command-results --id=<command-uuid>` in Fleet, then confirm the app is gone by sending `InstalledApplicationList` or checking the host's software inventory after its next refresh.
    - question: What errors can RemoveApplication return?
      answer: |
        Usually the app isn't managed by this MDM, isn't installed, or the `Identifier` doesn't match its bundle ID exactly. Expect an error too if DDM manages the app. `NotNow` means the device is busy and will retry, and `CommandFormatError` means the plist is malformed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifier</key>
            <string>com.acme.myenterpriseapp</string>
            <key>RequestType</key>
            <string>RemoveApplication</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RemoveApplication</string>
    </dict>
    </plist>

- name: Apply redemption code
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/apply-redemption-code-command
  description: Remove an app.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
  faq:
    - question: What does the ApplyRedemptionCode MDM command do?
      answer: |
        `ApplyRedemptionCode` gives an iPhone or iPad a redemption code to finish installing a paid app. You pass the app's bundle ID in `Identifier` and the code in `RedemptionCode`.
    - question: When do I need ApplyRedemptionCode?
      answer: |
        Only when an install is waiting for a code. `InstallApplication` returns a `State` of `NeedsRedemption`, or `ManagedApplicationList` shows that status for the app. Send the code then. Sending a code for an app that doesn't need one returns an error.
    - question: Are redemption codes still used for app distribution?
      answer: |
        Rarely. Redemption codes belong to the legacy Volume Purchase Program (VPP) flow, which Apple supports with `PurchaseMethod` `0` on iOS only. Most organizations now assign managed licenses in Apple Business to devices or users, which installs apps without codes or Apple Account prompts.
    - question: Does Fleet use ApplyRedemptionCode?
      answer: |
        No. Fleet installs [App Store apps](https://fleetdm.com/guides/install-app-store-apps) with managed licenses from Apple Business, so no codes are needed. If you still have redemption codes, consider switching those apps to managed licenses.

        To use a code anyway, fill in `Identifier` and `RedemptionCode`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=redeem.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: Can I reuse a redemption code on another device?
      answer: |
        No. Send each code to one device. If a user already bought a paid app, `ManagedApplicationList` can return an `UnusedRedemptionCode` for it, which you can give to another user. That value is reported only once, so save it.
    - question: How do I know if ApplyRedemptionCode worked?
      answer: |
        `Acknowledged` means the device accepted the code. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. Then confirm the app moves out of `NeedsRedemption` with `ManagedApplicationList` and shows up in the host's software inventory.
    - question: What errors can ApplyRedemptionCode return?
      answer: |
        Expect an error when the app isn't waiting for a code, the code was already used, or it's for a different app. `CommandFormatError` means the plist is malformed, for example a missing `Identifier`.
    - question: Does ApplyRedemptionCode work on macOS?
      answer: |
        No. It's iOS and iPadOS only.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifier</key>
            <string>com.example.app</string>
            <key>RedemptionCode</key>
            <string>SB56LT7YX8RH</string>
            <key>RequestType</key>
            <string>ApplyRedemptionCode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ApplyRedemptionCode</string>
    </dict>
    </plist>

- name: Validate applications
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/validate-applications-command
  description: Force validation of developer and universal provisioning profiles for enterprise apps.
  supportedDeviceTypes:
    - iOS 9.2+
    - iPadOS 9.2+
    - tvOS 10.2+
    - visionOS 1.1+
  faq:
    - question: What does the ValidateApplications MDM command do?
      answer: |
        `ValidateApplications` makes an iPhone or iPad check the provisioning profiles of its in-house (enterprise) apps right away. Pass bundle IDs in `Identifiers` to check specific apps. Leave it out to check every installed managed app.
    - question: Why would I need ValidateApplications?
      answer: |
        An enterprise-distributed app that isn't validated won't launch until validation happens. Sending this command triggers validation now instead of waiting for the device to do it, which helps on devices that were offline or on restricted networks.
    - question: How do I find apps that need validation?
      answer: |
        Check the `IsValidated` key. Both `InstalledApplicationList` and `ManagedApplicationList` report it. A value of `false` means the app won't run until it's validated.
    - question: Which devices support ValidateApplications?
      answer: |
        iPhone and iPad on iOS and iPadOS 9.2 and later, Apple TV, and Apple Vision Pro. It doesn't apply to Macs, and App Store apps don't need it.
    - question: Does Fleet use ValidateApplications?
      answer: |
        No. Fleet installs in-house `.ipa` apps with `InstallApplication`, but doesn't send `ValidateApplications`. If an in-house app won't launch, send it as a custom command.
    - question: How do I run ValidateApplications with Fleet?
      answer: |
        Save the sample plist, optionally add an `Identifiers` array, and run `fleetctl mdm run-command --hosts=<hostname> --payload=validate-apps.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. The device needs network access to reach Apple.
    - question: How do I know if ValidateApplications worked?
      answer: |
        `Acknowledged` means the device accepted the request. To confirm, send `InstalledApplicationList` and check that `IsValidated` is now `true`, or ask the user to open the app.
    - question: Why does my in-house app still not launch after ValidateApplications?
      answer: |
        Validation fails when the signing certificate or provisioning profile has expired or been revoked, or when the device can't reach Apple. Re-sign the app with a valid certificate and profile, then reinstall it. `NotNow` means the device is busy and will run the command later.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ValidateApplications</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ValidateApplications</string>
    </dict>
    </plist>

- name: Managed application attributes
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-attributes-command
  description: Query attributes in managed apps on a device.
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ManagedApplicationAttributes MDM command do?
      answer: |
        `ManagedApplicationAttributes` reads the attributes set on managed apps. Pass bundle IDs in the required `Identifiers` array. The response can include the per-app VPN (`VPNUUID`), content filter, DNS proxy, and relay UUIDs, `AssociatedDomains`, and whether the app is `Removable`, `Hideable`, or `Lockable`.
    - question: How do I set managed app attributes?
      answer: |
        Include an `Attributes` dictionary when you install the app with `InstallApplication`, or send the `Settings` command with an `ApplicationAttributes` item for an app that's already managed. `ManagedApplicationAttributes` only reads values back.
    - question: How do I stop users from deleting or hiding a managed app on iPhone?
      answer: |
        Set the app's attributes. `Removable` set to `false` blocks deleting it (iOS and iPadOS 14 and later). `Hideable` and `Lockable` set to `false` stop users from hiding or locking it (iOS and iPadOS 18.1 and later). Send `ManagedApplicationAttributes` afterward to confirm the values.
    - question: Which devices support ManagedApplicationAttributes?
      answer: |
        iPhone, iPad, Apple TV, Apple Vision Pro, and Apple Watch. It isn't available on macOS. Apps managed through declarative device management (DDM) aren't included in the response.
    - question: Does Fleet use ManagedApplicationAttributes?
      answer: |
        No. Fleet doesn't set or read app attributes. To set them, send a `Settings` command with `ApplicationAttributes` as a custom MDM command, then read them back with this command.
    - question: How do I run ManagedApplicationAttributes with Fleet?
      answer: |
        Put the app's bundle ID in the `Identifiers` array and run `fleetctl mdm run-command --hosts=<hostname> --payload=app-attributes.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I know if ManagedApplicationAttributes worked?
      answer: |
        The result is `Acknowledged` and contains an `ApplicationAttributes` array with one entry per app. An app with no attributes set returns its `Identifier` without attribute values.
    - question: What errors can ManagedApplicationAttributes return?
      answer: |
        Apps that aren't managed by this MDM return no attributes. `CommandFormatError` usually means `Identifiers` is missing or isn't an array. Expect `NotNow` if the device is busy.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifiers</key>
            <array>
                <string>com.acme.myenterpriseapp</string>
            </array>
            <key>RequestType</key>
            <string>ManagedApplicationAttributes</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationAttributes</string>
    </dict>
    </plist>

- name: Managed application configuration
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-attributes-command
  description: Get app configurations from managed apps on a device.
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - macOS 10.15+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ManagedApplicationConfiguration MDM command do?
      answer: |
        `ManagedApplicationConfiguration` reads the managed app configuration (often called App Config) that MDM sent to managed apps. Pass bundle IDs in the required `Identifiers` array. The response's `ApplicationConfigurations` array has each app's `Identifier` and its `Configuration` dictionary.
    - question: How do I send managed app configuration to an app?
      answer: |
        Include a `Configuration` dictionary in `InstallApplication`, or update it later with the `Settings` command and an `ApplicationConfiguration` item. The available keys depend on the app, so check the developer's documentation. This command only reads the configuration back.
    - question: Which Fleet features send managed app configuration?
      answer: |
        Fleet Premium lets you add a [managed configuration](https://fleetdm.com/guides/install-app-store-apps#managed-configuration) to App Store apps for iOS and iPadOS. Fleet sends it inside `InstallApplication` and replaces [Fleet variables](https://fleetdm.com/guides/fleet-variables) with each host's values.

        Fleet doesn't read it back automatically. Send this command as a custom command to see exactly what a host received.
    - question: How do I run ManagedApplicationConfiguration with Fleet?
      answer: |
        Put the app's bundle ID in `Identifiers` and run `fleetctl mdm run-command --hosts=<hostname> --payload=app-config.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Read the configuration with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: Why isn't my app using the new configuration?
      answer: |
        Many apps only read configuration when they launch. The user may need to fully quit and reopen the app. If this command shows the expected values, delivery worked.

        If the values are missing, check that the app is managed with `ManagedApplicationList`. Configuration only applies to managed apps.
    - question: Does ManagedApplicationConfiguration work on macOS?
      answer: |
        Yes, on macOS 10.15 and later. But most Mac apps read managed settings from configuration profiles, not App Config. For Mac apps, add a profile with the app's preference domain in **Controls > OS settings** in Fleet.
    - question: How do I know if ManagedApplicationConfiguration worked?
      answer: |
        The result is `Acknowledged` and includes an `ApplicationConfigurations` array. Each entry shows the configuration the device holds for that app, with any Fleet variables already filled in.
    - question: What errors can ManagedApplicationConfiguration return?
      answer: |
        An app that isn't managed, or has no configuration, returns no `Configuration` dictionary. Apps managed through declarative device management (DDM) aren't included. `CommandFormatError` usually means `Identifiers` is missing or isn't an array.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifiers</key>
            <array>
                <string>com.acme.myenterpriseapp</string>
            </array>
            <key>RequestType</key>
            <string>ManagedApplicationConfiguration</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationConfiguration</string>
    </dict>
    </plist>

- name: Managed application feedback
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-attributes-command
  description: Get app feedback from a managed app on the device.
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
  faq:
    - question: What does the ManagedApplicationFeedback MDM command do?
      answer: |
        `ManagedApplicationFeedback` collects feedback that managed apps have written for MDM. Pass bundle IDs in the required `Identifiers` array. The response's `ManagedApplicationFeedback` array has a `Feedback` dictionary for each app.

        Set `DeleteFeedback` to `true` to clear the feedback after it's read, so the next request only returns new data.
    - question: What kind of feedback can a managed app send?
      answer: |
        Whatever the developer chooses, such as setup status, sign-in state, or error details. Apps write feedback to the `com.apple.feedback` key in their managed app defaults. Most App Store apps don't write any, so check the app's documentation first.
    - question: How do I know which apps have feedback to collect?
      answer: |
        Send `ManagedApplicationList` and look for `HasFeedback` set to `true`. Then send `ManagedApplicationFeedback` for those apps.
    - question: Does ManagedApplicationFeedback work on macOS?
      answer: |
        Only on the user channel, on macOS 12 and later. On iPhone, iPad, Apple TV, and Apple Vision Pro, it's sent on the device channel.

        Fleet sends custom commands on the device channel, so with Fleet you can collect feedback from iPhone and iPad, not from Macs. To read app status on a Mac, use a script or a report with fleetd instead.
    - question: Does Fleet use ManagedApplicationFeedback?
      answer: |
        No. Fleet doesn't send it for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run ManagedApplicationFeedback with Fleet?
      answer: |
        Add the app's bundle ID to `Identifiers`, choose a `DeleteFeedback` value, and run `fleetctl mdm run-command --hosts=<hostname> --payload=app-feedback.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Read the feedback with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I know if ManagedApplicationFeedback worked?
      answer: |
        The result is `Acknowledged` and contains the `ManagedApplicationFeedback` array. An app that hasn't written feedback returns its `Identifier` with no `Feedback` dictionary.
    - question: What errors can ManagedApplicationFeedback return?
      answer: |
        Errors are rare. Apps that aren't managed, or are managed through declarative device management (DDM), return no feedback. `CommandFormatError` usually means `Identifiers` is missing or isn't an array.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>DeleteFeedback</key>
            <false/>
            <key>Identifiers</key>
            <array>
                <string>com.acme.myenterpriseapp</string>
            </array>
            <key>RequestType</key>
            <string>ManagedApplicationFeedback</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationFeedback</string>
    </dict>
    </plist>


- name: Install media
  platform: apple
  category: Managed media
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-media-command
  description: Install a book on a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
    - macOS 10.19+
  faq:
    - question: What does the InstallMedia MDM command do?
      answer: |
        `InstallMedia` installs a book on an iPhone or iPad as managed media, and it shows up in the Books app. Set `MediaType` to `Book` and provide either a `MediaURL` for your own file or an `iTunesStoreID` for a Book Store book. `PersistentID`, `Kind`, `Title`, `Author`, and `Version` describe your own files.

        `MediaURL` must lead to a PDF, an EPUB in `gzip` format, or an iBooks Author file in `gzip` format.
    - question: Does InstallMedia work on macOS?
      answer: |
        No, not on current Macs. Apple removed `InstallMedia` from macOS in macOS 11. Use it on iPhone and iPad.
    - question: Does the user see a prompt when a book is installed?
      answer: |
        No, unless they need to sign in to complete a Book Store transaction. Your own PDFs and EPUBs install without a prompt and appear in the Books app.
    - question: What happens to managed books when MDM is removed?
      answer: |
        It depends on the source. Books you host yourself are removed with MDM, and they aren't backed up or synced. Book Store books stay on the device, are backed up, and need a Volume Purchase Program (VPP) license.
    - question: How do I update a book I installed with InstallMedia?
      answer: |
        Send `InstallMedia` again with the same `PersistentID` and a new `MediaURL` or `Version`. The new file replaces the old one. For Book Store books, the same `iTunesStoreID` replaces the existing book.
    - question: How do I run InstallMedia with Fleet?
      answer: |
        Fleet doesn't send `InstallMedia` for any built-in feature, so send it as a custom command. Host the file on an HTTPS server the device can reach, fill in `MediaType`, `MediaURL`, `PersistentID`, and `Title`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=install-book.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet doesn't track books in its UI. To give users a link to documents instead, deploy a web clip profile in **Controls > OS settings**.
    - question: How do I know if InstallMedia worked?
      answer: |
        `Acknowledged` means the device accepted the command. The response's `State` shows progress, such as `Queued`, `Installing`, or `Managed`. To check later, send `ManagedMediaList`.
    - question: What errors can InstallMedia return?
      answer: |
        The response's `RejectionReason` explains most failures:

        - `DownloadInvalid`: the `MediaURL` doesn't lead to a valid book.
        - `WrongMediaType`: `MediaType` isn't `Book`.
        - `PurchaseNotFound` or `CouldNotVerifyITunesStoreID`: a Book Store book has no license or an invalid ID.
        - `AppStoreDisabled`: Book Store books need the App Store, which is turned off.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Author</key>
            <string>Acme, Inc.</string>
            <key>Kind</key>
            <string>pdf</string>
            <key>MediaType</key>
            <string>Book</string>
            <key>MediaURL</key>
            <string>https://yourmdmhost.example.com/files/myenterprisebook.pdf</string>
            <key>PersistentID</key>
            <string>com.acme.pdf.myenterprisebook</string>
            <key>RequestType</key>
            <string>InstallMedia</string>
            <key>Title</key>
            <string>My Enterprise Book</string>
            <key>Version</key>
            <string>1.0</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstallMedia</string>
    </dict>
    </plist>

- name: List managed media
  platform: apple
  category: Managed media
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-media-list-command
  description: Get a list of the managed books on a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
  faq:
    - question: What does the ManagedMediaList MDM command do?
      answer: |
        `ManagedMediaList` returns the managed books on an iPhone or iPad. The response's `Books` array lists each book's `PersistentID` or `iTunesStoreID`, `Title`, `Author`, `Version`, `Kind`, and `State`. The command needs no extra keys.
    - question: What do the ManagedMediaList states mean?
      answer: |
        `Managed` means the book is installed and managed. Book Store books report `Installed` instead. `ManagedButUninstalled` means the user deleted it, and `Queued`, `Installing`, or `Updating` mean work is in progress.

        `Failed` and `Unknown` are transient and reported only once, so check soon after an install.
    - question: Does ManagedMediaList show books the user added?
      answer: |
        No. It only lists books MDM installed with `InstallMedia`. Books the user added themselves aren't included.
    - question: Does ManagedMediaList work on macOS?
      answer: |
        No. It's available on iOS and iPadOS 8 and later, including Shared iPad.
    - question: How do I run ManagedMediaList with Fleet?
      answer: |
        Fleet doesn't send it automatically or track books in its UI, so send it as a custom command. Save the sample plist and run `fleetctl mdm run-command --hosts=<hostname> --payload=list-books.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Read the list with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I remove a book that ManagedMediaList shows?
      answer: |
        Send `RemoveMedia` with `MediaType` set to `Book` and the book's `PersistentID` or `iTunesStoreID` from the list.
    - question: What errors can ManagedMediaList return?
      answer: |
        This command rarely fails. Expect `NotNow` if the device is busy, and `CommandFormatError` if the plist is malformed. An empty `Books` array means MDM hasn't installed any books.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ManagedMediaList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedMediaList</string>
    </dict>
    </plist>

- name: Remove media
  platform: apple
  category: Managed media
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-media-list-command
  description: Remove a previously installed book from a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
  faq:
    - question: What does the RemoveMedia MDM command do?
      answer: |
        `RemoveMedia` deletes a managed book from an iPhone or iPad. Set `MediaType` to `Book` and identify the book with the `PersistentID` or `iTunesStoreID` used when it was installed.
    - question: What's the correct RemoveMedia payload?
      answer: |
        Put `MediaType`, `PersistentID`, and `RequestType` inside a `Command` dictionary, like every other Apple MDM command. Some published examples, including the sample on this page, put these keys at the top level of the plist. That fails, and Fleet rejects it as a command it can't decode.
    - question: How do I run RemoveMedia with Fleet?
      answer: |
        Fleet doesn't send `RemoveMedia` for any built-in feature. Fix the payload structure, then run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-book.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Get the book's `PersistentID` from `ManagedMediaList` first.
    - question: Can RemoveMedia delete books the user added?
      answer: |
        No. It only removes managed books installed with `InstallMedia`. Users manage their own books in the Books app.
    - question: Are managed books removed when the device leaves MDM?
      answer: |
        Books you host yourself are. Book Store books stay on the device. To remove a Book Store book, send `RemoveMedia` before the device leaves MDM.
    - question: Does RemoveMedia work on macOS?
      answer: |
        No. It's available on iOS and iPadOS only, including Shared iPad.
    - question: How do I know if RemoveMedia worked?
      answer: |
        `Acknowledged` means the device removed the book. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. To confirm, send `ManagedMediaList` and check that the book is gone.
    - question: What errors can RemoveMedia return?
      answer: |
        Expect an error if the `PersistentID` or `iTunesStoreID` doesn't match a managed book on the device. `CommandFormatError` means the plist is malformed, often because the `Command` dictionary is missing.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>MediaType</key>
        <string>Book</string>
        <key>PersistentID</key>
        <string>com.acme.pdf.myenterprisebook</string>
        <key>RequestType</key>
        <string>RemoveMedia</string>
    </dict>
    </plist>

- name: Account configuration
  platform: apple
  category: Accounts
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/account-configuration-command
  description: Create and configure a local administrator account on a device.
  supportedDeviceTypes:
    - macOS 10.11+
  faq:
    - question: What does the AccountConfiguration MDM command do?
      answer: |
        `AccountConfiguration` tells a Mac in Setup Assistant how to create local accounts. It can create an admin account (`AutoSetupAdminAccounts`, optionally hidden), prefill and lock the user's account name and full name, create the user as a standard account (`SetPrimarySetupAccountAsRegularUser`), or skip creating a user account (`SkipPrimarySetupAccountCreation`).
    - question: When can I send AccountConfiguration?
      answer: |
        Only during initial setup of a Mac that enrolled through Automated Device Enrollment (ADE), while Setup Assistant waits for MDM to finish. The Mac ignores it after setup and during migration from another MDM.

        That's why changes to these settings only apply to Macs that are erased and set up again.
    - question: How do I create a hidden admin account on Macs with MDM?
      answer: |
        Add one entry to `AutoSetupAdminAccounts` with `shortName`, `fullName`, a `passwordHash`, and `hidden` set to `true`. Setup Assistant only uses the first entry. A hidden account doesn't appear at the login window or in **Users & Groups**, but you can still sign in by typing its name.
    - question: Can I make the end user a standard (non-admin) user on a Mac?
      answer: |
        Yes, during setup. Set `SetPrimarySetupAccountAsRegularUser` to `true`. Apple requires an `AutoSetupAdminAccounts` entry at the same time, so the Mac still has an admin account. The same requirement applies to `SkipPrimarySetupAccountCreation`.
    - question: Which Fleet features use AccountConfiguration?
      answer: |
        [Setup experience](https://fleetdm.com/guides/setup-experience) in Fleet Premium, for Macs that enroll through Apple Business. Fleet sends it when you turn on:

        - End user authentication, to prefill the account name and full name from your IdP, locked if `lock_end_user_info` is on.
        - The [managed local account](https://fleetdm.com/guides/setup-experience#managed-local-account), a hidden `_fleetadmin` account with a unique password per host.
        - An end user account type of **Standard** or **Skip (no account)**.

        Use these settings rather than a custom command. Fleet sends the command at the right moment and stores the managed account password.
    - question: How do I change local accounts on Macs that already finished setup?
      answer: |
        `AccountConfiguration` won't help, so either erase and set up the Mac again, or use a script. For example, `sysadminctl -addUser` creates an account and `dseditgroup -o edit -d <username> -t user admin` removes a user from the admin group.

        In Fleet, run the script from **Host details** or on many hosts with [Fleet's script execution](https://fleetdm.com/guides/scripts).
    - question: What format does passwordHash need?
      answer: |
        A salted PBKDF2 SHA-512 hash (`SALTED-SHA512-PBKDF2`) in a plist, stored in the `passwordHash` data field. A plain-text password won't work. Fleet generates this hash for you when it creates the managed local account.
    - question: How do I know if AccountConfiguration worked?
      answer: |
        Check the Mac after setup: the admin account exists, and the user's account has the expected name and type. `Acknowledged` only means the Mac accepted the command.

        In Fleet, **Host details > Actions > Show managed account** shows the managed account's password once it's created.
    - question: What errors can AccountConfiguration return?
      answer: |
        The most common problem is timing. Outside Setup Assistant, the Mac ignores the command, so nothing is created. Other failures come from an invalid `passwordHash`, a missing `AutoSetupAdminAccounts` entry when it's required, or a malformed plist (`CommandFormatError`).
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>AutoSetupAdminAccounts</key>
            <array>
                <dict>
                    <key>fullName</key>
                    <string>Administrator</string>
