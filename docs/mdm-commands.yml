- name: Invite to program
  platform: apple
  category: Accounts
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/account-configuration-command
  description: Invite a user to join the Volume Purchase Program (VPP).
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - macOS 10.11+
  faq:
    - question: What does the InviteToProgram MDM command do?
      answer: |
        `InviteToProgram` shows the user an invitation to join Apple's Volume Purchase Program (VPP). You pass the `InvitationURL` from Apple and the `ProgramID` `com.apple.cloudvpp`. When the user accepts, their Apple Account is linked so licenses can be assigned to them.
    - question: How often is InviteToProgram used?
      answer: |
        Rarely, and less every year. It's part of the older user-based VPP model. Most organizations now assign app licenses to devices by serial number, which needs no invitation.
    - question: Does Fleet send InviteToProgram automatically?
      answer: |
        No. Fleet assigns App Store licenses to devices by serial number. For personal devices enrolled with a Managed Apple Account, Fleet assigns licenses to that account directly. Neither needs an invitation. You can still send `InviteToProgram` as a custom MDM command.
    - question: How do I run InviteToProgram with Fleet?
      answer: |
        Get an invitation URL for the user from Apple's VPP service, put it in `InvitationURL`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=invite.xml`. Escape `&` as `&amp;` inside the plist string, as in the sample.
    - question: Will the end user be notified?
      answer: |
        Yes. The user sees the invitation and must accept it and sign in with their Apple Account. Nothing happens if they ignore it.
    - question: How do I know if InviteToProgram worked?
      answer: |
        `Acknowledged` in `fleetctl get mdm-command-results --id=<command-uuid>` means the invitation was shown. It doesn't mean the user accepted. Check acceptance in your VPP user records.
    - question: What errors can InviteToProgram return?
      answer: |
        Expect errors for an invalid or expired `InvitationURL`, an unknown `ProgramID`, or unescaped characters in the URL (`CommandFormatError`).
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>InvitationURL</key>
            <string>https://buy.itunes.apple.com/WebObjects/MZFinance.woa/wa/associateVPPUserWithITSAccount?cc=us&amp;inviteCode=7770596534cf46b58fb0254e7112a5e5&amp;mt=8</string>
            <key>ProgramID</key>
            <string>com.apple.cloudvpp</string>
            <key>RequestType</key>
            <string>InviteToProgram</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InviteToProgram</string>
    </dict>
    </plist>

- name: Clear passcode
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/clear-passcode-command
  description: Remove the passcode from a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - visionOS 1.1+
    - macOS 10.0+
  faq:
    - question: What does the ClearPasscode MDM command do?
      answer: |
        The `ClearPasscode` command removes the passcode from an iPhone, iPad, or Apple Vision Pro. After the device processes it, the end user can unlock the device without a passcode and set a new one.

        The command must include the device's `UnlockToken`. The device gives this token to the MDM server in its `TokenUpdate` check-in, and the MDM server stores it. Without the token, the command can't run.
    - question: When do IT admins use ClearPasscode?
      answer: |
        Rarely, and only on request. The usual reason is an end user who forgot their passcode and is locked out of a company iPhone or iPad.

        It isn't part of routine device management. MDM servers don't send it on enrollment or during regular refreshes.
    - question: Does Fleet send ClearPasscode automatically?
      answer: |
        No. Fleet sends `ClearPasscode` only when an admin asks for it with the built-in **Clear passcode** action.

        Fleet stores each device's `UnlockToken` and adds it to the command at delivery, so you never handle the token yourself. Fleet logs a "cleared passcode" activity on the host. Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How do I clear an iPhone or iPad passcode with Fleet?
      answer: |
        Use the built-in action. Open the host's **Host details** page, click **Actions**, then click **Clear passcode** and confirm.

        You can also use the API, `POST /api/v1/fleet/hosts/:id/clear_passcode`, or `fleetctl mdm clear-passcode --host=<hostname>`. These are better than a custom command, because a custom `ClearPasscode` payload needs the device's real `UnlockToken`, which Fleet doesn't expose.
    - question: Is clear passcode available in Fleet Free?
      answer: |
        No. Clear passcode is available in Fleet Premium. This applies to the built-in action and to `ClearPasscode` sent as a custom MDM command. On Fleet Free, the request returns a missing license error.
    - question: Which iPhones and iPads can I clear the passcode on?
      answer: |
        Company-owned and manually enrolled iOS and iPadOS hosts with MDM turned on. Fleet blocks the action for hosts with a personal (BYOD) enrollment, because Apple doesn't provide an unlock token for User Enrollment.

        Fleet also blocks it when the enrollment profile doesn't grant the device lock and passcode removal access right, and for hosts in Lost Mode or with a wipe pending. `ClearPasscode` isn't supported on macOS.
    - question: What happens if a passcode policy is installed on the device?
      answer: |
        The passcode is still removed. If a configuration profile with a `Passcode` payload requires a passcode, the device asks the end user to create a new one that meets the policy.

        Starting with iOS 16, clearing the passcode doesn't add it to the passcode history. The end user can set the same passcode again even when the profile sets `pinHistory`.
    - question: How do I know the ClearPasscode command worked?
      answer: |
        Check the command result. In Fleet, go to **Host details** and click **Show MDM commands**, or run `fleetctl get mdm-command-results --id=<command-uuid>`. The built-in action returns the command UUID.

        `Acknowledged` means the device removed the passcode. `Pending` means the device hasn't checked in yet. `NotNow` means the device couldn't process it yet and will try again at a later check-in.
    - question: Can I cancel a clear passcode request?
      answer: |
        Yes, if the device hasn't received it yet. Go to **Host details > Activity > Upcoming > MDM commands**, or use the [cancel host's pending MDM command](https://fleetdm.com/docs/rest-api/rest-api#cancel-hosts-pending-mdm-command) API endpoint. Once the device acknowledges the command, the passcode is already gone.
    - question: Why did ClearPasscode return an error?
      answer: |
        If Fleet has no unlock token for the device, it rejects the request before sending anything. If the device returns `Error`, a common cause is an unlock token that doesn't match the device, for example after a re-enrollment.

        Check the `ErrorChain` in the command result for the domain and description the device reported.
