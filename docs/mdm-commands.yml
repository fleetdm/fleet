- name: Stop AirPlay mirroring
  platform: apple
  category: Airplay mirroring
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/stop-mirroring-command
  description: Stop mirroring the display to another device.
  supportedDeviceTypes:
    - iOS 7.0+
    - ipadOS 7.0+
    - macOS 10.10+
  faq:
    - question: What does the StopMirroring MDM command do?
      answer: |
        `StopMirroring` ends AirPlay Mirroring on an iPhone, iPad, or Mac. The device stops sharing its screen to the AirPlay destination.

        The command has no keys other than `RequestType`.
    - question: When would I use StopMirroring?
      answer: |
        To end a screen share you started with `RequestMirroring`, or to stop a device from mirroring to a room display. Classrooms and conference rooms are the common cases.
    - question: Does StopMirroring require a supervised device?
      answer: |
        Yes. Apple lists it as requiring supervision on iOS and macOS, on the device channel. That's different from `RequestMirroring`, which doesn't require supervision.
    - question: Can I stop AirPlay mirroring on a personal device?
      answer: |
        No. Because `StopMirroring` requires supervision, it doesn't work on User Enrollment (BYOD) devices or on iPhones, iPads, and Macs that aren't supervised. The user can stop mirroring themselves from Control Center.
    - question: Can I stop users from mirroring to unapproved displays?
      answer: |
        Yes, with a configuration profile instead of a command. The AirPlay payload (`com.apple.airplay`) can limit which AirPlay destinations a supervised device can use and store passwords for approved ones. In Fleet, add the profile in **Controls > OS settings > Configuration profiles**.

        `StopMirroring` only ends a session that's already running.
    - question: How do I run StopMirroring with Fleet?
      answer: |
        Fleet doesn't send it for any built-in feature, so send it as a custom command. Save a plist with `RequestType` set to `StopMirroring` and run `fleetctl mdm run-command --hosts=<hostname> --payload=stop-mirroring.xml`. To target several devices, pass their hostnames to `--hosts` separated by commas.

        You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Custom commands work in Fleet Free and Fleet Premium.
    - question: How do I know StopMirroring worked?
      answer: |
        `Acknowledged` means the device processed the command. `Error` includes an `ErrorChain` with details, and `CommandFormatError` means the plist was malformed. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>StopMirroring</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_StopMirroring</string>
    </dict>
    </plist>

- name: Refresh cellular plans
  platform: apple
  category: eSim management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/refresh-cellular-plans-command
  description: Query a carrier URL for active eSIM cellular-plan profiles on a device.
  supportedDeviceTypes:
    - iOS 13.0+
    - ipadOS 13.0+
  faq:
    - question: What does the RefreshCellularPlans MDM command do?
      answer: |
        `RefreshCellularPlans` tells an iPhone or cellular iPad to contact a carrier's eSIM server and check for cellular plans that are ready to install. It takes one required key, `eSIMServerURL`, which is the carrier URL the device should query.

        Organizations use it to deliver a corporate eSIM plan to a device without the end user scanning a QR code or setting it up in Settings.
    - question: How often is RefreshCellularPlans used?
      answer: |
        Rarely. It's a special-purpose command for organizations that provision eSIM plans through a carrier. Most MDM deployments never send it.

        When it is used, it's usually sent once per device after the carrier activates a plan, and again if the plan didn't download the first time.
    - question: Where do I get the eSIMServerURL value?
      answer: |
        From your carrier. Apple says to get this URL from each carrier separately, because it points to that carrier's eSIM provisioning server for your account.

        The URL in a sample payload is a placeholder. If the URL is wrong, the device can still respond, but no plan is installed.
    - question: Can I add an eSIM to an iPhone without MDM?
      answer: |
        Yes. The user can add an eSIM in **Settings > Cellular** (**Cellular Data** on iPad), usually by scanning a QR code from the carrier or using the carrier's activation flow.

        `RefreshCellularPlans` is for when you want the organization, not the user, to start the download on managed devices.
    - question: Does RefreshCellularPlans require a supervised device?
      answer: |
        No. Apple doesn't list supervision as a requirement. The command runs on the device channel on iOS and iPadOS 13 and later, including Shared iPad. It isn't available on macOS.

        The device needs eSIM-capable cellular hardware. A device without it returns error `36002`.
    - question: How do I run RefreshCellularPlans with Fleet?
      answer: |
        Fleet doesn't send this command automatically, but you can send it as a custom command in Fleet Free or Fleet Premium. Put your carrier's URL in `eSIMServerURL`, save the payload, and run `fleetctl mdm run-command --hosts=<hostname> --payload=refresh-cellular-plans.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API to target many hosts at once.

        Then run `fleetctl get mdm-command-results --id=<command-uuid>` to see the device's response.
    - question: How do I know if RefreshCellularPlans worked?
      answer: |
        `Acknowledged` means the device accepted the command and queried the carrier URL. It doesn't guarantee a plan was installed, since that depends on what the carrier's server returned.

        To confirm, check **Settings > Cellular** on the device or ask your carrier whether the plan was downloaded.
    - question: What errors can RefreshCellularPlans return?
      answer: |
        Apple documents three error codes:

        - `36001`: the device couldn't communicate with its cellular software stack.
        - `36002`: the hardware doesn't support the command.
        - `36003`: the cellular stack couldn't perform the request. This can happen when it's busy, so retrying later may work.

        `CommandFormatError` usually means the plist is malformed or `eSIMServerURL` is missing.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>RefreshCellularPlans</string>
            <key>eSIMServerURL</key>
            <string>http://example.server.com</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RefreshCellularPlans</string>
    </dict>
    </plist>

- name: Disable remote desktop
  platform: apple
  category: Managed settings
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/disable-remote-desktop-command
  description: Disable Remote Desktop on a device.
  supportedDeviceTypes:
    - macOS 10.14.4+
  faq:
    - question: What does the DisableRemoteDesktop MDM command do?
      answer: |
        `DisableRemoteDesktop` turns off Remote Desktop (Remote Management) on a Mac and stops it from processing remote events. The command has no options.

        Per Apple, it also removes the `PostEvent` privacy (TCC) permission, unless a privacy preferences (PPPC) profile installed on the Mac already grants it.
    - question: How often is DisableRemoteDesktop used?
      answer: |
        Occasionally. It's usually sent after a remote support session ends, or when a security review finds Remote Management turned on where it shouldn't be. It isn't part of routine MDM traffic.
    - question: How do I turn off Remote Management on a Mac without MDM?
      answer: |
        An admin user can turn off **Remote Management** in **System Settings > General > Sharing**. Admins can also turn it off from Terminal with Apple's `kickstart` tool in `/System/Library/CoreServices/RemoteManagement/ARDAgent.app`.

        The MDM command is useful when you need to turn it off on many Macs at once, or without touching the Mac.
    - question: Does DisableRemoteDesktop require a supervised Mac?
      answer: |
        Yes. Apple lists supervision as a requirement. Macs enrolled through Automated Device Enrollment (ADE) are supervised.

        The command runs on the device channel only, requires macOS 10.14.4 or later, and isn't available in user enrollment. An unsupervised Mac returns an `Error` status.
    - question: How do I run DisableRemoteDesktop with Fleet?
      answer: |
        Fleet doesn't turn Remote Desktop on or off as part of a built-in feature, so send it as a custom command in Fleet Free or Fleet Premium. Save the sample payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=disable-remote-desktop.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API to target many Macs in one request.

        To keep it off, add a Fleet policy that checks for the `ARDAgent` process in the `processes` table, so you can spot Macs where it was turned back on.
    - question: How do I know if DisableRemoteDesktop worked?
      answer: |
        `Acknowledged` means the Mac turned off Remote Desktop. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        To double-check, send a `SecurityInfo` command and look for `RemoteDesktopEnabled` set to `false`, or check **System Settings > General > Sharing** on the Mac.
    - question: Can end users turn Remote Management back on?
      answer: |
        Yes. A user with admin rights can turn **Remote Management** back on in **System Settings > General > Sharing**. The command turns it off once, it doesn't enforce the setting.

        To catch this, monitor it with a report or policy, and resend the command when needed. Limiting who has admin rights on the Mac also helps.
    - question: What's the difference between DisableRemoteDesktop and EnableRemoteDesktop?
      answer: |
        `EnableRemoteDesktop` turns on Remote Management for all users with the Observe, Control, and Show being observed options. `DisableRemoteDesktop` turns it off and stops remote event processing.

        Neither command takes options, so neither can grant access to specific users only.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DisableRemoteDesktop</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DisableRemoteDesktop</string>
    </dict>
    </plist>

- name: Enable remote desktop
  platform: apple
  category: Managed settings
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/enable-remote-desktop-command
  description: Enable Remote Desktop on a device.
  supportedDeviceTypes:
    - macOS 10.14.4+
  faq:
    - question: What does the EnableRemoteDesktop MDM command do?
      answer: |
        `EnableRemoteDesktop` turns on Remote Desktop (Remote Management) on a Mac. Per Apple, it enables Remote Desktop with access for all users, lets the Mac receive remote events, and turns on the Observe, Control, and Show being observed options.

        All other Remote Desktop options on the Mac stay as they were. The command has no options.
    - question: How often is EnableRemoteDesktop used?
      answer: |
        Occasionally. IT teams use it to prepare Macs for Apple Remote Desktop or another screen-sharing tool, or before a remote support session. It isn't part of routine MDM traffic.
    - question: How do I turn on Remote Management on a Mac without MDM?
      answer: |
        An admin user can turn on **Remote Management** in **System Settings > General > Sharing**. Apple's `kickstart` tool in `/System/Library/CoreServices/RemoteManagement/ARDAgent.app` can also configure it from Terminal, including per-user access.

        On recent macOS versions, privacy (TCC) controls may stop a script from granting full remote control without user approval. The MDM command doesn't need the user to approve anything.
    - question: Does EnableRemoteDesktop require a supervised Mac?
      answer: |
        Yes. Apple lists supervision as a requirement. Macs enrolled through Automated Device Enrollment (ADE) are supervised.

        The command runs on the device channel only, requires macOS 10.14.4 or later, and isn't available in user enrollment.
    - question: Is it safe to run EnableRemoteDesktop on every Mac?
      answer: |
        Be careful. The command grants remote access to all users on the Mac, which widens who can control it remotely.

        Turn it on only where you need it, and send `DisableRemoteDesktop` when you're done. If you need access for specific users only, configure Remote Management on the Mac instead of using this command.
    - question: How do I run EnableRemoteDesktop with Fleet?
      answer: |
        Fleet doesn't turn on Remote Desktop as part of a built-in feature, so send it as a custom command in Fleet Free or Fleet Premium. Save the sample payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=enable-remote-desktop.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        To track which Macs have it on, add a Fleet policy or report that checks for the `ARDAgent` process in the `processes` table.
    - question: How do I know if EnableRemoteDesktop worked?
      answer: |
        `Acknowledged` means the Mac turned on Remote Desktop. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        To double-check, send a `SecurityInfo` command and look for `RemoteDesktopEnabled` set to `true`, or check **System Settings > General > Sharing** on the Mac.
    - question: What errors can EnableRemoteDesktop return?
      answer: |
        The most common failure is an `Error` status because the Mac isn't supervised or runs a macOS version older than 10.14.4. The response's `ErrorChain` has the reason.

        `CommandFormatError` means the plist couldn't be parsed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>EnableRemoteDesktop</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_EnableRemoteDesktop</string>
    </dict>
    </plist>

- name: Configure settings
  platform: apple
  category: Managed settings
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/settings-command
  description: Configure settings on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 10.9+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the Settings MDM command do?
      answer: |
        The `Settings` command changes one or more device settings in a single command. Its `Settings` array holds one dictionary per setting, and each one has an `Item` key that names the setting, like `DeviceName`.

        Apple supports many items, including `DeviceName`, `HostName` (macOS only), `TimeZone`, `Wallpaper`, `Bluetooth`, `DataRoaming`, `PersonalHotspot`, and Shared iPad options. See [Apple's documentation](https://developer.apple.com/documentation/devicemanagement/settings-command) for the full list and which platforms each item supports.
    - question: How often is the Settings command used?
      answer: |
        Often. Renaming devices with the `DeviceName` item is one of its most common uses. Other items, like wallpaper, time zone, or roaming, are used less often and mostly on company-owned iPhones and iPads.
    - question: How do I rename a Mac, iPhone, or iPad remotely?
      answer: |
        Send `Settings` with the `DeviceName` item and the new name. You can rename several devices by sending one command to each with a different name.

        Without MDM, rename a Mac in **System Settings > General > About**, or run `sudo scutil --set ComputerName "New name"` in Terminal. On iPhone and iPad, the user renames the device in **Settings > General > About > Name**.
    - question: Does the Settings command require a supervised device?
      answer: |
        It depends on the item. The command itself doesn't require supervision and is allowed in user enrollment, but many items don't support user enrollment, and some, like `DeviceName`, `Bluetooth`, and `TimeZone`, are documented as supervised-only.

        In practice, unsupervised iPhones and iPads reject a `DeviceName` change. Supervise them through Automated Device Enrollment (ADE) or Apple Configurator.
    - question: Which Fleet features use the Settings command?
      answer: |
        Fleet's [host name template](https://fleetdm.com/guides/rename-hosts-with-a-naming-template) (Fleet Premium). When you set a template in **Controls > OS settings > Host names**, Fleet sends `Settings` with the `DeviceName` item to rename each macOS, iOS, and iPadOS host. If a user renames the device, Fleet renames it back, up to 3 times before marking the host **Failed**.

        Personally enrolled (BYOD) hosts are skipped, and iPhones and iPads must be supervised. Fleet doesn't send other `Settings` items.
    - question: How do I send other Settings items with Fleet?
      answer: |
        Edit the sample payload's `Settings` array with the items you want, save it, and run `fleetctl mdm run-command --hosts=<hostname> --payload=settings.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet sends custom commands on the device channel, and it doesn't re-apply them later. To rename hosts on an ongoing basis, use a host name template instead of a one-off `DeviceName` command.
    - question: How do I know if the Settings command worked?
      answer: |
        Check both the overall `Status` and the per-item results. The response includes a `Settings` array with a `Status` for each item, so one item can fail while others succeed. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        For a name change, the new name appears in Fleet the next time the host reports its details.
    - question: Can end users change a setting after the Settings command runs?
      answer: |
        Often, yes. Per Apple, users may be able to change these settings later unless a profile restricts it. For example, a user can turn automatic time zone back on after you set `TimeZone`.

        To lock a value, pair the command with a restrictions profile where one exists, or use an MDM feature that re-applies the setting, like Fleet's host name template for device names.
    - question: What errors can the Settings command return?
      answer: |
        Per-item errors are the most common. An item can fail because the device isn't supervised, the platform or OS version doesn't support it, the value is invalid, or the enrollment doesn't allow it. Fleet's host name template also marks a host **Failed** when the resolved name is longer than 63 bytes.

        `CommandFormatError` means the plist couldn't be parsed, often a misspelled `Item` value.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>Settings</string>
            <key>Settings</key>
            <array>
                <dict>
                    <key>DeviceName</key>
                    <string>NewName</string>
                    <key>Item</key>
                    <string>DeviceName</string>
                </dict>
            </array>
        </dict>
        <key>CommandUUID</key>
        <string>0001_Settings</string>
    </dict>
    </plist>

- name: LOM Device Request
  platform: apple
  category: Lights-Out management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/lom-device-request-command
  description: Send requests to a device using lights-out management (LOM).
  supportedDeviceTypes:
    - macOS 11.0+
  faq:
    - question: What does the LOMDeviceRequest MDM command do?
      answer: |
        `LOMDeviceRequest` tells a controller Mac to send lights-out management (LOM) requests to other Macs over the network. Each entry in `RequestList` names a target by `DeviceDNSName` and its IPv6 addresses, and sets `DeviceRequestType` to `PowerON`, `PowerOFF`, or `Reset`.

        LOM lets you power-manage supported Macs remotely, even when the target's operating system isn't responding.
    - question: How often is LOMDeviceRequest used?
      answer: |
        Rarely. LOM is a niche feature, mostly used in data centers or labs that run racks of Macs. Most MDM deployments never send it.
    - question: What do I need before I can run LOMDeviceRequest?
      answer: |
        Per Apple:

        - macOS 11 or later, on Mac hardware that supports LOM.
        - Supervised Macs, and the `DeviceLockAndRemovePasscode` access right.
        - A Lights Out Management configuration payload installed on the controller and target Macs.
        - The target's `LOMProtocolVersion` and IPv6 addresses, which you get by sending `LOMSetupRequest` to the target.
    - question: Is the sample payload on this page complete?
      answer: |
        No. A working payload also needs `RequestType` set to `LOMDeviceRequest` inside the `Command` dictionary, and each `RequestList` entry needs `LOMProtocolVersion`, using the value the target returned for `LOMSetupRequest`.

        `DeviceDNSName` must match the DNS name in the target's LOM client certificate. See [Apple's reference](https://developer.apple.com/documentation/devicemanagement/lom-device-request-command) for every required key.
    - question: How do I run LOMDeviceRequest with Fleet?
      answer: |
        Fleet doesn't have a built-in LOM feature, so you deploy the LOM configuration profile in **Controls > OS settings** and send the command yourself. Fill in the payload for each target, then send it to the controller Mac with `fleetctl mdm run-command --hosts=<controller-hostname> --payload=lom-device-request.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Custom commands work in Fleet Free and Fleet Premium.
    - question: How do I know if LOMDeviceRequest worked?
      answer: |
        Check the `ResponseList` in the response. It has one entry per request, with its `DeviceRequestUUID`, a `DeviceRequestSuccess` boolean, and a `DeviceRequestReturnError` description when a request failed. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        `Acknowledged` with `DeviceRequestSuccess` set to `false` means the controller ran the command but the request to the target failed.
    - question: What errors can LOMDeviceRequest return?
      answer: |
        Expect an `Error` status if the controller isn't supervised, doesn't have the LOM configuration, or runs a macOS version older than 11. `CommandFormatError` usually means a required key is missing, like `RequestType` or `LOMProtocolVersion`.

        Wrong IPv6 addresses or a DNS name that doesn't match the certificate show up as failed entries in `ResponseList`.
    - question: What's the difference between LOMDeviceRequest and LOMSetupRequest?
      answer: |
        `LOMSetupRequest` goes to the target Mac and returns its LOM protocol version and IPv6 addresses. `LOMDeviceRequest` goes to the controller Mac and uses those values to send power requests to the target.

        Run setup on each target first, then send device requests from the controller.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestList</key>
        <array>
            <dict>
                <key>DeviceDNSName</key>
                <string>lomdevice.com</string>
                <key>DeviceRequestType</key>
                <string>Reset</string>
                <key>DeviceRequestUUID</key>
                <string>0001</string>
                <key>PrimaryIPv6AddressList</key>
                <array>
                    <string>fe80::94f6:d6ff:fef3:c05b</string>
                    <string>fe80::94f6:d6ff:fef3:c1a4</string>
                </array>
                <key>SecondaryIPv6AddressList</key>
                <array/>
            </dict>
        </array>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LOMDeviceRequest</string>
    </dict>
    </plist>

- name: LOM setup Request
  platform: apple
  category: Lights-Out management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/lom-setup-request-command
  description: Get information from a device to set up lights-out management (LOM).
  supportedDeviceTypes:
    - macOS 11.0+
  faq:
    - question: What does the LOMSetupRequest MDM command do?
      answer: |
        `LOMSetupRequest` asks a Mac for the information needed to manage it with lights-out management (LOM). The response includes `LOMProtocolVersion`, `PrimaryIPv6AddressList`, and `SecondaryIPv6AddressList`.

        A controller Mac uses those values later in `LOMDeviceRequest` to power on, power off, or reset the target.
    - question: How often is LOMSetupRequest used?
      answer: |
        Rarely. You send it once per target Mac when setting up LOM, and again if its network configuration changes. Most MDM deployments never use LOM.
    - question: What does LOMSetupRequest require?
      answer: |
        Per Apple, the Mac must run macOS 11 or later on hardware that supports LOM, be supervised, and have a Lights Out Management configuration payload installed. The MDM server needs the `DeviceLockAndRemovePasscode` access right.

        The command runs on the device channel only and isn't available in user enrollment.
    - question: How do I run LOMSetupRequest with Fleet?
      answer: |
        Fleet doesn't have a built-in LOM feature, so deploy the LOM configuration profile in **Controls > OS settings** first. Then save the sample payload and run `fleetctl mdm run-command --hosts=<target-hostname> --payload=lom-setup-request.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Custom commands work in Fleet Free and Fleet Premium.
    - question: How do I use the LOMSetupRequest results?
      answer: |
        Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`. Copy `LOMProtocolVersion`, `PrimaryIPv6AddressList`, and `SecondaryIPv6AddressList` into the matching keys of a `RequestList` entry in your `LOMDeviceRequest` payload.

        Save these values somewhere, since the controller needs them every time it sends a request to that target.
    - question: What errors can LOMSetupRequest return?
      answer: |
        Expect an `Error` status if the Mac isn't supervised, doesn't have the LOM configuration, or doesn't support LOM. The `ErrorChain` has the reason.

        `CommandFormatError` means the plist couldn't be parsed.
    - question: What's the difference between LOMSetupRequest and LOMDeviceRequest?
      answer: |
        `LOMSetupRequest` collects setup details from the target Mac. `LOMDeviceRequest` is sent to a controller Mac, which uses those details to send `PowerON`, `PowerOFF`, or `Reset` requests to the target.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
