- name: Install profile
  platform: apple
  category: Profile managment
  description: Install a configuration profile on a device.
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-profile-command
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the InstallProfile MDM command do?
      answer: |
        `InstallProfile` tells an Apple device to install a configuration profile (`.mobileconfig`). The profile is base64-encoded and sent in the command's `Payload` key, and it installs without asking the user to approve it.

        Once installed, the device enforces every payload in the profile, such as restrictions, Wi-Fi, VPN, certificates, or passcode rules. The profile is marked as managed, so only the MDM that installed it can remove it.
    - question: How often is InstallProfile used?
      answer: |
        Constantly. It's one of the most common Apple MDM commands. MDMs send it during enrollment to deliver settings, and again whenever a profile is added, edited, or reassigned.

        Apple now ships many new settings as declarations for declarative device management (DDM), but configuration profiles are still how most Apple settings get delivered.
    - question: What's the difference between InstallProfile and declarative device management (DDM)?
      answer: |
        With `InstallProfile`, the MDM server pushes a profile and has to check back to confirm the device still has it. With DDM, the server sends declarations once, and the device applies them, keeps them enforced, and reports status changes on its own.

        Most MDMs, including Fleet, support both. Some newer Apple settings, like software update enforcement, are only available as declarations.
    - question: Can I install a configuration profile without an MDM?
      answer: |
        Yes. On a Mac, a user can open a `.mobileconfig` file and approve it in **System Settings > General > Device Management**. On iPhone and iPad, they download it and install it from **Settings**.

        But some payloads only work when an MDM installs them, like privacy preferences (PPPC), system extension, and kernel extension policies. Users can also remove profiles they installed themselves at any time.
    - question: Which Fleet features use InstallProfile?
      answer: |
        [OS settings](https://fleetdm.com/guides/custom-os-settings). When you add a `.mobileconfig` in **Controls > OS settings** or with GitOps, Fleet signs it and sends `InstallProfile` to every targeted host.

        Fleet also installs a few profiles of its own, like the FileVault profile when disk encryption is enforced, and a renewed enrollment profile when a host's MDM certificate is close to expiring.
    - question: How do I send a one-off InstallProfile command with Fleet?
      answer: |
        Base64-encode your `.mobileconfig`, put it in the `Payload` `<data>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-profile.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        A profile sent this way isn't tracked in OS settings, so Fleet won't retry it or remove it later. If you want the profile enforced, add it in **Controls > OS settings** instead.
    - question: Can I install a user-scoped profile with InstallProfile?
      answer: |
        Only on macOS, and only on the user channel. `InstallProfile` sent on the device channel installs the profile for the whole device. Sent on the user channel, it installs for the signed-in user.

        Fleet sends custom commands on the device channel. To deliver a user-scoped profile with Fleet, set `PayloadScope` to `User` and add it in OS settings. Learn more about [device and user scope](https://fleetdm.com/guides/custom-os-settings#device-and-user-scope).
    - question: How do I know if InstallProfile worked?
      answer: |
        `Acknowledged` means the device installed the profile. `Error` means it rejected it, and the response includes Apple's `ErrorChain` with the reason. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        On the device, the profile appears in **System Settings > General > Device Management** on macOS, or **Settings > General > VPN & Device Management** on iPhone and iPad.
    - question: What errors can InstallProfile return?
      answer: |
        Most failures come back in the `ErrorChain` with the `MCInstallationErrorDomain` or `MCProfileErrorDomain` domain. Common causes:

        - The profile is malformed, or the payload isn't base64-encoded correctly.
        - A payload isn't supported on that platform or OS version.
        - A payload requires a supervised device, or user-approved MDM on macOS.
        - A profile with the same `PayloadIdentifier` was installed by the user or another MDM, so it can't be replaced.

        `CommandFormatError` means the command plist itself was invalid.
    - question: Does InstallProfile require a supervised device?
      answer: |
        No. The command works on supervised and unsupervised devices. But some payloads inside a profile only apply on supervised iPhones and iPads, including many restrictions.

        On macOS, some payloads, like privacy preferences (PPPC) and kernel extension policies, only work when MDM enrollment is user-approved. Macs enrolled through Automated Device Enrollment (ADE) meet that requirement.
