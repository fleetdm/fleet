- name: Set firmware password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/set-firmware-password-command
  description: Change or clear the firmware password on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the SetFirmwarePassword MDM command do?
      answer: |
        `SetFirmwarePassword` sets, changes, or clears the firmware password on an Intel-based Mac. Put the new password in `NewPassword`, or an empty string to clear it. If a password already exists, include it in `CurrentPassword`.

        `AllowOroms` controls whether option ROMs can load. After processing the command, the Mac restarts so the new password takes effect.
    - question: Does SetFirmwarePassword work on Apple silicon Macs?
      answer: |
        No. Apple silicon Macs don't support firmware passwords. Use Recovery Lock instead, with the `SetRecoveryLock` command.

        Fleet Premium can set, escrow, and rotate Recovery Lock passwords for you. Learn more in the [Recovery Lock password guide](https://fleetdm.com/guides/recovery-lock-password).
    - question: Can I set a firmware password without MDM?
      answer: |
        Yes. On an Intel-based Mac, start up in macOS Recovery and open **Startup Security Utility** to set a firmware password. You can also use the `firmwarepasswd` command in Terminal.

        MDM is useful when you need to set or change passwords on many Macs without touching each one.
    - question: What if I don't know the current firmware password?
      answer: |
        MDM can't help. Apple doesn't provide a way to change or clear a firmware password without the current one. Contact AppleCare for a Mac whose firmware password is unknown.

        To avoid this, store every firmware password in a password manager before you send the command.
    - question: Does SetFirmwarePassword require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision, on the device channel. The enrollment must also grant the `DeviceLockAndRemovePasscode` access right.
    - question: How do I set a firmware password with Fleet?
      answer: |
        Fleet doesn't manage firmware passwords, so send it as a custom command. Save a plist with `RequestType` set to `SetFirmwarePassword`, `NewPassword`, and `CurrentPassword` if one exists. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=set-firmware-password.xml`.

        The password must use printable low-ASCII characters (`0x20` through `0x7E`) so it can be typed at the firmware prompt. Fleet doesn't escrow it, so save it yourself first. To check which Macs have a firmware password, run `firmwarepasswd -check` with a [Fleet script](https://fleetdm.com/guides/scripts).
    - question: How do I know SetFirmwarePassword worked?
      answer: |
        The response includes a `SetFirmwarePassword` dictionary with `PasswordChanged`. `true` means the change succeeded. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        After the Mac restarts, confirm with the `VerifyFirmwarePassword` command.
    - question: Why did SetFirmwarePassword return an error?
      answer: |
        Common causes:

        - The Mac has Apple silicon.
        - `CurrentPassword` is missing or wrong.
        - A firmware password change is already pending a restart.
        - The command was sent again within 30 seconds. Apple throttles it.

        Check the `ErrorChain` in the command result for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>AllowOroms</key>
            <false/>
            <key>CurrentPassword</key>
            <string>oldpassword</string>
            <key>NewPassword</key>
            <string>newpassword</string>
            <key>RequestType</key>
            <string>SetFirmwarePassword</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_SetFirmwarePassword</string>
    </dict>
    </plist>

- name: Verify firmware password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/verify-firmware-password-command
  description: Verify the firmware password on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the VerifyFirmwarePassword MDM command do?
      answer: |
        `VerifyFirmwarePassword` checks whether a password matches the firmware password on an Intel-based Mac. It doesn't change anything.

        The payload has one key, `Password`. The response includes a `VerifyFirmwarePassword` dictionary with `PasswordVerified` set to `true` or `false`.
    - question: When would I use VerifyFirmwarePassword?
      answer: |
        Rarely. Use it to confirm that the firmware password you stored matches what's on the Mac, for example after `SetFirmwarePassword`, or before you hand a Mac to a technician who needs the password.
    - question: Does Acknowledged mean the firmware password is correct?
      answer: |
        No. `Acknowledged` only means the Mac processed the command. Check `PasswordVerified` in the response. `true` means the password matches. `false` means it doesn't.
    - question: Does VerifyFirmwarePassword work on Apple silicon Macs?
      answer: |
        No. Apple silicon Macs don't have firmware passwords. To check a Recovery Lock password on Apple silicon, use `VerifyRecoveryLock`.
    - question: Does VerifyFirmwarePassword require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision, on the device channel. Macs enrolled through Automated Device Enrollment (ADE) are supervised.
    - question: How do I check whether a Mac has a firmware password without knowing it?
      answer: |
        Run `firmwarepasswd -check` on the Mac. It reports whether a firmware password is turned on, without needing the password. With Fleet, you can run it on many Macs at once as a [script](https://fleetdm.com/guides/scripts).

        `VerifyFirmwarePassword` is for confirming a specific password, not for finding out whether one exists.
    - question: How do I run VerifyFirmwarePassword with Fleet?
      answer: |
        Save a plist with `RequestType` set to `VerifyFirmwarePassword` and `Password` set to the password to check. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=verify-firmware-password.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Read the result with `fleetctl get mdm-command-results --id=<command-uuid>`. Fleet doesn't send this command for any built-in feature.
    - question: Why did VerifyFirmwarePassword return an error?
      answer: |
        The usual causes are an Apple silicon Mac, or sending the command again within 30 seconds. Apple throttles it to once every 30 seconds. Check the `ErrorChain` in the command result for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>AllowOroms</key>
            <false/>
            <key>CurrentPassword</key>
            <string>oldpassword</string>
            <key>NewPassword</key>
            <string>newpassword</string>
            <key>RequestType</key>
            <string>SetFirmwarePassword</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_SetFirmwarePassword</string>
    </dict>
    </plist>

- name: Enable lost mode
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/enable-lost-mode-command
  description: Verify the firmware password on a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the EnableLostMode MDM command do?
      answer: |
        `EnableLostMode` puts a supervised iPhone or iPad into Lost Mode. The device locks and shows your message, phone number, or both on the Lock Screen. The user can't use the device until MDM turns Lost Mode off.

        The payload takes `Message`, `PhoneNumber`, and `Footnote`. You must include `Message` or `PhoneNumber`.
    - question: When do IT admins use Lost Mode?
      answer: |
        For lost or stolen iPhones and iPads, or for devices that need to be held until they're returned, like after an employee leaves. Lost Mode keeps the data on the device, so it's a common first step before deciding whether to erase it.
    - question: What's the difference between MDM Lost Mode and Find My Lost Mode?
      answer: |
        Find My Lost Mode is turned on by the user through their Apple Account. MDM Lost Mode is turned on by the organization and only works on supervised devices. It doesn't depend on the user's Apple Account or Find My settings.

        While a device is in MDM Lost Mode, the MDM can request its location with `DeviceLocation` and play a sound with `PlayLostModeSound`.
    - question: Does Lost Mode work on a Mac?
      answer: |
        No. Lost Mode is only for supervised iPhones and iPads, including Shared iPad. To lock a Mac, use the `DeviceLock` command, which locks it with a six-digit PIN.
    - question: Does EnableLostMode require a supervised device?
      answer: |
        Yes. Apple supports it only on supervised iPhones and iPads, on the device channel. It isn't available for User Enrollment (BYOD). Devices enrolled through Automated Device Enrollment (ADE) are supervised.
    - question: How do I put an iPhone or iPad in Lost Mode with Fleet?
      answer: |
        Open **Host details**, click **Actions > Lock**, and confirm. Fleet sends `EnableLostMode`, then sends `DeviceLocation` to collect the device's location. The host shows **Lock pending**, then **Locked**. You can also use `fleetctl mdm lock` or the [Lock host](https://fleetdm.com/docs/rest-api/rest-api#lock-host) API.

        The **Lock** action is a Fleet Premium feature for company-owned iOS and iPadOS hosts. Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: Can I customize the Lost Mode message in Fleet?
      answer: |
        Not with the built-in action. Fleet's **Lock** shows "This device is locked. It belongs to" followed by the organization name from your Fleet settings, with no phone number.

        To show a phone number or footnote, send `EnableLostMode` as a custom command with `fleetctl mdm run-command`. Custom commands work in Fleet Free too. But Fleet doesn't track a custom lock in the host's status, so unlock it with a custom `DisableLostMode` command.
    - question: What errors can EnableLostMode return?
      answer: |
        If the device isn't supervised, the command fails with an error in the `ErrorChain`. While a device is in Lost Mode, it rejects commands that aren't valid in Lost Mode with error code `12078`.
    - question: Can I cancel a pending Lost Mode command?
      answer: |
        Yes, if the device hasn't received it yet. In Fleet, go to **Host details > Activity > Upcoming** and click **Cancel**, or use the [cancel host's pending MDM command](https://fleetdm.com/docs/rest-api/rest-api#cancel-hosts-pending-mdm-command) API. If the device already entered Lost Mode, send `DisableLostMode` instead.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Footnote</key>
            <string>Return to Acme, Inc.</string>
            <key>Message</key>
            <string>Lock Message</string>
            <key>PhoneNumber</key>
            <string>408-555-555</string>
            <key>RequestType</key>
            <string>EnableLostMode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_EnableLostMode</string>
    </dict>
    </plist>

- name: Device location
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-location-command
  description: Request the location of a device when in Lost Mode.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the DeviceLocation MDM command do?
      answer: |
        `DeviceLocation` asks a supervised iPhone or iPad in Lost Mode for its current location. The response includes `Latitude`, `Longitude`, `HorizontalAccuracy`, `VerticalAccuracy`, `Altitude`, `Speed`, `Course`, and a `Timestamp`.

        The command has no keys other than `RequestType`.
    - question: Can MDM track the location of a device?
      answer: |
        Only while the device is in Lost Mode. Apple's `DeviceLocation` command fails on devices that aren't in Lost Mode, so an MDM can't track where devices are during normal use. Turning on Lost Mode is visible to the user, because the device locks and shows a message.
    - question: Can I get the location of a Mac with MDM?
      answer: |
        No. `DeviceLocation` only works on supervised iPhones and iPads, including Shared iPad. It isn't available on macOS or for User Enrollment (BYOD).
    - question: How do I see a lost iPhone's location in Fleet?
      answer: |
        Lock the host with **Host details > Actions > Lock** (Fleet Premium). Fleet sends `DeviceLocation` automatically after the device enters Lost Mode. Then, under **Vitals**, click **Show location**, then **Open in Google Maps**.

        To get a fresh location while the host is locked, click **Refetch**. Fleet sends `DeviceLocation` again for locked hosts enrolled through Automated Device Enrollment (ADE). Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts#find-a-lost-iosipados-host).
    - question: Can I send DeviceLocation as a custom command?
      answer: |
        Yes. Save a plist with `RequestType` set to `DeviceLocation`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=device-location.xml`. The device must already be in Lost Mode.

        Read `Latitude` and `Longitude` from `fleetctl get mdm-command-results --id=<command-uuid>`, and open `https://google.com/maps?q=LATITUDE,LONGITUDE` with those values.
    - question: What errors can DeviceLocation return?
      answer: |
        Apple documents these error codes:

        - `12067`: the device isn't in Lost Mode.
        - `12068`: the device's location is unknown.
        - `12078`: the command isn't valid while in Lost Mode.

        If you get `12068`, try again later, for example after the device moves somewhere with a better signal.
    - question: How accurate is the location from DeviceLocation?
      answer: |
        Check `HorizontalAccuracy` in the response. It's the radius of uncertainty in meters, so a smaller number means a more precise location. A negative value for accuracy, altitude, speed, or course means the device doesn't know that value.

        `Timestamp` tells you when the location was determined.
    - question: Does Fleet keep location data after a device is unlocked?
      answer: |
        No. When you unlock an iOS or iPadOS host with **Actions > Unlock**, Fleet sends `DisableLostMode` and deletes the location data it collected for that host.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DeviceLocation</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DeviceLocation</string>
    </dict>
    </plist>

- name: Play lost mode sound
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/play-lost-mode-sound-command
  description: Play the Lost Mode sound on a device that’s in Lost Mode.
  supportedDeviceTypes:
    - iOS 10.3+
    - ipadOS 10.3+
  faq:
    - question: What does the PlayLostModeSound MDM command do?
      answer: |
        `PlayLostModeSound` makes an iPhone or iPad in Lost Mode play a sound, so someone nearby can find it. The sound keeps playing until MDM turns off Lost Mode or someone stops the sound on the device.

        The command has no keys other than `RequestType`.
    - question: When would I use PlayLostModeSound?
      answer: |
        When a locked device is probably nearby, like in an office, classroom, or warehouse, and you want to find it by sound. Use `DeviceLocation` first to narrow down where to look.
    - question: Does PlayLostModeSound require Lost Mode?
      answer: |
        Yes. The device must be supervised and already in Lost Mode. If it isn't in Lost Mode, the device returns error code `12067`. Put it in Lost Mode with `EnableLostMode` first.
    - question: Can I play a sound on a device that isn't in Lost Mode?
      answer: |
        Not with MDM. Apple only lets an MDM play a sound on a device in Lost Mode. A user can play a sound on their own device with Find My, if Find My is turned on and signed in to their Apple Account.
    - question: Can I play a sound on a Mac with MDM?
      answer: |
        No. `PlayLostModeSound` is only supported on supervised iPhones and iPads, including Shared iPad. It isn't available on macOS or for User Enrollment (BYOD).
    - question: How do I play a sound on a lost iPhone with Fleet?
      answer: |
        Fleet's **Lock** action puts the device in Lost Mode but doesn't play a sound, so send this as a custom command. First, lock the host with **Host details > Actions > Lock** (Fleet Premium). Then save a plist with `RequestType` set to `PlayLostModeSound` and run `fleetctl mdm run-command --hosts=<hostname> --payload=play-lost-mode-sound.xml`.

        You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: How do I know PlayLostModeSound worked?
      answer: |
        `Acknowledged` means the device started playing the sound. `Error` with code `12067` means the device isn't in Lost Mode. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I stop the Lost Mode sound?
      answer: |
        Someone holding the device can stop it on the device. To stop it remotely, turn off Lost Mode with `DisableLostMode`. In Fleet, use **Host details > Actions > Unlock**.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>PlayLostModeSound</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_PlayLostModeSound</string>
    </dict>
    </plist>

- name: Disable lost mode
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/disable-lost-mode-command
  description: Take the device out of Lost Mode.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the DisableLostMode MDM command do?
      answer: |
        `DisableLostMode` takes a supervised iPhone or iPad out of Lost Mode. The Lost Mode message goes away, and the user can unlock the device with their passcode as usual.

        The command has no keys other than `RequestType`.
    - question: Can a user turn off MDM Lost Mode themselves?
      answer: |
        No. Only the MDM can turn off Lost Mode, by sending `DisableLostMode`. Erasing the device also turns it off.
    - question: Does erasing a device turn off Lost Mode?
      answer: |
        Yes. If you want the device back in Lost Mode after it enrolls again, your MDM has to remember that it was in Lost Mode and send `EnableLostMode` again.
    - question: Does DisableLostMode require a supervised device?
      answer: |
        Yes. Like the other Lost Mode commands, Apple supports it only on supervised iPhones and iPads, including Shared iPad, on the device channel.
    - question: How do I take an iPhone or iPad out of Lost Mode with Fleet?
      answer: |
        Open **Host details** and click **Actions > Unlock**. Fleet sends `DisableLostMode`, clears the **Locked** badge once the device responds, and deletes the location data it collected. You can also use `fleetctl mdm unlock` or the [Unlock host](https://fleetdm.com/docs/rest-api/rest-api#unlock-host) API.

        If you locked the host with Fleet's **Lock** action, always use **Unlock** rather than a custom command, so Fleet's lock status stays accurate.
    - question: What if a locked iPhone or iPad is offline?
      answer: |
        It can't receive `DisableLostMode` until it's back online. If the device restarted while locked, it may not reconnect to Wi-Fi on its own.

        Connect it to a Mac with a USB cable and share the Mac's internet connection. Then send the unlock again. Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts#how-to-unlock-offline-ios-and-ipados-hosts).
    - question: What errors can DisableLostMode return?
      answer: |
        Apple documents these error codes:

        - `12067`: the device isn't in Lost Mode.
        - `12069`: the request to turn off Lost Mode failed.
        - `12078`: the command isn't valid while in Lost Mode.
    - question: How do I know DisableLostMode worked?
      answer: |
        `Acknowledged` means the device left Lost Mode. In Fleet, the **Locked** badge clears, or run `fleetctl get mdm-command-results --id=<command-uuid>` for a custom command.

        If you unlock within a minute of locking, Fleet may show the **Locked** badge until the next MDM check-in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DisableLostMode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DisableLostMode</string>
    </dict>
    </plist>

- name: Set Recovery Lock
  platform: apple
  category: Recovery lock
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/set-recovery-lock-command
  description: Set or clear the Recovery Lock password.
  supportedDeviceTypes:
    - macOS 11.5+
  faq:
    - question: What does the SetRecoveryLock MDM command do?
      answer: |
        `SetRecoveryLock` sets, changes, or clears the Recovery Lock password on an Apple silicon Mac. With Recovery Lock on, anyone who starts the Mac in recoveryOS has to enter the password first.

        Put the new password in `NewPassword`, or an empty string to clear it. If a password is already set, include it in `CurrentPassword`.
    - question: Why use Recovery Lock?
      answer: |
        It stops users and attackers from making changes in recoveryOS, like turning off System Integrity Protection (SIP), lowering startup security, or erasing and reinstalling macOS. It's the Apple silicon replacement for the Intel firmware password.
    - question: What's the difference between Recovery Lock and a firmware password?
      answer: |
        Both protect a Mac's startup and recovery tools with a password. Firmware passwords are for Intel-based Macs and use `SetFirmwarePassword`. Recovery Lock is for Apple silicon Macs and uses `SetRecoveryLock`.

        If you manage both kinds of Mac, you need both commands.
    - question: Which Macs support Recovery Lock?
      answer: |
        Apple silicon Macs running macOS 11.5 or later. Intel Macs don't support it. Apple lists the command as requiring supervision, on the device channel, and the enrollment must grant the `DeviceLockAndRemovePasscode` access right.
    - question: How do I turn on Recovery Lock with Fleet?
      answer: |
        In Fleet Premium, go to **Controls > OS settings > Passwords**, pick a fleet, and check **Turn on Recovery Lock password**. Fleet generates a unique password for each Apple silicon Mac, encrypts and stores it, and sends `SetRecoveryLock`. It then sends `VerifyRecoveryLock` to confirm.

        To see or rotate a password, open **Host details > Actions > Show recovery lock password**. Turning the setting off clears the passwords. Learn more in the [Recovery Lock password guide](https://fleetdm.com/guides/recovery-lock-password).
    - question: Can I set my own Recovery Lock password with a custom command?
      answer: |
        Yes, but only for hosts in fleets where Fleet's Recovery Lock password setting is off. If it's on, Fleet rejects the command with a 409 conflict, so it doesn't overwrite the password Fleet manages.

        Otherwise, run `fleetctl mdm run-command --hosts=<hostname> --payload=set-recovery-lock.xml`. Fleet won't store your password, so save it yourself. Custom commands work in Fleet Free too.
    - question: What if I don't know the current Recovery Lock password?
      answer: |
        The MDM can't change or clear it with `SetRecoveryLock`, because the command needs `CurrentPassword`. But macOS removes the Recovery Lock password when the Mac unenrolls from MDM. After unenrolling, you can enroll the Mac again and set a new password.

        If Fleet manages the password, see it in **Host details > Actions > Show recovery lock password**.
    - question: How do I know SetRecoveryLock worked?
      answer: |
        `Acknowledged` means the Mac accepted the command. To be sure the password is correct, follow up with `VerifyRecoveryLock` and check `PasswordVerified`.

        In Fleet, the host's **OS settings** shows the Recovery Lock status. **Verified** means the Mac confirmed the password, **Enforcing (pending)** means it's in progress, and **Failed** means it didn't work.
    - question: Why did SetRecoveryLock fail?
      answer: |
        The most common cause is a wrong or missing `CurrentPassword` when the Mac already has a Recovery Lock password. The command also fails on Intel Macs and on Macs that aren't supervised.

        Check the `ErrorChain` in the command result for details. Fleet retries temporary errors automatically, and if the Mac still has a password Fleet set earlier, Fleet verifies that one.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>SetRecoveryLock</string>
            <key>NewPassword</key>
            <string>Apple</string>
        </dict>
    </dict>
    </plist>

- name: Verify Recovery Lock
  platform: apple
  category: Recovery lock
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/verify-recovery-lock-command
  description: Verify the device’s Recovery Lock password.
  supportedDeviceTypes:
    - macOS 11.5+
  faq:
    - question: What does the VerifyRecoveryLock MDM command do?
      answer: |
        `VerifyRecoveryLock` checks whether a password matches the Recovery Lock password on an Apple silicon Mac. It doesn't change anything.

        The payload has one key, `Password`. The response includes `PasswordVerified`, set to `true` or `false`.
    - question: Does Acknowledged mean the Recovery Lock password is correct?
      answer: |
        No. The Mac acknowledges the command whether or not the password matched. Check `PasswordVerified` in the response. `true` means the password matches. `false` means it doesn't.
    - question: How do I check whether a Mac has no Recovery Lock password?
      answer: |
        Send `VerifyRecoveryLock` with an empty `Password`. A Mac without a Recovery Lock password accepts the empty password. Fleet uses this check to confirm that a password was cleared.
    - question: Which Macs support VerifyRecoveryLock?
      answer: |
        Apple silicon Macs running macOS 11.5 or later. Apple lists it as requiring supervision, on the device channel, with the `DeviceLockAndRemovePasscode` access right. Intel Macs use firmware passwords instead, which you check with `VerifyFirmwarePassword`.
    - question: Does Fleet use VerifyRecoveryLock?
      answer: |
        Yes. Fleet Premium sends it after each `SetRecoveryLock` it sends, including when it rotates or clears a password. A host's Recovery Lock status changes to **Verified** only after this check passes, and changes to **Failed** if the device reports the password doesn't match.

        Learn more in the [Recovery Lock password guide](https://fleetdm.com/guides/recovery-lock-password).
    - question: Can I send VerifyRecoveryLock as a custom command?
      answer: |
        Yes, but only for hosts in fleets where Fleet's Recovery Lock password setting is off. If it's on, Fleet rejects the command with a 409 conflict. For those hosts, check the **OS settings** status, or see the password in **Host details > Actions > Show recovery lock password**.

        Otherwise, save a plist with `RequestType` set to `VerifyRecoveryLock` and `Password`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=verify-recovery-lock.xml`.
    - question: How do I read the VerifyRecoveryLock result?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` and look for `PasswordVerified`. If the status is `Error`, check the `ErrorChain` for the domain and description the Mac reported.
    - question: What should I do if VerifyRecoveryLock returns false?
      answer: |
        The password you have doesn't match the one on the Mac. If you know the right password, send `SetRecoveryLock` with it in `CurrentPassword` and a new `NewPassword`.

        If nobody knows the password, the MDM can't reset it. macOS removes the Recovery Lock password when the Mac unenrolls from MDM, so unenroll and enroll it again to start over.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>VerifyRecoveryLock</string>
            <key>Password</key>
            <string>Apple</string>
        </dict>
    </dict>
    </plist>

- name: Content caching information
  platform: apple
  category: Content caching
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/content-caching-information-command
  description: Get the status of the content caches on a device.
  supportedDeviceTypes:
    - macOS 10.15.4+
  faq:
    - question: What does the ContentCachingInformation MDM command do?
      answer: |
        `ContentCachingInformation` asks a Mac for the status of its content cache. Content caching stores Apple software updates, apps, and iCloud data on the local network, so other Apple devices download them faster.

        The command has no keys other than `RequestType`. The response's `StatusResponse` dictionary includes keys like `Activated`, `Active`, `CacheUsed`, `CacheFree`, `CacheLimit`, `CacheStatus`, `Peers`, `Parents`, `Alerts`, and byte totals served to clients.
    - question: When would I use ContentCachingInformation?
      answer: |
        Occasionally, to check the health of Macs you set up as content caches. For example, to confirm a cache is active, see how much disk space it uses, or find out why it failed to register with Apple. It's usually sent only to those Macs.
    - question: How do I check content caching status on a Mac without MDM?
      answer: |
        Run `AssetCacheManagerUtil status` in Terminal. You can also see the status in **System Settings > General > Sharing** under **Content Caching**.

        With Fleet, you can run `AssetCacheManagerUtil status` on many Macs at once as a [script](https://fleetdm.com/guides/scripts).
    - question: Does ContentCachingInformation require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision on macOS 10.15.4 and later, on the device channel. The enrollment must also grant the `AllowQueryNetworkInformation` access right.
    - question: How do I turn on content caching with an MDM?
      answer: |
        Install a configuration profile with the `com.apple.AssetCache.managed` payload. It can turn on caching and set options like the cache size limit and which clients to serve.

        In Fleet, add the profile in **Controls > OS settings > Configuration profiles**. Learn more in the [custom OS settings guide](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I run ContentCachingInformation with Fleet?
      answer: |
        Fleet doesn't send it for any built-in feature, so send it as a custom command. Save a plist with a `Command` dictionary whose `RequestType` is `ContentCachingInformation`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=content-caching-information.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I read the ContentCachingInformation result?
      answer: |
        Look in `StatusResponse`. `Activated` means content caching is turned on. `Active` means it's ready to serve requests. A `CacheStatus` of `LOWSPACE` means cache pressure is high.

        `RegistrationStatus` is `1` when the cache registered with Apple, `0` while pending, and `-1` if it failed.
    - question: Why is content caching activated but not active?
      answer: |
        Content caching is turned on but isn't ready to serve content. Check `RegistrationStatus`, `RegistrationError`, and `Alerts` in the response. A cache that can't register with Apple won't serve devices.
  command: |
    TODO

- name: Request AirPlay mirroring
  platform: apple
  category: Airplay mirroring
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/request-mirroring-command
  description: Prompt the user to share their screen using AirPlay Mirroring.
  supportedDeviceTypes:
    - iOS 7.0+
    - ipadOS 7.0+
    - macOS 10.10+
  faq:
    - question: What does the RequestMirroring MDM command do?
      answer: |
        `RequestMirroring` prompts the user of an iPhone, iPad, or Mac to share their screen to an AirPlay destination, like an Apple TV.

        Name the destination with `DestinationName` or `DestinationDeviceID`. If you include both, the device uses `DestinationDeviceID`. You can also set `Password` for the destination and `ScanTime`, the number of seconds to search for it.
    - question: When would I use RequestMirroring?
      answer: |
        Occasionally, in classrooms and conference rooms. For example, to send a device's screen to a room's Apple TV without walking the user through AirPlay settings.
    - question: Will the user see a prompt?
      answer: |
        Yes. The command can't start mirroring silently. When the response's `MirroringResult` is `Prompting`, the user is being asked to share their screen, and they can cancel.
    - question: Does RequestMirroring require a supervised device?
      answer: |
        No. Apple doesn't require supervision, and it's allowed on User Enrollment (BYOD) devices running iOS and macOS. It runs on the device channel. Note that `StopMirroring` does require supervision.
    - question: How do I run RequestMirroring with Fleet?
      answer: |
        Fleet doesn't send it for any built-in feature, so send it as a custom command. Save a plist with `RequestType` set to `RequestMirroring` and either `DestinationName` or `DestinationDeviceID`. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=request-mirroring.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Custom commands work in Fleet Free and Fleet Premium.
    - question: How do I know RequestMirroring worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` and check `MirroringResult`:

        - `Prompting`: the user is being prompted to share their screen.
        - `DestinationNotFound`: the device couldn't reach the destination.
        - `Cancelled`: the user canceled.
        - `Unknown`: an unknown error occurred.
    - question: Why does RequestMirroring return DestinationNotFound?
      answer: |
        The device couldn't find the AirPlay destination within the scan time. Check that the destination is on and on the same network, and that `DestinationName` matches its name exactly.

        Increase `ScanTime`, which accepts `10` to `300` seconds and defaults to `30`. For an Apple TV running tvOS 18 or later, use `DestinationName`, because `DestinationDeviceID` isn't supported.
    - question: How do I stop AirPlay mirroring after it starts?
      answer: |
        The user can stop it from Control Center on the device. To stop it remotely, send `StopMirroring`, which only works on supervised devices.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
