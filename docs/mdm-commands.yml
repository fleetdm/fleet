- name: doWipeProtected
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipeprotected
  description: Performs a remote wipe that fully cleans the internal drive and continues retrying until complete, even after power cycles. Unlike doWipe, which can be interrupted by a simple power cycle, doWipeProtected ensures the wipe finishes. May render the device unbootable on some configurations.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the doWipeProtected MDM command do?
      answer: |
        It wipes the Windows host and fully cleans the internal drive. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeProtected`.

        Unlike doWipe, it can't be stopped by power cycling the device. Windows keeps retrying until the wipe is done.
    - question: Does Fleet use doWipeProtected?
      answer: |
        Yes. It's the default command behind the **Wipe** action in **Host details > Actions** and `fleetctl mdm wipe` for Windows hosts. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).

        To use `doWipe` instead, call the [Wipe host](https://fleetdm.com/docs/rest-api/rest-api#wipe-host) API with `wipe_type` set to `doWipe`.
    - question: Can doWipeProtected leave a device unable to boot?
      answer: |
        Yes. Microsoft warns that in some configurations, doWipeProtected may leave the device unable to boot. That tradeoff is why Microsoft recommends it for lost or stolen devices, where a guaranteed wipe matters more.

        For devices you plan to reuse, consider `doWipe`.
    - question: How often is doWipeProtected used?
      answer: |
        It's the most common Windows wipe in Fleet because it's the default. Wipes are still rare compared with routine commands.
    - question: Is doWipeProtected available in Fleet Free?
      answer: |
        No. Wipe requires Fleet Premium, whether you use the **Wipe** action, `fleetctl mdm wipe`, the API, or a custom command.
    - question: How do I know doWipeProtected worked?
      answer: |
        When sent with the **Wipe** action, the host shows "Wipe pending," then "Wiped" once Windows acknowledges the command with a `2xx` status. You can also check `fleetctl get mdm-command-results --id=<command-uuid>`.

        Wait for the wipe to finish before deleting the host from Fleet.
    - question: What if doWipeProtected fails with a 500?
      answer: |
        A `500` usually means a broken Windows Recovery Environment. Run Fleet's [fallback wipe script](https://github.com/fleetdm/fleet/blob/main/docs/solutions/windows/scripts/wipe-windows-device.ps1). It repairs WinRE, suspends BitLocker, and triggers the wipe locally.
    - question: Can I cancel a doWipeProtected command?
      answer: |
        No. Windows wipes aren't cancelable in Fleet. If the host re-enrolls in MDM before it receives the wipe, Fleet cancels it.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>0d0f7e7b-82b7-4fff-a4d1-101c9edb795d</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeProtected</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: InstallWindowsDefenderApplicationGuard
  platform: windows
  category: WindowsDefenderApplicationGuard
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowsdefenderapplicationguard-csp#installwindowsdefenderapplicationguard
  description: Remotely installs the Windows Defender Application Guard feature on the device.
  supportedDeviceTypes:
    - Windows 10.0.16299
  faq:
    - question: What does the InstallWindowsDefenderApplicationGuard MDM command do?
      answer: |
        It installs the Microsoft Defender Application Guard Windows feature. It's an `<Exec>` on `./Device/Vendor/MSFT/WindowsDefenderApplicationGuard/InstallWindowsDefenderApplicationGuard`.

        Application Guard opens untrusted sites in an isolated, Hyper-V based container.
    - question: Is Application Guard still supported?
      answer: |
        No. Microsoft deprecated Microsoft Defender Application Guard, and it isn't available in Windows 11, version 24H2 and later. Plan to use other browser isolation or web filtering tools.

        This command is mainly useful on older Windows builds that still have the feature.
    - question: What does a host need to install Application Guard?
      answer: |
        Windows Enterprise or Education, a 64-bit CPU with virtualization extensions, and enough memory for Hyper-V isolation. Hosts that don't meet the requirements fail the install.
    - question: How often is InstallWindowsDefenderApplicationGuard used?
      answer: |
        Rarely, and less every year because of the deprecation. Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run InstallWindowsDefenderApplicationGuard with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-wdag.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Turning Application Guard on and setting its policies are separate settings that go in a Windows configuration profile.
    - question: How do I know the install worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the request. A restart may be needed before the feature is available.

        On the host, `Get-WindowsOptionalFeature -Online -FeatureName Windows-Defender-ApplicationGuard` shows whether the feature is enabled.
    - question: What errors does InstallWindowsDefenderApplicationGuard return?
      answer: |
        A `404` usually means the CSP isn't available on that Windows version or edition. A `500` usually means the hardware doesn't meet the requirements, like missing virtualization support.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>be527684-1679-449f-b4f1-7d2f6fe48ce7</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/WindowsDefenderApplicationGuard/InstallWindowsDefenderApplicationGuard</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ChangeProductKey
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#changeproductkey
  description: Installs a new Windows product key on the device without requiring a reboot.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the ChangeProductKey MDM command do?
      answer: |
        It installs a new Windows product key without restarting the computer. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/ChangeProductKey` with the key as a `chr` string in `<Data>`.

        It's available on Windows 10, version 1703 and later.
    - question: What's the difference between ChangeProductKey and UpgradeEditionWithProductKey?
      answer: |
        ChangeProductKey swaps the key on the current edition and doesn't reboot. Use it to move a host to a different license, like a volume license key.

        UpgradeEditionWithProductKey is meant for edition upgrades, like Pro to Enterprise, and restarts the computer to finish.
    - question: How often is ChangeProductKey used?
      answer: |
        Rarely. It's used when correcting activation or moving computers onto volume licensing.

        Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run ChangeProductKey with Fleet?
      answer: |
        Add `<Data>` with your 29-character product key, including dashes. Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=change-key.xml`.

        You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`. Treat the payload file as a secret, and delete it after use.
    - question: How do I know ChangeProductKey worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the key.

        On the host, `slmgr /dli` shows the partial product key and activation status.
    - question: What errors does ChangeProductKey return?
      answer: |
        A `400` or `500` usually means the key is invalid, mistyped, or not valid for the installed edition. Keys without dashes fail.
    - question: Will the user notice when ChangeProductKey runs?
      answer: |
        Usually not. Changing the key is silent and doesn't restart the computer.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>e416bea9-8407-4a72-a7db-415cd4dcf622</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/ChangeProductKey</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: CheckApplicability
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#checkapplicability
  description: Checks if the provided product key is valid for upgrading the Windows edition on the device, returning TRUE if applicable.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the CheckApplicability MDM command do?
      answer: |
        It checks whether a product key can be used to upgrade the Windows edition on a host. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/CheckApplicability` with the key in `<Data>`.

        It returns TRUE when the key applies. It doesn't change anything on the host.
    - question: Why would I run CheckApplicability first?
      answer: |
        To avoid a failed edition upgrade. UpgradeEditionWithProductKey restarts the computer, so testing the key first prevents an unnecessary restart on hosts where the upgrade won't work.
    - question: How often is CheckApplicability used?
      answer: |
        Rarely, and usually right before an edition upgrade. Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run CheckApplicability with Fleet?
      answer: |
        Add `<Data>` with the 29-character product key. Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=check-key.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: Where do I see the CheckApplicability result?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The status code shows whether the device accepted the command, and the raw result has the device's full response.

        If you're unsure how to read it, run the upgrade on one pilot host first.
    - question: What errors does CheckApplicability return?
      answer: |
        A `400` usually means the key is malformed, for example missing dashes. A `500` usually means the device couldn't evaluate the key.
    - question: Does CheckApplicability use up or activate the key?
      answer: |
        No. It only checks the key. Nothing is installed or activated.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>e3f7b84a-1984-4511-843f-c33001392d14</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/CheckApplicability</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: SwitchFromSMode
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#smodeswitchfromsmode
  description: Switches the device from Windows 10/11 S mode to a standard edition, if eligible. No reboot is required.
  supportedDeviceTypes:
    - Windows 10.0.17763
  faq:
    - question: What does the SwitchFromSMode MDM command do?
      answer: |
        It switches a Windows host out of S mode to the full edition, like Windows 11 Pro. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/SMode/SwitchFromSMode` with `null` format and empty `<Data>`.

        No restart is needed.
    - question: Can I switch back to S mode afterward?
      answer: |
        No. Leaving S mode is one-way. To get S mode back, you need to reinstall Windows in S mode.
    - question: How often is SwitchFromSMode used?
      answer: |
        Rarely. It's used when an organization buys devices that ship in S mode and needs to run apps from outside the Microsoft Store, like fleetd.

        Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run SwitchFromSMode with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=switch-from-s-mode.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        It requires Windows 10, version 1809 or later.
    - question: Can a Windows device in S mode enroll in Fleet?
      answer: |
        Only through automatic enrollment with Microsoft Entra ID or Autopilot. Manual enrollment in Fleet starts by installing fleetd, and S mode blocks apps that don't come from the Microsoft Store.

        After automatic enrollment, send SwitchFromSMode so fleetd, scripts, software installs, and osquery data can work.
    - question: How do I know SwitchFromSMode worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the request was accepted.

        The `SMode/Status` node reports the result: `0` switched, `1` in progress, `3` already out of S mode, `4` failed. On the host, **Settings > System > Activation** no longer mentions S mode.
    - question: Can I stop users from leaving S mode themselves?
      answer: |
        Yes. Set `SMode/SwitchingPolicy` to `1` in a Windows configuration profile. Then only an admin can switch the device out of S mode, using this command.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>848dc97d-0d6d-489e-bb32-9a90fa2e3afb</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/SMode/SwitchFromSMode</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RemoveSubscription
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#subscriptionsremovesubscription
  description: Removes the subscription license from the device and resets the subscription type to a user-based subscription.
  supportedDeviceTypes:
    - Windows 99.9.99999
  faq:
    - question: What does the RemoveSubscription MDM command do?
      answer: |
        It removes a Windows subscription license from the device and resets the subscription type to user-based. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/Subscriptions/RemoveSubscription` with `null` format.
    - question: Which Windows versions support RemoveSubscription?
      answer: |
        Microsoft only lists it for Windows Insider Preview builds. That's why the supported version on this page shows a placeholder build number. Release builds of Windows may return an error.
    - question: What is a device-based subscription?
      answer: |
        Windows Enterprise subscription activation can be tied to a user or a device. With device-based subscription, the device gets the Enterprise license without a user signing in. RemoveSubscription removes that license and returns the device to user-based subscription.
    - question: How often is RemoveSubscription used?
      answer: |
        Rarely. It's a preview feature for organizations testing device-based subscriptions.

        Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run RemoveSubscription with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-subscription.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`. Test on an Insider host first.
    - question: How do I know RemoveSubscription worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the command ran. Windows records details in the `Subscriptions/SubscriptionStatus` and `Subscriptions/SubscriptionLastError` nodes.
    - question: What errors does RemoveSubscription return?
      answer: |
        A `404` usually means the host isn't running a Windows Insider build with this node. Other failures show up in `Subscriptions/SubscriptionLastError` and `SubscriptionLastErrorDescription`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>da9c456a-2f0e-4d8a-9748-0fbde572ee76</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/Subscriptions/RemoveSubscription</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpgradeEditionWithLicense
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#upgradeeditionwithlicense
  description: Upgrades the Windows edition on the device by applying a provided license. No reboot is required to complete the upgrade.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the UpgradeEditionWithLicense MDM command do?
      answer: |
        It upgrades the Windows edition using a license file in XML, without a restart. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithLicense`.
    - question: Is UpgradeEditionWithLicense still supported?
      answer: |
        Microsoft marks it as deprecated. It was designed for Windows 10 Mobile, which needed a license file instead of a product key.

        For Windows desktop edition upgrades, use UpgradeEditionWithProductKey.
    - question: What's the difference between UpgradeEditionWithLicense and UpgradeEditionWithProductKey?
      answer: |
        UpgradeEditionWithLicense takes a license file and doesn't restart. UpgradeEditionWithProductKey takes a 29-character product key and restarts the computer to finish.

        Windows desktop devices use product keys. The `LicenseKeyType` node reports which one a device expects.
    - question: How often is UpgradeEditionWithLicense used?
      answer: |
        Almost never today. Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run UpgradeEditionWithLicense with Fleet?
      answer: |
        Put the license XML in `<Data>`, save the `<Exec>` element as a file, and run `fleetctl mdm run-command --hosts=<hostname> --payload=upgrade-license.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I know UpgradeEditionWithLicense worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the license. The WindowsLicensing `Status` node tracks the upgrade: `0` failed, `1` pending, `2` in progress, `3` completed. Fleet shows the new edition in the host's OS details after a refetch.
    - question: What errors does UpgradeEditionWithLicense return?
      answer: |
        A `400` or `500` usually means the license XML is invalid or the device expects a product key instead. Check `LicenseKeyType` on the host.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>472afd03-6963-4c7b-aebb-99d561724086</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithLicense</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpgradeEditionWithProductKey
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#upgradeeditionwithproductkey
  description: Upgrades the Windows edition on the device by applying a specified product key. A reboot is required to complete the upgrade.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the UpgradeEditionWithProductKey MDM command do?
      answer: |
        It upgrades the Windows edition with a product key, like Pro to Enterprise. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithProductKey` with the key in `<Data>`.

        Windows runs `changepk.exe` with the key and restarts to finish the upgrade.
    - question: Which edition upgrades does UpgradeEditionWithProductKey support?
      answer: |
        Microsoft lists these upgrade paths through MDM:

        - Pro to Enterprise
        - Pro to Education
        - Home to Education
        - Enterprise to Education
    - question: Will UpgradeEditionWithProductKey restart the computer?
      answer: |
        Yes. Windows notifies the user that a new edition is available. The user can restart, or Windows restarts automatically after two hours, with a reminder 10 minutes before.

        If the key is only activating or changing the key on the current edition, no restart is needed.
    - question: How often is UpgradeEditionWithProductKey used?
      answer: |
        Occasionally, often when an organization standardizes on Enterprise. Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run UpgradeEditionWithProductKey with Fleet?
      answer: |
        Replace the placeholder in `<Data>` with your 29-character key, including dashes. Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=upgrade-edition.xml`.

        Run CheckApplicability first to confirm the key works for the host's edition.
    - question: How do I know UpgradeEditionWithProductKey worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the key. After the restart, Fleet shows the new edition in the host's OS details following a refetch.
    - question: What errors does UpgradeEditionWithProductKey return?
      answer: |
        A `400` or `500` usually means an invalid key, a key without dashes, or an unsupported upgrade path. The upgrade also fails if another policy forces a restart while `changepk.exe` is running.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>3d13b6f6-5e79-4a28-b8f5-062f884a1de1</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithProductKey</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>XXXXX-XXXXX-XXXXX-XXXXX-XXXXX</Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetToFactoryState
  platform: windows
  category: eUICCs
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/euiccs-csp#euiccactionsresettofactorystate
  description: Triggers an eUICC (embedded Universal Integrated Circuit Card) factory reset, permanently deleting all eSIM (embedded Subscriber Identity Module) profiles stored on the eUICC.
  supportedDeviceTypes:
    - Windows 10.0.16299
  faq:
    - question: What does the eUICC ResetToFactoryState MDM command do?
      answer: |
        It factory resets the device's eUICC, the embedded chip that stores eSIM profiles. Every eSIM profile on the chip is permanently deleted. It's an `<Exec>` on `./Device/Vendor/MSFT/eUICCs/{eUICC}/Actions/ResetToFactoryState`.

        The rest of Windows isn't affected.
    - question: Which devices does ResetToFactoryState apply to?
      answer: |
        Only Windows devices with a cellular modem and an eSIM, like some LTE or 5G laptops. Devices without an eUICC have no `{eUICC}` node, so the command fails.
    - question: Can I undo ResetToFactoryState?
      answer: |
        No. Deleted eSIM profiles can't be restored. The user needs a new activation from the mobile carrier to get cellular service back.
    - question: How often is ResetToFactoryState used?
      answer: |
        Rarely. It's used when retiring or reassigning a cellular-capable laptop, or when a device is lost.

        Fleet doesn't send it automatically, and Fleet's **Wipe** action doesn't reset eSIMs. You can send it as a custom MDM command.
    - question: How do I run ResetToFactoryState with Fleet?
      answer: |
        Replace `{eUICC}` with the eUICC's identifier. Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset-euicc.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Fleet's run-command feature only accepts `<Exec>`, so you can't read the `eUICCs` node through it to find the identifier. Look it up on the device or from your carrier tooling first.
    - question: How do I know ResetToFactoryState worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the reset. On the host, **Settings > Network & internet > Cellular > eSIM profiles** shows no profiles.
    - question: What errors does ResetToFactoryState return?
      answer: |
        A `404` usually means the `{eUICC}` identifier is wrong or the device has no eUICC. A `500` means the reset failed on the modem side.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ebb2aec5-4865-4419-9fa1-3458d32fcab6</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/eUICCs/{eUICC}/Actions/ResetToFactoryState</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>
