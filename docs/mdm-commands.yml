- name: Clear restrictions password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/clear-restrictions-password-command
  description: Remove the passcode from a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
  faq:
    - question: What does the ClearRestrictionsPassword MDM command do?
      answer: |
        The `ClearRestrictionsPassword` command clears the Screen Time passcode on a supervised iPhone or iPad. On older versions of iOS, this was called the restrictions passcode.

        What happens next depends on the iOS version. In iOS 12.2 and later, if Screen Time shares settings across devices with iCloud, the command turns off Screen Time and clears its restrictions. Otherwise, it clears the passcode but leaves Screen Time and its restrictions on.
    - question: When would I use ClearRestrictionsPassword?
      answer: |
        Rarely. Use it when an end user set a Screen Time passcode on a company device and can no longer change Screen Time settings, or when a previous user left one behind.

        MDM servers don't send it as part of routine management.
    - question: Does Fleet send ClearRestrictionsPassword automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run ClearRestrictionsPassword with Fleet?
      answer: |
        Save a plist with `RequestType` set to `ClearRestrictionsPassword`. The command has no other keys. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        You can also base64-encode the plist and send it with the [run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API endpoint, `POST /api/v1/fleet/commands/run`. The [MDM commands guide](https://fleetdm.com/guides/mdm-commands) walks through each step.
    - question: Does ClearRestrictionsPassword require a supervised device?
      answer: |
        Yes. Apple supports this command only on supervised iPhones and iPads, on the device channel. Devices enrolled through Automated Device Enrollment (ADE) are supervised. It isn't available for User Enrollment (BYOD) or macOS.
    - question: Why does ClearRestrictionsPassword fail on a child's device?
      answer: |
        Apple blocks it. If the device's user is a child in an iCloud family, the command fails. Screen Time for that user is managed by the family organizer, not by MDM.
    - question: How do I know ClearRestrictionsPassword worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` or check **Host details > Show MDM commands** in Fleet. `Acknowledged` means the device cleared the passcode. `Error` includes an `ErrorChain` that explains why it didn't.

        To confirm on the device, open **Settings > Screen Time** and check that no passcode is required.
    - question: Is ClearRestrictionsPassword available in Fleet Free?
      answer: |
        Yes. Any Fleet admin or maintainer can send it as a custom MDM command in Fleet Free or Fleet Premium.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ClearRestrictionsPassword</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ClearRestrictionsPassword</string>
    </dict>
    </plist>

- name: Unlock user account
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/unlock-user-account-command
  description: Unlock a user account that the system locked because of too many failed password attempts.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the UnlockUserAccount MDM command do?
      answer: |
        The `UnlockUserAccount` command unlocks a local macOS user account that the system locked after too many failed password attempts. You name the account with the `UserName` key.

        It works on any local account on the Mac, not only accounts that MDM created. It doesn't change or reveal the password.
    - question: When do IT admins use UnlockUserAccount?
      answer: |
        Occasionally, as a help desk fix. A common case is a Mac with a passcode policy profile that sets a maximum number of failed attempts. When a user hits that limit, the account locks, and this command lets them try again without waiting.

        MDM servers don't send it as part of routine management.
    - question: Does Fleet send UnlockUserAccount automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.

        Don't confuse it with Fleet's **Unlock** action. That action reverses a Fleet **Lock** on the whole Mac. It doesn't unlock individual user accounts.
    - question: How do I run UnlockUserAccount with Fleet?
      answer: |
        Save a plist with `RequestType` set to `UnlockUserAccount` and `UserName` set to the account's short name, such as `jdoe`. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        You can also base64-encode the plist and send it with `POST /api/v1/fleet/commands/run`. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: Does UnlockUserAccount require a supervised Mac?
      answer: |
        Yes. Apple lists this command as requiring supervision on macOS 10.13 and later, on the device channel. Macs enrolled through Automated Device Enrollment (ADE) are supervised. The enrollment must also grant the device lock and passcode removal access right.
    - question: Should I use UnlockUserAccount if the user forgot their password?
      answer: |
        No. This command only clears the lockout. The user still needs the correct password to sign in.

        If the user forgot their password on a FileVault-encrypted Mac, use the escrowed disk encryption key instead. Learn more in the [disk encryption guide](https://fleetdm.com/guides/enforce-disk-encryption).
    - question: How do I know UnlockUserAccount worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` or check **Host details > Show MDM commands** in Fleet. `Acknowledged` means macOS processed the unlock. The user should be able to sign in again at the login window.

        If you get `Error`, check the `ErrorChain`. A misspelled or nonexistent `UserName` is a common cause.
    - question: Is UnlockUserAccount available in Fleet Free?
      answer: |
        Yes. Any Fleet admin or maintainer can send it as a custom MDM command in Fleet Free or Fleet Premium.
  command: |
