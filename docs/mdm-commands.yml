- name: RotateRecoveryPasswords
  platform: windows
  category: BitLocker
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/bitlocker-csp#rotaterecoverypasswords
  description: Triggers a one-time rotation of all numeric BitLocker recovery passwords for OS and fixed drives on Entra ID or hybrid-joined devices. Requires Active Directory backup of recovery passwords to be set to "required" before execution.
  supportedDeviceTypes:
    - Windows 10.0.18363
  faq:
    - question: What does the BitLocker RotateRecoveryPasswords MDM command do?
      answer: |
        It tells Windows to replace every numeric BitLocker recovery password on the OS drive and fixed data drives in one pass. The command is an `<Exec>` on `./Device/Vendor/MSFT/BitLocker/RotateRecoveryPasswords` in the BitLocker CSP.

        Windows generates the new passwords on the device and backs them up to Active Directory or Microsoft Entra ID. The old recovery passwords no longer unlock the drives.
    - question: When should I rotate BitLocker recovery passwords?
      answer: |
        After a recovery password has been exposed. Common cases are a help desk reading the password to an end user, a device changing hands, or a suspected leak.

        It's a one-off action. Each `<Exec>` triggers one rotation. For automatic rotation after a password is used, set the BitLocker CSP's `ConfigureRecoveryPasswordRotation` node instead.
    - question: What are the requirements for RotateRecoveryPasswords?
      answer: |
        Windows 10, version 1909 or later (Pro, Enterprise, Education, or IoT Enterprise), on a device that's Microsoft Entra joined or hybrid joined.

        BitLocker policy must also require recovery information to be backed up to Active Directory before BitLocker turns on, for OS drives and fixed drives. Without that, the command has no effect. Microsoft lists supported enrollment types by their Intune names (Entra join, bulk Entra join, Entra join with device auth, and co-management), so test on one device before relying on it with another MDM.
    - question: How do I rotate a BitLocker recovery password without MDM?
      answer: |
        Use `manage-bde` in an elevated prompt. Run `manage-bde -protectors -get C:` to find the current recovery password ID, delete it with `manage-bde -protectors -delete C: -id <ID>`, and add a new one with `manage-bde -protectors -add C: -RecoveryPassword`.

        Then back up the new password, for example with the `BackupToAAD-BitLockerKeyProtector` PowerShell cmdlet. Otherwise the only copy is on the device.
    - question: Does Fleet use RotateRecoveryPasswords?
      answer: |
        No. When you turn on disk encryption for a fleet, Fleet's agent (fleetd) turns on BitLocker and escrows the recovery password to Fleet using Windows' local BitLocker APIs. If the disk is already encrypted, fleetd adds a new recovery password, removes the old ones, and escrows the new one. See the [disk encryption guide](https://fleetdm.com/guides/enforce-disk-encryption).

        Fleet's on-demand **Rotate key** action is macOS only (Fleet Premium). To get a fresh key escrowed for a Windows host, [transfer it](https://fleetdm.com/guides/enforce-disk-encryption) to a fleet with disk encryption off and then back. Fleet deletes the stored key on the first move, and fleetd escrows a new one after the second. The host gets the other fleet's settings in between, so do this deliberately.
    - question: Will RotateRecoveryPasswords break the recovery key escrowed in my MDM?
      answer: |
        It can. This command backs up the new password to Active Directory or Entra ID, not to your MDM. If your MDM escrows its own copy, that copy stops working.

        Fleet doesn't yet detect a replaced BitLocker recovery password, so the key shown in **Actions > Show disk encryption key** goes stale. On hosts where Fleet enforces disk encryption, don't use this command. Use the fleet transfer workaround above instead.
    - question: How do I run RotateRecoveryPasswords with Fleet?
      answer: |
        Save only the `<Exec>` element from the example (drop the `<syncml>` and `<syncbody>` wrappers, because Fleet accepts a single `<Exec>` with one `<Item>`). Microsoft documents the `<Data>` value as a request ID, such as a GUID, which Windows reports back in `RotateRecoveryPasswordsRequestID`.

        Then run `fleetctl mdm run-command --hosts=<hostname> --payload=rotate.xml`, which prints the command UUID. With the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API, Fleet uses your `<CmdID>` as the command ID, so give it a new unique value. It's available in Fleet Free and Fleet Premium.
    - question: How do I check that BitLocker recovery password rotation worked?
      answer: |
        A status of `202` means Windows accepted the request and started rotation in the background. In Fleet, check it with `fleetctl get mdm-command-results --id=<command-uuid>`.

        For the outcome, read `./Device/Vendor/MSFT/BitLocker/Status/RotateRecoveryPasswordsStatus` together with `RotateRecoveryPasswordsRequestID`. Status `0` means passed, `1` pending, `2` not started, and any other value is an error. You can read device-scope nodes like these with osquery's `mdm_bridge` table in a Fleet report.
    - question: Why did RotateRecoveryPasswords fail?
      answer: |
        Most failures come from missing prerequisites: the device isn't Entra joined or hybrid joined, or the "Do not enable BitLocker until recovery information is stored to AD DS" policies aren't set. These usually show up as an error in `RotateRecoveryPasswordsStatus`, not in the command status.

        A `404` status usually means the OS is older than Windows 10, version 1909, or the LocURI is wrong. A `405` means the verb wasn't `<Exec>`.
    - question: Does RotateRecoveryPasswords rotate removable drive passwords?
      answer: |
        No. Microsoft documents it for OS drives and fixed data drives only. Removable drives protected with BitLocker To Go aren't included.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>5f0096d1-c2aa-4934-b67a-0ed35d20d322</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/BitLocker/RotateRecoveryPasswords</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll (Personal scope)
  platform: windows
  category: CertificateStore
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/certificatestore-csp#myscepuniqueidinstallenroll
  description: Initiates SCEP certificate enrollment in the personal certificate store on the device.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the CertificateStore SCEP Enroll command do?
      answer: |
        It starts a SCEP certificate request using settings already stored under `./Device/Vendor/MSFT/CertificateStore/MY/SCEP/{UniqueID}/Install`. The command is an `<Exec>` on the `Install/Enroll` node, and the issued certificate goes to the device's personal (MY) store.

        The `<Exec>` carries no settings itself. The server URL, challenge, subject, and other values must be set on the sibling `Install` nodes first.
    - question: Is CertificateStore SCEP deprecated?
      answer: |
        Yes. Microsoft marks `CertificateStore/MY/SCEP` as deprecated and says it may be removed in a future release. It recommends the ClientCertificateInstall CSP for all new SCEP deployments.
    - question: What's the difference between CertificateStore SCEP and ClientCertificateInstall SCEP?
      answer: |
        Both request a certificate over SCEP and use the same `Install/Enroll` pattern. CertificateStore SCEP is the older, deprecated path and is device scope only.

        ClientCertificateInstall is the current path. It supports device scope (`./Device/`) and user scope (`./User/`), and adds options like TPM key protection and Windows Hello for Business key storage. If you're writing a new SCEP profile, use ClientCertificateInstall.
    - question: Should I migrate existing CertificateStore SCEP configurations?
      answer: |
        Yes, when you next touch them. Recreate the request under `./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}` with the same server URL, subject, and key settings, confirm the new certificate issues, then remove the old configuration.

        Apps and Wi-Fi or VPN profiles that select the certificate by issuer or template usually keep working, since the new certificate lands in the same personal store.
    - question: Does Fleet use CertificateStore SCEP enrollment?
      answer: |
        No. Fleet Premium delivers SCEP certificates to Windows hosts with configuration profiles built on ClientCertificateInstall, from Microsoft NDES or any SCEP CA. See [Deploy certificates](https://fleetdm.com/guides/connect-end-user-to-wifi-with-certificate).

        To run this legacy `<Exec>` anyway, set the `Install` nodes with a custom Windows profile in **Controls > OS settings**, since Fleet's custom commands only accept a single `<Exec>`. Then save the `<Exec>` element with `{UniqueID}` replaced and run `fleetctl mdm run-command --hosts=<hostname> --payload=enroll.xml`.
    - question: How do I know the certificate was issued?
      answer: |
        The command status only shows that Windows accepted the request. Microsoft says the server must check afterward whether the certificate was added.

        Read `MY/SCEP/{UniqueID}/Status`: `1` means finished, `2` pending at the CA, `16` failed, and `32` unknown. In Fleet, issued certificates also appear in the host's **Certificates** section. See [View certificates in host vitals](https://fleetdm.com/guides/view-certificates-in-host-vitals).
    - question: Why did CertificateStore SCEP enrollment fail?
      answer: |
        A `404` status usually means the `{UniqueID}` node doesn't exist, because the `Install` settings were never added or the placeholder wasn't replaced.

        Problems with the CA show up later. `Status` is `16` and `MY/SCEP/{UniqueID}/ErrorCode` holds the HRESULT. Common causes are a wrong or expired challenge, a wrong CA thumbprint, or an unreachable SCEP URL.
    - question: Can CertificateStore SCEP install a certificate for a user?
      answer: |
        No. Microsoft documents `CertificateStore/MY/SCEP` as device scope only. For a certificate in the signed-in user's store, use ClientCertificateInstall with a `./User/` LocURI.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>1a3a3666-2df6-4dcf-a785-46b2f28d2fbf</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/CertificateStore/MY/SCEP/{UniqueID}/Install/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RenewNow
  platform: windows
  category: CertificateStore
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/certificatestore-csp#mywsteprenewrenewnow
  description: Triggers an immediate renewal of an existing certificate in the personal certificate store on the device.
  supportedDeviceTypes:
    - Windows 10.0.14393
  faq:
    - question: What does the RenewNow MDM command do?
      answer: |
        It tells Windows to renew its MDM client certificate now instead of waiting for the renewal window. The command is an `<Exec>` on `./Device/Vendor/MSFT/CertificateStore/MY/WSTEP/Renew/RenewNow`.

        The WSTEP certificate is the one Windows received from the MDM's enrollment service during enrollment. Renewal follows the same discovery, policy, and enrollment steps as the original enrollment.
    - question: When would I use RenewNow?
      answer: |
        Rarely. Windows renews its MDM certificate on its own once the renewal period starts, and retries on failure. RenewNow is for troubleshooting a device whose certificate is close to expiry or whose scheduled renewal keeps failing, after you've fixed the cause.
    - question: How do I see when an MDM certificate will renew?
      answer: |
        The device stores the schedule under `MY/WSTEP/Renew`. `RenewPeriod` is how many days before expiry renewal starts (the default is 42), and `RetryInterval` is how many days to wait after a failure (the default is 7). `LastRenewalAttemptTime` shows the last attempt.

        The enrollment record under `HKLM\SOFTWARE\Microsoft\Enrollments` also stores `RenewStatus` and `RenewErrorCode`.
    - question: Can I trigger MDM certificate renewal without an MDM command?
      answer: |
        Yes. Windows creates a scheduled task for each enrollment under `\Microsoft\Windows\EnterpriseMgmt\<enrollment ID>\`. Starting the task whose name includes "renewal of certificate", for example with `Start-ScheduledTask` in PowerShell running as SYSTEM, starts a renewal attempt.

        This works even when the MDM can't reach the device, which makes it useful when renewal is failing.
    - question: Does Fleet use RenewNow?
      answer: |
        No. Fleet issues its Windows MDM certificate for 365 days and sets the renewal window to open 180 days before expiry. Fleet doesn't complete renewals yet ([issue 52492](https://github.com/fleetdm/fleet/issues/52492)), so a renewal request sent to Fleet is declined.

        That doesn't interrupt management. Fleet authenticates Windows check-ins with credentials it provisions at enrollment, not with this certificate, so the host stays managed.
    - question: How do I fix Intune MDM certificate renewal failures?
      answer: |
        Find the cause first. Read `RenewStatus` and `RenewErrorCode` from the Intune enrollment record in the registry, fix the cause (often a stale UPN), then trigger a retry. RenewNow has to come from the MDM that owns the certificate.

        With fleetd installed alongside Intune, Fleet can find affected devices with a policy and fix the most common cause with a script. See [Find Windows devices that can't renew their Intune MDM certificate](https://fleetdm.com/guides/find-windows-devices-that-cant-renew-their-intune-mdm-certificate).
    - question: How do I run RenewNow with Fleet?
      answer: |
        Save only the `<Exec>` element (without the `<syncml>` and `<syncbody>` wrappers) and run `fleetctl mdm run-command --hosts=<hostname> --payload=renewnow.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet can only send it over Fleet's own enrollment. Because Fleet declines WSTEP renewals today, expect `RenewStatus` to read `3` (failed) with `RenewErrorCode` `0x801900C8` afterward. The host stays managed.
    - question: How do I check whether the MDM certificate renewed?
      answer: |
        A `200` status only means Windows started the renewal. Read `MY/WSTEP/Renew/Status` for the outcome: `0` not started, `1` in progress, `2` succeeded, `3` failed. On failure, `MY/WSTEP/Renew/ErrorCode` holds the HRESULT.

        `MY/WSTEP/CertThumprint` (Microsoft's spelling) shows the new thumbprint once renewal succeeds. In Fleet, a report on osquery's `registry` table can read `RenewStatus` across hosts.
    - question: Is RenewNow device scope or user scope?
      answer: |
        Device scope only. The MDM client certificate belongs to the device's enrollment, so there's no `./User/` version of this node.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>cdd76df2-d665-4045-9503-7954cc491bf2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/CertificateStore/MY/WSTEP/Renew/RenewNow</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll (Device context)
  platform: windows
  category: ClientCertificateInstall
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/clientcertificateinstall-csp#devicescepuniqueidinstallenroll
  description: Triggers the device to start SCEP certificate enrollment at the device scope. The device will not notify MDM server after cert enrollment is done. The MDM server could later query the device to find out whether new cert is added.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does ClientCertificateInstall SCEP Enroll do in device context?
      answer: |
        It tells Windows to request a certificate for the computer from a SCEP server. The command is an `<Exec>` on `./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll`.

        The certificate goes to the local machine's personal store, so it's available to system services and before anyone signs in. That makes device context the right choice for machine Wi-Fi, VPN, and device-based access checks.
    - question: When should I use a device certificate instead of a user certificate?
      answer: |
        Use a device certificate when the network or app needs to trust the computer, especially before sign-in, such as machine Wi-Fi (802.1X) or an always-on VPN. Use a user certificate (`./User/`) when access must be tied to a specific person.

        On shared devices, a device certificate is usually the simpler choice, because it doesn't depend on who signs in.
    - question: What has to be set before the SCEP Enroll command?
      answer: |
        The `Install` child nodes under the same `{UniqueID}`. Required ones include `ServerURL`, `Challenge`, `SubjectName`, `KeyUsage`, `KeyLength`, `HashAlgorithm`, `CAThumbprint`, and `EKUMapping`. The `Enroll` `<Exec>` comes last and uses those values.

        Microsoft also says the `{UniqueID}` node must be added in an `<Atomic>` block, so the settings and the `<Exec>` normally travel together in one configuration profile.
    - question: Can I resend SCEP Enroll to retry a failed certificate?
      answer: |
        Usually not on its own. Windows deletes the `Challenge` value shortly after it accepts the `<Exec>`, and many CAs, including NDES, issue one-time challenges anyway. Resending only the `<Exec>` has nothing valid to send.

        Redeliver the whole SCEP profile instead, so the device gets a new challenge. In Fleet, select **Resend** next to the profile in **Host details > OS settings**.
    - question: Which Fleet features use ClientCertificateInstall SCEP Enroll?
      answer: |
        [Certificate deployment](https://fleetdm.com/guides/connect-end-user-to-wifi-with-certificate) in Fleet Premium. You add a Windows profile that sets the `Install` nodes and ends with this `<Exec>`, using `$FLEET_VAR_SCEP_WINDOWS_CERTIFICATE_ID` as the `{UniqueID}`. Fleet fills in the challenge for Microsoft NDES or your SCEP CA.

        Fleet also renews these certificates automatically before they expire by resending the profile. Keep certificate settings in their own profile, so renewal doesn't resend unrelated Wi-Fi or VPN settings.
    - question: How do I run device-context SCEP Enroll with Fleet as a custom command?
      answer: |
        You rarely should. Fleet's custom commands accept a single `<Exec>`, so they can't add the `Install` settings, and the challenge is gone after the first attempt. Use a configuration profile in **Controls > OS settings**.

        If the `Install` nodes already exist with a valid challenge, replace `{UniqueID}`, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=enroll.xml`.
    - question: How do I know the device certificate was issued?
      answer: |
        Windows doesn't notify the server when enrollment finishes. Read `./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Status`: `1` means success, `2` pending at the CA, `16` failed, and `32` unknown.

        For SCEP profiles Fleet delivers, Fleet reads `Status` and `ErrorCode` after the host acknowledges the profile and shows the result in **Host details > OS settings**. The certificate also appears in the host's **Certificates** section with System scope.
    - question: Why did device-context SCEP enrollment fail?
      answer: |
        A `404` command status means the `{UniqueID}` node doesn't exist. CA problems show up later as `Status` `16` with an HRESULT in `ErrorCode`.

        Common causes are a reused or expired challenge, a `CAThumbprint` that doesn't match the root CA, a SCEP URL the device can't reach, and a missing root CA certificate on devices that aren't joined to Active Directory.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>96821528-e7c2-41ce-b4a8-6a20c61df80b</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll (User context)
  platform: windows
  category: ClientCertificateInstall
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/clientcertificateinstall-csp#devicescepuniqueidinstallenroll
  description: Triggers the user context to start SCEP certificate enrollment. The device will not notify MDM server after cert enrollment is done. The MDM server could later query the device to find out whether new cert is added.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does ClientCertificateInstall SCEP Enroll do in user context?
      answer: |
        It tells Windows to request a certificate for the signed-in user from a SCEP server. The command is an `<Exec>` on `./User/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll`.

        The certificate goes to that user's personal store, not the machine store. Other users on the device and system services can't use it. That fits user-based Wi-Fi or VPN, email signing, and apps that identify the person.
    - question: How is user-context SCEP different from device context?
      answer: |
        The nodes are the same, but every LocURI starts with `./User/` instead of `./Device/`, and the certificate is issued to whoever the MDM session is running for. It needs a signed-in user with an MDM user enrollment, while device context works with nobody signed in.

        Keep all of a certificate's `Install` settings and its `Enroll` `<Exec>` under the same `./User/` path. Don't mix scopes for one certificate.
    - question: What are the requirements for user-context SCEP enrollment?
      answer: |
        Windows 10, version 1511 or later (Pro, Enterprise, Education, or IoT Enterprise), and an MDM enrollment that includes a user. Devices with a device-only MDM enrollment can't process `./User/` commands, and Fleet's guide notes that user-scope profiles need a Microsoft Entra ID user association.

        The user must also be signed in when the command runs.
    - question: Can I use Windows Hello for Business to protect a user SCEP certificate?
      answer: |
        Yes. Set `Install/KeyProtection` to `4` to keep the private key in Windows Hello for Business, and set `Install/ContainerName`, or enrollment fails.

        Microsoft notes that even TPM-protected SCEP keys aren't guarded by a TPM PIN.
    - question: Does Fleet support user-scoped SCEP certificates on Windows?
      answer: |
        Yes, in Fleet Premium. Take a Windows SCEP profile from the [certificate guide](https://fleetdm.com/guides/connect-end-user-to-wifi-with-certificate) and replace `./Device/` with `./User/` in every `<LocURI>`. Fleet delivers user-scoped profiles after an end user signs in and shows them as **Pending** until then.

        Fleet doesn't support user-scoped profiles on Windows devices shared by multiple users. They go to whoever is signed in, so use a device certificate on shared devices. See [device and user scope](https://fleetdm.com/guides/custom-os-settings#device-and-user-scope).
    - question: How do I run user-context SCEP Enroll with Fleet?
      answer: |
        Use a user-scoped configuration profile in **Controls > OS settings**. Fleet's custom commands accept a single `<Exec>`, so they can't add the `Install` settings, and Windows deletes the challenge after the first attempt.

        To retry, select **Resend** next to the profile in **Host details > OS settings** while the user is signed in. That sends a fresh challenge along with the `<Exec>`.
    - question: How do I know the user certificate was issued?
      answer: |
        Read `./User/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Status` on the user channel: `1` means success, `2` pending, `16` failed, and `32` unknown. Fleet reads this for SCEP profiles it delivers and shows the result in **Host details > OS settings**.

        In the host's **Certificates** section, user certificates show User scope and the owning username. osquery can only read a user's certificates while that user is signed in.
    - question: Why is my user-scoped SCEP certificate stuck in Pending?
      answer: |
        Most often, no end user has signed in since the profile was added. Fleet holds user-scoped Windows profiles until someone signs in.

        If a user is signed in and it's still pending, check that the device has an MDM enrollment with a user, not a device-only enrollment. A profile that mixes `./Device/` and `./User/` settings also waits for sign-in, so keep device settings in a separate profile.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>a901c1bc-3970-461d-9c92-932645cab9b3</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridlinkedenrollmentenroll
  description: Silently unenrolls the device from a Linked Enrollment without user interaction. All settings and resources applied by the Declared Configuration are rolled back automatically.
  supportedDeviceTypes:
    - Windows 10.0.22621
    - Windows 10.0.22000.918
    - Windows 10.0.19044.2193
    - Windows 10.0.19043.2193
    - Windows 10.0.19042.2193
  faq:
    - question: What does the DMClient LinkedEnrollment Enroll command do?
      answer: |
        It starts a silent Windows declared configuration enrollment, also called a linked enrollment. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Enroll`.

        Windows uses the Microsoft Entra device token to enroll in a second management channel that's linked to the existing MDM enrollment. No user interaction is needed.
    - question: Does LinkedEnrollment Enroll enroll or unenroll the device?
      answer: |
        It enrolls. Microsoft's reference page also includes a sentence copied from `LinkedEnrollment/Unenroll`, which makes it look like an unenroll command. The node's own description says it triggers a silent declared configuration enrollment.

        To remove the linked enrollment, use `LinkedEnrollment/Unenroll`.
    - question: What is Windows declared configuration?
      answer: |
        It's Microsoft's declarative management protocol for Windows. The device receives a desired state and keeps it applied, instead of the server sending individual commands. It runs as a linked enrollment alongside a classic OMA-DM enrollment, which keeps handling everything else.
    - question: What are the requirements for LinkedEnrollment Enroll?
      answer: |
        The device must be Microsoft Entra joined, because Windows authenticates with the Entra device token. Supported builds are Windows 11, version 22H2 and later, Windows 11, version 21H2 with KB5016691, and Windows 10, versions 20H2 through 21H2 with KB5018482.

        `LinkedEnrollment/DiscoveryEndpoint` must be set first, or the command fails with `ERROR_FILE_NOT_FOUND (0x80070002)`. Microsoft currently lists `DiscoveryEndpoint` for Windows Insider Preview builds.
    - question: Does Fleet use linked enrollment?
      answer: |
        No. Fleet manages Windows over OMA-DM and doesn't run a declared configuration service, so there's no Fleet endpoint for a linked enrollment to connect to.

        To enforce Windows settings with Fleet, add CSP configuration profiles in **Controls > OS settings** or with GitOps. Fleet tracks each profile's status per host and resends ones that fail. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I run LinkedEnrollment Enroll with Fleet?
      answer: |
        Set `DiscoveryEndpoint` first with a custom Windows profile, because Fleet's custom commands only accept `<Exec>`. Then replace `{ProviderID}` with `Fleet` (Fleet's provider ID), save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=linked-enroll.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        This only helps if another service provides the declared configuration endpoint.
    - question: How do I check whether the linked enrollment succeeded?
      answer: |
        Read `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/EnrollStatus`. `2` means in progress, `3` failed, and `4` succeeded.

        On failure, `LinkedEnrollment/LastError` returns the HRESULT. You can read both device-scope nodes with osquery's `mdm_bridge` table in a Fleet report.
    - question: Why did LinkedEnrollment Enroll fail?
      answer: |
        `0x80070002` means `DiscoveryEndpoint` isn't set. A `404` command status usually means the build doesn't support linked enrollment or `{ProviderID}` doesn't match the device's enrollment. Problems authenticating with the Entra device token, for example on a device that isn't Entra joined, show up in `LastError`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>307799ee-7535-472d-a06e-a846d8e6f214</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Unenroll (linked enrollment)
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridlinkedenrollmentunenroll
  description: Triggers the device to unenroll from its linked MDM enrollment
  supportedDeviceTypes:
    - Windows 10.0.22621
    - Windows 10.0.22000.918
    - Windows 10.0.19044.2193
    - Windows 10.0.19043.2193
    - Windows 10.0.19042.2193
  faq:
    - question: What does the LinkedEnrollment Unenroll command do?
      answer: |
        It removes a device's linked Windows declared configuration enrollment. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Unenroll`.

        Unenrollment is silent. Windows rolls back every setting and resource applied through declared configuration.
    - question: Does LinkedEnrollment Unenroll remove the device from MDM?
      answer: |
        No. It removes only the linked declared configuration channel. The primary OMA-DM enrollment stays in place and keeps checking in.

        To remove the primary enrollment, use `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Unenroll`.
    - question: What happens to settings applied through the linked enrollment?
      answer: |
        Windows rolls them back. Anything set through declared configuration is reverted when the linked enrollment is removed.

        Settings applied over the primary enrollment, such as CSP configuration profiles, aren't affected.
    - question: When would I use LinkedEnrollment Unenroll?
      answer: |
        Rarely. Use it when retiring a declared configuration deployment, when switching to an MDM that doesn't use one, or to reset a linked enrollment that's stuck before enrolling again.
    - question: Does Fleet use LinkedEnrollment Unenroll?
      answer: |
        No. Fleet doesn't create linked enrollments. If a host was migrated to Fleet from an MDM that used one, you can send this command to clean it up. Replace `{ProviderID}` with the provider ID of the primary enrollment (`Fleet` for Fleet), save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=linked-unenroll.xml`.

        You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. The host must be enrolled in Fleet's MDM.
    - question: How do I confirm the linked enrollment was removed?
      answer: |
        Read `LinkedEnrollment/EnrollStatus`. `6` means unenrollment is in progress, `7` failed, and `8` succeeded. On failure, `LinkedEnrollment/LastError` returns the HRESULT.

        The command status only shows whether Windows accepted the request.
    - question: Which Windows versions support LinkedEnrollment Unenroll?
      answer: |
        Windows 11, version 22H2 and later, Windows 11, version 21H2 with KB5016691 (build 22000.918), and Windows 10, versions 20H2, 21H1, and 21H2 with KB5018482 (build 1904x.2193). On older builds the node doesn't exist and the command returns `404`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>48e557bd-c055-4239-bb13-d24fb5e0c526</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Unenroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: InitiateRecovery
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridrecoveryinitiaterecovery
  description: Initiates a device recovery action. The server can specify prerequisites that must be met before the recovery action proceeds.
  supportedDeviceTypes:
    - Windows 10.0.22621
    - Windows 10.0.22000.1165
  faq:
    - question: What does the DMClient InitiateRecovery command do?
      answer: |
        It starts MDM recovery, which re-establishes the device's MDM certificate and keys with the server. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Recovery/InitiateRecovery`.

        The `<Data>` value sets prerequisites. `0` starts recovery right away. `1` starts it only if the MDM keys aren't already in the TPM, a TPM is available, the Entra ID keys are TPM protected, and the TPM is ready for attestation.
    - question: When is InitiateRecovery used?
      answer: |
        Rarely. It's for devices whose MDM certificate or keys are in a bad state, or to move MDM keys into the TPM with data value `1`. Most devices never need it, and the MDM server must support the recovery flow.
    - question: What's the difference between InitiateRecovery and AllowRecovery?
      answer: |
        `InitiateRecovery` is a one-time `<Exec>` that starts recovery now. `Recovery/AllowRecovery` is a setting. When it's `1`, Windows starts recovery on its own whenever it detects a problem with the MDM certificate. It defaults to `0` (off).
    - question: What are the requirements for InitiateRecovery?
      answer: |
        Windows 11, version 22H2 or later, or Windows 11, version 21H2 with KB5018483 (build 22000.1165). Windows 10 isn't supported. With data value `1`, the device also needs a TPM that's ready for attestation and Entra ID keys protected by the TPM.
    - question: Does Fleet use InitiateRecovery?
      answer: |
        No, and Fleet doesn't document support for MDM recovery requests. Fleet's enrollment service doesn't complete certificate renewals yet, so test on one host before sending this to Fleet-enrolled devices.

        Fleet authenticates Windows check-ins with credentials it provisions at enrollment, not with the MDM certificate, so a certificate problem rarely needs recovery. If a host loses its Fleet enrollment and fleetd is installed, Fleet enrolls it again automatically when [automatic Windows MDM enrollment](https://fleetdm.com/guides/windows-mdm-setup) is on.
    - question: How do I run InitiateRecovery with Fleet?
      answer: |
        Replace `{ProviderID}` with `Fleet`, set `<Data>` to `0` or `1` with the `int` format, and save only the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=recovery.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: How do I check the result of InitiateRecovery?
      answer: |
        Read `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Recovery/RecoveryStatus`. `0` means no recovery has run, `1` in progress, and `2` finished successfully.

        `3` through `8` explain a failure: no TPM, Entra ID keys not TPM protected, MDM keys already TPM protected, TPM not ready for attestation, the client couldn't authenticate to the server, or the server rejected the request.
    - question: Will InitiateRecovery interrupt the end user?
      answer: |
        No. Recovery runs in the background without prompting the user. The device may miss check-ins while it re-establishes credentials, so commands queued during that time can be delayed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>cc6ccbd3-3679-44c0-976a-581e8946a96a</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Recovery/InitiateRecovery</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">int</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>0</Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Unenroll (provider)
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridunenroll
  description: Triggers the device to unenroll from a specific MDM provider. The Provider ID of the management server must be specified in the <Data> element of the command.
  supportedDeviceTypes:
    - Windows 10.0.10240
  faq:
    - question: What does the DMClient Provider Unenroll command do?
      answer: |
        It unenrolls the device from an MDM server. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Unenroll`, where `{ProviderID}` names the enrollment.

        This is the current form Microsoft documents. The older `./Device/Vendor/MSFT/DMClient/Unenroll` path is kept for backward compatibility.
    - question: What happens to a Windows device when it's unenrolled from MDM?
      answer: |
        Windows stops enforcing the MDM's policies and removes the certificates it configured, its enrollment settings, and its scheduled check-in task. Line-of-business apps tied to the enterprise app token are removed too. Files, user accounts, and other apps stay.

        If the device was enrolled through Microsoft Entra join, remote unenrollment also removes the Entra association. Make sure the device has a local admin account that isn't in Entra ID first, or nobody will have admin rights afterward.
    - question: Can end users unenroll a Windows device from MDM?
      answer: |
        Sometimes. Users can disconnect in **Settings > Accounts > Access work or school** if the enrollment was created there or with bulk enrollment. If it came from Microsoft Entra join, the **Disconnect** button is unavailable, and the user would have to remove the device from Entra ID.
    - question: Does Fleet use DMClient Unenroll to turn off Windows MDM or migrate hosts?
      answer: |
        No. For [automatic Windows MDM migration](https://fleetdm.com/guides/windows-mdm-setup#automatic-windows-mdm-migration), Fleet's agent (fleetd) unenrolls the host from the old MDM locally, then enrolls it in Fleet. When you turn Windows MDM off in Fleet, fleetd unenrolls hosts from Fleet the same way.

        To turn off MDM for specific hosts, Fleet's guide uses a script that removes the enrollment and fleetd. To leave another MDM, use migration rather than sending this command.
    - question: How do I run Provider Unenroll with Fleet?
      answer: |
        Replace `{ProviderID}` with `Fleet` and fix the double slash in the example so the path ends in `/Fleet/Unenroll`. Save only the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=unenroll.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        If fleetd is still installed and automatic Windows MDM enrollment is on, Fleet enrolls the host again. To keep it out, use Fleet's documented turn-off steps instead.
    - question: How do I confirm the device unenrolled?
      answer: |
        Don't wait for a command result. Microsoft says the server doesn't get a response. Windows ends the session and sends an unenrollment alert instead, and Fleet removes the host's Windows MDM enrollment when it receives that alert.

        Check the host's MDM status in Fleet after fleetd next reports in. On the device, the enrollment disappears from **Settings > Accounts > Access work or school**.
    - question: Why did Provider Unenroll fail?
      answer: |
        A `404` status usually means `{ProviderID}` doesn't match an enrollment on the device, or the LocURI is malformed, such as the double slash in the example. A `405` means the verb wasn't `<Exec>`.

        Microsoft notes that `<Data>` is ignored on current Windows versions. The provider ID in the LocURI selects the enrollment.
    - question: Can I undo an MDM unenrollment?
      answer: |
        Not from the MDM, since it can no longer reach the device. The device has to enroll again, either automatically through fleetd when Fleet's automatic Windows MDM enrollment is on, by the end user, or through a provisioning flow such as Autopilot.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>e43a2271-7661-4587-b452-df8880005fd8</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}//Unenroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Unenroll (device)
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceunenroll
  description: Triggers the device to permanently unenroll from its current MDM management server. The Provider ID of the management server must be specified in the <Data> element of the command.
  supportedDeviceTypes:
    - Windows 10.0.10240
  faq:
    - question: What does the DMClient Unenroll command do?
      answer: |
        It permanently unenrolls the device from an MDM server. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Unenroll`, with the server's provider ID in the `<Data>` element.

        Microsoft keeps this path for backward compatibility. The current form is `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Unenroll`.
    - question: What's the difference between DMClient Unenroll and Provider Unenroll?
      answer: |
        They do the same job. `DMClient/Unenroll` is the older path and names the provider in `<Data>`. `DMClient/Provider/{ProviderID}/Unenroll` names it in the LocURI, and Microsoft notes `<Data>` is ignored there on current Windows versions.

        Use the provider-specific form for new work. Keep this one only for scripts or tools that already rely on it.
    - question: Does DMClient Unenroll wipe the device?
      answer: |
        No. It removes the MDM enrollment, the certificates and policies the MDM applied, and line-of-business apps tied to the enterprise app token. Files, user accounts, and other apps stay.

        To erase a device, use the RemoteWipe CSP. Fleet exposes it as **Actions > Wipe** on the host details page in Fleet Premium.
    - question: What should I check before unenrolling an Entra-joined device?
      answer: |
        That it has a local admin account outside Entra ID. Microsoft says remotely unenrolling a device that enrolled through Entra join also removes its Entra association, which can leave the device with no admin and needing a reimage.
    - question: Does Fleet send DMClient Unenroll?
      answer: |
        No. Fleet's agent (fleetd) unenrolls hosts locally instead, both for [automatic Windows MDM migration](https://fleetdm.com/guides/windows-mdm-setup#automatic-windows-mdm-migration) from another MDM and when you turn Windows MDM off in Fleet. To turn off MDM for specific hosts, Fleet's guide uses a script that removes the enrollment and fleetd.
    - question: How do I run DMClient Unenroll with Fleet?
      answer: |
        Put `Fleet` in `<Data>`, set the format to `chr`, and save only the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=unenroll.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        If fleetd is still installed and automatic Windows MDM enrollment is on, Fleet enrolls the host again on its next check-in.
    - question: How do I confirm the device unenrolled?
      answer: |
        Windows ends the session without a command response and sends an unenrollment alert, which Fleet uses to remove the host's Windows MDM enrollment. Check the host's MDM status in Fleet after fleetd reports in, or look under **Settings > Accounts > Access work or school** on the device.
    - question: Why did DMClient Unenroll fail?
      answer: |
        A `404` status usually means no enrollment matches the provider ID in `<Data>`, or the path is wrong. Check that `<Data>` holds the exact provider ID and the format is `chr`.

        If it worked, you won't see an error, and usually not a success status either, because the connection ends.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>b1eae449-50af-4cb1-a680-a7ef8f583646</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Unenroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: OfflineScan
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#offlinescan
  description: Starts a Microsoft Defender Offline scan on the device. After the next reboot, the device will start in Microsoft Defender Offline mode to perform a scan before Windows loads, helping detect and remove persistent or hard-to-find malware.
  supportedDeviceTypes:
    - Windows 10.0.17134
  faq:
    - question: What does the Defender OfflineScan MDM command do?
      answer: |
        It schedules a Microsoft Defender Offline scan. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/OfflineScan`.

        On the next restart, the device boots into Microsoft Defender Offline and scans before Windows loads. That helps find rootkits and other malware that hide while Windows is running.
    - question: When should I use a Defender offline scan?
      answer: |
        When you suspect persistent malware that a normal scan can't remove, or when Defender asks for one. `./Device/Vendor/MSFT/Defender/Health/ComputerState` returns `8` when an offline scan is pending.

        It's an incident response tool, not routine maintenance.
    - question: Does OfflineScan restart the device?
      answer: |
        No. The scan starts on the next restart, and Microsoft marks the node's reboot behavior as server initiated. Restart the device yourself, for example with an `<Exec>` on `./Device/Vendor/MSFT/Reboot/RebootNow`, or let the end user restart.

        The device isn't usable while the offline scan runs, which typically takes about 15 minutes. Warn the end user first.
    - question: How do I start a Defender offline scan without MDM?
      answer: |
        Run `Start-MpWDOScan` in an elevated PowerShell session. Users can also start one from **Windows Security > Virus & threat protection > Scan options > Microsoft Defender Offline scan**. Either way, the device restarts into the offline scan.
    - question: How do I run OfflineScan with Fleet?
      answer: |
        Save only the `<Exec>` element (drop the `<syncml>` and `<syncbody>` wrappers) and run `fleetctl mdm run-command --hosts=<hostname> --payload=offlinescan.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's available in Fleet Free and Fleet Premium.

        Fleet doesn't send Defender commands automatically. You can also run `Start-MpWDOScan` as a PowerShell script from **Actions > Run script** on the host details page, which shows its output in Fleet.
    - question: How do I know the offline scan ran?
      answer: |
        A `200` status in `fleetctl get mdm-command-results --id=<command-uuid>` means the scan is scheduled, not finished.

        After the restart, check **Protection history** in Windows Security, or read Defender's `Health` nodes, such as `ComputerState`, which should no longer report `8`. You can read them across hosts with osquery's `mdm_bridge` table in a Fleet report.
    - question: Why did OfflineScan fail?
      answer: |
        A `404` status usually means the device runs a Windows version older than 1803. A `405` means the verb wasn't `<Exec>`.

        A failure on a supported version often means Microsoft Defender Antivirus isn't the active antivirus, for example when a third-party product has put it in passive mode or turned it off.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>0370d798-9a85-4dee-a870-176146513415</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/OfflineScan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RollbackEngine
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#rollbackengine
  description: Rolls back the Microsoft Defender antimalware engine to its last known good version on the device.
  supportedDeviceTypes:
    - Windows 10.0.17134
  faq:
    - question: What does the Defender RollbackEngine command do?
      answer: |
        It rolls Microsoft Defender's antimalware engine back to its last known good saved version. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/RollbackEngine`.

        Only the engine changes. Security intelligence (signatures) and the Defender platform stay on their current versions.
    - question: What's the difference between the Defender engine, platform, and security intelligence?
      answer: |
        Security intelligence is the signature data, updated several times a day. The engine is the scanning component that uses it, updated monthly. The platform is the Defender service and its binaries, also updated monthly.

        Each has its own rollback: RollbackEngine for the engine, RollbackPlatform for the platform, and `MpCmdRun.exe -RemoveDefinitions` for signatures.
    - question: When would I roll back the Defender engine?
      answer: |
        When a new engine version causes a known problem, such as false positives, high CPU, or app compatibility issues, and you need the earlier version while Microsoft fixes it. Try it on a few devices first.
    - question: How do I roll back the Defender engine without MDM?
      answer: |
        Run `MpCmdRun.exe -RemoveDefinitions -Engine` in an elevated prompt. It restores the previously installed engine. `MpCmdRun.exe` is in `%ProgramData%\Microsoft\Windows Defender\Platform\<version>` or `%ProgramFiles%\Windows Defender`.
    - question: How do I run RollbackEngine with Fleet?
      answer: |
        Save only the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=rollback-engine.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Fleet doesn't send Defender commands automatically.

        To roll back many hosts and see output for each, you can instead run `MpCmdRun.exe -RemoveDefinitions -Engine` as a PowerShell script from **Controls > Scripts**.
    - question: How do I verify the Defender engine was rolled back?
      answer: |
        Read `./Device/Vendor/MSFT/Defender/Health/EngineVersion` and confirm it shows the earlier version, or run `Get-MpComputerStatus` on the device and check `AMEngineVersion`.

        To compare versions across hosts, use osquery's `mdm_bridge` table in a Fleet report. Microsoft marks the node's reboot behavior as server initiated, so restart if the version doesn't change.
    - question: Will the Defender engine update again after a rollback?
      answer: |
        Yes. Defender installs newer engine versions through its normal updates, so a rollback is temporary. To delay future engine updates on sensitive devices, put them in a later update channel with Defender's `Configuration/DeploymentChannel` setting in a configuration profile.
    - question: Why did RollbackEngine fail?
      answer: |
        A `404` status means the Windows version is older than 1803. Other failures usually mean there's no saved earlier engine to roll back to, or Microsoft Defender Antivirus isn't the active antivirus.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d8d49362-a2df-46b6-b42b-dab967f822f8</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/RollbackEngine</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RollbackPlatform
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#rollbackplatform
  description: Rolls back Microsoft Defender to its last known good installation location on the device.
  supportedDeviceTypes:
    - Windows 10.0.17134
  faq:
    - question: What does the Defender RollbackPlatform command do?
      answer: |
        It rolls Microsoft Defender back to its last known good installation location. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/RollbackPlatform`.

        The platform is the Defender antimalware service and its binaries. Rolling it back doesn't change the engine or security intelligence.
    - question: When would I roll back the Defender platform?
      answer: |
        When a Defender platform update causes a problem, such as the service crashing, a performance regression, or a conflict with another app, and you need the earlier version while you investigate. If the problem is with scanning results, the engine is a more likely cause, so consider RollbackEngine first.
    - question: How do I roll back the Defender platform without MDM?
      answer: |
        Run `MpCmdRun.exe -RevertPlatform` in an elevated prompt to go back to the previously installed platform version. `MpCmdRun.exe -ResetPlatform` instead resets the binaries to the version that shipped with Windows in `%ProgramFiles%\Windows Defender`.
    - question: Does RollbackPlatform need a restart?
      answer: |
        Plan for one. Microsoft marks the node's reboot behavior as server initiated, which means the MDM is expected to restart the device. Send an `<Exec>` on `./Device/Vendor/MSFT/Reboot/RebootNow`, or let the end user restart.
    - question: How do I run RollbackPlatform with Fleet?
      answer: |
        Save only the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=rollback-platform.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Fleet doesn't send Defender commands automatically.

        You can also run `MpCmdRun.exe -RevertPlatform` as a PowerShell script from **Controls > Scripts**, which shows the output for each host in Fleet. Try it on one host before a wider rollout.
    - question: How do I verify the Defender platform was rolled back?
      answer: |
        Read `./Device/Vendor/MSFT/Defender/Health/DefenderVersion` after the restart and confirm the earlier version, or run `Get-MpComputerStatus` and check `AMProductVersion`. To compare versions across hosts, use osquery's `mdm_bridge` table in a Fleet report.
    - question: Will Defender update its platform again after a rollback?
      answer: |
        Yes. Defender keeps receiving platform updates, so the rollback lasts until the next one. To get updates later in the monthly rollout, set Defender's `Configuration/DeploymentChannel` in a configuration profile.
    - question: Why did RollbackPlatform fail?
      answer: |
        A `404` status means the device runs a Windows version older than 1803. Other failures usually mean there's no earlier platform installation to roll back to, or Microsoft Defender Antivirus isn't the active antivirus.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>25b353ea-3b5a-4da8-a9a0-3aa602cf08a3</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/RollbackPlatform</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Scan
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#scan
  description: Starts a Windows Defender scan on the device
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the Defender Scan MDM command do?
      answer: |
        It starts a Microsoft Defender Antivirus scan. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/Scan`.

        Set `<Data>` to `1` for a quick scan or `2` for a full scan. The example payload has no `<Data>` element, so add one before you send it.
    - question: What's the difference between a Defender quick scan and full scan?
      answer: |
        A quick scan checks the places malware most often runs from, such as startup locations and running processes, and usually finishes in minutes. A full scan checks every file on fixed drives and can take hours, with noticeable CPU and disk use.

        Start with a quick scan. Use a full scan after a detection, or when Defender reports one is required.
    - question: How do I run a Defender scan without MDM?
      answer: |
        Run `Start-MpScan -ScanType QuickScan` (or `FullScan`) in PowerShell, or `MpCmdRun.exe -Scan -ScanType 1` (quick) or `2` (full). Both need an elevated session. Users can also start a scan in **Windows Security > Virus & threat protection**.
    - question: Should I run Defender scans with an MDM command or a script?
      answer: |
        Either works. The MDM command only tells you Windows started the scan. A PowerShell script like `Start-MpScan` waits for the scan to finish, so its exit code and output show the result.

        In Fleet, run the script from **Actions > Run script** on the host details page, or from **Controls > Scripts** for many hosts. To scan automatically, attach the script to a policy, for example one that fails when signatures are out of date. See the [scripts guide](https://fleetdm.com/guides/scripts).
    - question: How do I run a Defender quick scan with Fleet?
      answer: |
        Add `<Data>1</Data>` (or `2` for a full scan) inside the `<Item>`, keep the format as `chr`, and save only the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=scan.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Pass a comma-separated list to `--hosts` to target several hosts. Fleet doesn't start Defender scans on its own.
    - question: How do I know the Defender scan finished?
      answer: |
        A `200` command status only means the scan started. To confirm it finished, read `Health/QuickScanTime` or `Health/FullScanTime`, and `Health/ComputerState` for pending actions (`0` means clean).

        You can read those nodes across hosts with osquery's `mdm_bridge` table in a Fleet report or policy.
    - question: Why did the Defender Scan command fail?
      answer: |
        Usually because `<Data>` is missing or isn't `1` or `2`. A `405` status means the verb wasn't `<Exec>`.

        On a correct payload, a failure usually means Microsoft Defender Antivirus isn't running, or it's in passive mode because another antivirus is primary.
    - question: Will the end user notice a Defender scan?
      answer: |
        Possibly. A quick scan is light. A full scan can slow the device while it runs. Windows Security shows scan activity, and any detections appear as notifications and in **Protection history**.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>9326cc3a-8960-4e7a-b46f-c414e871ca5b</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/Scan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpdateSignature
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#updatesignature
  description: Performs a Windows Defender signature update on the device.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the Defender UpdateSignature MDM command do?
      answer: |
        It tells Microsoft Defender Antivirus to check for and install the latest security intelligence (signature) update now. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/UpdateSignature`.

        Defender downloads from its configured update sources, such as Windows Update, Microsoft's malware protection center, or an internal file share.
    - question: When should I force a Defender signature update?
      answer: |
        Before an on-demand scan, during an outbreak when Microsoft has released new detections, or on a device that reports out-of-date signatures. Defender checks for updates on its own schedule, so routine use isn't needed.
    - question: How do I update Defender signatures without MDM?
      answer: |
        Run `Update-MpSignature` in PowerShell, or `MpCmdRun.exe -SignatureUpdate` in an elevated prompt. Users can also select **Check for updates** under **Windows Security > Virus & threat protection > Protection updates**.
    - question: Does UpdateSignature also update the Defender engine and platform?
      answer: |
        Not reliably. It targets security intelligence. The engine and platform follow their own monthly update channels, so check `Health/EngineVersion` and `Health/DefenderVersion` separately if you need them current.
    - question: How do I run UpdateSignature with Fleet?
      answer: |
        Save only the `<Exec>` element (drop the `<syncml>` and `<syncbody>` wrappers) and run `fleetctl mdm run-command --hosts=<hostname> --payload=update-signature.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's available in Fleet Free and Fleet Premium.

        Fleet doesn't send Defender commands automatically. To update hosts only when needed, create a policy that fails when signatures are out of date and attach an `Update-MpSignature` script as its automation.
    - question: How do I confirm Defender signatures updated?
      answer: |
        A `200` command status means the update started. Then read `Health/SignatureVersion` for the new version and `Health/SignatureOutOfDate`, which should be `false`.

        To find every out-of-date host, write a Fleet policy that reads `SignatureOutOfDate` with osquery's `mdm_bridge` table.
    - question: Why did UpdateSignature fail?
      answer: |
        Usually Defender couldn't reach its update source, such as Windows Update or a configured file share, because of a proxy, firewall, or offline device. It also fails when Microsoft Defender Antivirus isn't the active antivirus.

        Run `MpCmdRun.exe -SignatureUpdate` on the device to see the specific error.
    - question: Can I make Defender update signatures more often?
      answer: |
        Yes, with a setting instead of repeated commands. The Policy CSP's `Defender/SignatureUpdateInterval` sets how many hours Defender waits between checks. Deliver it in a configuration profile, which Fleet keeps enforced through **Controls > OS settings**. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>034c6f94-db50-4ec1-87f5-71900cb730a2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/UpdateSignature</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: MdmConfiguration
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#devicestatedatamdmconfiguration
  description: Triggers a snapshot of the device’s management state data, capturing the current MDM configuration for diagnostic purposes.
  supportedDeviceTypes:
    - Windows 10.0.14393
  faq:
    - question: What does the DiagnosticLog MdmConfiguration command do?
      answer: |
        It tells Windows to take a snapshot of the device's MDM state data. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/DeviceStateData/MdmConfiguration` with `<Data>SNAP</Data>` and format `chr`.

        It's a troubleshooting tool. The snapshot records the management configuration Windows has applied, so you can compare it with what your MDM thinks it sent. It requires Windows 10, version 1607 or later.
    - question: Where does the MdmConfiguration snapshot go?
      answer: |
        It stays on the device. The command only creates the snapshot. Microsoft documents pulling it back to the MDM server with the DiagnosticLog CSP's `FileDownload` node, which reads the file in blocks through a series of `<Get>` and `<Replace>` operations.

        Fleet custom commands accept only a single `<Exec>`, so Fleet can't run that download sequence. To get MDM diagnostics off a host with Fleet, use one of the alternatives on this page.
    - question: How do I collect MDM diagnostics from a Windows device without an MDM command?
      answer: |
        Run `mdmdiagnosticstool.exe`. Microsoft's example is `mdmdiagnosticstool.exe -area "DeviceEnrollment;DeviceProvisioning;Autopilot" -zip "c:\users\public\documents\MDMDiagReport.zip"`. The zip includes an HTML summary of MDM configuration and policies, a detailed XML report, registry dumps, and MDM event logs.

        End users can create the same report in **Settings > Accounts > Access work or school**. They select the account, select **Info**, then **Create report**. The files land in `C:\Users\Public\Documents\MDMDiagnostics`.
    - question: Which Fleet features use MdmConfiguration?
      answer: |
        None. Fleet tracks each Windows configuration profile itself and shows whether it's Verified, Verifying, Pending, or Failed in **Host details > OS settings**. That usually answers "did my setting apply?" without a device snapshot.
    - question: How do I run MdmConfiguration with Fleet?
      answer: |
        Save only the `<Exec>` element from the example, without the `<syncml>` and `<syncbody>` wrappers, because Fleet accepts a single `<Exec>` with one `<Item>`. Keep `<Data>SNAP</Data>`. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=mdm-snap.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Because Fleet can't download the snapshot, this is mostly useful when someone will collect it locally afterward.
    - question: What's the easiest way to get MDM diagnostics from a remote Windows host in Fleet?
      answer: |
        Run a PowerShell script from **Actions > Run script** that runs `mdmdiagnosticstool.exe` and prints the details you need, such as recent errors from the DeviceManagement-Enterprise-Diagnostics-Provider Admin event log. Script output shows up in Fleet. See the [scripts guide](https://fleetdm.com/guides/scripts).

        For the full zip, have the script write it somewhere you can retrieve it, or use the DiagnosticLog `ArchiveDefinition` command with your own storage URL.
    - question: How do I know MdmConfiguration worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` status means Windows took the snapshot. A `404` means the node wasn't found, usually because the LocURI has a typo or the device runs a Windows version older than 1607.
    - question: What's the difference between MdmConfiguration and ArchiveDefinition?
      answer: |
        `MdmConfiguration` only snapshots MDM state on the device, and the file has to be pulled back with `FileDownload`. `ArchiveDefinition` gathers a set of logs, registry keys, and command output into a zip and uploads it to storage you provide. For remote collection, `ArchiveDefinition` is the more practical of the two.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>86e88d1e-9474-4098-91af-ec28d066b072</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/DeviceStateData/MdmConfiguration</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>SNAP</Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ArchiveDefinition
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#diagnosticarchivearchivedefinition
  description: Definition and collection point for diagnostic archives on the device.
  supportedDeviceTypes:
    - Windows 10.0.18362
  faq:
    - question: What does the DiagnosticLog ArchiveDefinition command do?
      answer: |
        It tells Windows to gather diagnostic data, zip it, and upload it to a URL you provide. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/DiagnosticArchive/ArchiveDefinition`, with a `Collection` XML snippet as a string in `<Data>`.

        The `Collection` lists an `ID`, a `SasUrl`, and directives such as `RegistryKey`, `FoldersFiles`, `Events`, and `Command`. It requires Windows 10, version 1903 or later.
    - question: What can ArchiveDefinition collect?
      answer: |
        Registry exports, event logs, log files, and output from a fixed list of built-in tools. Microsoft limits it to protect user data:

        - `RegistryKey` only accepts paths under HKLM and HKCR.
        - `FoldersFiles` only reads from roots like `%PROGRAMDATA%`, `%PROGRAMFILES%`, `%WINDIR%`, and `%TEMP%`, and only files such as `.log`, `.txt`, `.etl`, `.evtx`, and `.zip`.
        - `Command` only runs allowed tools, including `ipconfig.exe`, `gpresult.exe`, `dsregcmd.exe`, `MdmDiagnosticsTool.exe`, and `mpcmdrun.exe`.

        It isn't a general scripting tool.
    - question: What do I need before running ArchiveDefinition?
      answer: |
        Storage that accepts an HTTP PUT from the device, such as an Azure Blob Storage container with a time-limited shared access signature (SAS) URL that grants write access. That URL goes in `SasUrl`.

        You also need a new `ID` for every request. Windows ignores repeat requests with an `ID` it has already seen.
    - question: Which Fleet features use ArchiveDefinition?
      answer: |
        None. Fleet doesn't send this command and doesn't provide upload storage for it. You can send it as a custom MDM command with your own storage URL.
    - question: How do I run ArchiveDefinition with Fleet?
      answer: |
        The example has no `<Data>` element, so add one with your `Collection` XML. Escape it or wrap it in CDATA, since the format is `chr`. Save only the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=archive.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Fleet keeps the command payload, including the SAS URL, in its command history. Use a write-only SAS URL with a short expiry.
    - question: How do I know the diagnostic archive uploaded?
      answer: |
        Check your storage for a file named `DiagLogs-{ComputerName}-YYYYMMDDTHHMMSSZ.zip`. A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` only means Windows accepted the request. The upload happens afterward, outside the MDM session.

        On the device, the `DiagnosticArchive/ArchiveResults` node reports each directive's result as an HRESULT, so you can see which items failed.
    - question: Why is something missing from my ArchiveDefinition zip?
      answer: |
        Usually because a directive fell outside Microsoft's limits, such as a registry path under HKCU, a file extension that isn't allowed, or a command that isn't on the allowed list. Those items are skipped and get an error HRESULT in `ArchiveResults`.

        If nothing uploaded, check that the SAS URL hasn't expired, grants write access, and is reachable from the device.
    - question: Is there a simpler way to collect logs from Windows hosts with Fleet?
      answer: |
        Often, yes. If you only need specific details, run a PowerShell script from **Actions > Run script** and read its output in Fleet. See the [scripts guide](https://fleetdm.com/guides/scripts). To query event logs, registry values, or files across many hosts, use a Fleet report with osquery tables like `windows_eventlog` and `registry`.

        Use `ArchiveDefinition` when you need full log bundles, like `.etl` traces or `.evtx` files, for a vendor or Microsoft support.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>91bde209-058a-4d1a-9805-702aeab4976a</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/DiagnosticArchive/ArchiveDefinition</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Export
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#etwlogchannelschannelnameexport
  description: Triggers exporting events from the associated Windows event channel into a log file with the standard .evtx extension.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the DiagnosticLog Export command do?
      answer: |
        It exports the events from one Windows event log channel into an `.evtx` file on the device. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/EtwLog/Channels/{ChannelName}/Export`.

        `.evtx` is the standard Windows event log format, so you can open the file in Event Viewer. You can set an XPath filter first with the channel's `Filter` node to export only matching events.
    - question: Why is there no channel name in the example LocURI?
      answer: |
        The example omits it. Insert the full channel name between `Channels/` and `/Export`, URL-encoded. Microsoft warns that an unencoded name is read as a different path. For example, `Microsoft-Windows-DeviceManagement-Enterprise-Diagnostics-Provider/Admin` becomes `Microsoft-Windows-DeviceManagement-Enterprise-Diagnostics-Provider%2FAdmin`.
    - question: Where does the exported .evtx file go?
      answer: |
        It stays on the device. Microsoft documents pulling it back with the DiagnosticLog CSP's `FileDownload` node, which reads the file in blocks through repeated `<Get>` and `<Replace>` operations. Fleet custom commands accept only a single `<Exec>`, so Fleet can't run that sequence.
    - question: How do I export a Windows event log without MDM?
      answer: |
        Run `wevtutil epl <channel> <path>.evtx` in an elevated prompt, or right-click the log in Event Viewer and select **Save all events as**. To read events instead of saving them, use `Get-WinEvent -LogName <channel>` in PowerShell.
    - question: Which Fleet features use DiagnosticLog Export?
      answer: |
        None. Fleet doesn't send this command. You can send it as a custom MDM command.
    - question: How do I run DiagnosticLog Export with Fleet?
      answer: |
        Put the encoded channel name in the LocURI, save only the `<Exec>` element (Fleet accepts a single `<Exec>` with one `<Item>`), and run `fleetctl mdm run-command --hosts=<hostname> --payload=export.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Microsoft's CSP lets the server add channel nodes with `<Add>`, which a custom command can't do. If you get `404`, check the channel name and encoding first.
    - question: How do I get Windows event logs from hosts with Fleet instead?
      answer: |
        Use a Fleet report on osquery's `windows_eventlog` table to query a channel on demand, for example filtered by event ID. For one host, a PowerShell script from **Actions > Run script** that runs `Get-WinEvent` returns matching events in Fleet. See the [scripts guide](https://fleetdm.com/guides/scripts).

        To capture the whole channel as a file, run `wevtutil epl` in a script, or collect it with the `ArchiveDefinition` command's `Events` directive.
    - question: What errors can DiagnosticLog Export return?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows Windows' status code. `200` means the export ran. `404` usually means the channel name is missing, misspelled, or not URL-encoded. `500` means Windows couldn't export the channel.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>22ba5bc3-70cf-4742-94e4-c7c7658a64a2</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/EtwLog/Channels/Export</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: TraceControl
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#etwlogcollectorscollectornametracecontrol
  description: Triggers the start or stop of the associated trace session.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the DiagnosticLog TraceControl command do?
      answer: |
        It starts or stops an Event Tracing for Windows (ETW) session for a collector. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/EtwLog/Collectors/{CollectorName}/TraceControl`, with `<Data>START</Data>` or `<Data>STOP</Data>` and format `chr`.

        The example has no `<Data>` element, so add one. Starting a collector again overwrites its previous log file.
    - question: What has to be set up before TraceControl works?
      answer: |
        A collector with at least one provider. Microsoft's steps:

        - Add the collector at `EtwLog/Collectors/{CollectorName}`, optionally setting `TraceLogFileMode` and `LogFileSizeLimitMB`.
        - Add each ETW provider by GUID under `Collectors/{CollectorName}/Providers/{ProviderGUID}`.
        - Send `START`, reproduce the issue, then send `STOP`.

        Log file mode and size changes only apply the next time the session starts.
    - question: Which Fleet features use TraceControl?
      answer: |
        None. Fleet doesn't send this command.
    - question: How do I run TraceControl with Fleet?
      answer: |
        Replace `{CollectorName}`, add `<Data>START</Data>`, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=trace-start.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you). Send a second command with `STOP` when you're done.

        Fleet custom commands accept only `<Exec>`, so they can't create the collector and providers. Fleet's Windows configuration profiles accept `<Add>`, so one option is a profile that adds those nodes. Test it on one host first.
    - question: Where does the trace file go?
      answer: |
        Windows writes the `.etl` file on the device, under the collector's working folder. Microsoft documents pulling it back with the `FileDownload` node, which needs repeated `<Get>` and `<Replace>` operations that Fleet custom commands can't send.

        To retrieve it with Fleet, run a script that copies or uploads the file to storage you control.
    - question: Can I run an ETW trace without MDM?
      answer: |
        Yes. `logman` and the Windows Performance Recorder (`wpr.exe`) are built into Windows. For example, `logman start <name> -p <provider-guid> -o <path>.etl -ets` starts a trace and `logman stop <name> -ets` stops it.

        With Fleet, run those commands in a PowerShell script from **Actions > Run script**. That keeps setup, start, stop, and collection in one place. See the [scripts guide](https://fleetdm.com/guides/scripts).
    - question: How do I confirm the trace started?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows Windows' status code, and `200` means it accepted the command. On the device, `logman query -ets` lists running trace sessions. You can run it from a Fleet script and read the output in Fleet.
    - question: What errors can TraceControl return?
      answer: |
        A `404` usually means the collector doesn't exist yet or `{CollectorName}` is wrong. A `500` means Windows couldn't start or stop the session. Check that `<Data>` is exactly `START` or `STOP`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>a563bffc-2c4c-4f2f-a5e5-6545bab6ad95</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/EtwLog/Collectors/{CollectorName}/TraceControl</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: DownloadInstall (Device context)
  platform: windows
  category: EnterpriseDesktopAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisedesktopappmanagement-csp#devicemsiproductiddownloadinstall
  description: Executes the download and installation of an application. An optional <DownloadFromAad> tag in the <Enforcement> section of the XML (default 0) can be set to 1 to include the AAD user token when retrieving the download URL.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does DownloadInstall do in device context?
      answer: |
        It downloads an MSI and installs it for every user on the device. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall`, part of the EnterpriseDesktopAppManagement CSP.

        The `<Data>` holds an `MsiInstallJob` XML with one or more `ContentURL` download locations, the file's SHA-256 `FileHash`, and `Enforcement` settings such as the msiexec `CommandLine` (for example `/quiet`), `TimeOut`, `RetryCount`, and `RetryInterval`.
    - question: When should I use device context instead of user context?
      answer: |
        For per-machine MSIs, which is most enterprise software. Microsoft's guidance is that the MSI's package type decides where it installs. Per-machine MSIs (`ALLUSERS=1`) install per-device, so use `./Device/`. Per-user and dual-mode MSIs install per-user, so use `./User/`.

        For a dual-mode MSI that you want installed for everyone, pass `ALLUSERS=1` in `CommandLine`.
    - question: Which Fleet features use DownloadInstall?
      answer: |
        Installing fleetd. When a Windows host turns on MDM without fleetd installed, for example through Windows Autopilot or Microsoft Entra enrollment, Fleet sends `DownloadInstall` in device context to install the fleetd MSI. Fleet sends the required `<Add>` together with the `<Exec>`.

        Fleet doesn't use this CSP for other software. fleetd installs the packages you add to Fleet. See [Deploy software](https://fleetdm.com/guides/deploy-software-packages).
    - question: Can I send DownloadInstall as a custom command in Fleet?
      answer: |
        You can send it, but it's not a reliable way to install software. Microsoft requires an `<Add>` on the `{ProductID}` node before the `<Exec>`, and Fleet custom commands accept only a single `<Exec>` with one `<Item>`.

        To install MSIs with Fleet, add the package as a custom package or use a Fleet-maintained app (Fleet Premium). fleetd installs it, Fleet reports success or failure with the installer output, and you can make it self-service or install it automatically with a policy.
    - question: How do I format the DownloadInstall payload?
      answer: |
        Replace `{ProductID}` with the MSI product code, URL-encoding the braces as `%7B` and `%7D`. Add `<Data>` with the `MsiInstallJob`, keep format `xml`, and save only the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=install.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Every `ContentURL` must be reachable from the device, and `FileHash` must match the file exactly.
    - question: How do I know the MSI installed?
      answer: |
        Installs run in the background, so a `200` in `fleetctl get mdm-command-results --id=<command-uuid>` only means Windows accepted the job. Windows then reports progress in `MSI/{ProductID}/Status`. `70` is enforcement completed, `60` is enforcement failed, `30` is download failed, and `40` is download completed.

        `LastError` holds an HRESULT, often from msiexec. The app also appears in the host's software inventory in Fleet after the next refresh.
    - question: Why did DownloadInstall fail?
      answer: |
        Common causes:

        - The `{ProductID}` node wasn't added first.
        - The `MsiInstallJob` XML is malformed or the braces in `{ProductID}` aren't encoded.
        - The download URL isn't reachable or `FileHash` doesn't match (Status `30`).
        - msiexec failed (Status `60`). Check `LastError` and test the same `CommandLine` locally.
    - question: How do I uninstall an MSI installed with DownloadInstall?
      answer: |
        Microsoft documents sending a `<Delete>` on `./Device/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}`, which removes the node and uninstalls the app. Fleet custom commands can't send `<Delete>`.

        With Fleet, uninstall from **Host details > Software** if the app was added to Fleet, or run `msiexec /x {ProductCode} /quiet` in a script.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>02802f7e-1266-494a-b4b0-9878a122fafa</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: DownloadInstall (User context)
  platform: windows
  category: EnterpriseDesktopAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisedesktopappmanagement-csp#usermsiproductiddownloadinstall
  description: Executes the download and installation of an application. An optional <DownloadFromAad> tag in the <Enforcement> XML section (default 0) can be set to 1 to include the AAD user token when retrieving the download URL.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does DownloadInstall do in user context?
      answer: |
        It downloads an MSI and installs it for the user tied to the MDM session, not for everyone on the device. The command is an `<Exec>` on `./User/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall`.

        The `<Data>` carries the same `MsiInstallJob` XML as the device-context version. The `./User/` prefix is what changes the target.
    - question: When should I use user context for an MSI?
      answer: |
        For per-user and dual-mode MSIs that should install into one person's profile. Microsoft's guidance is that the package type wins. A per-machine MSI (`ALLUSERS=1`) installs per-device even if you target it to a user.

        You can check the package type with the MSI's `ALLUSERS` property. Empty means per-user, `1` means per-machine, and `2` with `MSIINSTALLPERUSER=1` means dual-mode.
    - question: What does DownloadFromAad do?
      answer: |
        Setting `<DownloadFromAad>1</DownloadFromAad>` in the `<Enforcement>` section tells Windows to include the user's Microsoft Entra ID (Azure AD) token when it downloads from `ContentURL`. The default is `0`. Use it only when your download server authenticates users with Entra ID. It was added in Windows 10, version 1703.
    - question: Why is my user-context install stuck?
      answer: |
        A `Status` of `48` means "pending user session." Windows is waiting for the target user to sign in. User-context commands need a user associated with the MDM session. If no user signs in, or the enrollment has no user context, the install doesn't run.
    - question: Which Fleet features use user-context DownloadInstall?
      answer: |
        None. Fleet only uses `DownloadInstall` in device context, to install fleetd. For other software, fleetd installs packages you add to Fleet. See [Deploy software](https://fleetdm.com/guides/deploy-software-packages).
    - question: How do I install a per-user MSI with Fleet?
      answer: |
        Fleet installs software packages as SYSTEM, so they work best with per-machine installers. If your MSI is dual-mode, add `ALLUSERS=1` to the install command so it installs for everyone. If the vendor offers a per-machine build, use that instead.

        A truly per-user MSI has to run as the signed-in user. That usually means the user installs it themselves, for example from a file share or download link you provide.
    - question: How do I run user-context DownloadInstall with Fleet?
      answer: |
        Replace `{ProductID}` with the URL-encoded product code, add your `MsiInstallJob` in `<Data>`, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-user.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Microsoft requires an `<Add>` on the node before the `<Exec>`, and Fleet custom commands can't include it, so expect this to be unreliable.
    - question: How do I check a per-user MSI install?
      answer: |
        Read `./User/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/Status`. `70` means completed, `48` means waiting for the user, and `60` means msiexec failed, with the HRESULT in `LastError`.

        Per-user installs are recorded in that user's registry hive, so check the host's software inventory in Fleet, or ask the user to confirm the app opens.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>bbb7ee46-9032-4020-b1f5-0252104ab3a8</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: HostedInstall (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappinstallationpackagefamilynamehostedinstall
  description: Installs an app package from a hosted location, such as a local drive, UNC path, or HTTPS source.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does HostedInstall do in device context?
      answer: |
        It provisions an app package (`.appx`, `.msix`, or a bundle) from a location you host, so every user on the device gets the app at their next sign-in. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/HostedInstall`.

        The source can be a local path, a UNC share, or an HTTPS URL. Windows installs it as the local system account, so that account needs access to the share.
    - question: What's the difference between device and user context HostedInstall?
      answer: |
        Device context (`./Device/`) provisions the app for all users of the device. User context (`./User/`) installs it only for the signed-in user.

        Microsoft notes two differences for device context. The `DeploymentOptions` attribute is only available in user context, and removing a provisioned app doesn't remove it from users who already have it.
    - question: What goes in the HostedInstall payload?
      answer: |
        Replace `{PackageFamilyName}` with the app's package family name, such as `Contoso.App_8wekyb3d8bbwe`. Add `<Data>` with an `Application` element whose `PackageUri` points to the package, for example `<Application PackageUri="\\server\share\app.msix" />`.

        If the app needs framework packages, list them in a `Dependencies` element, each with its own `PackageUri`.
    - question: What are the requirements for provisioning a sideloaded app?
      answer: |
        The package must be signed by a certificate the device trusts, in Trusted People or Trusted Root. Microsoft's guide also says to allow trusted app installs with the `ApplicationManagement/AllowAllTrustedApps` policy. With Fleet, you can deliver the policy and the signing certificate with Windows configuration profiles.

        For offline-licensed Store apps, deploy the license with `AddLicense` before the app.
    - question: Which Fleet features use HostedInstall?
      answer: |
        None. Fleet doesn't send this command, and custom package uploads don't accept `.msix`. To provision an MSIX or APPX for all users with Fleet, add a PowerShell script-only package that runs `Add-AppxProvisionedPackage -Online`. This works because Fleet runs Windows scripts as SYSTEM. See [Deploy software](https://fleetdm.com/guides/deploy-software-packages).
    - question: How do I run HostedInstall with Fleet?
      answer: |
        Add `<Data>` with your `Application` element, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=hostedinstall.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Microsoft's examples send an `<Add>` on the `{PackageFamilyName}` node first, so that Windows can remove the app cleanly when the device unenrolls. Fleet custom commands can't include that `<Add>`.
    - question: How do I know HostedInstall worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` only means Windows accepted the job. While it runs, `AppInstallation/{PackageFamilyName}/Status` is `1` (installing) or `2` (failed, with details in `LastError`). On success, Windows removes the node.

        To confirm provisioning, run `Get-AppxProvisionedPackage -Online` in a Fleet script and look for the package.
    - question: Why did HostedInstall fail?
      answer: |
        Usually one of these:

        - The signing certificate isn't trusted, or trusted app installs aren't allowed.
        - A dependency package is missing or unreachable.
        - The local system account can't reach the `PackageUri`, such as a share that only allows user accounts.

        The HRESULT in `LastError` tells you which. Windows app deployment errors often start with `0x80073CF`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ba628a02-12d5-48c4-9586-34fa039a4a00</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/HostedInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: StoreInstall (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappinstallationpackagefamilynamestoreinstall
  description: Installs an app along with its license from the Microsoft Store under the device context.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does StoreInstall do?
      answer: |
        It asks Windows to install an app and its license from the Microsoft Store. The command is an `<Exec>` on `.../EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/StoreInstall`, with an `Application` element in `<Data>` that identifies the Store product, for example `<Application id="{ProductID}" flags="0" skuid="..." />`.

        This page covers the `./Device/` path.
    - question: Does StoreInstall work in device context?
      answer: |
        Not according to Microsoft. Its enterprise app management guide says installing directly from the Microsoft Store is supported only in user context, not device context. The CSP reference still lists a `./Device/` StoreInstall node, but don't rely on it.

        To get an app to every user on a device, Microsoft's supported route is provisioning a package from a hosted location with `HostedInstall` in device context.
    - question: Does StoreInstall still work after Microsoft Store for Business was retired?
      answer: |
        Mostly not. The `ProductID` and `skuid` values and the license assignment came from Microsoft Store for Business, which Microsoft retired on March 31, 2023. Microsoft's guide also requires the app to be assigned to the user's Microsoft Entra identity there.

        For new deployments, use another method, such as the Windows Package Manager (winget) or provisioning the package.
    - question: How do I install Microsoft Store apps for all users with Fleet?
      answer: |
        Use a script-only package. Fleet's guide walks through installing free Microsoft Store apps for all users on Windows hosts, with install and uninstall scripts you add as a custom package and can offer in self-service. See [Add Microsoft Store apps to self service with script-only packages](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide).

        Only free apps are supported.
    - question: Which Fleet features use StoreInstall?
      answer: |
        None. Fleet doesn't send `StoreInstall` in either context.
    - question: How do I run StoreInstall with Fleet?
      answer: |
        Replace `{PackageFamilyName}`, add `<Data>` with your `Application` element, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=storeinstall.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Because Microsoft doesn't support Store installs in device context, test on one host before relying on the result.
    - question: How do I check whether a Store app installed?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` only means Windows accepted the command. Check `AppInstallation/{PackageFamilyName}/Status` and `LastError` for the outcome. After a successful install, Windows removes that node.

        To confirm, look for the app in the host's software inventory in Fleet, or run `Get-AppxPackage -AllUsers -Name <name>` in a Fleet script.
    - question: What are the requirements for Store installs over MDM?
      answer: |
        Per Microsoft's guide: the device needs connectivity to the Microsoft Store, Microsoft Store services must be enabled (you can still hide the Store UI), and the user must be signed in with their Microsoft Entra identity. Policies that turn off the Store or its services block these installs.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>19e07f1f-bce0-43a1-a364-477c1cd500ab</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/StoreInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: AddLicense (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceapplicensesstorelicenseslicenseidaddlicense
  description: Adds a specified app license to the device using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the AddLicense command do?
      answer: |
        It installs an offline app license that you supply in the command. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense`.

        The `<Data>` holds a `License` element with the base64-encoded license blob, `<License Content="{LicenseBlob}"/>`. The `{LicenseID}` is the "Content ID" from the license file.
    - question: When do I need AddLicense in device context?
      answer: |
        When you provision an offline-licensed Store app for all users of a device. Microsoft says the required license must be deployed before the app, which you then provision with `HostedInstall` in device context.

        The license only needs to go out with the initial install. App updates don't need it again.
    - question: Is AddLicense still relevant after Microsoft Store for Business was retired?
      answer: |
        Only if you still have offline license files. Offline licenses were downloaded from Microsoft Store for Business, which Microsoft retired on March 31, 2023. Without a license source, there's nothing to send.
    - question: What's the difference between AddLicense and GetLicenseFromStore?
      answer: |
        `AddLicense` delivers a license you already have, which suits offline-licensed apps and devices that can't reach the Store. `GetLicenseFromStore` asks the device to fetch the license from the Microsoft Store itself, which needs Store connectivity.
    - question: Which Fleet features use AddLicense?
      answer: |
        None. Fleet doesn't manage Microsoft Store licenses. For free Store apps, Fleet's [script-only package guide](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide) installs apps without a separate license step.
    - question: How do I run AddLicense with Fleet?
      answer: |
        Replace `{LicenseID}` with the license's Content ID, add `<Data><License Content="..."/></Data>` with the base64 blob, keep format `xml`, and save only the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=addlicense.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Fleet stores the command payload in its command history, so treat the license blob accordingly.
    - question: How do I confirm the license was added?
      answer: |
        Check for `200` in `fleetctl get mdm-command-results --id=<command-uuid>`. On the device, the `{LicenseID}` node then reports `LicenseCategory` (such as Retail or Enterprise) and `LicenseUsage` (such as Online or Offline). The best check is that the app launches for an end user.
    - question: How do I remove a license added with AddLicense?
      answer: |
        Microsoft documents a `<Delete>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}`. Fleet custom commands accept only `<Exec>`, so Fleet can't send it. Removing the provisioned app is usually the more useful step.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>2a7e4bc2-5b0d-4cf1-b66d-05f828177582</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: GetLicenseFromStore (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceapplicensesstorelicenseslicenseidgetlicensefromstore
  description: Retrieves a specified app license from the Microsoft Store using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the GetLicenseFromStore command do?
      answer: |
        It tells the device to fetch an app license from the Microsoft Store. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore`, with format `xml`.

        Microsoft says the `{LicenseID}` is generally the app's package family name. Unlike `AddLicense`, you don't supply the license yourself.
    - question: When would I use GetLicenseFromStore?
      answer: |
        Rarely. It's for online-licensed Store apps, where the license has to come from the Microsoft Store rather than a file. Microsoft's guide says apps with online licenses must get both the app and license directly from the Store.
    - question: What's the difference between GetLicenseFromStore and AddLicense?
      answer: |
        `GetLicenseFromStore` has the device download the license from the Store, so it needs Store connectivity. `AddLicense` installs an offline license blob you include in the command, so it works without the Store.
    - question: Does GetLicenseFromStore work after Microsoft Store for Business was retired?
      answer: |
        For organization-purchased apps, likely not. Those licenses were managed through Microsoft Store for Business, which Microsoft retired on March 31, 2023. Test on one host before relying on it.
    - question: Does GetLicenseFromStore install the app?
      answer: |
        No. It only retrieves the license. Install the app separately, for example with Fleet's [script-only package guide](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide) for free Store apps.
    - question: Which Fleet features use GetLicenseFromStore?
      answer: |
        None. Fleet doesn't send this command. You can send it as a custom MDM command.
    - question: How do I run GetLicenseFromStore with Fleet?
      answer: |
        Replace `{LicenseID}`, keep format `xml`, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=getlicense.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).

        Microsoft's CSP reference doesn't publish a `<Data>` schema for this node, so test on one host first.
    - question: How do I check that the license was retrieved?
      answer: |
        Look for `200` in `fleetctl get mdm-command-results --id=<command-uuid>`. A `404` usually means the `{LicenseID}` is wrong, and a `500` means the Store couldn't issue a license. Afterward, the `{LicenseID}` node reports `LicenseCategory` and `LicenseUsage`. Confirm the app opens.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>aba692b8-bd1b-4bd1-90b6-eef510b03562</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetPackage (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappmanagementresetpackage
  description: Restores a specified Windows app to its initial state by resetting all configurations and data associated with the package.
  supportedDeviceTypes:
    - Windows 10.0.22000
  faq:
    - question: What does the ResetPackage command do?
      answer: |
        It restores a Windows app (APPX or MSIX) to its initial configuration. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage`, with format `xml` and a `<Data>` XML that names the package.

        It's the remote equivalent of **Reset** in the app's advanced options in Windows Settings.
    - question: Which Windows versions support ResetPackage?
      answer: |
        Windows 11, version 21H2 (build 22000) and later. On Windows 10, the node doesn't exist and Windows returns `404`.
    - question: Will ResetPackage delete user data?
      answer: |
        Yes, the app's local data. Resetting clears the app's settings and the data it stores in its own package folder, including sign-in state. Files the user saved elsewhere, such as their Documents folder or cloud storage, aren't touched. Warn the user first.
    - question: How do I reset a Windows app without MDM?
      answer: |
        The user can go to **Settings > Apps > Installed apps**, select the app's menu, choose **Advanced options**, and select **Reset**. In PowerShell, `Reset-AppxPackage` resets the app for the user who runs it.
    - question: Which Fleet features use ResetPackage?
      answer: |
        None. Fleet doesn't send this command. Fleet runs Windows scripts as SYSTEM, so `Reset-AppxPackage` in a Fleet script won't reset a signed-in user's copy. For a remote reset, send `ResetPackage` as a custom command or have the user reset the app in Settings.
    - question: How do I run ResetPackage with Fleet?
      answer: |
        Add `<Data>` with the XML that identifies the package. Microsoft's CSP reference doesn't publish the schema or an example, so test on one host first. Save only the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you).
    - question: When should I use ResetPackage?
      answer: |
        As a help desk fix for a Store or MSIX app that crashes on launch, won't sync, or is stuck in a bad sign-in state. It's faster than uninstalling and reinstalling, and it doesn't need the package source. If a reset doesn't help, reinstall the app.
    - question: How do I know ResetPackage worked?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows Windows' status code. `200` means the reset ran, `404` means the device runs Windows 10 or the LocURI is wrong, and `500` means Windows couldn't reset the package. Then open the app. It should start with default settings, as if newly installed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>5f301e26-48ec-4a40-bad5-9c8b4e438ca2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpdateScan (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappmanagementupdatescan
  description: Starts a Windows Update scan on the device.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseModernAppManagement UpdateScan command do?
      answer: |
        It tells Windows to check for updates to Microsoft Store apps. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan` with format `null`.

        Microsoft's CSP reference describes it as starting "the Windows Update scan," but its app management guide uses it under "Update apps directly from the store." It's part of the app management CSP, not the Windows Update CSP.
    - question: Does UpdateScan install Windows OS updates?
      answer: |
        No. It doesn't install anything by itself, and it isn't the tool for operating system updates. Whether updated Store apps then install depends on the device's Store update settings. Microsoft's guide notes that store updates need the device to reach Store services.
    - question: How do I enforce Windows OS updates instead?
      answer: |
        Use update policies. In Fleet Premium, set a deadline and grace period per fleet in **Controls > OS updates**. For rollout rings, deferrals, or pinned releases, add Windows Update CSP policies as configuration profiles. See [Manage Windows updates with the Windows Update CSP](https://fleetdm.com/guides/custom-windows-updates).
    - question: Which Fleet features use UpdateScan?
      answer: |
        None. Fleet doesn't send this command. You can send it as a custom MDM command.
    - question: How do I run UpdateScan with Fleet?
      answer: |
        Save only the `<Exec>` element from the example, without the `<syncml>` and `<syncbody>` wrappers, and run `fleetctl mdm run-command --hosts=<hostname> --payload=updatescan.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a unique `<CmdID>`, since the API uses it as the command ID (`fleetctl` generates one for you). Custom Windows commands like this one are available in Fleet Free and Fleet Premium.
    - question: How do I check the result of UpdateScan?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows started the scan. The scan result is in `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/LastScanError`, which reports the last error code from the scan.

        To see whether apps actually updated, check app versions in the host's software inventory in Fleet after the next refresh.
    - question: What's the difference between device and user context UpdateScan?
      answer: |
        The `./Device/` path runs the scan in the device context. The `./User/` path runs it for the user tied to the MDM session, which is the form Microsoft's app management guide shows. Store apps are often installed per user, so if a device-context scan doesn't pick up a user's app updates, try the user-context version.
    - question: What errors can UpdateScan return?
      answer: |
        A `405` means Windows didn't accept the verb. This node only supports `<Exec>`. A `500` means the scan couldn't start. Problems during the scan, such as no connection to Store services or policies that turn off Store updates, show up in `LastScanError`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>44702317-0b9b-4dc0-945f-e5303a967e8c</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: HostedInstall (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappinstallationpackagefamilynamehostedinstall
  description: Installs an app package from a hosted location, such as a local drive, UNC path, or HTTPS source.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the HostedInstall (User context) MDM command do?
      answer: |
        It installs an app package (`.appx`, `.msix`, or a bundle) from a location you host for one user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/HostedInstall` in the EnterpriseModernAppManagement CSP.

        The package can come from a local path, a UNC share, or an HTTPS URL. Windows registers the app only for the signed-in user, installs it in the background, and sends the MDM server an alert when it finishes.
    - question: What's the difference between HostedInstall in user context and device context?
      answer: |
        User context installs the app for the signed-in user only. The download runs as that user, so the user needs access to the package location. It's also the only context that accepts the `DeploymentOptions` attribute and reports install progress in `Status`.

        Device context (`./Device/`) provisions the app instead. Windows installs it as Local System and registers it for every user at their next sign-in. Use device context for shared computers or when every user needs the app.
    - question: What goes in the HostedInstall payload?
      answer: |
        Put the app's package family name in the `<LocURI>` in place of `{PackageFamilyName}`, for example `Contoso.App_8wekyb3d8bbwe`. The sample on this page leaves that segment out, so add it.

        The `<Data>` (format `xml`) holds an `<Application>` element with a required `PackageUri` attribute. You can add a `<Dependencies>` list of `<Dependency PackageUri="..."/>` entries for framework packages, and `DeploymentOptions` for options like forcing the app to close during an update.
    - question: What does a Windows host need before HostedInstall can install an app?
      answer: |
        A user must be signed in, and that user must be able to reach the `PackageUri`. The package must be signed by a certificate the host trusts. For in-house apps, deploy the signing certificate to the host first. Microsoft's guide also says non-Store apps require the `ApplicationManagement/AllowAllTrustedApps` policy, depending on the Windows version.

        Dependency packages need to be reachable too. The Microsoft Store isn't involved, so the host doesn't need Store access.
    - question: Can I install an MSIX app for a user without MDM?
      answer: |
        Yes. The user can double-click the `.msix` file to open App Installer, or run `Add-AppxPackage -Path <path-to-package>` in PowerShell in their own session. Either way, the app installs only for that user.

        To install for every user on a computer, an administrator can run `Add-AppxProvisionedPackage -Online -PackagePath <path> -SkipLicense`.
    - question: How do I run HostedInstall (User context) with Fleet?
      answer: |
        Save only the `<Exec>` element, with one `<Item>`, as an XML file. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=hosted-install.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.

        Microsoft's examples send an `<Add>` for the `{PackageFamilyName}` node before the `<Exec>`, which it says lets the app be removed cleanly at unenrollment. Fleet custom commands only accept `<Exec>`, so test on one host first.
    - question: What's the recommended way to deploy an MSIX or APPX app with Fleet?
      answer: |
        Use a [script-only package](https://fleetdm.com/guides/deploy-software-packages#script-only-packages) (Fleet Premium) or a script from **Actions > Run script**. Fleet doesn't accept `.msix` files as custom package uploads.

        Fleet runs Windows scripts as SYSTEM, so a per-user `Add-AppxPackage` won't reach the signed-in user. Have the script download the package and run `Add-AppxProvisionedPackage -Online -PackagePath <path> -SkipLicense`, which provisions the app for every user. Some apps are also available as [Fleet-maintained apps](https://fleetdm.com/guides/fleet-maintained-apps).
    - question: How do I know HostedInstall (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the request, not that the app finished installing.

        To confirm, run `Get-AppxPackage -AllUsers -Name <package-name>` on the host, for example as a Fleet script. Fleet's built-in software inventory reads installed programs, so packaged apps may not appear there.
    - question: Why did HostedInstall fail?
      answer: |
        If Windows rejects the command, check that the `<LocURI>` includes the package family name and that `<Data>` is valid XML. Failures after Windows accepts the command usually come from an unreachable `PackageUri`, an untrusted signing certificate, a missing dependency, or no signed-in user.

        Windows records the details in `AppInstallation/{PackageFamilyName}/LastError` and `LastErrorDesc`. Fleet custom commands can't read those nodes, so check the AppX deployment event logs on the host.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ab117216-9adc-49cf-b3b1-3a1a7d9b43d0</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/HostedInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: StoreInstall (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappinstallationpackagefamilynamestoreinstall
  description: Command to perform an install of an app and a license from the Microsoft Store.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the StoreInstall (User context) MDM command do?
      answer: |
        It installs an app and its license from the Microsoft Store for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/StoreInstall`.

        Unlike HostedInstall, you don't host the package. The device downloads the app from the Store.
    - question: Does StoreInstall work in device context?
      answer: |
        No, not for installing from the Store. Microsoft's app management guide says deploying an app directly from the Microsoft Store is only supported in the user context.

        To make an app available to every user on a computer, Microsoft's route is device context HostedInstall, which provisions a package you host.
    - question: Does StoreInstall still work now that Microsoft Store for Business is retired?
      answer: |
        Treat it as legacy. Microsoft's documented flow requires the app to be assigned to the user's Microsoft Entra identity in Microsoft Store for Business, and the `ProductID` and `skuid` values come from that service. Microsoft retired Microsoft Store for Business and Education on March 31, 2023.

        For new deployments, use another method, such as a script that installs the app from the Microsoft Store, or winget.
    - question: What goes in the StoreInstall payload?
      answer: |
        Replace `{PackageFamilyName}` in the `<LocURI>`. The sample on this page leaves that segment out. The `<Data>` (format `xml`) is an `<Application>` element with `id`, `flags`, and `skuid` attributes.

        `id` is the product ID. `flags="0"` tells the management tool to call back to Store for Business to assign a seat, and `flags="1"` lets the device claim a seat if one is available. `skuid` is required.
    - question: What does the host need for StoreInstall (User context) to work?
      answer: |
        The user must be signed in with their Microsoft Entra identity, and the app must be assigned to them. The host needs a connection to the Microsoft Store, and Microsoft Store services must be turned on. You can hide the Store app itself and installs still work.
    - question: How do I install Microsoft Store apps with Fleet?
      answer: |
        Use a script-only package. Fleet's guide to [adding Microsoft Store apps with script-only packages](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide) provides install and uninstall scripts. They install free Store apps for all users without winget or a signed-in user, and you can offer them in self-service (Fleet Premium).

        Paid apps aren't supported by that method, because the Store can't license them without a store account.
    - question: How do I run StoreInstall (User context) with Fleet?
      answer: |
        Save only the `<Exec>` element, with one `<Item>`, as an XML file. Run `fleetctl mdm run-command --hosts=<hostname> --payload=store-install.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.

        Microsoft's flow sends an `<Add>` for the app's node first. Fleet custom commands only accept `<Exec>`, so test on one host.
    - question: How do I check if StoreInstall (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the request. The download happens afterward, and Microsoft notes that Windows doesn't send a completion alert for Store installs.

        Confirm with `Get-AppxPackage -Name <package-name>` in the user's session, or `Get-AppxPackage -AllUsers` from a Fleet script.
    - question: Why did StoreInstall fail?
      answer: |
        Common causes are a malformed `<Data>` body, a missing package family name in the `<LocURI>`, no license seat available, or a user who isn't signed in with Entra. A policy or firewall that blocks the Microsoft Store also stops installs, even when Windows accepts the command.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>48a53564-56b8-4ddf-b27f-8e0fa0d0f513</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/StoreInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: AddLicense (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userapplicensesstorelicenseslicenseidaddlicense
  description: Adds a specified app license to the device using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the AddLicense (User context) MDM command do?
      answer: |
        It installs an offline license for a Microsoft Store app, for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense`.

        `{LicenseID}` is the license's content ID, which is listed in the license file. The `<Data>` holds a `<License>` element whose `Content` attribute is the base64-encoded license blob.
    - question: When do I need AddLicense?
      answer: |
        When you deploy an offline-licensed Store app yourself, for example with HostedInstall. Offline apps need their license on the device, and Microsoft says to deploy the license before the app.

        You only need it for the first install. App updates don't need a new license. On Windows 10, version 1607 and later, HostedInstall's `LicenseUri` option can also deploy the license as part of the install.
    - question: Is AddLicense still useful after Microsoft Store for Business was retired?
      answer: |
        Only if you still have offline license files. Offline licenses were downloaded from Microsoft Store for Business, which Microsoft retired on March 31, 2023. Without a source for new license files, most teams move these apps to another deployment method.
    - question: What's the difference between AddLicense in user context and device context?
      answer: |
        User context adds the license for the signed-in user, to go with a user-based app install. Device context adds it at the device level, which Microsoft's guide uses for apps provisioned to every user. Match the license context to the way you installed the app.
    - question: What's the difference between AddLicense and GetLicenseFromStore?
      answer: |
        AddLicense installs a license you supply in the command. GetLicenseFromStore asks the device to download the license from the Microsoft Store. Use AddLicense for offline licenses and GetLicenseFromStore for online ones.
    - question: How do I run AddLicense (User context) with Fleet?
      answer: |
        Replace `{LicenseID}` with the content ID, put the `<License Content="..."/>` element in `<Data>`, and save only the `<Exec>` element as a file. Run `fleetctl mdm run-command --hosts=<hostname> --payload=add-license.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I know AddLicense (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows added the license. The practical test is that the app opens for that user without a license error.

        Windows lists installed licenses under `AppLicenses/StoreLicenses`, but Fleet custom commands only send `<Exec>`, so they can't read that node.
    - question: How do I remove a license added with AddLicense?
      answer: |
        Microsoft's method is a `<Delete>` on the `./User/.../StoreLicenses/{LicenseID}` node. Fleet custom commands only send `<Exec>`, so Fleet can't send it.

        In most cases, remove the app instead, for example with RemovePackage or a Fleet script that runs `Remove-AppxPackage`.
    - question: Why did AddLicense fail?
      answer: |
        Usually the license blob is malformed, isn't base64-encoded, or belongs to a different app than the `{LicenseID}` in the path. A user must also be signed in, because the command runs in that user's context.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>9b0b3d42-e244-4359-8471-46f8cf62558e</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: GetLicenseFromStore (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userapplicensesstorelicenseslicenseidgetlicensefromstore
  description: Retrieves a specified app license from the Microsoft Store using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the GetLicenseFromStore (User context) MDM command do?
      answer: |
        It tells Windows to download a Microsoft Store app license for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore`, with an `xml` format.

        Microsoft describes it in one line, "Command to get license from the store," and doesn't publish a sample `<Data>` body.
    - question: When would I use GetLicenseFromStore?
      answer: |
        Rarely. It's meant for an online-licensed Store app that's installed for the user but is missing its license. A typical symptom is an app that won't open and asks for a license.
    - question: What's the difference between GetLicenseFromStore and AddLicense?
      answer: |
        GetLicenseFromStore makes the device fetch the license from the Microsoft Store, so the host needs Store access. AddLicense installs an offline license blob that you include in the command, so no Store access is needed.
    - question: Does GetLicenseFromStore install the app?
      answer: |
        No. It only gets the license. To install an app and its license from the Store in one step, Microsoft's command is StoreInstall.
    - question: Does GetLicenseFromStore still work after Microsoft Store for Business was retired?
      answer: |
        For organization-purchased apps, likely not. Those licenses came from Microsoft Store for Business, which Microsoft retired on March 31, 2023. Test on one host before relying on it, and plan to move these apps to another deployment method.
    - question: How do I run GetLicenseFromStore (User context) with Fleet?
      answer: |
        Replace `{LicenseID}` with the license's content ID, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=get-license.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Send it while the user is signed in. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I license free Microsoft Store apps with Fleet?
      answer: |
        You don't need a separate command. The install script in Fleet's guide to [adding Microsoft Store apps with script-only packages](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide) gets the app and its license from the Store together. It supports free apps only, and fails with a licensing message for paid ones.
    - question: How do I check if GetLicenseFromStore worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the request. Then open the app as that user. If the license was retrieved, it opens without a license error.
    - question: Why did GetLicenseFromStore fail?
      answer: |
        Common causes are a `{LicenseID}` that doesn't match an app, a host that can't reach the Microsoft Store, Store services turned off by policy, or no signed-in user. If the license came from Microsoft Store for Business, the source may no longer exist.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>f4796a1e-5bf9-4828-a602-d3a0ac9f5930</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RemovePackage (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappmanagementremovepackage
  description: Removes a specified Windows app package from the device.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the RemovePackage MDM command do?
      answer: |
        It uninstalls a packaged Windows app (MSIX or APPX). It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/RemovePackage`, available on Windows 10, version 1703 and later.

        The `<Data>` (format `xml`) is a `<Package>` element. `Name` is the package full name, and `RemoveForAllUsers` sets how widely it's removed.
    - question: What do RemoveForAllUsers and the User attribute do?
      answer: |
        `RemoveForAllUsers="1"` removes the package for all users, but only if it's a provisioned package. `0`, the default, would un-provision the app for new users while leaving it for current users, but Microsoft notes that option isn't currently supported.

        The optional `User` attribute takes a user's SID and removes the package for that user only.
    - question: Why is RemovePackage only in the user context?
      answer: |
        Microsoft lists the node under `./User/` only, but the `RemoveForAllUsers` and `User` attributes let it act beyond the signed-in user. Microsoft's own example sends it to a `./Device/` path, so the docs aren't consistent.

        Start with the `./User/` path from the CSP reference and test on one host.
    - question: Why does RemovePackage need the package full name?
      answer: |
        Because it removes one exact installed package. The full name includes the version, architecture, and publisher ID, such as `Contoso.App_1.2.3.0_x64__8wekyb3d8bbwe`. The package family name doesn't include the version.

        If the app updates before the command runs, the full name changes and the command fails. Look up the name with `Get-AppxPackage -AllUsers` right before you send it.
    - question: Can I remove built-in Windows apps with RemovePackage?
      answer: |
        Many of them, yes, such as consumer apps that ship with Windows. Apps that Windows classifies as system apps can't be uninstalled.

        Removing an app for current users doesn't stop it from installing for new users if it's still provisioned. Microsoft's guide removes provisioned apps separately, in the device context.
    - question: How do I remove an MSIX or APPX app without MDM?
      answer: |
        Run `Remove-AppxPackage -Package <PackageFullName>` in PowerShell for the current user, or add `-AllUsers` as an administrator. To stop the app from installing for new users, also run `Remove-AppxProvisionedPackage -Online -PackageName <name>`.

        With Fleet, you can run these as a script from **Actions > Run script**, or automatically when a policy fails. See [policy automations](https://fleetdm.com/guides/policy-automation-run-script).
    - question: How do I run RemovePackage with Fleet?
      answer: |
        Put the full name in the `Name` attribute, save only the `<Exec>` element as a file, and run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-package.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I know RemovePackage worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the removal. Then confirm that `Get-AppxPackage -AllUsers -Name <package-name>` no longer lists the package, for example with a Fleet script.
    - question: Why did RemovePackage fail?
      answer: |
        Usually the full name doesn't match an installed package, often because the app updated. A malformed `<Package>` element also fails. `RemoveForAllUsers="1"` only works for provisioned packages, and system apps can't be removed at all.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>70fe3f35-ce6f-484d-a14f-1f8ceb9edda3</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/RemovePackage</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>
              <Package Name="{PackageFullName}" RemoveForAllUsers="1" />
            </Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetPackage (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappmanagementresetpackage
  description: Restores a specified Windows app to its initial state by resetting all configurations and data associated with the package.
  supportedDeviceTypes:
    - Windows 10.0.22000
  faq:
    - question: What does the ResetPackage (User context) MDM command do?
      answer: |
        It restores a packaged Windows app to its initial configuration. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage`, with an `xml` format.

        It's the MDM version of the **Reset** button in an app's advanced options in Windows Settings. The user context version targets the app for the signed-in user.
    - question: Which Windows versions support ResetPackage?
      answer: |
        Windows 11, version 21H2 (build 22000) and later, on Pro, Enterprise, Education, and IoT Enterprise editions. Windows 10 hosts don't have this node.
    - question: Will ResetPackage delete the user's app data?
      answer: |
        Yes. Resetting returns the app to its initial state, which clears its local settings and data, including saved sign-ins. Files the user saved outside the app, such as in Documents or cloud storage, aren't affected. Tell the user before you send it.
    - question: When should I use user context instead of device context for ResetPackage?
      answer: |
        Use user context when one person has a broken app, such as one that crashes on launch or is stuck in a bad sign-in state. It targets the app as that user sees it.

        Microsoft lists the same node under `./Device/` but doesn't document how the two differ. Test on one host before you use either widely.
    - question: How do I reset a Windows app without MDM?
      answer: |
        On the computer, go to **Settings > Apps > Installed apps**, open the app's **Advanced options**, and select **Reset**. In PowerShell, the user can run `Reset-AppxPackage -Package <PackageFullName>` in their own session.

        Fleet runs Windows scripts as SYSTEM, so a Fleet script that runs `Reset-AppxPackage` won't target the signed-in user's copy of the app.
    - question: How do I run ResetPackage (User context) with Fleet?
      answer: |
        Add an XML `<Data>` body that identifies the package, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset-package.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Microsoft doesn't publish a sample `<Data>` body for this node, so confirm the format on a test host first. Send it while the user is signed in.
    - question: How do I check if ResetPackage (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the reset. Then have the user open the app. It should start like a fresh install, with default settings and no saved sign-in.
    - question: Why did ResetPackage fail?
      answer: |
        On Windows 10 the node doesn't exist, so the command fails. On Windows 11, check that `<Data>` is valid and names an app that's installed for the signed-in user. A reset can also fail if the app is running and can't be closed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ceeeeabd-f3d0-4c15-bdf2-07326cf27bbd</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpdateScan (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappmanagementupdatescan
  description: Starts a Windows Update scan under the user context to check for available app updates.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the UpdateScan (User context) MDM command do?
      answer: |
        It starts an update scan for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan`, with a `null` format and empty `<Data>`.

        Microsoft's CSP reference calls it a Windows Update scan, and its app management guide uses it to update apps from the Microsoft Store. It doesn't change OS update policies or deadlines.
    - question: What's the difference between UpdateScan in user context and device context?
      answer: |
        User context checks for updates for the user tied to the MDM session. Microsoft's app management guide uses this version to update a user's Store apps.

        Device context (`./Device/`) runs the scan at the device level. Use it when you want a device-wide check rather than one user's apps.
    - question: Does UpdateScan install updates?
      answer: |
        It starts a scan, and Windows handles what happens next. To update Store apps, the device must be able to reach Microsoft Store services. Updates for apps you deployed from a hosted location come from a new HostedInstall, not from a scan.
    - question: How do I run UpdateScan (User context) with Fleet?
      answer: |
        The command needs no data. Save only the `<Exec>` element as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=update-scan-user.xml`. To target several hosts, pass a comma-separated list to `--hosts`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Send it while the user is signed in. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I check the result of UpdateScan (User context)?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the scan started, not that any app updated.

        Windows records the last scan error in `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/LastScanError`. Fleet custom commands can't read it, so check app versions with `Get-AppxPackage` instead, for example in a Fleet script.
    - question: How do I keep Microsoft Store apps updated with Fleet?
      answer: |
        If you installed the app with Fleet's [Microsoft Store app script](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide), select **Reinstall** in Fleet, and the Store installs the latest version.

        For Windows OS updates, use Fleet's OS update settings or the Update CSP. See [Manage Windows updates](https://fleetdm.com/guides/custom-windows-updates).
    - question: Can I stop a Store app from updating automatically?
      answer: |
        Yes, but only at the device level. Microsoft's `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/AppStore/{PackageFamilyName}/DoNotUpdate` setting blocks Store updates for one app. It's a setting, not a command, so deliver it with `<Replace>` in a Windows configuration profile. There's no user-level version.
    - question: Why did UpdateScan (User context) fail?
      answer: |
        Check that the verb is `<Exec>` and the format is `null`. A user also needs to be signed in, because the command runs in the user's context. Scans that start but can't finish, for example because Store services are blocked, are recorded in `LastScanError`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>f4a37fe3-e8f4-4961-a80e-e4d33550d496</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: TriggerAttestation
  platform: windows
  category: HealthAttestation
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/healthattestation-csp#triggerattestation
  description: Triggers an asynchronous device health attestation session, prompting the device to collect and submit its current health status for verification.
  supportedDeviceTypes:
    - Windows 10.0.22000
  faq:
    - question: What does the TriggerAttestation MDM command do?
      answer: |
        It starts a device health attestation session with Microsoft Azure Attestation (MAA). It's an `<Exec>` on `./Vendor/MSFT/HealthAttestation/TriggerAttestation`, with a `chr` format, on Windows 11, version 21H2 and later.

        The host collects TPM-backed evidence about how it booted and sends it to your MAA instance. The signed report that comes back is cached on the device, so your MDM server can retrieve it and decide whether the device booted to a trusted state.
    - question: What's the difference between TriggerAttestation and VerifyHealth?
      answer: |
        TriggerAttestation is the Windows 11 flow. The device sends its evidence to your own Microsoft Azure Attestation instance, and the MDM server reads the signed report afterward.

        VerifyHealth is the original flow, available since Windows 10, version 1511. The device prepares health data, and the MDM server forwards it to the Device Health Attestation service and parses the response itself.
    - question: What do I need before sending TriggerAttestation?
      answer: |
        A Microsoft Azure Attestation instance with an attestation policy, a Microsoft Entra token to authenticate to it, and a Windows 11 host with a TPM.

        The `<Data>` is JSON with `rpid`, the MAA endpoint URL, a `nonce`, `aadToken`, and a correlation vector `cv`. Microsoft's field list calls the endpoint `serviceEndpoint`, while its sample uses `endpoint`. The sample on this page has no `<Data>`, so add it.
    - question: How do I read the attestation report?
      answer: |
        Use `<Get>` on `./Vendor/MSFT/HealthAttestation/AttestStatus` for the session's status code and `GetAttestReport` for the signed report.

        Fleet custom commands only send `<Exec>`, so you can't retrieve the report through Fleet. If you need the report, you'll need a server that implements the full MAA flow.
    - question: Does Fleet use device health attestation?
      answer: |
        No. Fleet doesn't send TriggerAttestation or process attestation reports. For device health signals, Fleet uses policies built on osquery data, such as the `tpm_info`, `secureboot`, and `bitlocker_info` tables.

        Those policy results also drive [conditional access](https://fleetdm.com/guides/conditional-access), which can block a failing host from signing in to apps.
    - question: How do I run TriggerAttestation with Fleet?
      answer: |
        Add the JSON `<Data>`, save only the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=trigger-attestation.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Each session needs a fresh nonce and a valid Entra token, so build a new payload for every run.
    - question: How do I know TriggerAttestation started?
      answer: |
        Microsoft says the node returns `202` when the attestation session launches. Check for it with `fleetctl get mdm-command-results --id=<command-uuid>`. The session then runs in the background.
    - question: Why did TriggerAttestation fail?
      answer: |
        Any status other than `202` means the session didn't start. Common causes are missing or malformed JSON, a Windows 10 host where the node doesn't exist, or a TPM that isn't ready.

        Failures after a `202`, such as an expired Entra token or an unreachable MAA endpoint, are recorded in `AttestStatus` on the host.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>47b2a850-2c56-4044-b2de-98e49d9cfcb9</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/HealthAttestation/TriggerAttestation</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: VerifyHealth
  platform: windows
  category: HealthAttestation
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/healthattestation-csp#verifyhealth
  description: Notifies the device to prepare a device health verification request.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the VerifyHealth MDM command do?
      answer: |
        It tells a Windows device to prepare a device health attestation request. It's an `<Exec>` on `./Vendor/MSFT/HealthAttestation/VerifyHealth`, with a `null` format and empty `<Data>`, on Windows 10, version 1511 and later.

        The device collects TPM-protected boot data and gets an encrypted health blob from the Device Health Attestation (DHA) service. The MDM server then retrieves that data and asks the service to validate it.
    - question: How does the VerifyHealth attestation flow work?
      answer: |
        The MDM server sends a `Nonce`, then `VerifyHealth`, and reads `Status` until it reaches `3`. Then it reads the `Nonce`, `Certificate`, and `CorrelationID` nodes and posts that data to the DHA service. The service returns a report with boot security details, such as Secure Boot and BitLocker state.

        By default, devices use Microsoft's cloud DHA service. The `HASEndpoint` node points them to an on-premises service instead.
    - question: What do the HealthAttestation Status values mean?
      answer: |
        `0` means the device has never attested. `1` means the request was triggered and the device is getting its health data. `2` means retrieval failed. `3` means retrieval is complete and the server can collect the data.

        Microsoft's CSP reference lists more error codes for specific failures, such as a TPM that isn't ready.
    - question: What's the difference between VerifyHealth and TriggerAttestation?
      answer: |
        VerifyHealth makes the MDM server do the round trip to the DHA service. TriggerAttestation, added in Windows 11, has the device talk to your Microsoft Azure Attestation instance directly. For Windows 11 hosts, Microsoft describes TriggerAttestation as the simpler approach.
    - question: Can I see the health attestation result in Fleet?
      answer: |
        No. VerifyHealth only prepares the data. Getting a result requires `<Get>` commands and a call to the DHA service, and Fleet custom commands only send `<Exec>`.

        For device health in Fleet, write policies on osquery data, such as `tpm_info`, `secureboot`, and `bitlocker_info`. Failing policies can trigger a script or block sign-ins through [conditional access](https://fleetdm.com/guides/conditional-access).
    - question: How do I run VerifyHealth with Fleet?
      answer: |
        It needs no data. Save only the `<Exec>` element as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=verify-health.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the device accepted the request.
    - question: Why did VerifyHealth fail?
      answer: |
        Usually because the device can't use its TPM, for example because it has no TPM or the TPM isn't ready. A typo in the `<LocURI>` also fails. If the command is accepted but `Status` returns `2`, the device couldn't reach the DHA service.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>b442558e-a685-48c4-9fa1-71e5c6c9338f</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/HealthAttestation/VerifyHealth</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetPassword
  platform: windows
  category: Local Administrator Password Solution (LAPS)
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/laps-csp#actionsresetpassword
  description: Immediately generates and securely stores a new random password for the managed local administrator account on the device using Local Administrator Password Solution (LAPS).
  supportedDeviceTypes:
    - Windows 10.0.25145
    - Windows 10.0.22621.1480
    - Windows 10.0.22000.1754
    - Windows 10.0.20348.1663
    - Windows 10.0.19041.2784
    - Windows 10.0.17763.4244
  faq:
    - question: What does the LAPS ResetPassword MDM command do?
      answer: |
        It tells Windows LAPS to immediately generate a new password for the managed local administrator account and back it up. It's an `<Exec>` on `./Device/Vendor/MSFT/LAPS/Actions/ResetPassword`, with a `null` format and empty `<Data>`.

        The reset ignores the normal schedule, such as `PasswordAgeDays`. The new password goes to Microsoft Entra ID or Active Directory. It isn't returned to the MDM server.
    - question: What do I need before ResetPassword works?
      answer: |
        Windows LAPS must be configured on the host, especially `BackupDirectory`. It defaults to `0`, which turns off backup. Set it to `1` for Microsoft Entra ID or `2` for Active Directory.

        Microsoft supports the LAPS CSP on hosts joined to Microsoft Entra ID or hybrid joined. You can deliver LAPS settings with a Windows configuration profile. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: Which Windows versions support Windows LAPS ResetPassword?
      answer: |
        Windows 11, versions 22H2 and 21H2, Windows 10, version 2004 and later, Windows 10, version 1809, and Windows Server 2022, each with the April 2023 updates or later. Newer releases include it.

        Legacy Microsoft LAPS, the separately installed MSI, doesn't use this CSP.
    - question: Can I rotate a LAPS password without MDM?
      answer: |
        Yes. On the host, an administrator can run `Reset-LapsPassword` in PowerShell, which rotates the password and backs it up right away.

        With Fleet, you can run that cmdlet as a script from **Actions > Run script**, which also works in Fleet Free. A script also returns output you can read in Fleet, which the MDM command doesn't.
    - question: Where do I find the new password after ResetPassword?
      answer: |
        In the backup directory. For Microsoft Entra ID, use the Entra admin center or Microsoft Graph. For Active Directory, use `Get-LapsADPassword` or the LAPS tab in Active Directory Users and Computers.

        Fleet doesn't store or display Windows LAPS passwords.
    - question: How do I run ResetPassword with Fleet?
      answer: |
        Save only the `<Exec>` element as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=laps-reset.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        It's a device-scope command, so no user needs to be signed in. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I know ResetPassword worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the request. Windows reports the outcome in `ResetPasswordStatus`, where `0` means success, but Fleet custom commands can't read it.

        Instead, check the password's update time in Entra ID or Active Directory, or the Windows LAPS event log on the host.
    - question: Why did ResetPassword fail?
      answer: |
        If the node isn't found, the host's Windows build doesn't include Windows LAPS. If the reset fails, LAPS usually isn't configured with a backup directory, or the host can't reach Entra ID or a domain controller to store the new password.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>fa8a8f93-b3ed-48ef-940f-6232e74c087a</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/LAPS/Actions/ResetPassword</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Install (User context)
  platform: windows
  category: Office
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/office-csp#deviceinstallationidinstall
  description: Installs Microsoft Office for the user based on the provided XML configuration.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the Office CSP Install (User context) command do?
      answer: |
        It installs Microsoft 365 Apps (Office) with the Office Deployment Tool, from a request sent in the signed-in user's context. It's an `<Exec>` on `./User/Vendor/MSFT/Office/Installation/{id}/Install`, on Windows 10, version 1703 and later.

        `{id}` is a unique name you choose for this install. The `<Data>` holds the Office Deployment Tool configuration XML.
    - question: Why does the sample on this page use a ./Device path?
      answer: |
        The sample targets `./Device/Vendor/MSFT/Office/Installation/{id}/Install`, which is the device context node. For a user context install, change the start of the `<LocURI>` to `./User/`.
    - question: Should I use the user or device context to install Office?
      answer: |
        Usually device context. Microsoft documents both nodes with the same description, but the user context version only runs while a user is signed in, and its status is tracked under the user's `./User/` nodes.

        Choose user context only when you need the request tied to a specific user's session.
    - question: What goes in the Office Install data?
      answer: |
        An Office Deployment Tool `<Configuration>` XML that sets the product, channel, languages, and excluded apps. Because the format is `chr`, escape the XML in `<Data>`, for example `&lt;Configuration&gt;`.

        Include `<Display Level="None" AcceptEULA="TRUE"/>` for a silent install. You can build the configuration with the [Office Customization Tool](https://config.office.com).
    - question: How do I install Microsoft 365 Apps with Fleet?
      answer: |
        Microsoft Office is a [Fleet-maintained app](https://fleetdm.com/guides/fleet-maintained-apps) for Windows (Fleet Premium). Fleet installs it for the whole computer with the Office Deployment Tool and a pinned configuration you can edit in the install script.

        This is the recommended route in Fleet, because Fleet tracks the install, shows script output, and detects Office in software inventory.
    - question: How do I run Office Install (User context) with Fleet?
      answer: |
        Change the `<LocURI>` to the `./User/` path, replace `{id}`, add the escaped configuration to `<Data>`, and save only the `<Exec>` element. Run `fleetctl mdm run-command --hosts=<hostname> --payload=office-install-user.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Send it while the user is signed in. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I know Office Install (User context) worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the request. The download and install run afterward and can take a while.

        Windows reports progress in `Installation/{id}/Status`, where `997` means in progress and `0` means success. Fleet custom commands can't read it, so look for Microsoft 365 Apps in the host's software inventory in Fleet after the next refetch.
    - question: Why did Office Install fail?
      answer: |
        Microsoft lists status codes for common failures:

        - `1603`: a prerequisite failed, such as an existing MSI-based Office 2016 install or a 32-bit and 64-bit mismatch.
        - `17004`: unknown product ID, unsupported language, or content unavailable on the Office CDN.
        - `0x80004005`: the Office Deployment Tool can't install volume-licensed Office.

        A rejected command usually means the configuration wasn't escaped.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>b06743fc-3682-4aba-9f65-90a134b3dd6d</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Office/Installation/{id}/Install</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Install (Device context)
  platform: windows
  category: Office
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/office-csp#userinstallationidinstall
  description: Installs Microsoft Office on the device using the provided XML configuration data.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the Office CSP Install (Device context) command do?
      answer: |
        It installs Microsoft 365 Apps (Office) on the whole computer with the Office Deployment Tool. It's an `<Exec>` on `./Device/Vendor/MSFT/Office/Installation/{id}/Install`, on Windows 10, version 1703 and later.

        `{id}` is any unique name for this install. The `<Data>` holds the Office Deployment Tool configuration XML that picks the product, channel, and languages.
    - question: Why does the sample on this page use a ./User path?
      answer: |
        The sample targets `./User/Vendor/MSFT/Office/Installation/{id}/Install`, which is the user context node. For a device context install, change the start of the `<LocURI>` to `./Device/`.
    - question: Why use the device context for Office?
      answer: |
        It doesn't depend on who's signed in. The command runs even when no one is signed in, which makes it a good fit for new and shared computers. The user context version only runs while a user is signed in.
    - question: Can I uninstall Office with the Office CSP?
      answer: |
        Yes. Send another `Install` exec with a configuration that removes Office, such as `<Remove All="TRUE"/>` with `<Display Level="None" AcceptEULA="TRUE"/>`. Use a new `{id}`.

        If no Click-to-Run Office is installed, the command fails with `0x8000ffff`.
    - question: How do I install Microsoft 365 Apps with Fleet?
      answer: |
        Add Microsoft Office as a [Fleet-maintained app](https://fleetdm.com/guides/fleet-maintained-apps) (Fleet Premium). It installs for the whole computer with the Office Deployment Tool, and you can edit the configuration in the install script.

        Fleet then tracks each install, shows the script output, and detects Office in software inventory. Use the Office CSP only if you specifically want an MDM-driven install.
    - question: How do I run Office Install (Device context) with Fleet?
      answer: |
        Set the `<LocURI>` to the `./Device/` path, replace `{id}`, and put the escaped configuration in `<Data>`, for example `&lt;Configuration&gt;`. Save only the `<Exec>` element.

        Run `fleetctl mdm run-command --hosts=<hostname> --payload=office-install.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. With the API, use a unique `<CmdID>`, since Fleet keeps it as the command's ID. `fleetctl` sets a new one for you.
    - question: How do I check the Office install status?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the request was accepted, not that Office finished installing.

        Windows tracks progress in `Installation/{id}/Status` and, on Windows 10, version 1809 and later, `FinalStatus`, which is `70` for success and `60` for failure. Fleet custom commands can't read these nodes. Look for Microsoft 365 Apps in the host's software inventory after the next refetch.
    - question: Why did Office Install (Device context) fail?
      answer: |
        Common status codes:

        - `1603`: an existing MSI-based Office 2016 install, or a 32-bit and 64-bit mismatch.
        - `1460`: the Office Deployment Tool couldn't be downloaded.
        - `17004`: unknown product ID, unsupported language, or content missing on the Office CDN.
        - `0x80004005`: volume-licensed Office, which this tool can't install.

        Hosts also need to reach Microsoft's Office content delivery network.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>2e9f2aba-db2e-44a4-9c78-6d05fd5ef4a4</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/Office/Installation/{id}/Install</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Install
  platform: windows
  category: PrinterProvisioning
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/printerprovisioning-csp#upprinterinstallsprintersharedidinstall
  description: Installs a Universal Print printer for the user asynchronously.
  supportedDeviceTypes:
    - Windows 10.0.22000
    - Windows 10.0.19044.1806
    - Windows 10.0.19043.1806
    - Windows 10.0.19042.1806
  faq:
    - question: What does the PrinterProvisioning Install MDM command do?
      answer: |
        It installs a Universal Print printer for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/PrinterProvisioning/UPPrinterInstalls/{PrinterSharedID}/Install`, with a `null` format.

        The install runs asynchronously. Don't confuse it with the Office CSP's `Install` command, which installs Microsoft 365 Apps.
    - question: Which Windows versions support PrinterProvisioning?
      answer: |
        Windows 11, version 21H2 and later, and Windows 10, versions 20H2, 21H1, and 21H2 with update KB5014666 or later. It works on Pro, Enterprise, Education, and IoT Enterprise editions.

        It's user scope only. There's no `./Device/` version, so a user must be signed in.
    - question: What do I need before sending the printer Install command?
      answer: |
        The printer must be registered and shared in Universal Print, a Microsoft 365 service. The user needs access to both the printer and Universal Print.

        Replace `{PrinterSharedID}` with the printer's share ID from the Universal Print portal. The same node also holds the printer's `CloudDeviceID` and `PrinterSharedName`, which you set with `<Add>` or `<Replace>`.
    - question: How do I run the printer Install command with Fleet?
      answer: |
        Fleet custom commands only accept a single `<Exec>`, so set `CloudDeviceID` and `PrinterSharedName` first. One option is a user-scoped Windows configuration profile that uses `<Add>` on those `./User/` nodes. See [device and user scope](https://fleetdm.com/guides/custom-os-settings#device-and-user-scope).

        Then save the `<Exec>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-printer.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Test on one host first.
    - question: Can Fleet deploy printers without Universal Print?
      answer: |
        Yes, with a script. Windows has no CSP for installing a network printer with a vendor driver, other than Universal Print.

        Fleet's guide to [deploying printers on Windows](https://fleetdm.com/guides/deploy-printers-on-windows) uses `Add-Printer` with an IPP URL, or a vendor driver package, in a script-only package. Running the script on demand or from a policy works in Fleet Free.
    - question: How do I know the printer Install command worked?
      answer: |
        A `200` or `202` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the request. Windows reports the result in the printer's `Status` node, where `1` means installed, `2` in progress, and `4` failed. `ErrorCode` holds the HRESULT.

        Fleet custom commands can't read those nodes, so have the user check **Settings > Bluetooth & devices > Printers & scanners**.
    - question: Why did the printer Install command fail?
      answer: |
        Common causes are a `{PrinterSharedID}` node that doesn't exist yet, a user without access to the printer or to Universal Print, or no signed-in user. Older Windows 10 builds without KB5014666 don't have the CSP.
    - question: How do I remove a Universal Print printer with MDM?
      answer: |
        Microsoft's method is a `<Delete>` on the `UPPrinterInstalls/{PrinterSharedID}` node. Fleet custom commands only send `<Exec>`, so Fleet can't send it. If you added the node with a user-scoped configuration profile, removing that profile from Fleet sends the delete. The user can also remove the printer in Windows Settings.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>0d2f967d-2c8b-45a6-9a5e-6969cb58b10a</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/PrinterProvisioning/UPPrinterInstalls/{PrinterSharedID}/Install</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RebootNow
  platform: windows
  category: Reboot
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/reboot-csp#rebootnow
  description: Triggers an immediate device reboot, typically within 5 minutes to allow the user to finish active work. If executed during a sync session, the device will reboot at the end of the session.
  supportedDeviceTypes:
    - Windows 10.0.14393
  faq:
    - question: What does the RebootNow MDM command do?
      answer: |
        It restarts a Windows computer. It's an `<Exec>` on `./Device/Vendor/MSFT/Reboot/RebootNow`, with a `null` format and empty `<Data>`, on Windows 10, version 1607 and later.

        Microsoft says the reboot happens within 5 minutes so the user can finish active work. If the command arrives during an MDM sync, Windows reboots when the sync session ends.
    - question: Can the user postpone a RebootNow restart?
      answer: |
        No. Microsoft doesn't document a way to cancel or postpone it, and unsaved work can be lost. Warn users first, or send it outside working hours.

        If you need a custom message or a longer delay, run `shutdown /r /t <seconds> /c "<message>"` as a script instead.
    - question: How do I restart a Windows host with Fleet?
      answer: |
        Send `RebootNow` as a custom command. Fleet's [MDM commands guide](https://fleetdm.com/guides/mdm-commands) uses it as its Windows example. Save the `<Exec>` element as `windows-restart-device.xml` and run `fleetctl mdm run-command --hosts=<hostname> --payload=windows-restart-device.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        It works in Fleet Free and Fleet Premium. `fleetctl` gives each run a new `<CmdID>`. With the API, change the `<CmdID>` each time you reuse the file, since Fleet keeps it as the command's ID.
    - question: Is there a restart button for Windows hosts in Fleet?
      answer: |
        No. The **Actions** menu on the host details page doesn't include a restart. Use the `RebootNow` custom command, or run a script such as `Restart-Computer -Force` from **Actions > Run script**.

        To restart hosts that have been running too long, write a policy on osquery's `uptime` table and set it to [run a restart script](https://fleetdm.com/guides/policy-automation-run-script) when it fails.
    - question: Can I schedule a Windows reboot instead of rebooting now?
      answer: |
        Yes. The Reboot CSP also has `Schedule/Single` and `Schedule/DailyRecurrent` settings, plus `Schedule/WeeklyRecurrent` on Windows 11, version 24H2 and later. Each takes an ISO 8601 date and time, such as `2025-10-07T10:35:00`. You can't set daily and weekly schedules at the same time.

        These are settings, not commands, so deliver them in a Windows configuration profile. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I know RebootNow worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the host accepted the reboot. After the host comes back and Fleet refetches its details, the last restart time on the host details page updates.
    - question: Why didn't RebootNow restart the host?
      answer: |
        If the status stays pending, the host hasn't checked in yet, for example because it's offline. If Windows rejected it, check that the `<LocURI>` is exact and the format is `null`.

        If Fleet rejects the command before sending it, make sure the payload is a single `<Exec>` without the `<SyncML>` wrapper and, when you use the API, that the `<CmdID>` hasn't been used before.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d21ff8f2-a1ae-43c9-8763-26d7554f4a94</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Reboot/RebootNow</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doAutomaticRedeployment
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#automaticredeploymentdoautomaticredeployment
  description: Triggers an Autopilot reset on the device. Unlike a standard reset, the device remains enrolled in Azure AD and MDM, and preserves Wi-Fi profiles, region, language, keyboard settings, and other key configurations.
  supportedDeviceTypes:
    - Windows 10.0.17763
  faq:
    - question: What does the doAutomaticRedeployment MDM command do?
      answer: |
        It starts Windows Autopilot Reset. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/AutomaticRedeployment/doAutomaticRedeployment`.

        Windows removes personal files, apps, and settings, then returns the computer to a business-ready state. Unlike the other RemoteWipe commands, it keeps the device joined to Microsoft Entra ID and enrolled in MDM. It also keeps Wi-Fi details, provisioning packages, SCEP certificates, and the original region, language, and keyboard settings.
    - question: What's the difference between Autopilot Reset and a full wipe?
      answer: |
        A full wipe, like `doWipe` or `doWipeProtected`, removes everything, including the MDM enrollment and Entra join. The computer has to go through setup and enroll again.

        Autopilot Reset keeps the device's identity and management connection, so the next user can sign in and get the organization's settings without IT reprovisioning it. Choose it to hand a computer to a new user. Choose a full wipe for lost or stolen devices, or when the computer is leaving your organization.
    - question: What are the requirements for a remote Autopilot Reset?
      answer: |
        The device must be MDM managed and joined to Microsoft Entra ID. It needs Windows 10, version 1809 or later, on Pro, Enterprise, or Education.

        Microsoft doesn't support Autopilot Reset on Microsoft Entra hybrid joined devices. The Windows Recovery Environment (WinRE) must also be enabled, or the reset fails immediately. Run `reagentc /info` to check and `reagentc /enable` to fix it.
    - question: How often is doAutomaticRedeployment used?
      answer: |
        Occasionally, mostly by schools and organizations that reassign shared computers often. It's not part of routine management.
    - question: Can I run Autopilot Reset with Fleet?
      answer: |
        Yes, as a custom command, on hosts that enrolled through [Microsoft Entra automatic enrollment](https://fleetdm.com/guides/windows-mdm-setup#automatic-enrollment). Hosts that aren't Entra joined, like most hosts that enrolled by installing fleetd, need a full wipe instead.

        Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=autopilot-reset.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Fleet treats every RemoteWipe command as a wipe, so this requires Fleet Premium.
    - question: Will fleetd still be installed after Autopilot Reset?
      answer: |
        Not necessarily. Autopilot Reset removes apps, and the MDM enrollment stays in place, so the host doesn't go through a fresh enrollment that would reinstall the agent.

        Autopilot Reset reapplies provisioning packages, so the most reliable approach is to [install fleetd with a provisioning package](https://fleetdm.com/guides/preinstall-fleets-agent-on-windows-with-a-provisioning-package). Test on one host before resetting a group.
    - question: How do I know doAutomaticRedeployment worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the request. It doesn't mean the reset finished.

        Windows reports progress in the `AutomaticRedeployment/Status` node: `10` scheduled, `20` waiting for a reboot, `1` complete. Fleet's custom commands only support `<Exec>`, so you can't read that node with a `<Get>`. Instead, watch for the host to check in again with its apps and user data gone.
    - question: Why did Autopilot Reset fail?
      answer: |
        Microsoft documents these failure values in `AutomaticRedeployment/Status`: `30` failed during Exec, `40` power requirements not met, and `50` the reset itself failed. The error, usually an HRESULT, is in `AutomaticRedeployment/LastError`.

        The most common cause is a disabled Windows Recovery Environment, which logs `ERROR_NOT_SUPPORTED (0x80070032)`. Run `reagentc /enable` on the host, for example with a Fleet script, keep laptops on power, and send the command again.
    - question: Does the host show as wiped in Fleet after Autopilot Reset?
      answer: |
        No. Fleet only tracks wipe status for wipes started with **Actions > Wipe**, `fleetctl mdm wipe`, or the Wipe host API. A custom Autopilot Reset leaves the host's status unchanged. Check the command result and the host's activity instead.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>1259012e-3aa2-4f65-a191-eee74d7208c1</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/AutomaticRedeployment/doAutomaticRedeployment</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipe
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipe
  description: Performs a remote wipe on the device. The return status indicates whether the device accepted the command. When used with OMA Client Provisioning, include a dummy value of "1" for this element.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the doWipe MDM command do?
      answer: |
        It resets a Windows computer and removes all user accounts and data. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipe`.

        Microsoft says it's equivalent to **Reset this PC > Remove everything** in Settings, with files deleted but the drive not fully cleaned. The computer loses its MDM enrollment and has to go through setup again.
    - question: What's the difference between doWipe and doWipeProtected?
      answer: |
        Both remove everything. doWipe can be interrupted: if someone power cycles the computer mid-reset, Windows tries to roll back to its previous state. If rollback fails, the computer may be unusable until Windows is reinstalled.

        doWipeProtected also fully cleans the drive and keeps retrying after power cycles, but Microsoft warns it can leave some devices unable to boot. Use doWipe to repurpose a computer you control, and doWipeProtected for lost or stolen devices.
    - question: Which RemoteWipe command should I use?
      answer: |
        It depends on what you want to keep:

        - Nothing, for a computer you control: `doWipe`
        - Nothing, for a lost or stolen device: `doWipeProtected`
        - Provisioning packages: `doWipePersistProvisionedData`
        - User accounts and files: `doWipePersistUserData`
        - Entra join and MDM enrollment: `doAutomaticRedeployment`

        The `doWipeCloud` variants do the same with fresh system files downloaded from Microsoft, on Windows 11, version 22H2 and later.
    - question: How often is doWipe used?
      answer: |
        Occasionally. It's used when retiring or reassigning a computer, not for routine management.
    - question: Does Fleet use doWipe?
      answer: |
        Yes, as an option. Fleet's **Wipe** action and `fleetctl mdm wipe` send `doWipeProtected` by default. To send doWipe instead, call the [Wipe host](https://fleetdm.com/docs/rest-api/rest-api#wipe-host) API with `{ "windows": { "wipe_type": "doWipe" } }`.

        Either way, the host shows "Wipe pending" and then "Wiped" once Windows acknowledges the command. Wipe requires Fleet Premium. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How do I know doWipe worked?
      answer: |
        A `2xx` status means Windows accepted the wipe. In Fleet, the host changes from "Wipe pending" to "Wiped." For a custom command, run `fleetctl get mdm-command-results --id=<CmdID>`.

        Wait for the wipe to finish before deleting the host from Fleet. If you plan to enroll it again, delete the host first so Fleet escrows a new BitLocker key.
    - question: Why did doWipe fail with a 500 error?
      answer: |
        Usually because Windows couldn't start the reset, most often because the Windows Recovery Environment is broken or disabled.

        Fleet provides a [fallback wipe script](https://github.com/fleetdm/fleet/blob/main/docs/solutions/windows/scripts/wipe-windows-device.ps1) you can run on the host. It repairs WinRE, suspends BitLocker, and starts the wipe locally through the WMI bridge to the RemoteWipe CSP.
    - question: Can I cancel doWipe after sending it?
      answer: |
        No. Fleet doesn't let you cancel a pending Windows wipe. If the host re-enrolls in MDM before it receives the wipe, Fleet cancels it.
    - question: Can I reset a Windows PC without MDM?
      answer: |
        Yes. Go to **Settings > System > Recovery > Reset this PC** and choose **Remove everything**. That requires someone at the computer with admin rights. MDM lets you start the same reset remotely, without the user's involvement.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d85af4e3-ed77-4b4e-8a6f-d50ae80d35e4</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipe</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipeCloud
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipecloud
  description: Performs a cloud-based remote wipe on the device. The return status indicates whether the device accepted the command.
  supportedDeviceTypes:
    - Windows 10.0.22621
  faq:
    - question: What does the doWipeCloud MDM command do?
      answer: |
        It performs a cloud-based remote wipe. Windows removes all user accounts and data, like `doWipe`, but rebuilds from system files downloaded from Microsoft instead of the copy on the drive. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeCloud`.

        It's the remote counterpart to choosing **Cloud download** in **Reset this PC > Remove everything**.
    - question: What's the difference between doWipeCloud and doWipe?
      answer: |
        The result is the same: an empty computer that's no longer enrolled in MDM. The difference is where Windows gets its system files. doWipe rebuilds from local files. doWipeCloud downloads them, which helps when local files are damaged.

        doWipeCloud needs Windows 11, version 22H2 or later. doWipe works on Windows 10, version 1511 and later.
    - question: When should I use doWipeCloud?
      answer: |
        When a local reset fails or the Windows install is corrupt, so rebuilding from local files isn't reliable.

        Expect a large download. The computer needs a stable internet connection for the reset to finish. For lost or stolen devices, prefer `doWipeProtected`, which keeps retrying through power cycles.
    - question: How often is doWipeCloud used?
      answer: |
        Rarely. Most MDMs default to a local wipe, and admins reach for the cloud version only when a local reset doesn't work.
    - question: How do I run doWipeCloud with Fleet?
      answer: |
        As a custom command. Fleet's **Wipe** action only sends `doWipeProtected` or `doWipe`. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=wipe-cloud.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        All RemoteWipe commands require Fleet Premium. A custom wipe doesn't change the host's wipe status in Fleet, so track it from the command result.
    - question: How do I know doWipeCloud worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the wipe. The host then stops checking in. If it enrolls again, it shows up as a new enrollment, so delete the old host record first if you want Fleet to escrow a new BitLocker key.
    - question: What errors does doWipeCloud return?
      answer: |
        A `404` usually means the host runs a version older than Windows 11, version 22H2, where the node doesn't exist. Send `doWipe` to those hosts instead.

        A `500` means Windows couldn't start the reset, often because the Windows Recovery Environment is disabled. Check with `reagentc /info`.
    - question: Can I do a cloud reset without MDM?
      answer: |
        Yes. On the computer, go to **Settings > System > Recovery > Reset this PC**, choose **Remove everything**, then **Cloud download**. It needs someone at the computer with admin rights.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>f1b40cb3-d964-4378-bdd8-132305dcc879</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeCloud</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipeCloudPersistProvisionedData
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipecloudpersistprovisioneddata
  description: Performs a cloud-based remote wipe while preserving provisioning data by backing it up to a persistent location. The backed-up data is restored and applied when the device resumes. The return status indicates whether the device accepted the command.
  supportedDeviceTypes:
    - Windows 10.0.22621
  faq:
    - question: What does the doWipeCloudPersistProvisionedData MDM command do?
      answer: |
        It backs up the device's provisioning data, performs a cloud-based wipe, and reapplies the backed-up data when Windows starts again. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistProvisionedData`.

        User accounts, files, and apps are removed. Windows rebuilds from system files downloaded from Microsoft.
    - question: What provisioning data is preserved?
      answer: |
        Provisioning packages (`.ppkg` files) applied to the device. Windows keeps them in `%SystemDrive%\ProgramData\Microsoft\Provisioning` and applies them again after the reset.

        Anything the packages set up, like Wi-Fi, certificates, or an agent install, comes back. Settings and apps your MDM delivered don't, unless the device enrolls in MDM again.
    - question: How is it different from doWipePersistProvisionedData?
      answer: |
        Both keep provisioning packages. This command rebuilds Windows from a cloud download and needs Windows 11, version 22H2 or later. doWipePersistProvisionedData rebuilds from local files and works on Windows 10, version 1511 and later.

        Use the cloud version when local system files are damaged or a local reset has failed.
    - question: How is it different from doWipeCloud?
      answer: |
        doWipeCloud removes everything, including provisioning packages, so the computer comes back as if new. This command keeps the packages, so a computer provisioned with a `.ppkg` can set itself back up without anyone touching it.
    - question: How often is doWipeCloudPersistProvisionedData used?
      answer: |
        Rarely. It's mostly used by organizations that provision computers with packages instead of Autopilot, when a local reset isn't an option.
    - question: How do I run doWipeCloudPersistProvisionedData with Fleet?
      answer: |
        As a custom command, which requires Fleet Premium. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=wipe-cloud-keep-ppkg.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        It's most useful when your package installs fleetd, so the host can come back into Fleet on its own. See [Preinstall Fleet's agent on Windows with a provisioning package](https://fleetdm.com/guides/preinstall-fleets-agent-on-windows-with-a-provisioning-package).
    - question: How do I know doWipeCloudPersistProvisionedData worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the command. Fleet doesn't change the host's wipe status for custom wipe commands.

        Success looks like the computer finishing setup with your provisioning package applied again.
    - question: What errors does doWipeCloudPersistProvisionedData return?
      answer: |
        A `404` usually means the host runs a version older than Windows 11, version 22H2. Send `doWipePersistProvisionedData` to those hosts instead.

        A `500` means Windows couldn't start the reset, often because the Windows Recovery Environment is disabled. Check with `reagentc /info`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d07f227f-74c1-4a0d-8e79-f0a9bcf1ffe2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistProvisionedData</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipeCloudPersistUserData
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipecloudpersistuserdata
  description: Performs a cloud-based remote reset while preserving user accounts and data. The return status indicates whether the device accepted the command.
  supportedDeviceTypes:
    - Windows 10.0.22621
  faq:
    - question: What does the doWipeCloudPersistUserData MDM command do?
      answer: |
        It reinstalls Windows from a cloud download while keeping user accounts and their files. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistUserData`.

        It's the remote counterpart to **Reset this PC > Keep my files** with **Cloud download** selected.
    - question: Does doWipeCloudPersistUserData remove apps?
      answer: |
        Yes. Installed apps and settings are removed, and Windows is reinstalled. User accounts and personal files stay.

        Plan to reinstall software afterward. Apps the user installed themselves need to be installed again too.
    - question: How is it different from doWipePersistUserData?
      answer: |
        Both keep user accounts and files. This one rebuilds Windows from a cloud download and needs Windows 11, version 22H2 or later. doWipePersistUserData rebuilds from local files and works on Windows 10, version 1709 and later.

        Use the cloud version when local system files are damaged, or when a local reset has already failed.
    - question: When should I use doWipeCloudPersistUserData?
      answer: |
        To repair a broken Windows install without losing the user's files. It's a repair tool, not a wipe.

        Don't use it for lost or stolen devices, or before giving a computer to someone else, because user data stays on the drive. Use `doWipeProtected` or `doWipe` for those.
    - question: How often is doWipeCloudPersistUserData used?
      answer: |
        Rarely. Most Windows repairs are handled with scripts or software updates. A full reinstall that keeps files is a last resort before wiping.
    - question: How do I run doWipeCloudPersistUserData with Fleet?
      answer: |
        As a custom command, which requires Fleet Premium. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset-cloud-keep-files.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Apps are removed, which can include fleetd. Test on one host first, and plan how fleetd and your software will be reinstalled, for example with [a provisioning package](https://fleetdm.com/guides/preinstall-fleets-agent-on-windows-with-a-provisioning-package).
    - question: How do I know doWipeCloudPersistUserData worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the command. Fleet doesn't change the host's wipe status for custom wipe commands.

        After the reset, users sign in to their existing accounts and find their files in place.
    - question: What errors does doWipeCloudPersistUserData return?
      answer: |
        A `404` usually means the host runs a version older than Windows 11, version 22H2. Send `doWipePersistUserData` to those hosts instead.

        A `500` means Windows couldn't start the reset. Check that the Windows Recovery Environment is enabled with `reagentc /info`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ef6fd567-f6ac-43c9-854d-c8df66684f0d</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistUserData</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipePersistProvisionedData
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipepersistprovisioneddata
  description: Performs a remote wipe while preserving provisioning data by backing it up to a persistent location. The backed-up data is restored and applied when the device resumes. The return status indicates whether the device accepted the command. When using OMA Client Provisioning, include a dummy value of "1" for this element.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the doWipePersistProvisionedData MDM command do?
      answer: |
        It backs up provisioning packages, wipes the device from local system files, and reapplies the packages when Windows starts again. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipePersistProvisionedData`.

        User accounts, files, and apps are removed.
    - question: Where does Windows keep the provisioning data during the wipe?
      answer: |
        In `%SystemDrive%\ProgramData\Microsoft\Provisioning`. Windows restores and reapplies those packages after the reset.
    - question: What's the difference between doWipePersistProvisionedData and doWipe?
      answer: |
        doWipe removes everything. doWipePersistProvisionedData keeps your provisioning packages, so anything they deliver, like Wi-Fi, certificates, or an agent install, comes back after the reset.

        Choose it when you reset computers between users and set them up with packages. Choose doWipe when the computer should come back completely clean.
    - question: How is it different from doWipeCloudPersistProvisionedData?
      answer: |
        Both keep provisioning packages. This command rebuilds from local files and works on Windows 10, version 1511 and later. The cloud version downloads fresh system files and needs Windows 11, version 22H2 or later.
    - question: How often is doWipePersistProvisionedData used?
      answer: |
        Occasionally, by organizations that provision computers with packages instead of Autopilot and reset them between users.
    - question: How do I run doWipePersistProvisionedData with Fleet?
      answer: |
        As a custom command, which requires Fleet Premium. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=wipe-keep-ppkg.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        If your package installs fleetd, the host can come back into Fleet without hands-on work. See [Preinstall Fleet's agent on Windows with a provisioning package](https://fleetdm.com/guides/preinstall-fleets-agent-on-windows-with-a-provisioning-package).
    - question: Do I need to include a value of 1 in the command?
      answer: |
        No. Microsoft's note about a dummy value of `1` applies to OMA Client Provisioning, not to MDM commands. For MDM, leave `<Data>` out or empty. Fleet's own Windows wipe sends an empty `<Data>` element.
    - question: How do I know doWipePersistProvisionedData worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the command. Fleet doesn't change the host's wipe status for custom wipe commands.

        Success looks like the computer finishing setup with your provisioning package applied again.
    - question: What errors does doWipePersistProvisionedData return?
      answer: |
        A `500` means Windows couldn't start the reset, most often because the Windows Recovery Environment is disabled. Run `reagentc /enable` on the host, for example with a Fleet script, and try again. A `400` usually means the payload is malformed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>505af1a0-407c-4971-a193-1a25a94abb2b</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipePersistProvisionedData</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipePersistUserData
