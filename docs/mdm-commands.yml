- name: Active NSExtensions
  platform: apple
  category: Extensions
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/active-nsextensions-command
  description: Get a list of active extensions for a user on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the ActiveNSExtensions MDM command do?
      answer: |
        It lists the app extensions that are active for a user on a Mac, like share, Finder, and Photos extensions. Each entry in the `ActiveNSExtensions` response includes the extension's `Identifier`, `DisplayName`, `ExtensionPoint`, `Path`, and `Version`.

        Use `FilterExtensionPoints` to return only certain extension points, like `com.apple.share-services`.
    - question: How often is ActiveNSExtensions used?
      answer: |
        Rarely. It's a special-purpose inventory command, mostly used to audit extensions before restricting them with a configuration profile.
    - question: Does Fleet send ActiveNSExtensions automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature.
    - question: Can I run ActiveNSExtensions with Fleet?
      answer: |
        Not effectively. Apple only accepts `ActiveNSExtensions` on the user channel, and Fleet's custom MDM commands are sent on the device channel. A Mac returns an error if you send it with `fleetctl mdm run-command`.

        To inventory extensions, write a Fleet report with osquery instead. See the [osquery table docs](https://fleetdm.com/tables).
    - question: Does ActiveNSExtensions require a supervised Mac?
      answer: |
        Yes. Apple requires supervision, the user channel, and the `QueryInstalledApps` access right. It isn't available in user enrollment.
    - question: Why are some extensions missing from ActiveNSExtensions results?
      answer: |
        Extensions blocked by an application launch restriction or an NSExtension management profile don't appear. The results are also per user, so extensions another user turned on aren't listed.
    - question: What's the difference between ActiveNSExtensions and NSExtensionMappings?
      answer: |
        `ActiveNSExtensions` returns only extensions the user has turned on. `NSExtensionMappings` returns every installed extension for the user, including ones the system never turns on because of restrictions.

        `NSExtensionMappings` is a superset of `ActiveNSExtensions`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
