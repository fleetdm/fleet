- name: Clear restrictions password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/clear-restrictions-password-command
  description: Remove the passcode from a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
  faq:
    - question: What does the ClearRestrictionsPassword MDM command do?
      answer: |
        `ClearRestrictionsPassword` clears the Screen Time passcode on a supervised iPhone or iPad. In older versions of iOS, this was called the restrictions passcode.

        The command has no keys other than `RequestType`.
    - question: Does ClearRestrictionsPassword turn off Screen Time?
      answer: |
        It depends. In iOS 12.2 and later, if Screen Time shares its settings across devices with iCloud, the command turns off Screen Time and clears its restrictions. Otherwise, it clears the passcode but leaves Screen Time and its restrictions on.

        In iOS 11 and earlier, it cleared the restrictions password and all the restrictions it protected.
    - question: When would I use ClearRestrictionsPassword?
      answer: |
        Rarely. Use it when a user set a Screen Time passcode on a company device and forgot it, or when a previous user left one behind and the next user can't change Screen Time settings.
    - question: Is a Screen Time passcode the same as the device passcode?
      answer: |
        No. The device passcode unlocks the iPhone or iPad. The Screen Time passcode only protects Screen Time settings and limits. To remove the device passcode, use `ClearPasscode` instead.
    - question: Does ClearRestrictionsPassword require a supervised device?
      answer: |
        Yes. Apple supports it only on supervised iPhones and iPads, on the device channel. Devices enrolled through Automated Device Enrollment (ADE) are supervised. It isn't available for User Enrollment (BYOD) or on macOS.
    - question: Why does ClearRestrictionsPassword fail on a child's device?
      answer: |
        Apple blocks it. If the device's user is a child in an iCloud family, the command fails, because Screen Time for that user is managed by the family organizer. The organizer has to change it from their own device.

        If the device is company-owned and the passcode can't be cleared, erasing the device is the remaining option.
    - question: How do I clear a Screen Time passcode with Fleet?
      answer: |
        Fleet doesn't have a built-in action for this, so send it as a custom command. Save a plist with `RequestType` set to `ClearRestrictionsPassword` and run `fleetctl mdm run-command --hosts=<hostname> --payload=clear-restrictions-password.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Custom commands work in Fleet Free and Fleet Premium, for admins and maintainers. Learn more in the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: How do I know ClearRestrictionsPassword worked?
      answer: |
        `Acknowledged` means the device cleared the passcode. `Error` includes an `ErrorChain` that explains why it didn't. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        To confirm on the device, open **Settings > Screen Time** and check that no passcode is required.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ClearRestrictionsPassword</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ClearRestrictionsPassword</string>
    </dict>
    </plist>

- name: Unlock user account
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/unlock-user-account-command
  description: Unlock a user account that the system locked because of too many failed password attempts.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the UnlockUserAccount MDM command do?
      answer: |
        `UnlockUserAccount` unlocks a local macOS user account that the system locked after too many failed password attempts. Put the account's short name in the `UserName` key.

        It works on any local account on the Mac, not only accounts that MDM created. It doesn't change or reveal the password.
    - question: When do IT admins use UnlockUserAccount?
      answer: |
        Occasionally, as a help desk fix. A common case is a Mac with a passcode policy profile that sets a maximum number of failed attempts. When a user hits that limit, the account locks, and this command lets them try again right away.
    - question: Should I use UnlockUserAccount if the user forgot their password?
      answer: |
        No. The command only clears the lockout. The user still needs the correct password to sign in.

        If the user forgot their password on a FileVault-encrypted Mac, sign in with the escrowed recovery key and reset the password. Learn how in the [disk encryption guide](https://fleetdm.com/guides/enforce-disk-encryption#use-disk-encryption-key-to-login).
    - question: Does UnlockUserAccount require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision, on the device channel. The enrollment must also grant the `DeviceLockAndRemovePasscode` access right. Macs enrolled through Automated Device Enrollment (ADE) are supervised.
    - question: Is UnlockUserAccount the same as unlocking a locked Mac?
      answer: |
        No. `UnlockUserAccount` clears a lockout on one user account. A Mac locked with the `DeviceLock` command is locked at startup and needs the six-digit PIN that MDM set.

        In Fleet, the **Unlock** action on a Mac shows that PIN. It doesn't unlock individual user accounts.
    - question: How do I unlock a macOS user account with Fleet?
      answer: |
        Fleet doesn't have a built-in action for this, so send it as a custom command. Save a plist with `RequestType` set to `UnlockUserAccount` and `UserName` set to the account's short name, such as `jdoe`. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=unlock-user-account.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Custom commands work in Fleet Free and Fleet Premium, for admins and maintainers.
    - question: How do I find the short name of the locked account?
      answer: |
        The short name is the account's username, which is also the name of its home folder in `/Users`. In Fleet, you can find it in the **Local user accounts** card on the host's **Host details** page, or with a report on the `users` table.
    - question: How do I know UnlockUserAccount worked?
      answer: |
        `Acknowledged` means macOS processed the unlock, and the user can try signing in again. If you get `Error`, check the `ErrorChain`. A misspelled or nonexistent `UserName` is a common cause.

        In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>UnlockUserAccount</string>
            <key>UserName</key>
            <string>graham</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_UnlockUserAccount</string>
    </dict>
    </plist>

- name: Set local admin password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/set-auto-admin-password-command
  description: Update the local administrator account password.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the SetAutoAdminPassword MDM command do?
      answer: |
        `SetAutoAdminPassword` changes the password of a local administrator account that MDM created on a Mac during Automated Device Enrollment (ADE).

        The payload has two keys. `GUID` identifies the admin account. `passwordHash` is a salted SHA-512 PBKDF2 password hash, sent as plist data. The plain-text password is never sent to the Mac.
    - question: Which accounts can SetAutoAdminPassword change?
      answer: |
        Only admin accounts that MDM created during ADE with the `AccountConfiguration` command. If the `GUID` doesn't match one of those accounts, the command returns an error.

        It can't change the password of the user's own account or any other local account.
    - question: How do I rotate a local admin password on a Mac without ADE?
      answer: |
        Use a script instead of MDM. For example, run a script with `sysadminctl -resetPasswordFor` to set a new password, and store it in your password manager. Fleet can run the script on a schedule with a policy automation.

        Learn how in the guide to [securing local admin passwords](https://fleetdm.com/guides/secure-local-admin-passwords).
    - question: Does SetAutoAdminPassword require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision, on the device channel. In practice, the Mac must have enrolled through ADE, because that's the only way MDM can create the admin account the command targets.
    - question: Does Fleet use SetAutoAdminPassword?
      answer: |
        Yes. Fleet Premium can create a hidden admin account, `_fleetadmin`, during macOS setup when **Controls > Setup experience > Users** is set to create one. Fleet uses `SetAutoAdminPassword` to rotate that account's password.

        Fleet sends it when you click **Rotate password** in **Host details > Actions > Show managed account**. It also rotates the password automatically about an hour after someone views it. Learn more in the [setup experience guide](https://fleetdm.com/guides/setup-experience#managed-local-account).
    - question: Can I send SetAutoAdminPassword as a custom command?
      answer: |
        Yes, with `fleetctl mdm run-command --hosts=<hostname> --payload=<file>` or the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. You need the account's GUID and a correctly built password hash.

        Don't do this for Fleet's `_fleetadmin` account. Fleet won't know the new password, so the password shown in **Show managed account** will be wrong. Use **Rotate password** instead.
    - question: How do I know the admin password rotation worked?
      answer: |
        `Acknowledged` means the Mac set the new password. `NotNow` means it will retry at a later check-in.

        In Fleet, open **Host details > Actions > Show managed account** to see the current password. If the Mac returns an error, Fleet logs a "failed to rotate managed local account password" activity.
    - question: Why is password rotation delayed on a newly enrolled Mac?
      answer: |
        The MDM needs the account's GUID before it can send `SetAutoAdminPassword`. Right after ADE enrollment, Fleet may not have it yet. Fleet holds the rotation and sends it automatically once fleetd reports the account, usually soon after the first check-in.
