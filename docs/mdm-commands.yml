- name: Set firmware password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/set-firmware-password-command
  description: Change or clear the firmware password on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the SetFirmwarePassword MDM command do?
      answer: |
        The `SetFirmwarePassword` command sets, changes, or clears the firmware (EFI) password on an Intel-based Mac. Set `NewPassword` to the new password, or to an empty string to clear it. If a password already exists, include it in `CurrentPassword`.

        `AllowOroms` controls whether option ROMs can load. After processing the command, the Mac restarts so the new password takes effect.
    - question: Does SetFirmwarePassword work on Apple silicon Macs?
      answer: |
        No. Apple silicon Macs don't support firmware passwords, and the command isn't supported on them.

        On Apple silicon, use a Recovery Lock password instead. Fleet Premium can set and rotate Recovery Lock passwords for you. Learn more in the [Recovery Lock password guide](https://fleetdm.com/guides/recovery-lock-password).
    - question: Does Fleet send SetFirmwarePassword automatically?
      answer: |
        No. Fleet doesn't manage firmware passwords and doesn't send this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I set a firmware password with Fleet?
      answer: |
        Save a plist with `RequestType` set to `SetFirmwarePassword`, `NewPassword`, and, if one exists, `CurrentPassword`. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        The password must use printable low-ASCII characters (`0x20` through `0x7E`) so it can be typed at the EFI prompt. Store the password somewhere safe before you send the command. Fleet doesn't escrow it.
    - question: What if I don't know the current firmware password?
      answer: |
        MDM can't help. Apple doesn't provide a way to change or clear an existing firmware password without the current one. Contact AppleCare for help with a Mac whose firmware password is unknown.
    - question: Does SetFirmwarePassword require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision on macOS 10.13 and later, on the device channel. The enrollment must also grant the device lock and passcode removal access right.
    - question: How do I know SetFirmwarePassword worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The response includes a `SetFirmwarePassword` dictionary with `PasswordChanged`. `true` means the change succeeded.

        Because the Mac restarts to apply it, you can confirm with the `VerifyFirmwarePassword` command afterward.
    - question: Why did SetFirmwarePassword return an error?
      answer: |
        Common causes:

        - The Mac has Apple silicon.
        - `CurrentPassword` is missing or wrong.
        - A firmware password change is already pending a restart.
        - The command was sent again within 30 seconds. Apple throttles it.

        Check the `ErrorChain` in the command result for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>AllowOroms</key>
            <false/>
            <key>CurrentPassword</key>
            <string>oldpassword</string>
            <key>NewPassword</key>
            <string>newpassword</string>
            <key>RequestType</key>
            <string>SetFirmwarePassword</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_SetFirmwarePassword</string>
    </dict>
    </plist>

- name: Verify firmware password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/verify-firmware-password-command
  description: Verify the firmware password on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the VerifyFirmwarePassword MDM command do?
      answer: |
        The `VerifyFirmwarePassword` command checks whether a password matches the firmware (EFI) password on an Intel-based Mac. It doesn't change anything.

        The payload has one key, `Password`. The response includes a `VerifyFirmwarePassword` dictionary with `PasswordVerified` set to `true` or `false`.
    - question: When would I use VerifyFirmwarePassword?
      answer: |
        Rarely. Use it to confirm that a firmware password you stored matches what's on the Mac, for example after `SetFirmwarePassword` or before you hand off a Mac. It's a spot check, not routine management.
    - question: Does Fleet send VerifyFirmwarePassword automatically?
      answer: |
        No. Fleet doesn't manage firmware passwords. You can send this command as a custom MDM command.
    - question: How do I run VerifyFirmwarePassword with Fleet?
      answer: |
        Save a plist with `RequestType` set to `VerifyFirmwarePassword` and `Password` set to the password to check. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        You can also base64-encode the plist and send it with `POST /api/v1/fleet/commands/run`. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: Does VerifyFirmwarePassword work on Apple silicon Macs?
      answer: |
        No. Apple silicon Macs don't have firmware passwords. To check a Recovery Lock password on Apple silicon, use `VerifyRecoveryLock`.
    - question: Does VerifyFirmwarePassword require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision on macOS 10.13 and later, on the device channel. Macs enrolled through Automated Device Enrollment (ADE) are supervised.
    - question: How do I read the VerifyFirmwarePassword result?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` and look for `PasswordVerified`. `true` means the password matches. `false` means it doesn't.

        A status of `Acknowledged` only means the Mac processed the command. Always check `PasswordVerified` too.
    - question: Why did VerifyFirmwarePassword return an error?
      answer: |
        The usual causes are an Apple silicon Mac, or sending the command again within 30 seconds. Apple throttles firmware password commands to one every 30 seconds. Check the `ErrorChain` for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>AllowOroms</key>
            <false/>
            <key>CurrentPassword</key>
            <string>oldpassword</string>
            <key>NewPassword</key>
            <string>newpassword</string>
            <key>RequestType</key>
            <string>SetFirmwarePassword</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_SetFirmwarePassword</string>
    </dict>
    </plist>

- name: Enable lost mode
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/enable-lost-mode-command
  description: Verify the firmware password on a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the EnableLostMode MDM command do?
      answer: |
        The `EnableLostMode` command puts a supervised iPhone or iPad into Lost Mode. The device locks and shows a message, a phone number, or both on the Lock Screen. The end user can't use the device until MDM turns Lost Mode off.

        The payload takes `Message`, `PhoneNumber`, and `Footnote`. You must include `Message` or `PhoneNumber`.
    - question: Does Fleet use EnableLostMode?
      answer: |
        Yes. When you lock an iOS or iPadOS host with **Host details > Actions > Lock**, Fleet sends `EnableLostMode`. The Lock Screen shows "This device is locked. It belongs to" followed by your organization name.

        After the device responds, Fleet sends `DeviceLocation` to collect the device's location. Fleet doesn't consider the device fully locked until it has location data. Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How often is EnableLostMode used?
      answer: |
        Rarely. It's an incident response command for lost or stolen devices, or for devices that need to be held until they're returned. MDM servers don't send it during routine management.
    - question: Is locking an iPhone or iPad available in Fleet Free?
      answer: |
        The built-in **Lock** action is available in Fleet Premium. The lock and wipe features in Fleet are Premium features.

        You can also send `EnableLostMode` as a custom MDM command with `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`. Use the built-in action when you can, because it also collects location and tracks the host's lock status.
    - question: Does Lost Mode require a supervised device?
      answer: |
        Yes. Apple supports `EnableLostMode` only on supervised iPhones and iPads, on the device channel. In Fleet, the **Lock** action is available only for company-owned (supervised) iOS and iPadOS hosts. Lost Mode isn't available on macOS or for User Enrollment (BYOD).
    - question: How do I know the device is in Lost Mode?
      answer: |
        In Fleet, the host shows a **Lock pending** badge, then **Locked** once the device acknowledges the command and reports its location.

        For custom commands, run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device entered Lost Mode.
    - question: What errors can EnableLostMode return?
      answer: |
        If the device isn't supervised, the command fails with an error in the `ErrorChain`. While a device is in Lost Mode, it rejects commands that aren't valid in Lost Mode with error code `12078`.
    - question: Can I cancel a pending Lost Mode command?
      answer: |
        Yes. If the device hasn't received it yet, go to **Host details > Activity > Upcoming > MDM commands** in Fleet, or use the [cancel host's pending MDM command](https://fleetdm.com/docs/rest-api/rest-api#cancel-hosts-pending-mdm-command) API endpoint.
    - question: How do I take a device out of Lost Mode?
      answer: |
        Send `DisableLostMode`. In Fleet, click **Host details > Actions > Unlock** on the locked iOS or iPadOS host. Erasing the device also turns off Lost Mode.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Footnote</key>
            <string>Return to Acme, Inc.</string>
            <key>Message</key>
            <string>Lock Message</string>
            <key>PhoneNumber</key>
            <string>408-555-555</string>
            <key>RequestType</key>
            <string>EnableLostMode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_EnableLostMode</string>
    </dict>
    </plist>

- name: Device location
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-location-command
  description: Request the location of a device when in Lost Mode.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the DeviceLocation MDM command do?
      answer: |
        The `DeviceLocation` command asks an iPhone or iPad in Lost Mode for its current location. The response includes `Latitude`, `Longitude`, `HorizontalAccuracy`, `Altitude`, `Speed`, `Course`, and a `Timestamp`.

        It only works while the device is in Lost Mode. MDM can't use it to track devices during normal use.
    - question: Does Fleet use DeviceLocation?
      answer: |
        Yes. After an iOS or iPadOS host responds to Fleet's **Lock** action (`EnableLostMode`), Fleet sends `DeviceLocation` automatically. Fleet also sends it when you click **Refetch** on a locked host that's assigned to Fleet through Automated Device Enrollment (ADE).

        To see the result, open **Host details**, go to **Vitals**, click **Show location**, then click **Open in Google Maps**.
    - question: How often is DeviceLocation sent?
      answer: |
        Only while a device is locked in Lost Mode. In Fleet, that means once after locking and again each time you refetch the locked host. It's never sent to devices that aren't in Lost Mode.
    - question: How do I send DeviceLocation as a custom command?
      answer: |
        Save a plist with `RequestType` set to `DeviceLocation`. The command has no other keys. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        Read `Latitude` and `Longitude` from the result and open `https://google.com/maps?q=LATITUDE,LONGITUDE` with those values. See the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: Can I get the location of a Mac with MDM?
      answer: |
        No. `DeviceLocation` is only supported on supervised iPhones and iPads in Lost Mode. Macs and User Enrollment (BYOD) devices aren't supported.
    - question: What errors can DeviceLocation return?
      answer: |
        Apple documents these error codes:

        - `12067`: the device isn't in Lost Mode.
        - `12068`: the device's location is unknown.
        - `12078`: the command isn't valid while in Lost Mode.

        If you get `12068`, check that Location Services is available on the device and try again later.
    - question: How do I know DeviceLocation worked?
      answer: |
        In Fleet, the host's location appears under **Vitals > Show location**. For a custom command, run `fleetctl get mdm-command-results --id=<command-uuid>` and look for `Acknowledged` with `Latitude` and `Longitude` in the response.

        A negative value for accuracy, altitude, speed, or course means the device doesn't know that value.
    - question: Is DeviceLocation available in Fleet Free?
      answer: |
        Sending `DeviceLocation` as a custom MDM command works in Fleet Free and Fleet Premium. But the device must already be in Lost Mode, and Fleet's built-in **Lock** action, which turns on Lost Mode, is a Fleet Premium feature.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DeviceLocation</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DeviceLocation</string>
    </dict>
    </plist>

- name: Play lost mode sound
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/play-lost-mode-sound-command
  description: Play the Lost Mode sound on a device that’s in Lost Mode.
  supportedDeviceTypes:
    - iOS 10.3+
    - ipadOS 10.3+
  faq:
    - question: What does the PlayLostModeSound MDM command do?
      answer: |
        The `PlayLostModeSound` command makes an iPhone or iPad in Lost Mode play a sound, so someone nearby can find it. The sound keeps playing until MDM turns off Lost Mode or someone stops the sound on the device.

        The command has no keys other than `RequestType`.
    - question: When would I use PlayLostModeSound?
      answer: |
        Rarely. Use it when a locked device is likely nearby, like in an office, classroom, or warehouse, and you want to find it by sound. Pair it with `DeviceLocation` to narrow down where to look.
    - question: Does Fleet send PlayLostModeSound automatically?
      answer: |
        No. Fleet's **Lock** action for iOS and iPadOS puts the device in Lost Mode but doesn't play a sound. You can send `PlayLostModeSound` as a custom MDM command.
    - question: How do I play a sound on a lost iPhone with Fleet?
      answer: |
        First, lock the host with **Host details > Actions > Lock** (Fleet Premium). Then save a plist with `RequestType` set to `PlayLostModeSound` and run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        You can also base64-encode the plist and send it with `POST /api/v1/fleet/commands/run`.
    - question: Does PlayLostModeSound require Lost Mode?
      answer: |
        Yes. The device must be supervised and already in Lost Mode. If it isn't in Lost Mode, the device returns error code `12067`.
    - question: Can I play a sound on a Mac with MDM?
      answer: |
        No. `PlayLostModeSound` is only supported on supervised iPhones and iPads running iOS 10.3 or later. It isn't available on macOS or for User Enrollment (BYOD).
    - question: How do I know PlayLostModeSound worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` or check **Host details > Show MDM commands**. `Acknowledged` means the device started playing the sound.

        `Error` with code `12067` means the device isn't in Lost Mode. Code `12078` means the command isn't valid while in Lost Mode.
    - question: How do I stop the Lost Mode sound?
      answer: |
        Turn off Lost Mode with `DisableLostMode`. In Fleet, use **Host details > Actions > Unlock**. Someone holding the device can also stop the sound on the device.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>PlayLostModeSound</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_PlayLostModeSound</string>
    </dict>
    </plist>

- name: Disable lost mode
  platform: apple
  category: Lost device
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/disable-lost-mode-command
  description: Take the device out of Lost Mode.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the DisableLostMode MDM command do?
      answer: |
        The `DisableLostMode` command takes a supervised iPhone or iPad out of Lost Mode. The Lost Mode message goes away and the end user can unlock the device with their passcode.

        The command has no keys other than `RequestType`.
    - question: Does Fleet use DisableLostMode?
      answer: |
        Yes. When you unlock a locked iOS or iPadOS host with **Host details > Actions > Unlock**, Fleet sends `DisableLostMode`. When the device acknowledges it, Fleet deletes the location data it collected while the device was locked. Learn more in the [lock and wipe hosts guide](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How often is DisableLostMode used?
      answer: |
        Only to reverse Lost Mode, usually after a lost device is found. It isn't part of routine device management.
    - question: Can I send DisableLostMode as a custom command?
      answer: |
        Yes. Save a plist with `RequestType` set to `DisableLostMode` and run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        If you locked the host with Fleet's **Lock** action, use **Unlock** instead. The built-in action keeps the host's lock status in Fleet accurate.
    - question: What errors can DisableLostMode return?
      answer: |
        Apple documents these error codes:

        - `12067`: the device isn't in Lost Mode.
        - `12069`: the request to turn off Lost Mode failed.
        - `12078`: the command isn't valid while in Lost Mode.
    - question: How do I know DisableLostMode worked?
      answer: |
        In Fleet, the **Locked** badge clears after the device acknowledges the command. For a custom command, run `fleetctl get mdm-command-results --id=<command-uuid>` and look for `Acknowledged`.

        If you unlock within a minute of locking, the badge may stay until the next MDM check-in.
    - question: Does erasing a device turn off Lost Mode?
      answer: |
        Yes. Erasing a device also turns off Lost Mode. If you want the device back in Lost Mode after it re-enrolls, send `EnableLostMode` again.
    - question: Does DisableLostMode require a supervised device?
      answer: |
        Yes. Like the other Lost Mode commands, Apple supports it only on supervised iPhones and iPads, on the device channel.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DisableLostMode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DisableLostMode</string>
    </dict>
    </plist>

- name: Set Recovery Lock
  platform: apple
  category: Recovery lock
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/set-recovery-lock-command
  description: Set or clear the Recovery Lock password.
  supportedDeviceTypes:
    - macOS 11.5+
  faq:
    - question: What does the SetRecoveryLock MDM command do?
      answer: |
        The `SetRecoveryLock` command sets, changes, or clears the Recovery Lock password on an Apple silicon Mac. With Recovery Lock on, anyone who starts the Mac in recoveryOS must enter the password first.

        Set `NewPassword` to the new password, or to an empty string to clear it. If a password already exists, include it in `CurrentPassword`.
    - question: Why use Recovery Lock?
      answer: |
        It stops end users and attackers from making changes in recoveryOS, like turning off System Integrity Protection (SIP), lowering startup security, or erasing and reinstalling macOS. It's the Apple silicon replacement for the Intel firmware password.
    - question: Does Fleet use SetRecoveryLock?
      answer: |
        Yes. Fleet Premium sends `SetRecoveryLock` when you turn on **Controls > OS settings > Passwords > Turn on Recovery Lock password** for a fleet. Fleet generates a unique password for each host, encrypts it, and stores it.

        Fleet also sends it to rotate the password and to clear it when you turn the setting off. After the Mac acknowledges the command, Fleet sends `VerifyRecoveryLock` to confirm. Learn more in the [Recovery Lock password guide](https://fleetdm.com/guides/recovery-lock-password).
    - question: How do I view or rotate a Recovery Lock password in Fleet?
      answer: |
        Open the Mac's **Host details** page and click **Actions > Show recovery lock password**. Click **Rotate password** to generate and send a new one.

        Fleet logs an activity when a password is set, rotated, or viewed. Rotating requires the maintainer role or higher.
    - question: Can I send SetRecoveryLock as a custom command?
      answer: |
        Yes, but only for hosts in fleets where Fleet's Recovery Lock password setting is off. If it's on, Fleet rejects the custom command with a 409 conflict, so it doesn't overwrite the password Fleet manages.

        Otherwise, run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`. Fleet won't store your custom password, so save it yourself.
    - question: Which Macs support Recovery Lock?
      answer: |
        Apple silicon Macs running macOS 11.5 or later. Intel Macs don't support it. Apple lists the command as requiring supervision, on the device channel, and the enrollment must grant the device lock and passcode removal access right.

        In Fleet, the feature requires Fleet Premium and MDM turned on.
    - question: What happens to the Recovery Lock password if the Mac unenrolls?
      answer: |
        macOS removes it. When a Mac unenrolls from MDM, the system clears the Recovery Lock password.
    - question: How do I know SetRecoveryLock worked?
      answer: |
        In Fleet, check the Recovery Lock row in the host's **OS settings** status. **Verified** means Fleet set the password and the Mac confirmed it. **Enforcing (pending)** means it's in progress. **Failed** means it didn't work.

        For custom commands, run `fleetctl get mdm-command-results --id=<command-uuid>` and follow up with `VerifyRecoveryLock`.
    - question: Why did SetRecoveryLock fail?
      answer: |
        The most common cause is a wrong or missing `CurrentPassword` when the Mac already has a password. Fleet has seen `MDMClientError` code `70` ("Existing recovery lock password not provided") and `ROSLockoutServiceDaemonErrorDomain` code `8` ("The provided recovery password failed to validate").

        The command also fails on Intel Macs and on Macs that aren't supervised.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>SetRecoveryLock</string>
            <key>NewPassword</key>
            <string>Apple</string>
        </dict>
    </dict>
    </plist>

- name: Verify Recovery Lock
  platform: apple
  category: Recovery lock
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/verify-recovery-lock-command
  description: Verify the device’s Recovery Lock password.
  supportedDeviceTypes:
    - macOS 11.5+
  faq:
    - question: What does the VerifyRecoveryLock MDM command do?
      answer: |
        The `VerifyRecoveryLock` command checks whether a password matches the Recovery Lock password on an Apple silicon Mac. It doesn't change anything.

        The payload has one key, `Password`. The response includes `PasswordVerified`, set to `true` or `false`.
    - question: Does Fleet use VerifyRecoveryLock?
      answer: |
        Yes. Fleet Premium sends `VerifyRecoveryLock` right after a Mac acknowledges a `SetRecoveryLock` command. A host's Recovery Lock status changes to **Verified** only after this check passes.

        When Fleet clears a password, it verifies with an empty password, which matches only when no Recovery Lock password is set. Learn more in the [Recovery Lock password guide](https://fleetdm.com/guides/recovery-lock-password).
    - question: How often is VerifyRecoveryLock sent?
      answer: |
        Only alongside Recovery Lock changes. In Fleet, it follows each set, rotation, or clear, and Fleet retries it if the Mac returns a temporary error. It isn't part of regular host refreshes.
    - question: Can I send VerifyRecoveryLock as a custom command?
      answer: |
        Yes, but only for hosts in fleets where Fleet's Recovery Lock password setting is off. If it's on, Fleet rejects the command with a 409 conflict. To see the password Fleet manages, use **Host details > Actions > Show recovery lock password**.

        Otherwise, save a plist with `RequestType` set to `VerifyRecoveryLock` and `Password`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.
    - question: Does Acknowledged mean the Recovery Lock password is correct?
      answer: |
        No. The Mac acknowledges the command whether or not the password matched. Always check `PasswordVerified` in the response. `true` means the password matches. `false` means it doesn't.
    - question: Which Macs support VerifyRecoveryLock?
      answer: |
        Apple silicon Macs running macOS 11.5 or later. Apple lists it as requiring supervision, on the device channel. Intel Macs use firmware passwords instead, which you check with `VerifyFirmwarePassword`.
    - question: How do I read the VerifyRecoveryLock result?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` and look for `PasswordVerified`. In Fleet, the host's **OS settings** status shows **Verified** when Fleet's check passes and **Failed** when it doesn't.
    - question: What errors can VerifyRecoveryLock return?
      answer: |
        Fleet has seen `MDMClientError` code `70` when the Mac has no Recovery Lock password set, and `ROSLockoutServiceDaemonErrorDomain` code `8` when the password fails to validate. Check the `ErrorChain` in the command result for the exact domain and description.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>VerifyRecoveryLock</string>
            <key>Password</key>
            <string>Apple</string>
        </dict>
    </dict>
    </plist>

- name: Content caching information
  platform: apple
  category: Content caching
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/content-caching-information-command
  description: Get the status of the content caches on a device.
  supportedDeviceTypes:
    - macOS 10.15.4+
  faq:
    - question: What does the ContentCachingInformation MDM command do?
      answer: |
        The `ContentCachingInformation` command asks a Mac that runs a content cache for its status. Content caching stores Apple software updates, apps, and iCloud data on the local network, so other devices download them faster.

        The response includes keys like `Activated`, `Active`, `CacheUsed`, `CacheFree`, `CacheLimit`, `CacheStatus`, `Peers`, `Parents`, `Alerts`, and byte totals served to clients.
    - question: When would I use ContentCachingInformation?
      answer: |
        Occasionally, to check the health of Macs you've set up as content caches. For example, use it to confirm a cache is active, see how much disk space it uses, or find registration errors. It isn't sent to every Mac, and it isn't part of routine management.
    - question: Does Fleet send ContentCachingInformation automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run ContentCachingInformation with Fleet?
      answer: |
        Save a plist with `RequestType` set to `ContentCachingInformation`. The command has no other keys. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        You can also base64-encode the plist and send it with `POST /api/v1/fleet/commands/run`. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: Does ContentCachingInformation require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision on macOS 10.15.4 and later, on the device channel. The enrollment must also grant the right to query network information.
    - question: How do I turn on content caching with Fleet?
      answer: |
        Deliver a configuration profile with the `com.apple.AssetCache.managed` payload. Add it in **Controls > OS settings > Configuration profiles**. You can also turn on content caching on the Mac in **System Settings > General > Sharing**.

        Learn more in the [custom OS settings guide](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I read the ContentCachingInformation result?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Activated` means content caching is turned on. `Active` means it's ready to serve requests. A `CacheStatus` of `LowSpace` means cache pressure is high.

        `RegistrationError` and `Alerts` explain why a cache isn't working.
    - question: What does it mean if ContentCachingInformation shows Activated but not Active?
      answer: |
        Content caching is turned on but isn't ready to serve content. Check `RegistrationStatus`, `RegistrationError`, and `Alerts` in the response. A cache that can't register with Apple won't serve devices.
  command: |
    TODO

- name: Request AirPlay mirroring
  platform: apple
  category: Airplay mirroring
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/request-mirroring-command
  description: Prompt the user to share their screen using AirPlay Mirroring.
  supportedDeviceTypes:
    - iOS 7.0+
    - ipadOS 7.0+
    - macOS 10.10+
  faq:
    - question: What does the RequestMirroring MDM command do?
      answer: |
        The `RequestMirroring` command prompts the user of an iPhone, iPad, or Mac to share their screen to an AirPlay destination, like an Apple TV.

        Name the destination with `DestinationName` or `DestinationDeviceID`. If you include both, the device uses `DestinationDeviceID`. You can also set `Password` for the destination and `ScanTime`, the number of seconds to search for it.
    - question: When would I use RequestMirroring?
      answer: |
        Occasionally, in classrooms, conference rooms, and kiosks. For example, a teacher or presenter can send a device's screen to a room's Apple TV without walking the user through AirPlay settings. It isn't part of routine device management.
    - question: Does Fleet send RequestMirroring automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run RequestMirroring with Fleet?
      answer: |
        Save a plist with `RequestType` set to `RequestMirroring` and either `DestinationName` or `DestinationDeviceID`. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`.

        You can also base64-encode the plist and send it with `POST /api/v1/fleet/commands/run`. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: Does RequestMirroring require a supervised device?
      answer: |
        No. Apple doesn't require supervision, and it's allowed on User Enrollment (BYOD) devices running iOS and macOS. It runs on the device channel.
    - question: Will the user see a prompt?
      answer: |
        Yes. When the response's `MirroringResult` is `Prompting`, the user is being asked to share their screen. The user can cancel, which returns `Cancelled`.
    - question: How do I know RequestMirroring worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` and check `MirroringResult`:

        - `Prompting`: the user is being prompted to share their screen.
        - `DestinationNotFound`: the device couldn't reach the destination.
        - `Cancelled`: the user canceled.
        - `Unknown`: an unknown error occurred.
    - question: Why does RequestMirroring return DestinationNotFound?
      answer: |
        The device couldn't find the AirPlay destination in the scan time. Check that the destination is on, on the same network, and that `DestinationName` matches its name exactly.

        Increase `ScanTime`, which accepts `10` to `300` seconds and defaults to `30`. On Apple TV with tvOS 18 or later, use `DestinationName`, because `DestinationDeviceID` isn't supported.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>DestinationName</key>
            <string>Apple TV</string>
            <key>Password</key>
            <string>password</string>
            <key>RequestType</key>
            <string>RequestMirroring</string>
            <key>ScanTime</key>
            <integer>30</integer>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RequestMirroring</string>
    </dict>
    </plist>

- name: Stop AirPlay mirroring
  platform: apple
  category: Airplay mirroring
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/stop-mirroring-command
  description: Stop mirroring the display to another device.
  supportedDeviceTypes:
    - iOS 7.0+
    - ipadOS 7.0+
    - macOS 10.10+
  faq:
    - question: What does the StopMirroring MDM command do?
      answer: |
        The `StopMirroring` command ends AirPlay Mirroring on an iPhone, iPad, or Mac. The device stops sharing its screen to the AirPlay destination.

        The command has no keys other than `RequestType`.
    - question: When would I use StopMirroring?
      answer: |
        Occasionally, to end a screen share you started with `RequestMirroring`, or to stop a device from mirroring to a room display. Classrooms and conference rooms are common cases. It isn't part of routine device management.
    - question: Does Fleet send StopMirroring automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run StopMirroring with Fleet?
      answer: |
        Save a plist with `RequestType` set to `StopMirroring` and run `fleetctl mdm run-command --hosts=<hostname> --payload=<file>`. To stop mirroring on several devices, pass their hostnames to `--hosts` separated by commas.

        You can also base64-encode the plist and send it with `POST /api/v1/fleet/commands/run`.
    - question: Does StopMirroring require a supervised device?
      answer: |
        Yes. Apple lists `StopMirroring` as requiring supervision on iOS and macOS, on the device channel. This is different from `RequestMirroring`, which doesn't require supervision.
    - question: How do I know StopMirroring worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>` or check **Host details > Show MDM commands**. `Acknowledged` means the device processed the command. `Error` includes an `ErrorChain` with details, and `CommandFormatError` means the payload was malformed.
    - question: Can I stop AirPlay mirroring on a personal device?
      answer: |
        No. Because `StopMirroring` requires supervision, it doesn't work on User Enrollment (BYOD) devices or on iPhones, iPads, and Macs that aren't supervised. Devices enrolled through Automated Device Enrollment (ADE) are supervised.
    - question: Is StopMirroring available in Fleet Free?
      answer: |
        Yes. Any Fleet admin or maintainer can send it as a custom MDM command in Fleet Free or Fleet Premium.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>StopMirroring</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_StopMirroring</string>
    </dict>
    </plist>

- name: Refresh cellular plans
  platform: apple
  category: eSim management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/refresh-cellular-plans-command
  description: Query a carrier URL for active eSIM cellular-plan profiles on a device.
  supportedDeviceTypes:
    - iOS 13.0+
    - ipadOS 13.0+
  faq:
    - question: What does the RefreshCellularPlans MDM command do?
      answer: |
        It tells an iPhone or cellular iPad to contact a carrier's eSIM server and check for cellular plans that are ready to install. The `RefreshCellularPlans` request type takes one key, `eSIMServerURL`, which is the carrier URL the device should query.

        Use it when a carrier has provisioned an eSIM for a device and you want the device to pick up the plan without the end user scanning a QR code or opening Settings.
    - question: How often is RefreshCellularPlans used?
      answer: |
        Rarely. It's a special-purpose command for organizations that provision corporate eSIM plans through a carrier. Most MDM deployments never send it.

        You'd typically run it once per device after the carrier activates a plan, or again if a plan didn't download the first time.
    - question: Does Fleet send RefreshCellularPlans automatically?
      answer: |
        No. Fleet doesn't send this command as part of any built-in feature.

        You can still send it as a custom MDM command to iOS and iPadOS hosts that are enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run RefreshCellularPlans with Fleet?
      answer: |
        Copy the sample payload, replace `eSIMServerURL` with the URL your carrier gave you, and save it as a file. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=refresh-cellular-plans.xml`.

        To use the API, base64-encode the file and send it to `POST /api/v1/fleet/commands/run` with the host's UUID in `host_uuids`. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands) for the full walkthrough.
    - question: Does RefreshCellularPlans require a supervised iPhone or iPad?
      answer: |
        No. Apple doesn't list supervision as a requirement. The command runs on the device channel on iOS and iPadOS 13 and later, including Shared iPad.

        The device does need eSIM-capable cellular hardware. An iPad without cellular hardware returns an error.
    - question: How do I know RefreshCellularPlans worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A status of `Acknowledged` means the device accepted the command and queried the carrier URL.

        Acknowledged doesn't guarantee a plan was installed. That depends on what the carrier's server returned. Check **Settings > Cellular** on the device, or confirm with your carrier, to see whether the plan appeared.
    - question: What errors can RefreshCellularPlans return?
      answer: |
        Apple documents three error codes for this command:

        - `36001`: the device couldn't communicate with its cellular software stack.
        - `36002`: the hardware doesn't support the command.
        - `36003`: the cellular stack couldn't perform the request. This can mean it was busy, so retrying later may work.

        A `CommandFormatError` usually means the plist is malformed or `eSIMServerURL` is missing.
    - question: Where do I get the eSIMServerURL value?
      answer: |
        From your carrier. The URL points to the carrier's eSIM provisioning server, and only the carrier can tell you the right one for your account.

        Fleet doesn't provide or validate this URL. If it's wrong, the device still acknowledges the command, but no plan is downloaded.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>RefreshCellularPlans</string>
            <key>eSIMServerURL</key>
            <string>http://example.server.com</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RefreshCellularPlans</string>
    </dict>
    </plist>

- name: Disable remote desktop
  platform: apple
  category: Managed settings
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/disable-remote-desktop-command
  description: Disable Remote Desktop on a device.
  supportedDeviceTypes:
    - macOS 10.14.4+
  faq:
    - question: What does the DisableRemoteDesktop MDM command do?
      answer: |
        It turns off Remote Desktop (Apple Remote Desktop remote management) on a Mac. The `DisableRemoteDesktop` request type stops the Mac from processing remote events.

        Per Apple, it also removes the `PostEvent` privacy (TCC) permission, unless a configuration profile on the Mac already grants it.
    - question: How often is DisableRemoteDesktop used?
      answer: |
        Occasionally. It's a special-purpose command, usually sent after a support session ends or when a security review finds remote management turned on where it shouldn't be.

        It isn't part of routine MDM traffic.
    - question: Does Fleet send DisableRemoteDesktop automatically?
      answer: |
        No. Fleet doesn't turn Remote Desktop on or off as part of any built-in feature.

        You can send it as a custom MDM command to macOS hosts enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run DisableRemoteDesktop with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=disable-remote-desktop.xml`.

        Or base64-encode it and send it to `POST /api/v1/fleet/commands/run` with the host UUIDs in `host_uuids`. You can target many Macs in one request.
    - question: Does DisableRemoteDesktop require a supervised Mac?
      answer: |
        Yes. Apple lists supervision as a requirement on macOS. Macs enrolled through Automated Device Enrollment (ADE) are supervised.

        The command runs on the device channel only and requires macOS 10.14.4 or later.
    - question: How do I know DisableRemoteDesktop worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the Mac turned off Remote Desktop.

        To confirm on the device, open **System Settings > General > Sharing** and check that **Remote Management** is off. You can also write a Fleet report or policy that checks whether the ARD agent is running.
    - question: What errors can DisableRemoteDesktop return?
      answer: |
        The most common failure is an `Error` status because the Mac isn't supervised. A `CommandFormatError` means the plist couldn't be parsed.

        Run `fleetctl get mdm-command-results --id=<command-uuid>` to see the full `ErrorChain` the Mac returned.
    - question: What's the difference between DisableRemoteDesktop and EnableRemoteDesktop?
      answer: |
        `EnableRemoteDesktop` turns on Remote Management for all users with Observe, Control, and Show being observed options. `DisableRemoteDesktop` turns it off and blocks remote events.

        Neither command has options, so you can't use them to grant access to specific users. Use a configuration profile for finer control.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DisableRemoteDesktop</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DisableRemoteDesktop</string>
    </dict>
    </plist>

- name: Enable remote desktop
  platform: apple
  category: Managed settings
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/enable-remote-desktop-command
  description: Enable Remote Desktop on a device.
  supportedDeviceTypes:
    - macOS 10.14.4+
  faq:
    - question: What does the EnableRemoteDesktop MDM command do?
      answer: |
        It turns on Remote Desktop (Apple Remote Desktop remote management) on a Mac. Per Apple, the `EnableRemoteDesktop` request type enables access for all users, lets the Mac receive remote events, and turns on the Observe, Control, and Show being observed options.

        Other Remote Desktop options on the Mac stay as they were.
    - question: How often is EnableRemoteDesktop used?
      answer: |
        Occasionally. Teams use it before a remote support session or to prepare Macs for Apple Remote Desktop administration. It isn't part of routine MDM traffic.
    - question: Does Fleet send EnableRemoteDesktop automatically?
      answer: |
        No. Fleet doesn't turn on Remote Desktop as part of any built-in feature.

        You can send it as a custom MDM command to macOS hosts enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run EnableRemoteDesktop with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=enable-remote-desktop.xml`.

        Or base64-encode it and send it to `POST /api/v1/fleet/commands/run` with the host UUIDs in `host_uuids`.
    - question: Does EnableRemoteDesktop require a supervised Mac?
      answer: |
        Yes. Apple lists supervision as a requirement on macOS. Macs enrolled through Automated Device Enrollment (ADE) are supervised.

        The command runs on the device channel only and requires macOS 10.14.4 or later.
    - question: Is it safe to run EnableRemoteDesktop on every Mac?
      answer: |
        Think carefully first. The command grants remote access to all users on the Mac, which widens who can control it remotely.

        Turn it on only where you need it, and send `DisableRemoteDesktop` when the support session is done. Track which Macs have it on with a Fleet report or policy.
    - question: How do I know EnableRemoteDesktop worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the Mac turned on Remote Desktop.

        On the Mac, **System Settings > General > Sharing** shows **Remote Management** turned on.
    - question: What errors can EnableRemoteDesktop return?
      answer: |
        The most common failure is an `Error` status because the Mac isn't supervised, or because it's running a macOS version older than 10.14.4. A `CommandFormatError` means the plist couldn't be parsed.

        Run `fleetctl get mdm-command-results --id=<command-uuid>` to see the `ErrorChain` the Mac returned.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>EnableRemoteDesktop</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_EnableRemoteDesktop</string>
    </dict>
    </plist>

- name: Configure settings
  platform: apple
  category: Managed settings
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/settings-command
  description: Configure settings on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 10.9+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the Settings MDM command do?
      answer: |
        It changes one or more device settings in a single command. The `Settings` request type takes a `Settings` array, and each entry names an `Item` to change, like `DeviceName`.

        Other items Apple supports include `HostName` on macOS, and `Bluetooth`, `DataRoaming`, `VoiceRoaming`, `PersonalHotspot`, `Wallpaper`, and `TimeZone` on iPhone and iPad. Some items require supervision. Check [Apple's documentation](https://developer.apple.com/documentation/devicemanagement/settings-command) for the full list.
    - question: How often is the Settings command used?
      answer: |
        Often. Renaming devices with the `DeviceName` item is one of the most common uses, and MDM solutions send it whenever a device name needs to change.

        Other items, like wallpaper or roaming, are used less often and usually only on company-owned iPhones and iPads.
    - question: Does Fleet send the Settings command automatically?
      answer: |
        Yes, for device names. When you set a host name template in **Controls > OS settings > Host names**, Fleet sends `Settings` with the `DeviceName` item to rename each macOS, iOS, and iPadOS host. It also renames hosts back if an end user changes the name. This is a Fleet Premium feature.

        Learn more in [Rename hosts with a naming template](https://fleetdm.com/guides/rename-hosts-with-a-naming-template). Fleet doesn't send other `Settings` items. You can send those as custom commands.
    - question: How do I run the Settings command with Fleet?
      answer: |
        Edit the sample payload's `Settings` array with the items you want, save it, and run `fleetctl mdm run-command --hosts=<hostname> --payload=settings.xml`. You can include several items in one command.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run` with the host UUIDs in `host_uuids`. Custom commands go to the device channel.
    - question: Does renaming an iPhone or iPad with the Settings command require supervision?
      answer: |
        Yes. Apple only applies `DeviceName` changes on supervised iPhones and iPads. Unsupervised devices reject the change.

        macOS doesn't need supervision to rename. Personally enrolled (BYOD) hosts are skipped by Fleet's naming template feature.
    - question: How do I know the Settings command worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The response has an overall `Status` and a `Settings` array with a status for each item, so one item can fail while others succeed.

        For name changes, the new name shows in the host's **Host details** page after its next vitals refresh.
    - question: What errors can the Settings command return?
      answer: |
        Per-item errors are common. An item can fail because the device isn't supervised, the platform doesn't support it, or the value is invalid. Fleet's naming template marks hosts as **Failed** when the resolved name is longer than 63 bytes, Apple's limit.

        A `CommandFormatError` means the plist couldn't be parsed. Check the `ErrorChain` in the command results for details.
    - question: Can the end user change a setting after the Settings command runs?
      answer: |
        Often, yes. Per Apple, users may be able to change these settings later unless a configuration profile restricts it.

        To keep a value locked, pair the command with a restrictions profile. For device names, Fleet's naming template detects changes and renames the host back, up to 3 times.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>Settings</string>
            <key>Settings</key>
            <array>
                <dict>
                    <key>DeviceName</key>
                    <string>NewName</string>
                    <key>Item</key>
                    <string>DeviceName</string>
                </dict>
            </array>
        </dict>
        <key>CommandUUID</key>
        <string>0001_Settings</string>
    </dict>
    </plist>

- name: LOM Device Request
  platform: apple
  category: Lights-Out management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/lom-device-request-command
  description: Send requests to a device using lights-out management (LOM).
  supportedDeviceTypes:
    - macOS 11.0+
  faq:
    - question: What does the LOMDeviceRequest MDM command do?
      answer: |
        It asks a Mac to send lights-out management (LOM) requests to other Macs on the network, like `Reset`. The command goes to a controller Mac, and its `RequestList` names each target by `DeviceDNSName` and IPv6 addresses.

        LOM lets you power-manage a Mac remotely, even when its operating system isn't responding.
    - question: How often is LOMDeviceRequest used?
      answer: |
        Rarely. LOM is a niche feature, mostly used in data centers or labs that run racks of Macs. Most MDM deployments never send it.
    - question: Does Fleet support lights-out management?
      answer: |
        Fleet doesn't have a built-in LOM feature and doesn't send `LOMDeviceRequest` automatically.

        You can send it as a custom MDM command to a macOS host enrolled in Fleet with MDM turned on, as long as you've already deployed the LOM configuration profile yourself.
    - question: What do I need before I can run LOMDeviceRequest?
      answer: |
        Per Apple:

        - macOS 11 or later, on Mac hardware that supports LOM.
        - Supervised Macs.
        - A Lights Out Management configuration profile installed on the controller and the target Macs.
        - The target's IPv6 addresses, which you get by running `LOMSetupRequest` on the target.

        The `DeviceDNSName` must match the common name in the target's LOM client certificate.
    - question: How do I run LOMDeviceRequest with Fleet?
      answer: |
        Fill in the sample payload with the target's DNS name, a `DeviceRequestUUID`, the request type, and the IPv6 addresses from `LOMSetupRequest`. Then send it to the controller Mac with `fleetctl mdm run-command --hosts=<controller-hostname> --payload=lom-device-request.xml`.

        Or base64-encode the file and use `POST /api/v1/fleet/commands/run`.
    - question: How do I know LOMDeviceRequest worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The response's `ResponseData` array has one entry per request, each with its `DeviceRequestUUID` and a `DeviceRequestSucess` boolean. Apple spells the key that way.

        An `Acknowledged` status with `DeviceRequestSucess` set to `false` means the controller ran the command but the target didn't respond.
    - question: What errors can LOMDeviceRequest return?
      answer: |
        Expect an `Error` status if the controller isn't supervised, doesn't have the LOM profile, or runs a macOS version older than 11. A `CommandFormatError` means the plist couldn't be parsed.

        Wrong IPv6 addresses or a DNS name that doesn't match the certificate usually show up as a failed entry in `ResponseData`.
    - question: What's the difference between LOMDeviceRequest and LOMSetupRequest?
      answer: |
        `LOMSetupRequest` runs on the target Mac and returns the IPv6 addresses it uses for LOM. `LOMDeviceRequest` runs on the controller Mac and uses those addresses to send power requests to the target.

        Run setup first, then device requests.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestList</key>
        <array>
            <dict>
                <key>DeviceDNSName</key>
                <string>lomdevice.com</string>
                <key>DeviceRequestType</key>
                <string>Reset</string>
                <key>DeviceRequestUUID</key>
                <string>0001</string>
                <key>PrimaryIPv6AddressList</key>
                <array>
                    <string>fe80::94f6:d6ff:fef3:c05b</string>
                    <string>fe80::94f6:d6ff:fef3:c1a4</string>
                </array>
                <key>SecondaryIPv6AddressList</key>
                <array/>
            </dict>
        </array>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LOMDeviceRequest</string>
    </dict>
    </plist>

- name: LOM setup Request
  platform: apple
  category: Lights-Out management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/lom-setup-request-command
  description: Get information from a device to set up lights-out management (LOM).
  supportedDeviceTypes:
    - macOS 11.0+
  faq:
    - question: What does the LOMSetupRequest MDM command do?
      answer: |
        It asks a Mac for the information needed to manage it with lights-out management (LOM). The `LOMSetupRequest` response includes the Mac's `PrimaryIPv6AddressList`, which a controller Mac uses later in `LOMDeviceRequest`.
    - question: How often is LOMSetupRequest used?
      answer: |
        Rarely. You run it once per target Mac when setting up LOM, and again if its network configuration changes. Most MDM deployments never use LOM.
    - question: Does Fleet send LOMSetupRequest automatically?
      answer: |
        No. Fleet doesn't have a built-in LOM feature.

        You can send it as a custom MDM command to a macOS host enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run LOMSetupRequest with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<target-hostname> --payload=lom-setup-request.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run` with the target's UUID in `host_uuids`.
    - question: What does LOMSetupRequest require?
      answer: |
        Per Apple, the Mac must run macOS 11 or later, be supervised, and have the Lights Out Management configuration profile installed. The command runs on the device channel only.

        Not all Mac hardware supports LOM, so test on your models first.
    - question: How do I get the LOMSetupRequest results?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The result shows the full response plist, including `PrimaryIPv6AddressList`.

        Copy those addresses into the `PrimaryIPv6AddressList` of your `LOMDeviceRequest` payload.
    - question: What errors can LOMSetupRequest return?
      answer: |
        Expect an `Error` status if the Mac isn't supervised, doesn't have the LOM configuration profile, or doesn't support LOM. A `CommandFormatError` means the plist couldn't be parsed.

        Check the `ErrorChain` in the command results for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>LOMSetupRequest</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LOMSetupRequest</string>
    </dict>
    </plist>

- name: Security info
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/security-info-command
  description: Get security-related information about a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the SecurityInfo MDM command do?
      answer: |
        It asks a device for its security state. The `SecurityInfo` response includes passcode status, like `PasscodePresent` and `PasscodeCompliant`, hardware encryption capabilities, and `ManagementStatus`.

        On macOS, it also reports FileVault, firewall, System Integrity Protection, and Secure Boot details, along with whether the Mac enrolled through Automated Device Enrollment.
    - question: How often is SecurityInfo used?
      answer: |
        Often. Many MDM solutions send it on a schedule to check compliance, especially for passcodes on iPhones and iPads.
    - question: Does Fleet send SecurityInfo automatically?
      answer: |
        No. Fleet doesn't send `SecurityInfo` as part of a built-in feature. On macOS, Fleet gathers similar data, like disk encryption and SIP status, with osquery through fleetd.

        You can send `SecurityInfo` as a custom MDM command to macOS, iOS, and iPadOS hosts enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run SecurityInfo with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=security-info.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run` with the host UUIDs in `host_uuids`.
    - question: Does SecurityInfo work on personal (BYOD) devices?
      answer: |
        Yes. Apple allows `SecurityInfo` in user enrollment on iOS, iPadOS, macOS, and visionOS, and it doesn't require supervision. User-enrolled devices return less information than company-owned devices.

        The MDM server needs the `AllowQuerySecurity` access right, which Fleet's enrollment profile includes.
    - question: How do I read the SecurityInfo results?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The result shows the full response plist the device returned.

        Results aren't saved to host vitals, so save the output if you need it for an audit.
    - question: What errors can SecurityInfo return?
      answer: |
        Errors are uncommon. A `CommandFormatError` means the plist couldn't be parsed. An `Error` status can mean the enrollment lacks the access right needed to query security info.

        If the result stays `Pending`, the device hasn't checked in. Make sure it's online and can reach Apple's push notification service.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>SecurityInfo</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_SecurityInfo</string>
    </dict>
    </plist>

- name: List certificate
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/certificate-list-command
  description: Get a list of installed certificates on a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the CertificateList MDM command do?
      answer: |
        It asks a device for the certificates installed on it. The `CertificateList` response has one entry per certificate with its `CommonName`, `Data` (DER-encoded), and `IsIdentity`, which is true when the certificate has a private key.

        Set `ManagedOnly` to `true` to get only certificates installed by MDM.
    - question: How often is CertificateList used?
      answer: |
        Often. Fleet sends it on a schedule to every iOS and iPadOS host, and other MDM solutions use it for certificate inventory and expiration tracking.
    - question: Which Fleet features use CertificateList?
      answer: |
        Fleet uses it for the certificates list in **Host details**:

        - iOS and iPadOS hosts: Fleet sends `CertificateList` about every hour and when you select **Refetch** on **Host details**.
        - macOS hosts: Fleet reads most certificates with osquery, but sends `CertificateList` when a configuration profile with an ACME payload is installed. This surfaces hardware-bound ACME certificates that osquery can't see.

        Learn more in [View certificates in host vitals](https://fleetdm.com/guides/view-certificates-in-host-vitals).
    - question: How do I run CertificateList with Fleet?
      answer: |
        Save the sample payload, set `ManagedOnly` to `true` or `false`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=certificate-list.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run`. Custom commands go to the device channel, so on macOS you'll see system keychain certificates, not certificates in a user's login keychain.
    - question: Does CertificateList work on personal (BYOD) devices?
      answer: |
        Yes, with limits. Apple allows it in user enrollment, but user-enrolled devices return only certificates pushed by MDM, whatever you set for `ManagedOnly`.

        It doesn't require supervision. The MDM server needs the `AllowInspection` access right.
    - question: Why are some certificates missing from CertificateList results?
      answer: |
        A few reasons:

        - Certificates installed through declarative device management (DDM) aren't returned.
        - On macOS, the device channel only reports the system keychain.
        - On iOS 15.4 and later, a passcode-protected device returns `NotNow` until it's unlocked for the first time after a restart.
    - question: How do I know CertificateList worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` with a `CertificateList` array means it worked.

        A custom `CertificateList` command doesn't update the certificates list in **Host details**. Only Fleet's own refetch does that.
    - question: What errors can CertificateList return?
      answer: |
        The most common non-success status is `NotNow`, when an iPhone or iPad is locked after a restart. The device retries automatically.

        A `CommandFormatError` means the plist couldn't be parsed. An `Error` status with an access-right error means the enrollment can't inspect certificates.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedOnly</key>
            <false/>
            <key>RequestType</key>
            <string>CertificateList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_CertificateList</string>
    </dict>
    </plist>

- name: Activation Lock bypass code
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/activation-lock-bypass-code-command
  description: Get the code to bypass Activation Lock on a device.
  supportedDeviceTypes:
    - iOS 7.1+
    - iPadOS 7.1+
    - macOS 10.15+
    - visionOS 2.0+
  faq:
    - question: What does the ActivationLockBypassCode MDM command do?
      answer: |
        It retrieves a device's Activation Lock bypass code. The `ActivationLockBypassCode` response includes the code in the `ActivationLockBypassCode` key.

        With that code, your organization can clear Activation Lock on a supervised device without the end user's Apple Account and password. This matters when someone leaves without turning off Find My.
    - question: How often is ActivationLockBypassCode used?
      answer: |
        Occasionally. MDM solutions that escrow bypass codes send it soon after enrollment. Otherwise, it's sent when a device needs to be recovered.
    - question: Does Fleet send ActivationLockBypassCode automatically?
      answer: |
        No. Fleet doesn't retrieve or store Activation Lock bypass codes.

        You can send it as a custom MDM command to supervised macOS, iOS, and iPadOS hosts enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium. For devices in Apple Business, you can also [turn off Activation Lock](https://support.apple.com/en-ca/guide/business/welcome/web) in Apple Business.
    - question: How do I run ActivationLockBypassCode with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=activation-lock-bypass-code.xml`.

        Then run `fleetctl get mdm-command-results --id=<command-uuid>` and copy the code from the response. Store it securely, since anyone with the code can remove Activation Lock.
    - question: Does ActivationLockBypassCode require a supervised device?
      answer: |
        Yes. Apple requires supervision on iOS, iPadOS, macOS, and visionOS. Devices enrolled through Automated Device Enrollment (ADE) are supervised.

        The command isn't available on personal (BYOD) devices with user enrollment.
    - question: Can I always retrieve an Activation Lock bypass code?
      answer: |
        No. The device generates a new code at first setup and after it's erased and not restored from its own backup. Retrieve and store the code early.

        Fleet's [MDM migration guide](https://fleetdm.com/guides/mdm-migration) notes that a Mac's bypass code can only be retrieved for a limited time after enrollment, so it's often unavailable after migrating from another MDM.
    - question: What errors can ActivationLockBypassCode return?
      answer: |
        Expect an `Error` status if the device isn't supervised, or if no bypass code is available on the device. A `CommandFormatError` means the plist couldn't be parsed.

        Check the `ErrorChain` in the command results for the specific reason.
    - question: How do I use the bypass code?
      answer: |
        On an iPhone or iPad, enter the code in the password field on the Activation Lock screen, with the username field left blank. On a Mac, the code is used to clear Activation Lock during recovery or setup.

        Apple's activation server checks the code against the device, so each code only works for the device it came from.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ActivationLockBypassCode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ActivationLockBypassCode</string>
    </dict>
    </plist>

- name: Clear Activation Lock bypass code
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/activation-lock-bypass-code-command
  description: Clear the Activation Lock bypass code on a device.
  supportedDeviceTypes:
    - iOS 7.1+
    - iPadOS 7.1+
    - macOS 10.15+
    - visionOS 2.0+
  faq:
    - question: What does the ClearActivationLockBypassCode MDM command do?
      answer: |
        It removes the Activation Lock bypass code stored on a device. After it runs, `ActivationLockBypassCode` can no longer retrieve that code from the device.

        MDM solutions use it after they've escrowed the code, so the code only exists on the server.
    - question: How often is ClearActivationLockBypassCode used?
      answer: |
        Rarely. It's usually sent once, right after an MDM solution retrieves and stores the bypass code.
    - question: Does Fleet send ClearActivationLockBypassCode automatically?
      answer: |
        No. Fleet doesn't manage Activation Lock bypass codes.

        You can send it as a custom MDM command to supervised macOS, iOS, and iPadOS hosts enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run ClearActivationLockBypassCode with Fleet?
      answer: |
        First, retrieve the code with `ActivationLockBypassCode` and store it somewhere safe. Then save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=clear-activation-lock-bypass-code.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run`.
    - question: Is ClearActivationLockBypassCode reversible?
      answer: |
        No. Once cleared, you can't get the code from the device again. If you didn't save it, you may not be able to remove Activation Lock without the end user's Apple Account credentials.

        Always confirm you've stored the code before sending this command.
    - question: Does ClearActivationLockBypassCode require a supervised device?
      answer: |
        Yes. Apple requires supervision on iOS, iPadOS, macOS, and visionOS. It isn't available in user enrollment.
    - question: How do I know ClearActivationLockBypassCode worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device cleared the code.

        An `Error` status usually means the device isn't supervised. A `CommandFormatError` means the plist couldn't be parsed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ClearActivationLockBypassCode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ClearActivationLockBypassCode</string>
    </dict>
    </plist>

- name: Rotate FileVault key
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/rotate-filevault-key-command
  description: Rotate the FileVault key on a device.
  supportedDeviceTypes:
    - macOS 10.9+
  faq:
    - question: What does the RotateFileVaultKey MDM command do?
      answer: |
        It replaces a Mac's FileVault recovery key. The `RotateFileVaultKey` request needs a `KeyType` (`personal` or `institutional`) and a `FileVaultUnlock` dictionary with the current password or recovery key.

        For a personal key, the Mac returns the new key in `RotateResult`, encrypted to the certificate you send in `ReplyEncryptionCertificate`.
    - question: How often is RotateFileVaultKey used?
      answer: |
        Occasionally. Teams rotate a key after it's been viewed or used to unlock a Mac, so the exposed key stops working. Some organizations also rotate keys on a schedule.
    - question: Which Fleet features use RotateFileVaultKey?
      answer: |
        Fleet sends it when you rotate a host's disk encryption key. On **Host details**, select **Actions > Show disk encryption key**, then **Rotate key**. You can also use `POST /api/v1/fleet/hosts/:id/encryption_key/rotate`.

        Fleet fills in the current escrowed key and escrows the new key as soon as the Mac acknowledges. This is a Fleet Premium feature. Learn more in [Enforce disk encryption](https://fleetdm.com/guides/enforce-disk-encryption).
    - question: What does Fleet need before it can rotate a FileVault key?
      answer: |
        The Mac must be enrolled in Fleet MDM, and key escrow must be turned on for its fleet. Fleet must also have the current key escrowed and be able to decrypt it.

        Fleet won't rotate keys on personally enrolled hosts, and only one rotation can be pending per host. The Mac doesn't need a user logged in.
    - question: Should I send RotateFileVaultKey as a custom command?
      answer: |
        Usually not. Use Fleet's **Rotate key** action instead. A custom command needs the current password or recovery key in plain text in the payload, and Fleet doesn't escrow the new key from a custom command's result.

        That means Fleet's escrowed key would no longer unlock the Mac. Only send it as a custom command if you have your own way to decrypt and store the new key.
    - question: How do I know RotateFileVaultKey worked?
      answer: |
        For Fleet's built-in rotation, the **Rotate key** button shows **Rotating...** until the Mac acknowledges. Then Fleet shows the new key and the disk encryption key API stops returning `rotation_pending: true`.

        For a custom command, run `fleetctl get mdm-command-results --id=<command-uuid>` and look for `Acknowledged` and an `EncryptedNewRecoveryKey` in the result.
    - question: What happens if RotateFileVaultKey fails?
      answer: |
        Fleet logs a "Failed to rotate disk encryption key" activity and sets the host's disk encryption status to **Action required**. At the next login, the end user is asked for their password so Fleet can escrow a new key.

        Common causes are a wrong current key, a Mac that isn't supervised, or a missing `ReplyEncryptionCertificate`. Fleet notes that macOS fails the command without it, even though Apple documents it as optional.
    - question: Does RotateFileVaultKey require a supervised Mac?
      answer: |
        Apple lists supervision as a requirement on macOS. The command runs on the device channel only, and the MDM server needs the `DeviceLockAndRemovePasscode` access right.
  command: |
