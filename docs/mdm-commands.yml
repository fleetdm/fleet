- name: Provisioning profile list
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/provisioning-profile-list-command
  description: Get a list of installed provisioning profiles on a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ProvisioningProfileList MDM command do?
      answer: |
        `ProvisioningProfileList` asks an Apple device for the app provisioning profiles it has installed. For each profile, the response includes its `Name`, `UUID`, and `ExpiryDate`.

        Set `ManagedOnly` to `true` to list only profiles installed by MDM. On devices enrolled with User Enrollment, the device ignores this key and always returns only managed profiles.
    - question: When would I use ProvisioningProfileList?
      answer: |
        Mostly to find provisioning profiles that are about to expire. When an in-house app's provisioning profile expires, the app stops launching. Checking `ExpiryDate` ahead of time tells you which apps need a renewed profile or a new build.

        It's also how you get a profile's `UUID` before sending `RemoveProvisioningProfile`.
    - question: What's the difference between ProvisioningProfileList and ProfileList?
      answer: |
        `ProvisioningProfileList` returns app provisioning profiles, which let in-house or development apps run. `ProfileList` returns configuration profiles, which hold device settings. Each command only sees its own type.
    - question: Does ProvisioningProfileList work on a Mac?
      answer: |
        Only for iOS and iPadOS apps. On macOS 11 or later, Apple limits this command to iOS and iPadOS style provisioning profiles, like those used by iPhone and iPad apps running on a Mac with Apple silicon.

        Native Mac apps keep their provisioning profile inside the app bundle. To inspect one, run a script that decodes `Contents/embedded.provisionprofile` with `security cms -D -i`.
    - question: Does Fleet send ProvisioningProfileList automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature, and Fleet doesn't show provisioning profiles or their expiration dates in the UI.

        To track expirations, send `ProvisioningProfileList` as a custom command on a schedule, for example from a script that calls the Fleet API, and alert on any `ExpiryDate` that's close.
    - question: How do I run ProvisioningProfileList with Fleet and read the results?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=provisioning-profile-list.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's read-only and available in Fleet Free.

        Then run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the result contains the `ProvisioningProfileList` array.
    - question: Does ProvisioningProfileList require a supervised device?
      answer: |
        No. It works on supervised and unsupervised devices, including devices enrolled with User Enrollment. It's supported on iPhone, iPad, Apple TV, Apple Vision Pro, Apple Watch, and Macs on macOS 11 or later.
    - question: Can I see provisioning profiles on an iPhone without MDM?
      answer: |
        Partly. On iPhone and iPad, in-house apps from an enterprise developer show their developer under **Settings > General > VPN & Device Management**, where the user can trust or remove it. That view doesn't list each provisioning profile or its expiration date, so use `ProvisioningProfileList` for that.
    - question: What errors can ProvisioningProfileList return?
      answer: |
        Errors are rare because the command is read-only. `CommandFormatError` means the plist is malformed, for example a misspelled `RequestType`. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedOnly</key>
            <false/>
            <key>RequestType</key>
            <string>ProvisioningProfileList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ProvisioningProfileList</string>
    </dict>
    </plist>

- name: Remove provisioning profile
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/remove-provisioning-profile-command
  description: Remove a previously installed provisioning profile from a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the RemoveProvisioningProfile MDM command do?
      answer: |
        `RemoveProvisioningProfile` deletes an app provisioning profile from an Apple device. You identify the profile by its `UUID`, which you get from a `ProvisioningProfileList` response.

        The app that used the profile isn't uninstalled.
    - question: Does removing a provisioning profile stop an in-house app from running?
      answer: |
        Not right away. According to Apple, an app keeps working until the device restarts, even with no provisioning profile. Apple recommends against using this command to revoke access to an enterprise app.

        To take an app away, remove the app itself with the `RemoveApplication` command.
    - question: When would I use RemoveProvisioningProfile?
      answer: |
        Rarely. The main use is cleanup: removing expired or replaced provisioning profiles from devices that run in-house or development apps. Most organizations never send it.
    - question: Does Fleet send RemoveProvisioningProfile?
      answer: |
        No. Fleet doesn't send this command for any built-in feature. You can send it as a custom MDM command in Fleet Free.

        In-house `.ipa` apps that Fleet deployed are uninstalled when the host turns off MDM. To remove one app from an enrolled iPhone or iPad, send `RemoveApplication` as a custom command.
    - question: How do I run RemoveProvisioningProfile with Fleet?
      answer: |
        First, send `ProvisioningProfileList` to get the profile's `UUID`. Put that value in the `UUID` key of this command, then run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-provisioning-profile.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: Does RemoveProvisioningProfile work on a Mac?
      answer: |
        Only for iOS and iPadOS apps. On macOS 11 or later, Apple limits this command to iOS and iPadOS style provisioning profiles. Native Mac apps keep their provisioning profile inside the app bundle, so remove the app itself instead, for example with a script.
    - question: How do I know if RemoveProvisioningProfile worked?
      answer: |
        `Acknowledged` means the device removed the profile. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. Send `ProvisioningProfileList` again to confirm it's gone.
    - question: Why did RemoveProvisioningProfile fail?
      answer: |
        Usually because the `UUID` doesn't match an installed provisioning profile. Copy the value from a fresh `ProvisioningProfileList` response. The device's reason is in the result's `ErrorChain`.

        `CommandFormatError` means the command plist is malformed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>RemoveProvisioningProfile</string>
            <key>UUID</key>
            <string>493d9dc8-e4c0-4fd8-bd8e-8fd4c0dc7b0c</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RemoveProvisioningProfile</string>
    </dict>
    </plist>

- name: Device information
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-information-command
  description: Get detailed information about a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the DeviceInformation MDM command do?
      answer: |
        `DeviceInformation` asks an Apple device to report details about itself. You list the keys you want in the `Queries` array, like `OSVersion`, `SerialNumber`, `DeviceName`, `BatteryLevel`, `IsSupervised`, or `AvailableDeviceCapacity`.

        The device returns a `QueryResponses` dictionary with a value for each key it supports. The `Queries` array is required.
    - question: How often is DeviceInformation used?
      answer: |
        Constantly. It's the main way MDMs collect inventory from iPhones and iPads, which can't run an agent like osquery. Most MDMs send it right after enrollment and then on a regular schedule.
    - question: Which Fleet features use DeviceInformation?
      answer: |
        Fleet uses it to collect vitals for iPhone and iPad hosts, like OS version, device name, storage, Wi-Fi MAC address, battery level, and Lost Mode status. Fleet sends it about once an hour, and when you click **Refetch** on the **Host details** page.

        Fleet doesn't use it for Macs. Mac vitals come from fleetd and osquery, which collect far more than this command.
    - question: How do I run DeviceInformation with Fleet?
      answer: |
        Edit the `Queries` array to the keys you need, then run `fleetctl mdm run-command --hosts=<hostname> --payload=device-information.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's read-only and available in Fleet Free.

        Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`. Use a custom command when you need a key Fleet doesn't show, like `IsActivationLockEnabled` or `MDMOptions`.
    - question: Why are some DeviceInformation keys missing from the response?
      answer: |
        The device skips keys that don't apply instead of failing the command. Cellular keys like `IMEI` and `ICCID` only come from devices with cellular hardware, and some keys are limited to certain platforms, OS versions, or supervised devices.

        Devices enrolled with User Enrollment (personally owned) return less, and don't share hardware identifiers like `SerialNumber` and `UDID`. Fleet asks those hosts for a smaller set of keys.
    - question: Does DeviceInformation work on macOS?
      answer: |
        Yes. Macs respond to `DeviceInformation`, but some keys are iOS-only. On a Mac, it's most useful for MDM-specific values, like `IsSupervised`, `IsActivationLockEnabled`, or `MDMOptions`. Other Mac inventory is easier to get from osquery.
    - question: How do I get the same information on a device without MDM?
      answer: |
        On a Mac, run `system_profiler SPHardwareDataType` or `sw_vers` in Terminal, or use osquery tables like `system_info` and `os_version`. Run `profiles status -type enrollment` to see whether the Mac is enrolled in MDM and through Automated Device Enrollment (ADE).

        On iPhone and iPad, the user can see most of these details in **Settings > General > About**.
    - question: Does DeviceInformation require a supervised device?
      answer: |
        No. It works on supervised and unsupervised devices, and on devices enrolled with User Enrollment. A few keys only return values on supervised devices.
    - question: What errors can DeviceInformation return?
      answer: |
        Errors are rare, since unsupported keys are skipped instead of failing the command. `CommandFormatError` means the plist is malformed, for example a `Queries` value that isn't an array of strings. If the device is offline, the command stays `Pending` until it checks in.
