- name: Security info
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/security-info-command
  description: Get security-related information about a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the SecurityInfo MDM command do?
      answer: |
        `SecurityInfo` asks a device for its security state. On iPhone and iPad, the response includes passcode status, like `PasscodePresent` and `PasscodeCompliant`, and `HardwareEncryptionCaps`.

        On macOS, it reports FileVault (`FDE_Enabled`), firewall settings, System Integrity Protection, Secure Boot, Recovery Lock, Remote Desktop, and bootstrap token details. All platforms include `ManagementStatus`, which shows things like whether the enrollment is a user enrollment.
    - question: How often is SecurityInfo used?
      answer: |
        Often. Many MDMs send it on a schedule to check compliance, especially passcode compliance on iPhones and iPads. Admins also send it on demand when troubleshooting a device.
    - question: How do I check a Mac's security settings without MDM?
      answer: |
        Use Terminal. `fdesetup status` shows FileVault, `csrutil status` shows System Integrity Protection, and `/usr/libexec/ApplicationFirewall/socketfilterfw --getglobalstate` shows the firewall. `profiles status -type enrollment` shows whether the Mac is enrolled in MDM and whether enrollment was user approved.

        On iPhone and iPad, there's no equivalent the user can run, so MDM is the main way to collect this.
    - question: Does SecurityInfo work on personal (BYOD) devices?
      answer: |
        Yes. Apple allows `SecurityInfo` in user enrollment on iOS, iPadOS, macOS, and visionOS, and it doesn't require supervision. User-enrolled devices return less information, for example no `PasscodePresent`.

        The MDM server needs the `AllowQuerySecurity` access right.
    - question: Does Fleet send SecurityInfo automatically?
      answer: |
        No. On macOS, Fleet collects similar data, like disk encryption, SIP, and firewall status, with osquery through fleetd, and you can build policies on it.

        You can send `SecurityInfo` as a custom command in Fleet Free or Fleet Premium with `fleetctl mdm run-command --hosts=<hostname> --payload=security-info.xml`, or the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Then read the response with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: Does a custom SecurityInfo command update host details in Fleet?
      answer: |
        No. Fleet shows the raw response in the command results, but it doesn't save the values to host vitals. Save the output if you need it for an audit.

        For ongoing checks, use Fleet policies on macOS. On iPhone and iPad, rely on configuration profiles to enforce passcode rules, since Fleet verifies those profiles were installed.
    - question: What does HardwareEncryptionCaps mean in SecurityInfo?
      answer: |
        It describes the device's hardware encryption. `1` is block-level, `2` is file-level, and `3` is both.

        Per Apple, an iPhone or iPad has data protection only when `HardwareEncryptionCaps` is `3` and `PasscodePresent` is `true`. In practice, that means requiring a passcode is what turns on data protection.
    - question: What errors can SecurityInfo return?
      answer: |
        Errors are uncommon because the command is read-only. `CommandFormatError` means the plist couldn't be parsed.

        If the result stays `Pending`, the device hasn't checked in. Make sure it's online and can reach Apple's push notification service (APNs).
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>SecurityInfo</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_SecurityInfo</string>
    </dict>
    </plist>

- name: List certificate
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/certificate-list-command
  description: Get a list of installed certificates on a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the CertificateList MDM command do?
      answer: |
        `CertificateList` asks a device for its installed certificates. Each entry in the `CertificateList` response has the certificate's `CommonName`, its `Data` in DER-encoded X.509 format, and `IsIdentity`, which is `true` for identity certificates (certificates with a private key).

        Set `ManagedOnly` to `true` to return only certificates installed by MDM.
    - question: How often is CertificateList used?
      answer: |
        Regularly, as an inventory command. MDMs use it to track certificates and catch ones that are about to expire, especially on iPhones and iPads, where there's no local agent to read certificates.
    - question: How do I list certificates on a Mac without MDM?
      answer: |
        Open **Keychain Access**, or run `security find-certificate -a` in Terminal. Add a keychain path, like `/Library/Keychains/System.keychain`, to list a specific keychain.

        On iPhone and iPad, certificates installed by profiles appear under **Settings > General > VPN & Device Management**.
    - question: Which Fleet features use CertificateList?
      answer: |
        [Certificates in host vitals](https://fleetdm.com/guides/view-certificates-in-host-vitals). For iOS and iPadOS hosts, Fleet sends `CertificateList` about every hour and when you select **Refetch** on **Host details**.

        On macOS, Fleet reads certificates from the system and login keychains with osquery. It also sends `CertificateList` after installing a profile with an ACME payload, to surface hardware-bound certificates that osquery can't see.
    - question: How do I run CertificateList with Fleet?
      answer: |
        Save the sample payload, set `ManagedOnly` to `true` or `false`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=certificate-list.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`. A custom command doesn't update the certificates list in **Host details**, so use **Refetch** for that.
    - question: Why are some certificates missing from CertificateList results?
      answer: |
        A few reasons:

        - Certificates installed through declarative device management (DDM) aren't returned. Apple provides a DDM status item for those.
        - User-enrolled devices return only certificates installed by MDM.
        - On macOS, certificates in a user's keychain need the command sent on the user channel. Fleet sends custom commands on the device channel, but its osquery-based inventory covers login keychains.
    - question: Does CertificateList work on personal (BYOD) devices?
      answer: |
        Yes. Apple allows it in user enrollment on iOS, iPadOS, macOS, and visionOS, and it doesn't require supervision. User-enrolled devices ignore `ManagedOnly` and return only certificates MDM installed.

        The MDM server needs the `AllowInspection` access right.
    - question: Why does CertificateList return NotNow?
      answer: |
        Starting in iOS 15.4, a passcode-protected iPhone or iPad returns `NotNow` until it's unlocked for the first time after a restart. The command is retried later, once the device is unlocked.

        Other failures are rare. `CommandFormatError` means the plist couldn't be parsed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedOnly</key>
            <false/>
            <key>RequestType</key>
            <string>CertificateList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_CertificateList</string>
    </dict>
    </plist>

- name: Activation Lock bypass code
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/activation-lock-bypass-code-command
  description: Get the code to bypass Activation Lock on a device.
  supportedDeviceTypes:
    - iOS 7.1+
    - iPadOS 7.1+
    - macOS 10.15+
    - visionOS 2.0+
  faq:
    - question: What does the ActivationLockBypassCode MDM command do?
      answer: |
        `ActivationLockBypassCode` retrieves a supervised device's Activation Lock bypass code. The response returns it in the `ActivationLockBypassCode` key, if one is available.

        With that code, an organization can remove Activation Lock without the user's Apple Account and password. That matters when someone leaves the company with Find My still turned on.
    - question: How often is ActivationLockBypassCode used?
      answer: |
        Occasionally. MDMs that manage Activation Lock send it soon after enrollment and store the code. Apple says to request the code before the device turns on Activation Lock, or the code may not work.
    - question: When does a device create a new bypass code?
      answer: |
        Per Apple, a supervised device creates a new bypass code when it's set up for the first time, when it's erased and not restored from a backup, or when it's restored from another device's backup.

        Retrieve and store the code early. Fleet's [MDM migration guide](https://fleetdm.com/guides/mdm-migration) notes that a Mac's code can only be retrieved for up to 30 days after enrollment, so it's often unavailable after migrating from another MDM.
    - question: Does ActivationLockBypassCode require a supervised device?
      answer: |
        Yes. Apple requires supervision on iOS, iPadOS, macOS, and visionOS. Devices enrolled through Automated Device Enrollment (ADE) are supervised.

        It runs on the device channel only and isn't available in user enrollment.
    - question: Can a supervised device be Activation Locked?
      answer: |
        Only if the MDM allows it. Per Apple, a supervised device registers with Activation Lock when the user turns on Find My only if the MDM sets `ActivationLockAllowedWhileSupervised` to `true` with the `Settings` command's `MDMOptions` item. It's `false` by default.

        Fleet doesn't set this option, so Activation Lock stays off on supervised hosts.
    - question: How do I use an Activation Lock bypass code?
      answer: |
        MDM vendors that manage Activation Lock send the code to Apple's activation service to unlock the device. On an iPhone or iPad, you can also enter it on the Activation Lock screen: leave the Apple Account field blank and enter the code as the password.

        Each code only works for the device it came from.
    - question: How do I get an Activation Lock bypass code with Fleet?
      answer: |
        Fleet doesn't retrieve or store bypass codes, so send it as a custom command in Fleet Free or Fleet Premium. Run `fleetctl mdm run-command --hosts=<hostname> --payload=activation-lock-bypass-code.xml`, then copy the code from `fleetctl get mdm-command-results --id=<command-uuid>`. Store it securely, since anyone with it can remove Activation Lock.

        For devices your organization owns in Apple Business, you can also [turn off Activation Lock](https://support.apple.com/en-ca/guide/business/welcome/web) there without a code.
    - question: What errors can ActivationLockBypassCode return?
      answer: |
        Expect an `Error` status if the device isn't supervised. If the device has no code available, the response may come back without one.

        `CommandFormatError` means the plist couldn't be parsed. Check the `ErrorChain` in the command results for the reason.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ActivationLockBypassCode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ActivationLockBypassCode</string>
    </dict>
    </plist>

- name: Clear Activation Lock bypass code
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/activation-lock-bypass-code-command
  description: Clear the Activation Lock bypass code on a device.
  supportedDeviceTypes:
    - iOS 7.1+
    - iPadOS 7.1+
    - macOS 10.15+
    - visionOS 2.0+
  faq:
    - question: What does the ClearActivationLockBypassCode MDM command do?
      answer: |
        `ClearActivationLockBypassCode` clears the Activation Lock bypass code stored on a supervised device. The command has no options. See [Apple's reference](https://developer.apple.com/documentation/devicemanagement/clear-activation-lock-bypass-code-command).

        MDMs send it after they retrieve and store the code with `ActivationLockBypassCode`, so the device no longer holds a copy.
    - question: How often is ClearActivationLockBypassCode used?
      answer: |
        Rarely. When it's used, it's usually sent once per device, right after the MDM stores the bypass code.
    - question: Is ClearActivationLockBypassCode reversible?
      answer: |
        No. After the code is cleared, you can't retrieve it from the device again. If you didn't save it, removing Activation Lock may require the user's Apple Account credentials, or Apple Business if your organization owns the device.

        Always confirm you've stored the code before sending this command.
    - question: Should I clear the Activation Lock bypass code?
      answer: |
        Only if you've stored the code somewhere secure first. Clearing it limits where the code exists, but it also removes your fallback if your copy is lost.

        Most organizations get the same protection by storing the code securely and keeping Activation Lock disallowed on supervised devices.
    - question: Does ClearActivationLockBypassCode require a supervised device?
      answer: |
        Yes. Apple requires supervision on iOS, iPadOS, macOS, and visionOS. It runs on the device channel only and isn't available in user enrollment.
    - question: How do I run ClearActivationLockBypassCode with Fleet?
      answer: |
        Fleet doesn't manage bypass codes, so send it as a custom command in Fleet Free or Fleet Premium. First retrieve the code with `ActivationLockBypassCode` and store it. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=clear-activation-lock-bypass-code.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: How do I know if ClearActivationLockBypassCode worked?
      answer: |
        `Acknowledged` means the device cleared the code. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`.

        An `Error` status usually means the device isn't supervised. `CommandFormatError` means the plist couldn't be parsed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ClearActivationLockBypassCode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ClearActivationLockBypassCode</string>
    </dict>
    </plist>

- name: Rotate FileVault key
  platform: apple
  category: Security
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/rotate-filevault-key-command
  description: Rotate the FileVault key on a device.
  supportedDeviceTypes:
    - macOS 10.9+
  faq:
    - question: What does the RotateFileVaultKey MDM command do?
      answer: |
        `RotateFileVaultKey` replaces a Mac's FileVault recovery key. The request needs `KeyType` (`personal` or `institutional`) and a `FileVaultUnlock` dictionary with a credential that unlocks FileVault, like a user's password or the current recovery key.

        For a personal key, the Mac returns the new key in `RotateResult` as `EncryptedNewRecoveryKey`, encrypted to the certificate you send in `ReplyEncryptionCertificate`.
    - question: How often is RotateFileVaultKey used?
      answer: |
        Occasionally. Teams rotate a key after it's been viewed or used to unlock a Mac, so the exposed key stops working. Some organizations also rotate keys on a schedule.
    - question: Can I rotate a FileVault recovery key without MDM?
      answer: |
        Yes. Run `sudo fdesetup changerecovery -personal` in Terminal and authenticate with a FileVault-enabled user's credentials. The new key is shown on screen.

        Without MDM, the new key isn't escrowed anywhere unless you set that up separately, so record it securely.
    - question: Which Fleet features use RotateFileVaultKey?
      answer: |
        Fleet's [rotate disk encryption key](https://fleetdm.com/guides/enforce-disk-encryption#rotate-disk-encryption-key) action (Fleet Premium). On **Host details**, select **Actions > Show disk encryption key**, then **Rotate key**, or use `POST /api/v1/fleet/hosts/:id/encryption_key/rotate`.

        Fleet fills in the current escrowed key and escrows the new key as soon as the Mac acknowledges. The host must be enrolled in Fleet MDM, key escrow must be on for its fleet, and Fleet must have a decryptable key. Personally enrolled hosts aren't supported, and no user needs to be logged in.
    - question: Should I send RotateFileVaultKey as a custom command?
      answer: |
        Usually not. A custom command puts a password or recovery key in plain text in the payload, and the MDM doesn't escrow the new key from it. In Fleet, that leaves the escrowed key out of date.

        Use your MDM's built-in rotation instead, like Fleet's **Rotate key** action. Send a custom command only if you have your own way to decrypt and store the new key.
    - question: Is ReplyEncryptionCertificate required?
      answer: |
        Apple documents it as optional, but include it. Fleet found that macOS fails the command without it. It's also the only way to get the new personal key back, since the Mac encrypts the key to this certificate.
    - question: How do I know if RotateFileVaultKey worked?
      answer: |
        `Acknowledged` with an `EncryptedNewRecoveryKey` in the response means the Mac rotated the key.

        With Fleet's built-in rotation, the **Rotate key** button shows **Rotating...** until the Mac acknowledges. Then Fleet shows the new key, and the disk encryption key API returns `rotation_pending: false`.
    - question: What happens if RotateFileVaultKey fails?
      answer: |
        The Mac keeps its old key. The most common cause is a wrong or stale credential in `FileVaultUnlock`.

        In Fleet, a failed rotation logs a "Failed to rotate disk encryption key" activity and sets the host's disk encryption status to **Action required**. At the next login, the end user is asked for their password so Fleet can escrow a new key.
    - question: Does RotateFileVaultKey require a supervised Mac?
      answer: |
        Apple lists supervision as a requirement. The command runs on the device channel only, isn't available in user enrollment, and needs the `DeviceLockAndRemovePasscode` access right. Fleet's personal (BYOD) enrollment profile doesn't grant that right.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
        <key>FileVaultUnlock</key>
        <dict>
            <key>Password</key>
            <string>mypassword</string>
