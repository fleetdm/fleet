- name: RotateRecoveryPasswords
  platform: windows
  category: BitLocker
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/bitlocker-csp#rotaterecoverypasswords
  description: Triggers a one-time rotation of all numeric BitLocker recovery passwords for OS and fixed drives on Entra ID or hybrid-joined devices. Requires Active Directory backup of recovery passwords to be set to "required" before execution.
  supportedDeviceTypes:
    - Windows 10.0.18363
  faq:
    - question: What does the BitLocker RotateRecoveryPasswords MDM command do?
      answer: |
        It tells Windows to replace every numeric BitLocker recovery password on the OS drive and fixed data drives in one pass. The command is an `<Exec>` on `./Device/Vendor/MSFT/BitLocker/RotateRecoveryPasswords` in the BitLocker CSP.

        Windows generates the new passwords locally and backs them up to Microsoft Entra ID or Active Directory. The old passwords stop working once rotation finishes.
    - question: How often is RotateRecoveryPasswords used?
      answer: |
        Rarely. It's a one-off action, typically after a help desk reads a recovery password to an end user, after a device changes hands, or when a recovery password may have leaked.

        It isn't part of routine MDM check-ins, and Windows doesn't rotate on a schedule because of it. Each command triggers exactly one rotation.
    - question: Does Fleet send RotateRecoveryPasswords automatically?
      answer: |
        No. Fleet doesn't send this command. When you turn on disk encryption for a fleet, Fleet's agent (fleetd) turns on BitLocker, creates the recovery password, and escrows it to Fleet using Windows' local BitLocker APIs. When a disk is already encrypted, fleetd rotates the recovery key itself and escrows the new one.

        You can view the escrowed key from the host's details page. Learn more in the [disk encryption guide](https://fleetdm.com/guides/enforce-disk-encryption).
    - question: Will rotating BitLocker recovery passwords with this command break the key escrowed in Fleet?
      answer: |
        Yes, it can. This CSP backs up the new password to Entra ID or Active Directory, not to Fleet. Fleet doesn't currently detect a changed BitLocker key on Windows, so the key shown in Fleet can become stale.

        If Fleet is your source of truth for recovery keys, don't use this command on hosts where Fleet enforces disk encryption. Rotate through Fleet's disk encryption workflow instead.
    - question: What are the requirements for RotateRecoveryPasswords?
      answer: |
        Windows 10, version 1909 or later (Pro, Enterprise, or Education). The device must be Microsoft Entra joined or hybrid joined. Microsoft supports rotation only for Entra join, bulk Entra join, Entra join with device auth, and co-management enrollment types.

        BitLocker policy must also require recovery information to be stored in Active Directory before BitLocker turns on, for OS drives and fixed drives. Without that, the command has no effect.
    - question: How do I run RotateRecoveryPasswords with Fleet?
      answer: |
        Save only the `<Exec>` element from the example (drop the `<syncml>` and `<syncbody>` wrappers, because Fleet accepts a single `<Exec>`). Then run `fleetctl mdm run-command --hosts=<hostname> --payload=rotate.xml`.

        You can also base64-encode the same XML and send it to `POST /api/v1/fleet/commands/run` with the host's UUID. The command is available in Fleet Free and Fleet Premium. Learn more in the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: How do I check that BitLocker recovery password rotation worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A successful request usually returns status `202`, which means Windows accepted the request and started rotation in the background.

        To see the final outcome, read `./Device/Vendor/MSFT/BitLocker/Status/RotateRecoveryPasswordsStatus` (0 = pass, 1 = pending, 2 = not started, other values are errors) along with `RotateRecoveryPasswordsRequestID`. You can read these nodes with a Fleet report that queries osquery's `mdm_bridge` table.
    - question: What errors can RotateRecoveryPasswords return?
      answer: |
        A `404` usually means the OS is too old or the LocURI is wrong. A `405` means the operation isn't allowed on that node, often because the payload used a verb other than `<Exec>`. A `500` means Windows couldn't start the rotation.

        A `202` followed by a failing `RotateRecoveryPasswordsStatus` usually points to missing prerequisites, such as the device not being Entra joined or the Active Directory backup policy not being set to required.
    - question: Does RotateRecoveryPasswords work on removable drives?
      answer: |
        No. Microsoft documents it as rotating numeric recovery passwords for OS drives and fixed data drives only. Removable drives protected with BitLocker To Go aren't included.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>5f0096d1-c2aa-4934-b67a-0ed35d20d322</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/BitLocker/RotateRecoveryPasswords</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll (Personal scope)
  platform: windows
  category: CertificateStore
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/certificatestore-csp#myscepuniqueidinstallenroll
  description: Initiates SCEP certificate enrollment in the personal certificate store on the device.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the CertificateStore SCEP Enroll command do?
      answer: |
        It starts a SCEP certificate request using settings already stored under `./Device/Vendor/MSFT/CertificateStore/MY/SCEP/{UniqueID}/Install`. The command is an `<Exec>` on the `Install/Enroll` node, and the issued certificate lands in the device's personal (MY) store.

        The Exec doesn't carry the SCEP settings itself. The server URL, challenge, subject, and other values must be set on the sibling `Install` nodes first.
    - question: Is the CertificateStore SCEP node deprecated?
      answer: |
        Yes. Microsoft marks `CertificateStore/MY/SCEP` as deprecated and says it may be removed in a future release. Use the ClientCertificateInstall CSP (`./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/...` or the `./User/` equivalent) for new SCEP deployments.
    - question: How often is this command used?
      answer: |
        Rarely today. It mostly appears in legacy configurations written before ClientCertificateInstall became the standard SCEP path on Windows. Modern MDMs, including Fleet, use ClientCertificateInstall instead.
    - question: Does Fleet use CertificateStore SCEP enrollment?
      answer: |
        No. Fleet delivers SCEP certificates to Windows hosts with configuration profiles that use the ClientCertificateInstall CSP, including its `Install/Enroll` Exec. See [Connect end users to Wi-Fi or VPN with a certificate](https://fleetdm.com/guides/connect-end-user-to-wifi-with-certificate).

        Fleet does write to the CertificateStore CSP during Windows MDM enrollment, but only to provision its own MDM client certificate, not for SCEP.
    - question: How do I run the CertificateStore SCEP Enroll command with Fleet?
      answer: |
        First set the `Install` child nodes (ServerURL, Challenge, SubjectName, and others) on the host. Fleet's custom MDM commands accept only a single `<Exec>`, so those settings need to arrive another way, such as a custom Windows configuration profile.

        Then replace `{UniqueID}` with the same ID, save the `<Exec>` element to a file, and run `fleetctl mdm run-command --hosts=<hostname> --payload=enroll.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I know the certificate was issued?
      answer: |
        The Exec response only tells you Windows accepted the request. Check `fleetctl get mdm-command-results --id=<command-uuid>` for a `200`.

        Windows doesn't notify the server when enrollment finishes. To confirm, look for the new certificate in the host's **Certificates** section in Fleet, or run a report against osquery's `certificates` table. Learn more in [View certificates in host vitals](https://fleetdm.com/guides/view-certificates-in-host-vitals).
    - question: What errors can CertificateStore SCEP Enroll return?
      answer: |
        A `404` means the `{UniqueID}` node doesn't exist, usually because the Install settings were never added or the placeholder wasn't replaced. A `500` means Windows couldn't start enrollment.

        Failures after the Exec, such as a rejected challenge or unreachable SCEP server, don't show up in the command result. Read the `Status` and `ErrorCode` nodes under the same `{UniqueID}` to diagnose them.
    - question: Can I install a user certificate with this command?
      answer: |
        No. Microsoft documents the `CertificateStore/MY/SCEP` nodes as device scope only. For a certificate in the signed-in user's store, use ClientCertificateInstall with a `./User/` LocURI.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>1a3a3666-2df6-4dcf-a785-46b2f28d2fbf</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/CertificateStore/MY/SCEP/{UniqueID}/Install/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RenewNow
  platform: windows
  category: CertificateStore
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/certificatestore-csp#mywsteprenewrenewnow
  description: Triggers an immediate renewal of an existing certificate in the personal certificate store on the device.
  supportedDeviceTypes:
    - Windows 10.0.14393
  faq:
    - question: What does the RenewNow MDM command do?
      answer: |
        It asks Windows to renew its MDM client certificate immediately. The command is an `<Exec>` on `./Device/Vendor/MSFT/CertificateStore/MY/WSTEP/Renew/RenewNow`.

        The WSTEP certificate is the one Windows received during MDM enrollment and uses to authenticate every check-in. RenewNow skips the normal renewal schedule and starts a renewal request to the MDM server's enrollment service.
    - question: When would I use RenewNow?
      answer: |
        Rarely. Windows renews its MDM certificate on its own during the renewal window the MDM server sets at enrollment. RenewNow is a troubleshooting tool for a device whose certificate is close to expiry or whose scheduled renewal keeps failing.

        If an MDM certificate expires, the device stops checking in and has to enroll again, so admins reach for RenewNow before that happens.
    - question: Does Fleet send RenewNow?
      answer: |
        No. Fleet issues its Windows MDM certificate for 365 days and tells Windows to open the renewal window 180 days before expiry. Fleet doesn't yet complete the renewal itself, so a renewal request sent to Fleet is declined. That's tracked in [issue 52492](https://github.com/fleetdm/fleet/issues/52492).

        Running RenewNow against a host enrolled in Fleet's MDM won't produce a new certificate today. The host stays managed.
    - question: Can Fleet help with Intune MDM certificate renewal failures?
      answer: |
        Yes. With fleetd installed alongside Intune, Fleet can find Windows devices whose Intune certificate is failing to renew, fix the most common cause, and confirm the new certificate arrived. See [Find Windows devices that can't renew their Intune MDM certificate](https://fleetdm.com/guides/find-windows-devices-that-cant-renew-their-intune-mdm-certificate).

        RenewNow itself has to come from the MDM that owns the certificate, so you'd send it from Intune, not Fleet.
    - question: How do I run RenewNow with Fleet?
      answer: |
        Save the `<Exec>` element (without the `<syncml>` and `<syncbody>` wrappers) to a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=renewnow.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        The host must be enrolled in Fleet's MDM. Keep in mind that Fleet doesn't complete WSTEP renewals yet.
    - question: How do I check whether the MDM certificate renewed?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` only means Windows started the renewal. To see the outcome, read `MY/WSTEP/Renew/ErrorCode`, `LastRenewalAttemptTime`, and `MY/WSTEP/CertThumprint` (Microsoft's spelling).

        On the host, the enrollment record under `HKLM\SOFTWARE\Microsoft\Enrollments` also stores `RenewStatus` and `RenewErrorCode`. You can read these values with a Fleet report on osquery's `registry` table.
    - question: What errors does RenewNow return?
      answer: |
        A `404` usually means the OS is older than Windows 10, version 1607, where RenewNow first appeared. A `405` means the verb wasn't `<Exec>`.

        Renewal failures happen after the command is accepted and show up as an HRESULT in `MY/WSTEP/Renew/ErrorCode`. On a Fleet-enrolled host, expect a `RenewErrorCode` of `0x801900C8` once the renewal window opens, because Fleet declines the request.
    - question: Is RenewNow device scope or user scope?
      answer: |
        Device scope only. The MDM client certificate belongs to the device enrollment, so there's no `./User/` version of this node.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>cdd76df2-d665-4045-9503-7954cc491bf2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/CertificateStore/MY/WSTEP/Renew/RenewNow</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll (Device context)
  platform: windows
  category: ClientCertificateInstall
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/clientcertificateinstall-csp#devicescepuniqueidinstallenroll
  description: Triggers the device to start SCEP certificate enrollment at the device scope. The device will not notify MDM server after cert enrollment is done. The MDM server could later query the device to find out whether new cert is added.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the ClientCertificateInstall SCEP Enroll command do in device context?
      answer: |
        It tells Windows to start a SCEP certificate request for the device. The command is an `<Exec>` on `./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll`.

        The certificate is issued to the computer and lands in the local machine's personal store, so it's available to every user and to system services. That makes device context the right choice for machine Wi-Fi, VPN, and device-based conditional access.
    - question: How often is the device-context SCEP Enroll command used?
      answer: |
        Often, in any environment that issues device certificates. Every SCEP certificate delivered to a Windows device ends with this Exec, and it runs again whenever the certificate is redelivered or renewed.

        You rarely send it by hand, though. It's normally the last step inside a SCEP configuration profile.
    - question: Does Fleet use ClientCertificateInstall SCEP Enroll?
      answer: |
        Yes. Fleet Premium delivers SCEP certificates from Microsoft NDES, Okta, and custom SCEP certificate authorities to Windows hosts using configuration profiles built on ClientCertificateInstall. The profile adds the `Install` settings and ends with this `Install/Enroll` Exec. Fleet fills in `$FLEET_VAR_SCEP_WINDOWS_CERTIFICATE_ID` as the `{UniqueID}`.

        See [Connect end users to Wi-Fi or VPN with a certificate](https://fleetdm.com/guides/connect-end-user-to-wifi-with-certificate).
    - question: Should I send SCEP Enroll as a custom command or a configuration profile?
      answer: |
        Use a configuration profile. The Enroll Exec only works after the `Install` child nodes (ServerURL, Challenge, SubjectName, KeyUsage, and others) exist, and Fleet's custom MDM commands accept only a single `<Exec>`.

        A profile in **Controls > OS settings > Custom settings** delivers the settings and the Exec together, and Fleet tracks its status per host. Send the Exec on its own only to retry enrollment for a `{UniqueID}` that's already configured.
    - question: How do I run device-context SCEP Enroll with Fleet as a custom command?
      answer: |
        Replace `{UniqueID}` with the ID of the existing SCEP node, save the `<Exec>` element to a file, and run `fleetctl mdm run-command --hosts=<hostname> --payload=enroll.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Many CAs, including NDES, use one-time challenges. Retrying with an already-used challenge will fail, so redelivering the profile is usually the better retry.
    - question: How do I know the device certificate was issued?
      answer: |
        Windows doesn't notify the server when enrollment finishes. Read `./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Status`: 1 means success, 2 means pending at the CA, 16 means failed, and 32 means unknown or still running.

        For profiles Fleet delivers, Fleet polls this Status node for you and shows the result in the host's **OS settings**. The certificate also appears in the host's **Certificates** section.
    - question: What errors can device-context SCEP Enroll return?
      answer: |
        A `404` means the `{UniqueID}` node doesn't exist yet. A `500` means Windows couldn't start enrollment, often because a required Install setting is missing.

        Problems with the CA show up after the Exec, as Status 16 and an HRESULT in the `ErrorCode` node. Common causes include an expired or reused challenge, a wrong CA thumbprint, and an unreachable SCEP URL.
    - question: What's the difference between device and user context SCEP enrollment?
      answer: |
        Device context (`./Device/`) issues a certificate to the computer, stored in the local machine store, and works without anyone signed in. User context (`./User/`) issues a certificate to the signed-in user, stored in that user's store.

        Use device context for machine authentication. Use user context when the certificate must identify a specific person.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>96821528-e7c2-41ce-b4a8-6a20c61df80b</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll (User context)
  platform: windows
  category: ClientCertificateInstall
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/clientcertificateinstall-csp#devicescepuniqueidinstallenroll
  description: Triggers the user context to start SCEP certificate enrollment. The device will not notify MDM server after cert enrollment is done. The MDM server could later query the device to find out whether new cert is added.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the ClientCertificateInstall SCEP Enroll command do in user context?
      answer: |
        It tells Windows to start a SCEP certificate request for the signed-in user. The command is an `<Exec>` on `./User/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll`.

        The certificate lands in that user's personal store, not the machine store. That makes it a fit for user-based Wi-Fi, VPN, email signing, and apps that identify the person rather than the computer.
    - question: How often is the user-context SCEP Enroll command used?
      answer: |
        Regularly, in environments that issue per-user certificates. It's normally the last step of a user-scoped SCEP configuration profile, so admins rarely send it by hand.
    - question: Does Fleet support user-scoped SCEP certificates on Windows?
      answer: |
        Yes. In Fleet Premium, you can make a Windows SCEP profile user-scoped by replacing `./Device/` with `./User/` in every `<LocURI>`. Fleet delivers user-scoped profiles after an end user signs in, and they show **Pending** until then.

        See [Connect end users to Wi-Fi or VPN with a certificate](https://fleetdm.com/guides/connect-end-user-to-wifi-with-certificate) and [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: What are the requirements for user-context SCEP enrollment?
      answer: |
        The host needs an enrolled user. Fleet's guide notes that user-scope profiles require a Microsoft Entra ID user association, and devices with device-only MDM enrollment can't process user-scope commands.

        All the `Install` settings must also be set under the same `./User/` path. Don't mix `./Device/` and `./User/` paths for one certificate.
    - question: How do I run user-context SCEP Enroll with Fleet?
      answer: |
        Prefer a user-scoped configuration profile, because the Enroll Exec depends on `Install` nodes that Fleet custom commands can't add. To retry an existing request, replace `{UniqueID}`, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=enroll-user.xml`.

        Windows processes `./User/` commands for the user tied to the MDM session. If no user is signed in, the command waits or fails.
    - question: How do I know the user certificate was issued?
      answer: |
        Read `./User/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Status`: 1 means success, 2 means pending, 16 means failed, and 32 means unknown or still running.

        For profiles Fleet delivers, Fleet checks this Status node on the user channel and shows the result in the host's **OS settings**. The certificate appears in the host's **Certificates** section with a user store location.
    - question: What errors can user-context SCEP Enroll return?
      answer: |
        A `404` usually means the `./User/` SCEP node doesn't exist for the current user, or the host has no user session the MDM can target. A `500` means Windows couldn't start enrollment.

        CA-side failures, such as a reused challenge or wrong CA thumbprint, show up later as Status 16 with an HRESULT in the `ErrorCode` node.
    - question: Why is my user-scoped SCEP certificate stuck in Pending?
      answer: |
        Most often, no end user has signed in since the profile was added. Fleet holds user-scoped Windows profiles until someone signs in.

        If a user is signed in and it's still pending, check that the device has a user enrollment the MDM can reach. A profile that mixes `./Device/` and `./User/` settings also waits for sign-in, so keep device settings in a separate profile.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>a901c1bc-3970-461d-9c92-932645cab9b3</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/ClientCertificateInstall/SCEP/{UniqueID}/Install/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Enroll
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridlinkedenrollmentenroll
  description: Silently unenrolls the device from a Linked Enrollment without user interaction. All settings and resources applied by the Declared Configuration are rolled back automatically.
  supportedDeviceTypes:
    - Windows 10.0.22621
    - Windows 10.0.22000.918
    - Windows 10.0.19044.2193
    - Windows 10.0.19043.2193
    - Windows 10.0.19042.2193
  faq:
    - question: What does the DMClient LinkedEnrollment Enroll command do?
      answer: |
        It starts a silent Declared Configuration enrollment, also called a linked or dual enrollment. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Enroll`.

        Windows uses the Microsoft Entra device token to enroll in a second, linked management channel that uses the Windows Declared Configuration protocol. No user interaction is needed.
    - question: Does LinkedEnrollment Enroll enroll or unenroll the device?
      answer: |
        It enrolls. Microsoft's reference page repeats the Unenroll description under this node, which is a documentation error. The node's own description says it triggers a silent Declared Configuration enrollment.

        To remove the linked enrollment, use `LinkedEnrollment/Unenroll`.
    - question: How often is LinkedEnrollment Enroll used?
      answer: |
        Rarely. It's a special-purpose command for MDMs that layer Declared Configuration on top of a classic OMA-DM enrollment. Most Windows deployments never send it.
    - question: Does Fleet use LinkedEnrollment?
      answer: |
        No. Fleet manages Windows with OMA-DM SyncML and doesn't use Declared Configuration linked enrollments. You can still send this command as a custom MDM command if another service provides the linked enrollment endpoint.
    - question: What are the requirements for LinkedEnrollment Enroll?
      answer: |
        The device must be Microsoft Entra joined, because Windows uses the Entra device token. Supported versions are Windows 11 22H2 and later, Windows 11 21H2 with KB5016691, and Windows 10 20H2 through 21H2 with KB5018482.

        The `LinkedEnrollment/DiscoveryEndpoint` node must be set first. Without it, the Exec fails with `ERROR_FILE_NOT_FOUND (0x80070002)`.
    - question: How do I run LinkedEnrollment Enroll with Fleet?
      answer: |
        Replace `{ProviderID}` with the provider ID of the existing enrollment (Fleet's is `Fleet`), save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=linked-enroll.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Fleet custom commands only accept `<Exec>`, so set `DiscoveryEndpoint` with a custom Windows configuration profile first.
    - question: How do I check whether the linked enrollment succeeded?
      answer: |
        Read `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/EnrollStatus`. A value of 4 means enrollment succeeded, 2 means in progress, and 3 means failed.

        If it failed, `LinkedEnrollment/LastError` returns the HRESULT. You can read both nodes with a Fleet report that queries osquery's `mdm_bridge` table.
    - question: What errors does LinkedEnrollment Enroll return?
      answer: |
        `0x80070002` (file not found) means `DiscoveryEndpoint` isn't set. A `404` status usually means the OS build doesn't support linked enrollment or `{ProviderID}` is wrong. Authentication failures with the Entra device token show up in `LastError`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>307799ee-7535-472d-a06e-a846d8e6f214</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Enroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Unenroll (linked enrollment)
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridlinkedenrollmentunenroll
  description: Triggers the device to unenroll from its linked MDM enrollment
  supportedDeviceTypes:
    - Windows 10.0.22621
    - Windows 10.0.22000.918
    - Windows 10.0.19044.2193
    - Windows 10.0.19043.2193
    - Windows 10.0.19042.2193
  faq:
    - question: What does the LinkedEnrollment Unenroll command do?
      answer: |
        It removes a device's linked Declared Configuration enrollment. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Unenroll`.

        Unenrollment is silent. Windows rolls back every setting and resource applied through Declared Configuration. The primary OMA-DM enrollment stays in place.
    - question: Does LinkedEnrollment Unenroll remove the device from MDM?
      answer: |
        No. It removes only the linked Declared Configuration channel. The device stays enrolled in its primary MDM.

        To remove the primary enrollment, Microsoft provides `DMClient/Provider/{ProviderID}/Unenroll` and `DMClient/Unenroll`.
    - question: How often is LinkedEnrollment Unenroll used?
      answer: |
        Rarely. You'd send it when retiring a Declared Configuration deployment, or to reset a linked enrollment that's stuck before enrolling again.
    - question: Does Fleet use LinkedEnrollment Unenroll?
      answer: |
        No. Fleet doesn't create linked enrollments, so it never sends this command. You can send it as a custom MDM command to clean up a linked enrollment created by another tool.
    - question: How do I run LinkedEnrollment Unenroll with Fleet?
      answer: |
        Replace `{ProviderID}` with the provider ID of the primary enrollment, save the `<Exec>` element (without the `<syncml>` and `<syncbody>` wrappers), and run `fleetctl mdm run-command --hosts=<hostname> --payload=linked-unenroll.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        The host must be enrolled in Fleet's MDM, since Fleet delivers the command over that enrollment.
    - question: How do I confirm the linked enrollment was removed?
      answer: |
        Read `LinkedEnrollment/EnrollStatus`. A value of 8 means unenrollment succeeded, 6 means in progress, and 7 means failed. `LinkedEnrollment/LastError` returns the HRESULT on failure.

        The command result in `fleetctl get mdm-command-results --id=<command-uuid>` only shows whether Windows accepted the request.
    - question: What happens to settings applied through the linked enrollment?
      answer: |
        Windows rolls them back automatically. Anything set through Declared Configuration is reverted when the linked enrollment is removed.

        Settings from the primary OMA-DM enrollment, such as Fleet's configuration profiles, aren't affected.
    - question: Which Windows versions support LinkedEnrollment Unenroll?
      answer: |
        Windows 11 22H2 and later, Windows 11 21H2 with KB5016691 (build 22000.918), and Windows 10 20H2, 21H1, and 21H2 with KB5018482 (builds 1904x.2193 and later). On older builds the node doesn't exist and the command returns `404`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>48e557bd-c055-4239-bb13-d24fb5e0c526</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/LinkedEnrollment/Unenroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: InitiateRecovery
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridrecoveryinitiaterecovery
  description: Initiates a device recovery action. The server can specify prerequisites that must be met before the recovery action proceeds.
  supportedDeviceTypes:
    - Windows 10.0.22621
    - Windows 10.0.22000.1165
  faq:
    - question: What does the DMClient InitiateRecovery command do?
      answer: |
        It starts MDM recovery, which re-establishes a device's MDM enrollment credentials with the server. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Recovery/InitiateRecovery`.

        The data value sets prerequisites. `0` starts recovery right away. `1` starts recovery only if the MDM keys aren't already TPM protected, a TPM is available, the Entra ID keys are TPM protected, and the TPM is ready for attestation.
    - question: When is InitiateRecovery used?
      answer: |
        Rarely. It's for devices whose MDM certificate or keys are in a bad state, or to move MDM keys into the TPM. Most devices never need it.

        Windows can also start recovery on its own when `Recovery/AllowRecovery` is set to 1 and it detects an MDM certificate problem.
    - question: Does Fleet use InitiateRecovery?
      answer: |
        No. Fleet doesn't send this command, and Fleet's documentation doesn't describe support for MDM recovery requests on its enrollment service. Test on one host before sending it to a Fleet-enrolled fleet.

        If a Windows host loses its Fleet MDM enrollment and fleetd is installed, Fleet can enroll it again automatically when Windows MDM is turned on. See the [Windows MDM setup guide](https://fleetdm.com/guides/windows-mdm-setup).
    - question: What are the requirements for InitiateRecovery?
      answer: |
        Windows 11 22H2 or later, or Windows 11 21H2 with KB5018483 (build 22000.1165). The MDM server must support the recovery flow. With data value `1`, the device also needs a TPM that's ready for attestation and Entra ID keys protected by the TPM.
    - question: How do I run InitiateRecovery with Fleet?
      answer: |
        Replace `{ProviderID}` with the enrollment's provider ID (`Fleet` for Fleet's MDM), set `<Data>` to `0` or `1`, and save the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=recovery.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I check the result of InitiateRecovery?
      answer: |
        Read `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Recovery/RecoveryStatus`. A value of 1 means in progress, and 2 means finished successfully.

        Values 3 through 8 explain a failure: no TPM, Entra ID keys not TPM protected, MDM keys already TPM protected, TPM not ready for attestation, client can't authenticate to the server, or server rejected the request.
    - question: What errors can InitiateRecovery return?
      answer: |
        A `404` means the build doesn't support the Recovery node or `{ProviderID}` is wrong. A `400` usually means the `<Data>` value isn't `0` or `1`, or the format isn't `int`.

        Prerequisite failures don't appear in the command status. They show up in `RecoveryStatus`, most commonly 5 (keys already in the TPM) or 6 (TPM not ready).
    - question: Will InitiateRecovery interrupt the end user?
      answer: |
        Recovery runs in the background without prompting the user. The device may miss MDM check-ins while it re-establishes credentials, so commands queued during that window can be delayed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>cc6ccbd3-3679-44c0-976a-581e8946a96a</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Recovery/InitiateRecovery</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">int</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>0</Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Unenroll (provider)
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceproviderprovideridunenroll
  description: Triggers the device to unenroll from a specific MDM provider. The Provider ID of the management server must be specified in the <Data> element of the command.
  supportedDeviceTypes:
    - Windows 10.0.10240
  faq:
    - question: What does the DMClient Provider Unenroll command do?
      answer: |
        It unenrolls the device from a specific MDM server. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Unenroll`.

        Windows removes the enrollment, its MDM certificate, and the scheduled check-in tasks. Policies set through that enrollment are generally removed with it. The device stops checking in with that server.
    - question: How often is Provider Unenroll used?
      answer: |
        Rarely. It's a one-time action when retiring a device from MDM, cleaning up a stale enrollment, or moving a device to another MDM.
    - question: Does Fleet use DMClient Unenroll to turn off Windows MDM or migrate hosts?
      answer: |
        No. For automatic Windows MDM migration, Fleet's agent (fleetd) unenrolls the host from the old MDM locally with the Windows `UnregisterDeviceWithManagement` API, then enrolls it in Fleet. To turn off Windows MDM, Fleet's guide uses a script that removes the enrollment and fleetd.

        See the [Windows MDM setup guide](https://fleetdm.com/guides/windows-mdm-setup).
    - question: Will a Windows host re-enroll in Fleet after I unenroll it?
      answer: |
        It can. If Windows MDM is on in Fleet, automatic enrollment is on, and fleetd is still installed, Fleet tells fleetd to enroll the host again once it reports that it isn't enrolled.

        To keep a host out of Fleet's MDM, remove fleetd or use Fleet's documented turn-off steps instead.
    - question: How do I run Provider Unenroll with Fleet?
      answer: |
        Replace `{ProviderID}` with the enrollment's provider ID (Fleet's is `Fleet`) and fix the double slash in the example so the path ends in `/{ProviderID}/Unenroll`. Save the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=unenroll.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Fleet can only deliver it over its own enrollment, so this removes the host from Fleet's MDM.
    - question: How do I confirm the device unenrolled?
      answer: |
        You may not get a command result. Once Windows processes the Exec, the enrollment is gone and the host stops checking in with Fleet's MDM.

        Check the host in Fleet. Its MDM status shows **Off** after fleetd reports the change. On the device, the enrollment disappears from **Settings > Accounts > Access work or school**.
    - question: What errors can Provider Unenroll return?
      answer: |
        A `404` means the `{ProviderID}` doesn't match an enrollment on the device, or the LocURI is malformed, such as a double slash. A `405` means the verb wasn't `<Exec>`.

        Microsoft notes that the `<Data>` value is ignored on current Windows versions. The provider ID in the LocURI is what selects the enrollment.
    - question: Is Provider Unenroll reversible?
      answer: |
        Not by the MDM. Once unenrolled, the server can't reach the device, so you can't send a command to undo it. The device has to enroll again, either through fleetd's automatic enrollment, the end user, or a provisioning flow such as Autopilot.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>e43a2271-7661-4587-b452-df8880005fd8</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}//Unenroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Unenroll (device)
  platform: windows
  category: DMClient
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/dmclient-csp#deviceunenroll
  description: Triggers the device to permanently unenroll from its current MDM management server. The Provider ID of the management server must be specified in the <Data> element of the command.
  supportedDeviceTypes:
    - Windows 10.0.10240
  faq:
    - question: What does the DMClient Unenroll command do?
      answer: |
        It permanently unenrolls the device from an MDM server. The command is an `<Exec>` on `./Device/Vendor/MSFT/DMClient/Unenroll`.

        Microsoft keeps this path for backward compatibility. The current, provider-specific form is `./Device/Vendor/MSFT/DMClient/Provider/{ProviderID}/Unenroll`.
    - question: What's the difference between DMClient Unenroll and Provider Unenroll?
      answer: |
        They do the same job. `DMClient/Unenroll` is the older path and expects the provider ID in the `<Data>` element. `DMClient/Provider/{ProviderID}/Unenroll` names the provider in the LocURI, which is clearer and the form Microsoft documents first.

        Use the provider-specific form for new scripts.
    - question: How often is DMClient Unenroll used?
      answer: |
        Rarely. It's for retiring a device, removing a stale enrollment, or preparing to move to another MDM.
    - question: Does Fleet send DMClient Unenroll?
      answer: |
        No. Fleet's automatic Windows MDM migration has fleetd call the Windows `UnregisterDeviceWithManagement` API locally to leave the old MDM, then enrolls the host in Fleet. To turn off Fleet's Windows MDM, follow the [Windows MDM setup guide](https://fleetdm.com/guides/windows-mdm-setup), which uses a script.
    - question: How do I run DMClient Unenroll with Fleet?
      answer: |
        Put the provider ID in `<Data>` (`Fleet` for Fleet's MDM), set the format to `chr`, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=unenroll.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        This removes the host from Fleet's MDM. If fleetd is still installed and automatic Windows MDM enrollment is on, Fleet enrolls the host again.
    - question: How do I confirm the device unenrolled?
      answer: |
        The host stops checking in with Fleet's MDM, so a command result may never arrive. Check the host's MDM status in Fleet after fleetd reports in, or look under **Settings > Accounts > Access work or school** on the device.
    - question: What errors can DMClient Unenroll return?
      answer: |
        A `404` means no enrollment matches, or the node path is wrong. A `400` usually means the payload's `<Meta>` or `<Data>` doesn't match what the node expects.

        If the device unenrolls successfully, you won't see an error, and you may not see a success status either, because the connection ends.
    - question: Does DMClient Unenroll wipe the device?
      answer: |
        No. It removes the MDM enrollment only. Apps, files, and user accounts stay on the device. To erase a device, use the RemoteWipe CSP, which Fleet exposes as **Wipe** in host details (Fleet Premium).
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>b1eae449-50af-4cb1-a680-a7ef8f583646</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/DMClient/Unenroll</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: OfflineScan
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#offlinescan
  description: Starts a Microsoft Defender Offline scan on the device. After the next reboot, the device will start in Microsoft Defender Offline mode to perform a scan before Windows loads, helping detect and remove persistent or hard-to-find malware.
  supportedDeviceTypes:
    - Windows 10.0.17134
  faq:
    - question: What does the Defender OfflineScan MDM command do?
      answer: |
        It schedules a Microsoft Defender Offline scan. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/OfflineScan`.

        On the next restart, the device boots into Microsoft Defender Offline and scans before Windows loads. That helps find rootkits and other malware that hide while Windows is running.
    - question: When should I use Defender OfflineScan?
      answer: |
        Rarely, and only when you suspect persistent malware that a normal scan can't remove. It's an incident response tool, not routine maintenance.

        Defender may also report that an offline scan is required through its `Health/ComputerState` node. That's a good signal to send it.
    - question: Does Fleet send Defender OfflineScan?
      answer: |
        No. Fleet doesn't send Defender commands automatically. You can send OfflineScan as a custom MDM command to any Windows host enrolled in Fleet's MDM.
    - question: Does OfflineScan restart the device?
      answer: |
        Not by itself. The scan runs on the next restart, and Microsoft marks the node's reboot behavior as server initiated. The end user can restart, or you can send `./Device/Vendor/MSFT/Reboot/RebootNow`.

        The offline scan takes time, about 15 minutes in Microsoft's guidance, and the device isn't usable until it finishes. Warn end users first.
    - question: How do I run OfflineScan with Fleet?
      answer: |
        Save the `<Exec>` element (without the `<syncml>` and `<syncbody>` wrappers) and run `fleetctl mdm run-command --hosts=<hostname> --payload=offlinescan.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`. It's available in Fleet Free and Fleet Premium.
    - question: How do I know the offline scan ran?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` returns `200` when Windows accepts the request. That means the scan is scheduled, not finished.

        After the restart, check the Defender protection history on the device, or read Defender's `Health` nodes. You can query them in a Fleet report with osquery's `mdm_bridge` table.
    - question: What errors can OfflineScan return?
      answer: |
        A `404` usually means the device runs a Windows version older than 1803. A `405` means the verb wasn't `<Exec>`. A `500` often means Defender isn't the active antivirus, for example when a third-party product has put Defender in passive or disabled mode.
    - question: Does OfflineScan work if another antivirus is installed?
      answer: |
        Usually not. The Defender CSP commands rely on Microsoft Defender Antivirus being active. If a third-party antivirus is the primary product, Defender may be disabled and the command fails.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>0370d798-9a85-4dee-a870-176146513415</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/OfflineScan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RollbackEngine
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#rollbackengine
  description: Rolls back the Microsoft Defender antimalware engine to its last known good version on the device.
  supportedDeviceTypes:
    - Windows 10.0.17134
  faq:
    - question: What does the Defender RollbackEngine command do?
      answer: |
        It rolls Microsoft Defender's antimalware engine back to its last known good saved version. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/RollbackEngine`.

        The engine is the scanning component Microsoft updates monthly. It's separate from security intelligence (signatures) and from the Defender platform.
    - question: When would I use RollbackEngine?
      answer: |
        Rarely. Use it when a new engine update causes a known problem, such as false positives, high CPU, or app compatibility issues, and Microsoft or your security team recommends rolling back.
    - question: Does Fleet use RollbackEngine?
      answer: |
        No. Fleet doesn't send Defender commands automatically. You can send RollbackEngine as a custom MDM command to Windows hosts enrolled in Fleet's MDM.
    - question: How do I run RollbackEngine with Fleet?
      answer: |
        Save the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=rollback-engine.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`. Target a small set of hosts first.
    - question: How do I verify the Defender engine was rolled back?
      answer: |
        Check `fleetctl get mdm-command-results --id=<command-uuid>` for `200`. Then read `./Device/Vendor/MSFT/Defender/Health/EngineVersion` and confirm it changed to the earlier version.

        You can read the version across hosts with a Fleet report on osquery's `mdm_bridge` table, or on the device with `Get-MpComputerStatus`.
    - question: Will the Defender engine update again after a rollback?
      answer: |
        Yes, unless you control updates. Defender normally installs newer engine versions through its regular update channel. If you need to hold a version, manage Defender's update rings with the Defender policies in a configuration profile.
    - question: What errors can RollbackEngine return?
      answer: |
        A `404` means the Windows version is older than 1803. A `500` usually means there's no saved engine version to roll back to, or Defender isn't the active antivirus.
    - question: What's the difference between RollbackEngine and RollbackPlatform?
      answer: |
        RollbackEngine reverts the scanning engine only. RollbackPlatform reverts the Defender platform, which is the antimalware service and its binaries, to the last known good installation location.

        Pick the one that matches the update that caused the problem.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d8d49362-a2df-46b6-b42b-dab967f822f8</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/RollbackEngine</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RollbackPlatform
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#rollbackplatform
  description: Rolls back Microsoft Defender to its last known good installation location on the device.
  supportedDeviceTypes:
    - Windows 10.0.17134
  faq:
    - question: What does the Defender RollbackPlatform command do?
      answer: |
        It rolls Microsoft Defender back to its last known good installation location. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/RollbackPlatform`.

        The platform is the Defender antimalware service and its binaries. Microsoft updates it separately from the engine and from security intelligence.
    - question: When would I use RollbackPlatform?
      answer: |
        Rarely. Use it when a Defender platform update causes a problem, such as a service crash, performance regression, or app conflict, and you need the previous version while you investigate.
    - question: Does Fleet use RollbackPlatform?
      answer: |
        No. Fleet doesn't send Defender commands automatically. You can send RollbackPlatform as a custom MDM command.
    - question: How do I run RollbackPlatform with Fleet?
      answer: |
        Save the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=rollback-platform.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`. Try it on one host before a wider rollout.
    - question: How do I verify the Defender platform was rolled back?
      answer: |
        Check `fleetctl get mdm-command-results --id=<command-uuid>` for `200`. Then read `./Device/Vendor/MSFT/Defender/Health/DefenderVersion` to confirm the earlier platform version.

        Microsoft marks the node's reboot behavior as server initiated, so plan for a restart if the version doesn't change right away.
    - question: What errors can RollbackPlatform return?
      answer: |
        A `404` means the device runs a Windows version older than 1803. A `500` usually means there's no earlier platform installation to roll back to, or Defender isn't the active antivirus.
    - question: Will Defender update its platform again after a rollback?
      answer: |
        Yes. Defender keeps receiving platform updates unless you change its update settings. Use Defender policy settings in a Fleet configuration profile to control update channels if you need to stay on a version.
    - question: Is RollbackPlatform device scope or user scope?
      answer: |
        Device scope only. Defender runs as a system service, so all Defender CSP commands target `./Device/`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>25b353ea-3b5a-4da8-a9a0-3aa602cf08a3</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/RollbackPlatform</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Scan
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#scan
  description: Starts a Windows Defender scan on the device
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the Defender Scan MDM command do?
      answer: |
        It starts a Microsoft Defender Antivirus scan. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/Scan`.

        Set `<Data>` to `1` for a quick scan or `2` for a full scan. The example payload has no `<Data>` element, so add one before you send it.
    - question: How often is the Defender Scan command used?
      answer: |
        Occasionally. Defender runs scheduled scans on its own, so most admins send Scan on demand: after a detection, during an investigation, or when a scan is overdue.
    - question: Does Fleet run Defender scans?
      answer: |
        No. Fleet doesn't send Defender Scan automatically. You can send it as a custom MDM command, or run `Start-MpScan` with a PowerShell script from **Actions > Run script** on the host's details page. Learn more in the [scripts guide](https://fleetdm.com/guides/scripts).
    - question: How do I run a Defender quick scan with Fleet?
      answer: |
        Add `<Data>1</Data>` (or `2` for a full scan) inside the `<Item>`, keep the format as `chr`, and save the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=scan.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        You can target many hosts at once with a comma-separated `--hosts` list.
    - question: How do I know the Defender scan finished?
      answer: |
        A `200` command result only means the scan started. To confirm it finished, read `Health/QuickScanTime` or `Health/FullScanTime`, and `Health/ComputerState` for any pending actions.

        You can query those nodes across hosts with a Fleet report on osquery's `mdm_bridge` table.
    - question: What errors can the Defender Scan command return?
      answer: |
        A `400` usually means `<Data>` is missing or isn't `1` or `2`. A `500` usually means Defender isn't running or is in passive mode because another antivirus is primary. A `405` means the verb wasn't `<Exec>`.
    - question: Will the end user notice a Defender scan?
      answer: |
        Possibly. A quick scan is light. A full scan can take a long time and use noticeable CPU and disk. Defender shows scan activity and any detections in Windows Security notifications.
    - question: Does Defender Scan work on Windows Home?
      answer: |
        Microsoft lists the Defender CSP for Pro, Enterprise, Education, and IoT Enterprise editions. Windows Home can't enroll in an MDM like Fleet, so it can't receive this command.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>9326cc3a-8960-4e7a-b46f-c414e871ca5b</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/Scan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpdateSignature
  platform: windows
  category: Defender
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/defender-csp#updatesignature
  description: Performs a Windows Defender signature update on the device.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the Defender UpdateSignature MDM command do?
      answer: |
        It tells Microsoft Defender Antivirus to download and install the latest security intelligence (signature) update now. The command is an `<Exec>` on `./Device/Vendor/MSFT/Defender/UpdateSignature`.
    - question: How often is UpdateSignature used?
      answer: |
        Occasionally. Defender checks for signature updates on its own schedule. Admins send UpdateSignature to force an update during an outbreak, before a scan, or on a device that reports out-of-date signatures.
    - question: Does Fleet send UpdateSignature?
      answer: |
        No. Fleet doesn't send Defender commands automatically. You can send UpdateSignature as a custom MDM command, or run `Update-MpSignature` with a PowerShell script from **Actions > Run script**.
    - question: How do I run UpdateSignature with Fleet?
      answer: |
        Save the `<Exec>` element (without the `<syncml>` and `<syncbody>` wrappers) and run `fleetctl mdm run-command --hosts=<hostname> --payload=update-signature.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        It's available in Fleet Free and Fleet Premium.
    - question: How do I confirm Defender signatures updated?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the update started. Then read `Health/SignatureVersion` and `Health/SignatureOutOfDate` to confirm the new version.

        A Fleet policy using osquery's `mdm_bridge` table can flag every host where `SignatureOutOfDate` is true.
    - question: What errors can UpdateSignature return?
      answer: |
        A `500` usually means Defender couldn't reach its update source, such as Microsoft Update or a configured file share, or Defender isn't the active antivirus. A `404` means the node isn't available on that device.
    - question: Does UpdateSignature update the Defender engine and platform too?
      answer: |
        Not necessarily. It targets security intelligence. Engine and platform updates follow their own channels, although the engine can update alongside signatures depending on your Defender update settings.
    - question: Can I make Defender update signatures more often?
      answer: |
        Yes, with policy instead of repeated commands. Deliver Defender update policies, such as the signature update interval, in a Fleet configuration profile. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>034c6f94-db50-4ec1-87f5-71900cb730a2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Defender/UpdateSignature</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: MdmConfiguration
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#devicestatedatamdmconfiguration
  description: Triggers a snapshot of the device’s management state data, capturing the current MDM configuration for diagnostic purposes.
  supportedDeviceTypes:
    - Windows 10.0.14393
  faq:
    - question: What does the DiagnosticLog MdmConfiguration command do?
      answer: |
        It takes a snapshot of the device's MDM state data for troubleshooting. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/DeviceStateData/MdmConfiguration` with `<Data>SNAP</Data>`.

        The snapshot captures the current MDM configuration so you can compare what the device has applied with what the MDM server sent.
    - question: How often is MdmConfiguration used?
      answer: |
        Rarely. It's a diagnostic step for investigating why settings didn't apply. It isn't part of normal MDM check-ins.
    - question: Does Fleet use MdmConfiguration?
      answer: |
        No. Fleet tracks each Windows configuration profile's status itself and shows it in the host's **OS settings**. You can send this command as a custom MDM command when you need a device-side snapshot.
    - question: How do I run MdmConfiguration with Fleet?
      answer: |
        Keep `<Data>SNAP</Data>` and format `chr`, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=mdm-snap.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I get the MDM configuration snapshot off the device?
      answer: |
        The command creates the snapshot on the device. It doesn't send it to Fleet. Microsoft's FileDownload node can read files from the device, but that takes a series of Get and Replace operations, and Fleet custom commands accept only `<Exec>`.

        A practical alternative is a PowerShell script from **Actions > Run script** that runs `mdmdiagnosticstool.exe` and reports what you need. See the [scripts guide](https://fleetdm.com/guides/scripts).
    - question: What errors can MdmConfiguration return?
      answer: |
        A `400` usually means `<Data>` isn't `SNAP` or the format isn't `chr`. A `404` means the node isn't available, typically on builds older than Windows 10, version 1607.
    - question: How do I check that MdmConfiguration worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows took the snapshot.
    - question: Does the MdmConfiguration snapshot include personal data?
      answer: |
        It captures device management state, such as policies and enrollment details, not user documents. It can still include identifiers like the enrolled user's UPN, so handle it like other diagnostic logs.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>86e88d1e-9474-4098-91af-ec28d066b072</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/DeviceStateData/MdmConfiguration</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>SNAP</Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ArchiveDefinition
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#diagnosticarchivearchivedefinition
  description: Definition and collection point for diagnostic archives on the device.
  supportedDeviceTypes:
    - Windows 10.0.18362
  faq:
    - question: What does the DiagnosticLog ArchiveDefinition command do?
      answer: |
        It collects diagnostic data from a Windows device and uploads it as a zip file. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/DiagnosticArchive/ArchiveDefinition`, with a `Collection` XML snippet in `<Data>`.

        The snippet lists what to gather, such as registry keys, files, event logs, and output from approved commands, plus a `SasUrl` where the device uploads the result.
    - question: How often is ArchiveDefinition used?
      answer: |
        Rarely. It's how MDMs implement remote log collection for troubleshooting, for example Intune's Collect diagnostics action. Admins use it when they need logs without touching the device.
    - question: Does Fleet use ArchiveDefinition?
      answer: |
        No. Fleet doesn't send this command and doesn't provide upload storage for it. You can send it as a custom MDM command if you provide your own storage URL.
    - question: What do I need before running ArchiveDefinition?
      answer: |
        A storage URL the device can write to with an HTTP PUT, such as an Azure Blob Storage container with a time-limited shared access signature (SAS) URL. You also need a unique `ID` in the `Collection` XML.

        The device ignores repeated requests with the same `ID`, so generate a new one each time. Windows 10, version 1903 or later is required.
    - question: How do I run ArchiveDefinition with Fleet?
      answer: |
        Add a `<Data>` element containing your `Collection` XML (escape it or wrap it in CDATA), keep the format `chr`, and save the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=archive.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        The SAS URL is a credential. Use a short expiry and write-only permissions.
    - question: How do I know the diagnostic archive uploaded?
      answer: |
        Check your storage container for a file named `DiagLogs-{ComputerName}-YYYYMMDDTHHMMSSZ.zip`. The command result in `fleetctl get mdm-command-results --id=<command-uuid>` shows only whether Windows accepted the request.

        On the device, `DiagnosticArchive/ArchiveResults` returns details about the last run.
    - question: What errors can ArchiveDefinition return?
      answer: |
        A `400` usually means the `Collection` XML is malformed or missing `ID` or `SasUrl`. Upload failures, such as an expired SAS URL or a container that rejects the PUT, happen after the command is accepted and appear in `ArchiveResults`.

        Microsoft limits registry paths to HKLM and HKCR and allows only a fixed list of commands, so other entries are skipped.
    - question: Is there a simpler way to collect logs from Windows hosts with Fleet?
      answer: |
        Yes. Run a PowerShell script from **Actions > Run script** on the host's details page to gather what you need, or use a Fleet report to query logs and settings directly with osquery. See the [scripts guide](https://fleetdm.com/guides/scripts).
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>91bde209-058a-4d1a-9805-702aeab4976a</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/DiagnosticArchive/ArchiveDefinition</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Export
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#etwlogchannelschannelnameexport
  description: Triggers exporting events from the associated Windows event channel into a log file with the standard .evtx extension.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the DiagnosticLog Export command do?
      answer: |
        It exports events from a Windows event log channel to an `.evtx` file on the device. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/EtwLog/Channels/{ChannelName}/Export`.

        `.evtx` is the standard Windows event log format, so you can open the file in Event Viewer.
    - question: Why is there no channel name in the example LocURI?
      answer: |
        The example omits it. Insert the full, URL-encoded channel name between `Channels/` and `/Export`. For example, `Microsoft-Client-Licensing-Platform/Admin` becomes `Microsoft-Client-Licensing-Platform%2FAdmin`.

        Microsoft's docs also describe adding the channel node first, using its full name.
    - question: How often is the DiagnosticLog Export command used?
      answer: |
        Rarely. It's a troubleshooting tool for pulling one event channel from a device you can't access directly.
    - question: Does Fleet use DiagnosticLog Export?
      answer: |
        No. Fleet doesn't send this command. You can send it as a custom MDM command.
    - question: How do I run DiagnosticLog Export with Fleet?
      answer: |
        Put the encoded channel name in the LocURI, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=export.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        If the channel node doesn't exist yet, it has to be added first, and Fleet custom commands accept only `<Exec>`.
    - question: How do I retrieve the exported .evtx file?
      answer: |
        Export writes the file on the device. Microsoft's FileDownload node can read it back in blocks, but that takes repeated Get and Replace operations that Fleet custom commands don't support.

        For most investigations, a PowerShell script from **Actions > Run script** that runs `Get-WinEvent` and prints matching events is simpler. See the [scripts guide](https://fleetdm.com/guides/scripts).
    - question: What errors can DiagnosticLog Export return?
      answer: |
        A `404` usually means the channel name is missing, misspelled, not URL-encoded, or not added. A `500` means Windows couldn't export the channel. A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the export ran.
    - question: Can Fleet show Windows event logs without this command?
      answer: |
        Yes. Fleet reports can query Windows event logs through osquery's `windows_eventlog` table, and fleetd can also collect events through osquery's `windows_events` table when it's turned on.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>22ba5bc3-70cf-4742-94e4-c7c7658a64a2</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/EtwLog/Channels/Export</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: TraceControl
  platform: windows
  category: DiagnosticLog
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/diagnosticlog-csp#etwlogcollectorscollectornametracecontrol
  description: Triggers the start or stop of the associated trace session.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the DiagnosticLog TraceControl command do?
      answer: |
        It starts or stops an ETW (Event Tracing for Windows) trace session for a collector. The command is an `<Exec>` on `./Vendor/MSFT/DiagnosticLog/EtwLog/Collectors/{CollectorName}/TraceControl`.

        Set `<Data>` to `START` to begin logging or `STOP` to end it. The example has no `<Data>` element, so add one.
    - question: How often is TraceControl used?
      answer: |
        Rarely. It's for deep troubleshooting with Microsoft support or a vendor that needs a trace from specific ETW providers.
    - question: What has to be set up before TraceControl works?
      answer: |
        The collector must already exist. Microsoft's steps are to add a collector with a name, optionally set log file options, then add each ETW provider by GUID under `Collectors/{CollectorName}/Providers/{ProviderGUID}`.

        Only after that do you send `START`, reproduce the issue, and send `STOP`.
    - question: Does Fleet use TraceControl?
      answer: |
        No. Fleet doesn't send this command. Because Fleet custom commands accept only `<Exec>`, create the collector and providers through a custom Windows configuration profile, then send TraceControl as a custom command.
    - question: How do I run TraceControl with Fleet?
      answer: |
        Replace `{CollectorName}`, add `<Data>START</Data>` (or `STOP`), save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=trace-start.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Send a second command with `STOP` when you're done.
    - question: Where does the trace file go?
      answer: |
        Windows writes the `.etl` trace file on the device. Microsoft documents collecting it with the FileDownload node, which takes Get and Replace operations that Fleet custom commands don't support.

        To retrieve it, run a script from **Actions > Run script** that copies or uploads the file.
    - question: What errors can TraceControl return?
      answer: |
        A `404` means the collector doesn't exist or `{CollectorName}` is wrong. A `400` usually means `<Data>` isn't `START` or `STOP`. A `500` means Windows couldn't start or stop the session, for example because the session is already in that state.
    - question: How do I confirm the trace started?
      answer: |
        Check for a `200` in `fleetctl get mdm-command-results --id=<command-uuid>`. On the device, `logman query -ets` lists active trace sessions. You can run it from a Fleet script.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>a563bffc-2c4c-4f2f-a5e5-6545bab6ad95</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/DiagnosticLog/EtwLog/Collectors/{CollectorName}/TraceControl</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: DownloadInstall (Device context)
  platform: windows
  category: EnterpriseDesktopAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisedesktopappmanagement-csp#devicemsiproductiddownloadinstall
  description: Executes the download and installation of an application. An optional <DownloadFromAad> tag in the <Enforcement> section of the XML (default 0) can be set to 1 to include the AAD user token when retrieving the download URL.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseDesktopAppManagement DownloadInstall command do in device context?
      answer: |
        It downloads an MSI and installs it for all users on the device. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall`.

        The `<Data>` carries an `MsiInstallJob` XML with the download URL, the file's SHA-256 hash, and msiexec options such as `/quiet`. Windows runs the install as SYSTEM.
    - question: How often is device-context DownloadInstall used?
      answer: |
        Often, in MDMs that deploy MSIs over the MDM channel. It's the standard way for Windows MDM to install a line-of-business MSI.
    - question: Does Fleet use DownloadInstall?
      answer: |
        Yes, for one job. When a Windows host enrolls in Fleet's MDM without fleetd installed, such as through Autopilot or Microsoft Entra automatic enrollment, Fleet sends this command in device context to install fleetd.

        For other software, Fleet doesn't use this CSP. fleetd installs `.msi` and `.exe` packages you upload to Fleet. See [Deploy software](https://fleetdm.com/guides/deploy-software-packages).
    - question: Do I need to add the MSI node before DownloadInstall?
      answer: |
        Microsoft's examples send an `<Add>` for the `{ProductID}` node before the `<Exec>`, and Fleet does the same when it installs fleetd. Fleet custom commands accept only a single `<Exec>`, so a standalone DownloadInstall may fail with `404` on a node that doesn't exist yet.

        For your own MSIs, uploading the package to Fleet is the supported route.
    - question: How do I run device-context DownloadInstall with Fleet?
      answer: |
        Replace `{ProductID}` with the MSI product code (URL-encode the braces as `%7B` and `%7D`), add `<Data>` with your `MsiInstallJob`, and save the `<Exec>` element. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=install.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        The `ContentURL` must be reachable from the device.
    - question: How do I know the MSI installed?
      answer: |
        Installs are asynchronous. A `200` or `202` in `fleetctl get mdm-command-results --id=<command-uuid>` means the job was accepted. Read `MSI/{ProductID}/Status` for progress: 70 means enforcement completed, 60 means enforcement failed, and 30 means download failed.

        `LastError` and `LastErrorDesc` give the reason. The app also appears in the host's software inventory in Fleet.
    - question: What errors can DownloadInstall return?
      answer: |
        A `404` usually means the `{ProductID}` node wasn't added. A `400` means the `MsiInstallJob` XML is malformed. After the command is accepted, a hash mismatch or unreachable URL shows as Status 30, and an msiexec failure shows as Status 60 with an HRESULT in `LastError`.
    - question: What's the difference between device and user context DownloadInstall?
      answer: |
        Device context (`./Device/`) installs per-machine for every user. User context (`./User/`) installs for the user tied to the MDM session.

        Microsoft notes the MSI's own package type matters too. A per-machine MSI installs per-device even when targeted to a user.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>02802f7e-1266-494a-b4b0-9878a122fafa</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: DownloadInstall (User context)
  platform: windows
  category: EnterpriseDesktopAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisedesktopappmanagement-csp#usermsiproductiddownloadinstall
  description: Executes the download and installation of an application. An optional <DownloadFromAad> tag in the <Enforcement> XML section (default 0) can be set to 1 to include the AAD user token when retrieving the download URL.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseDesktopAppManagement DownloadInstall command do in user context?
      answer: |
        It downloads an MSI and installs it for the user tied to the MDM session. The command is an `<Exec>` on `./User/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall`.

        The `<Data>` carries an `MsiInstallJob` XML with the download URL, SHA-256 hash, and msiexec options. Per-user MSIs install into that user's profile.
    - question: When should I use user context instead of device context?
      answer: |
        Use user context for per-user or dual-mode MSIs that should install only for one person. Use device context for per-machine MSIs or apps every user needs.

        Microsoft notes that a per-machine MSI installs per-device even when the LocURI starts with `./User/`.
    - question: How often is user-context DownloadInstall used?
      answer: |
        Less often than device context. Most enterprise MSIs are per-machine, so user-context installs are mainly for per-user apps.
    - question: Does Fleet use user-context DownloadInstall?
      answer: |
        No. Fleet only uses DownloadInstall in device context, to install fleetd. For other software, fleetd installs packages you upload to Fleet. See [Deploy software](https://fleetdm.com/guides/deploy-software-packages).
    - question: What does DownloadFromAad do?
      answer: |
        Setting `<DownloadFromAad>1</DownloadFromAad>` in the `<Enforcement>` section tells Windows to include the Microsoft Entra user token when downloading from `ContentURL`. The default is 0. Use it only when your download server authenticates with Entra ID.
    - question: How do I run user-context DownloadInstall with Fleet?
      answer: |
        Replace `{ProductID}` with the URL-encoded product code, add your `MsiInstallJob` in `<Data>`, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-user.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Microsoft requires an `<Add>` on the node first, which Fleet custom commands can't send, so this may return `404`.
    - question: How do I know the per-user MSI installed?
      answer: |
        Read `./User/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/Status`. Status 70 means completed, 48 means waiting for a user session, and 60 means failed. `LastError` gives the HRESULT.

        Per-user installs show in Fleet's software inventory when osquery can see them in the signed-in user's profile.
    - question: Why is my user-context install stuck?
      answer: |
        A Status of 48 (pending user session) means Windows is waiting for the target user to sign in. User-context commands need a user tied to the MDM enrollment. On devices with device-only enrollment, `./User/` installs may never run.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>bbb7ee46-9032-4020-b1f5-0252104ab3a8</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseDesktopAppManagement/MSI/{ProductID}/DownloadInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: HostedInstall (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappinstallationpackagefamilynamehostedinstall
  description: Installs an app package from a hosted location, such as a local drive, UNC path, or HTTPS source.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseModernAppManagement HostedInstall command do?
      answer: |
        It installs an app package, such as `.appx`, `.msix`, or a bundle, from a location you host. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/HostedInstall`.

        The source can be a local path, a UNC share, or an HTTPS URL. In device context the package is provisioned for all users on the device.
    - question: How often is HostedInstall used?
      answer: |
        Occasionally. It's the MDM route for sideloading line-of-business MSIX and APPX apps. Many teams now package apps as MSI or EXE instead.
    - question: Does Fleet use HostedInstall?
      answer: |
        No. Fleet doesn't send this command. fleetd installs the `.msi` and `.exe` packages you upload to Fleet. You can also install an MSIX with a PowerShell script (`Add-AppxProvisionedPackage`) using a script-only package. See [Deploy software](https://fleetdm.com/guides/deploy-software-packages).
    - question: What goes in the HostedInstall payload?
      answer: |
        Replace `{PackageFamilyName}` with the app's package family name, such as `Contoso.App_8wekyb3d8bbwe`. Then add `<Data>` with an `Application` element whose `PackageUri` points to the package.

        Optional attributes set deployment options, such as `ForceApplicationShutdown`, `DeferRegistration="1"`, or `StageOnly="1"`. Dependencies need to be reachable too.
    - question: How do I run HostedInstall with Fleet?
      answer: |
        Save the `<Exec>` element with your data and run `fleetctl mdm run-command --hosts=<hostname> --payload=hostedinstall.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Microsoft's examples add the `{PackageFamilyName}` node before the Exec. Fleet custom commands accept only `<Exec>`, so if you get `404`, the node may need to exist first.
    - question: What are the requirements for installing a hosted app package?
      answer: |
        The package must be signed with a certificate the device trusts. For line-of-business apps, deploy the signing certificate to the device's trusted store first, for example with a Fleet configuration profile. Sideloading must also be allowed, which is the default on current Windows versions.
    - question: How do I know HostedInstall worked?
      answer: |
        Installs run in the background, so a `200` or `202` result only means Windows accepted the job. Read `AppInstallation/{PackageFamilyName}/Status` and `LastError` to track progress.

        The app also appears in Fleet's software inventory for the host after the next refresh.
    - question: What errors can HostedInstall return?
      answer: |
        A `400` usually means the XML in `<Data>` is malformed. After acceptance, common failures are an untrusted signing certificate, a missing dependency, or an unreachable `PackageUri`. These show up as an HRESULT in `LastError`, often in the `0x80073CF*` range used by Windows app deployment.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ba628a02-12d5-48c4-9586-34fa039a4a00</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/HostedInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: StoreInstall (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappinstallationpackagefamilynamestoreinstall
  description: Installs an app along with its license from the Microsoft Store under the device context.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseModernAppManagement StoreInstall command do?
      answer: |
        It installs a Microsoft Store app along with its license. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/StoreInstall`.

        In device context, the app is provisioned for all users on the device rather than one user.
    - question: Does StoreInstall still work now that Microsoft Store for Business is retired?
      answer: |
        Partly. Microsoft retired Microsoft Store for Business and Education in 2023, and the license and catalog flows this command relied on came from that service.

        For new deployments, Microsoft points to the Windows Package Manager (winget) and the new Microsoft Store experience. Test StoreInstall on one host before relying on it.
    - question: How often is StoreInstall used?
      answer: |
        Less often today than when Microsoft Store for Business existed. Many teams have moved to winget-based installs.
    - question: Does Fleet use StoreInstall?
      answer: |
        No. Fleet doesn't send this command. To install Store apps with Fleet, a common approach is a script-only package that runs `winget install`. See [Add Microsoft Store apps to self service with script-only packages](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages-guide).
    - question: How do I run StoreInstall with Fleet?
      answer: |
        Replace `{PackageFamilyName}`, add `<Data>` with an `Application` element that identifies the Store product, save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=storeinstall.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Check Microsoft's StoreInstall documentation for the exact attributes your product needs.
    - question: How do I check whether StoreInstall worked?
      answer: |
        A `200` or `202` result in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the job. Read `AppInstallation/{PackageFamilyName}/Status` and `LastError` for the outcome, then look for the app in the host's software inventory in Fleet.
    - question: What errors can StoreInstall return?
      answer: |
        A `400` usually means the `<Data>` XML is malformed. Store-side failures, such as an unknown product, no available license, or a device that can't reach the Store, show up as an HRESULT in `LastError`. Policies that block the Microsoft Store can also stop installs.
    - question: What's the difference between device and user context StoreInstall?
      answer: |
        Device context provisions the app for every user who signs in. User context installs it only for the user tied to the MDM session. Device context suits shared or kiosk devices.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>19e07f1f-bce0-43a1-a364-477c1cd500ab</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/StoreInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: AddLicense (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceapplicensesstorelicenseslicenseidaddlicense
  description: Adds a specified app license to the device using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseModernAppManagement AddLicense command do?
      answer: |
        It adds an app license to the device. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense`.

        Microsoft notes the `{LicenseID}` is generally the app's package family name. The `<Data>` carries the license content.
    - question: When would I use AddLicense?
      answer: |
        Rarely. It's mainly for offline-licensed Store apps, where the license is delivered separately from the app package. Without a valid license, those apps install but won't run.
    - question: Is AddLicense still relevant after Microsoft Store for Business was retired?
      answer: |
        Less so. Offline licenses were typically downloaded from Microsoft Store for Business, which Microsoft retired in 2023. Use AddLicense only if you still have valid offline license files.
    - question: Does Fleet use AddLicense?
      answer: |
        No. Fleet doesn't manage Microsoft Store licenses. You can send AddLicense as a custom MDM command.
    - question: How do I run AddLicense with Fleet?
      answer: |
        Replace `{LicenseID}`, put the license XML in `<Data>` (format `xml`), save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=addlicense.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I confirm the license was added?
      answer: |
        Check `fleetctl get mdm-command-results --id=<command-uuid>` for `200`. Then read `AppLicenses/StoreLicenses/{LicenseID}/LicenseCategory` and `LicenseUsage` on the device. Confirm the app launches for an end user.
    - question: What errors can AddLicense return?
      answer: |
        A `400` usually means the license data is malformed or encoded incorrectly. A `500` often means Windows rejected the license, for example because it's for another app or isn't valid for this device.
    - question: What's the difference between AddLicense and GetLicenseFromStore?
      answer: |
        AddLicense installs license data you supply in the command. GetLicenseFromStore asks the device to fetch the license from the Microsoft Store itself. Use AddLicense for offline licenses and GetLicenseFromStore for online ones.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>2a7e4bc2-5b0d-4cf1-b66d-05f828177582</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: GetLicenseFromStore (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceapplicensesstorelicenseslicenseidgetlicensefromstore
  description: Retrieves a specified app license from the Microsoft Store using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the GetLicenseFromStore command do?
      answer: |
        It tells the device to fetch an app license from the Microsoft Store. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore`.

        The `{LicenseID}` is generally the app's package family name.
    - question: When would I use GetLicenseFromStore?
      answer: |
        Rarely. It repairs or refreshes the license for an online-licensed Store app that's installed but won't launch because its license is missing or expired.
    - question: Does GetLicenseFromStore work after Microsoft Store for Business was retired?
      answer: |
        It depends on the app. Organization-purchased licenses came from Microsoft Store for Business, which Microsoft retired in 2023. Free Store apps and apps licensed through the consumer Store may still work. Test on one host first.
    - question: Does Fleet use GetLicenseFromStore?
      answer: |
        No. Fleet doesn't send this command. You can send it as a custom MDM command.
    - question: How do I run GetLicenseFromStore with Fleet?
      answer: |
        Replace `{LicenseID}`, include the `<Data>` the node expects (format `xml`), save the `<Exec>` element, and run `fleetctl mdm run-command --hosts=<hostname> --payload=getlicense.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        The device needs internet access to the Microsoft Store.
    - question: How do I check that the license was retrieved?
      answer: |
        Look for `200` in `fleetctl get mdm-command-results --id=<command-uuid>`. Then read `LicenseCategory` and `LicenseUsage` under the same `{LicenseID}` and confirm the app opens.
    - question: What errors can GetLicenseFromStore return?
      answer: |
        A `404` usually means the `{LicenseID}` doesn't match a known app. A `500` usually means the Store couldn't issue a license, often because the device can't reach the Store, Store access is blocked by policy, or no license is available for the app.
    - question: Does GetLicenseFromStore install the app?
      answer: |
        No. It only retrieves the license. Install the app separately, for example with StoreInstall or a winget script.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>aba692b8-bd1b-4bd1-90b6-eef510b03562</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetPackage (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappmanagementresetpackage
  description: Restores a specified Windows app to its initial state by resetting all configurations and data associated with the package.
  supportedDeviceTypes:
    - Windows 10.0.22000
  faq:
    - question: What does the EnterpriseModernAppManagement ResetPackage command do?
      answer: |
        It resets a Windows app (APPX or MSIX) to its initial state. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage`.

        Resetting clears the app's settings and local data, the same as **Reset** under the app's advanced options in Windows Settings. The `<Data>` XML names the package to reset.
    - question: When would I use ResetPackage?
      answer: |
        Occasionally, as a remote fix for a broken Store or MSIX app, such as one that crashes on launch or is stuck in a bad sign-in state. It's a help desk action, not a routine one.
    - question: Will ResetPackage delete user data?
      answer: |
        Yes. It deletes the app's local data and settings. Files saved outside the app, such as documents in the user's folders or cloud storage, aren't affected. Warn the end user first.
    - question: Does Fleet use ResetPackage?
      answer: |
        No. Fleet doesn't send this command. You can send it as a custom MDM command, or run `Reset-AppxPackage` in a PowerShell script from **Actions > Run script**. See the [scripts guide](https://fleetdm.com/guides/scripts).
    - question: How do I run ResetPackage with Fleet?
      answer: |
        Add `<Data>` with the XML that identifies the package family name to reset (format `xml`). Microsoft's CSP reference doesn't include a full example, so confirm the schema first. Save the `<Exec>` element and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: Which Windows versions support ResetPackage?
      answer: |
        Windows 11, version 21H2 (build 22000) and later. On Windows 10 the node doesn't exist and the command returns `404`.
    - question: How do I know ResetPackage worked?
      answer: |
        Look for `200` in `fleetctl get mdm-command-results --id=<command-uuid>`. Then open the app on the device. It should behave like a fresh install, with default settings and any sign-in cleared.
    - question: What errors can ResetPackage return?
      answer: |
        A `404` means the device runs Windows 10 or the LocURI is wrong. A `400` usually means the `<Data>` XML is malformed or names a package that isn't installed. A `500` means Windows couldn't reset the package, for example because the app is running and can't close.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>5f301e26-48ec-4a40-bad5-9c8b4e438ca2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpdateScan (Device context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#deviceappmanagementupdatescan
  description: Starts a Windows Update scan on the device.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the EnterpriseModernAppManagement UpdateScan command do?
      answer: |
        Microsoft documents it as starting a Windows Update scan. The command is an `<Exec>` on `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan` with a `null` format.

        It lives in the app management CSP and only asks the device to check for updates. It doesn't change update policies or deadlines.
    - question: How often is UpdateScan used?
      answer: |
        Rarely. Windows scans for updates on its own schedule, so admins send UpdateScan on demand, for example to make a device check right after a release.
    - question: Does Fleet use UpdateScan?
      answer: |
        No. Fleet doesn't send this command. To enforce Windows OS updates, Fleet Premium sets deadlines and grace periods per fleet, and you can deliver more Update CSP policies as configuration profiles. See [Manage Windows updates with the Windows Update CSP](https://fleetdm.com/guides/custom-windows-updates).
    - question: Does UpdateScan install Windows updates?
      answer: |
        No. It starts a scan only. What happens next depends on the device's update policies, such as active hours, deadlines, and deferrals.
    - question: How do I run UpdateScan with Fleet?
      answer: |
        Save the `<Exec>` element (without the `<syncml>` and `<syncbody>` wrappers) and run `fleetctl mdm run-command --hosts=<hostname> --payload=updatescan.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`. It's available in Fleet Free and Fleet Premium.
    - question: How do I check the result of UpdateScan?
      answer: |
        Look for `200` in `fleetctl get mdm-command-results --id=<command-uuid>`. Then read `./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/LastScanError`, which reports the last error code from the update scan. A value of 0 means no error.

        You can read it across hosts with a Fleet report on osquery's `mdm_bridge` table.
    - question: What errors can UpdateScan return?
      answer: |
        A `405` means the verb wasn't `<Exec>`. A `500` means the scan couldn't start. Scan failures caused by network problems or policies that block Windows Update show up in `LastScanError`.
    - question: What's the difference between UpdateScan in device and user context?
      answer: |
        The device context form (`./Device/`) runs the scan for the device. A `./User/` form also exists and runs in the context of the user tied to the MDM session. For a device-wide check, use device context.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>44702317-0b9b-4dc0-945f-e5303a967e8c</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: HostedInstall (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappinstallationpackagefamilynamehostedinstall
  description: Installs an app package from a hosted location, such as a local drive, UNC path, or HTTPS source.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the HostedInstall (User context) MDM command do?
      answer: |
        It tells Windows to install an app package (`.appx`, `.msix`, or a bundle) from a location you host, such as a local path, a UNC share, or an HTTPS URL. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/HostedInstall`, part of the EnterpriseModernAppManagement CSP.

        The user context version installs the app for the signed-in user who owns the MDM enrollment. Other users on the same computer don't get it.
    - question: When should I use the user context instead of the device context?
      answer: |
        Use the user context when only one person should get the app. Windows registers the package for that user's profile only.

        Use the `./Device/` version when the app should be provisioned for every user on the computer, including people who sign in later. Device context is the more common choice for shared or lab computers.
    - question: How often is HostedInstall (User context) used?
      answer: |
        Rarely, in most environments. Many MDMs used it to push line-of-business MSIX apps, but it's a special-purpose command, not something sent on every check-in.

        Fleet doesn't send it automatically. Fleet installs Windows software through fleetd, Fleet's agent, using packages and scripts. See [Deploy software packages](https://fleetdm.com/guides/deploy-software-packages).
    - question: How do I run HostedInstall (User context) with Fleet?
      answer: |
        Save the `<Exec>` element as an XML file and run `fleetctl mdm run-command --hosts=<hostname> --payload=hosted-install.xml`. You can also base64-encode it and send it to `POST /api/v1/fleet/commands/run`.

        Replace `{PackageFamilyName}` in the `<LocURI>` with the app's package family name. Put an `<Application PackageUri="..." />` element in `<Data>` that points to the package. Fleet accepts one `<Exec>` with one `<Item>`, so send the `<Exec>` block without the `<SyncML>` wrapper. See [MDM commands](https://fleetdm.com/guides/mdm-commands).
    - question: Does HostedInstall (User context) work on every Windows host enrolled in Fleet?
      answer: |
        Not always. Windows only accepts `./User/` commands while a user associated with the MDM enrollment is signed in. If no one is signed in, the command fails.

        On computers shared by several people, the command runs for whoever is signed in, which may not be the person you meant.

        The package URL must also be reachable from the host, and the package must be signed by a certificate the host trusts.
    - question: How do I know HostedInstall (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` status means Windows accepted the command. Installation runs asynchronously, so confirm the app afterwards.

        On the host, `Get-AppxPackage` in that user's session should list the package. In Fleet, check the host's software inventory after the next refetch.
    - question: What errors can HostedInstall (User context) return?
      answer: |
        Common SyncML statuses are `400` or `500` for a bad `<Data>` body or a failed deployment, `404` for a malformed node path, and `405` when the operation isn't allowed on that node.

        Deployment failures usually come from an unreachable `PackageUri`, an untrusted signing certificate, missing dependency packages, or a newer version already installed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ab117216-9adc-49cf-b3b1-3a1a7d9b43d0</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/HostedInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: StoreInstall (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappinstallationpackagefamilynamestoreinstall
  description: Command to perform an install of an app and a license from the Microsoft Store.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the StoreInstall (User context) MDM command do?
      answer: |
        It asks Windows to download and install an app and its license from the Microsoft Store for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/{PackageFamilyName}/StoreInstall`.

        Unlike HostedInstall, you don't host the package. The Store supplies both the app and the license.
    - question: Does StoreInstall still work now that Microsoft Store for Business is retired?
      answer: |
        Treat it as legacy. Microsoft retired Microsoft Store for Business and Microsoft Store for Education on March 31, 2023, and this node was built around that licensing model.

        Test on a pilot host before relying on it. For Store apps today, many admins use `winget` instead. See [Build your own Windows self-service with winget](https://fleetdm.com/guides/build-your-own-windows-self-service-with-winget-and-script-only-packages).
    - question: How often is StoreInstall (User context) used?
      answer: |
        Rarely. It was common when MDMs synced apps from Microsoft Store for Business, and it's uncommon now.

        Fleet doesn't send it automatically. You can still send it as a custom MDM command.
    - question: How do I run StoreInstall (User context) with Fleet?
      answer: |
        Replace `{PackageFamilyName}` in the `<LocURI>` and add the `<Data>` body Microsoft documents for StoreInstall, which identifies the Store product. Save only the `<Exec>` element as a file.

        Then run `fleetctl mdm run-command --hosts=<hostname> --payload=store-install.xml`, or send the base64-encoded XML to `POST /api/v1/fleet/commands/run`.
    - question: What does the host need for StoreInstall (User context) to work?
      answer: |
        The host needs a signed-in user associated with the MDM enrollment, network access to the Microsoft Store, and a Windows edition that supports the EnterpriseModernAppManagement CSP (Pro, Enterprise, or Education).

        If Store access is blocked by policy or by a firewall, the install fails even though the command is accepted.
    - question: How do I check if StoreInstall (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the request. The download and install happen afterward.

        Confirm with `Get-AppxPackage` in the user's session, or check the host's software inventory in Fleet after a refetch.
    - question: What errors does StoreInstall (User context) return?
      answer: |
        Expect `400` or `500` when the `<Data>` body is wrong or the Store can't supply the app, and `404` when the node path is malformed.

        A `200` followed by no installed app usually means the Store download failed on the host. Check the AppXDeployment-Server event log on the host for details.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>48a53564-56b8-4ddf-b27f-8e0fa0d0f513</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppInstallation/StoreInstall</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: AddLicense (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userapplicensesstorelicenseslicenseidaddlicense
  description: Adds a specified app license to the device using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the AddLicense (User context) MDM command do?
      answer: |
        It installs a Microsoft Store app license for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense`.

        The license content goes in `<Data>`. Microsoft notes the `{LicenseID}` is generally the app's package family name.
    - question: When would I need AddLicense instead of StoreInstall?
      answer: |
        Use AddLicense when you deploy an offline-licensed Store app package yourself, for example with HostedInstall, and need to add its license separately.

        StoreInstall gets the app and license from the Store in one step. AddLicense only adds the license, so pair it with your own package install.
    - question: How often is AddLicense (User context) used?
      answer: |
        Rarely. It belongs to the offline licensing flow from Microsoft Store for Business, which Microsoft retired on March 31, 2023.

        Fleet doesn't send it automatically. You can send it as a custom MDM command if you still have offline license files.
    - question: How do I run AddLicense (User context) with Fleet?
      answer: |
        Replace `{LicenseID}` in the `<LocURI>`, put the license content in `<Data>`, and save the `<Exec>` element as an XML file.

        Run `fleetctl mdm run-command --hosts=<hostname> --payload=add-license.xml`, or base64-encode the file and send it to `POST /api/v1/fleet/commands/run`.
    - question: What's the difference between the user and device context for AddLicense?
      answer: |
        The user context adds the license only for the user who owns the MDM enrollment. The `./Device/` version adds it for the device, so any user can run the app.

        User context commands also need a signed-in user on the host. Windows rejects `./User/` commands when no enrolled user is signed in.
    - question: How do I know AddLicense (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` status means Windows added the license.

        The practical test is that the licensed app launches for that user without a license prompt.
    - question: What errors does AddLicense (User context) return?
      answer: |
        A `400` or `500` usually means the license content in `<Data>` is invalid, expired, or doesn't match the app. A `404` means the node path is malformed.

        If no enrolled user is signed in, the command fails because Windows can't resolve the `./User/` path.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>9b0b3d42-e244-4359-8471-46f8cf62558e</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/AddLicense</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: GetLicenseFromStore (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userapplicensesstorelicenseslicenseidgetlicensefromstore
  description: Retrieves a specified app license from the Microsoft Store using the provided license ID.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the GetLicenseFromStore (User context) MDM command do?
      answer: |
        It tells Windows to fetch an app license from the Microsoft Store for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore`.

        Use it when the app is already installed but its online license is missing or needs to be refreshed.
    - question: What's the difference between GetLicenseFromStore and AddLicense?
      answer: |
        AddLicense installs a license you provide in the command. GetLicenseFromStore asks the device to download the license from the Store itself.

        GetLicenseFromStore is for online-licensed apps. AddLicense is for offline-licensed apps where you hold the license file.
    - question: How often is GetLicenseFromStore (User context) used?
      answer: |
        Rarely. It's tied to the Microsoft Store for Business licensing model, which Microsoft retired on March 31, 2023.

        Fleet doesn't send it automatically. You can still send it as a custom MDM command.
    - question: How do I run GetLicenseFromStore (User context) with Fleet?
      answer: |
        Replace `{LicenseID}` in the `<LocURI>` and add the XML `<Data>` body Microsoft documents for this node. Save only the `<Exec>` element as a file.

        Run `fleetctl mdm run-command --hosts=<hostname> --payload=get-license.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: Does GetLicenseFromStore require a user context?
      answer: |
        Yes, for this version. The `./User/` path only works while a user associated with the MDM enrollment is signed in.

        The host also needs network access to the Microsoft Store.
    - question: How do I check if GetLicenseFromStore (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the request.

        Confirm by launching the app as that user. If the license was retrieved, the app opens without a license error.
    - question: What errors does GetLicenseFromStore (User context) return?
      answer: |
        Expect `400` or `500` when the request body is wrong or the Store can't issue the license, and `404` when the path is malformed.

        Because Store for Business is retired, a failure can also mean the license source no longer exists. In that case, move the app to a different deployment method.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>f4796a1e-5bf9-4828-a602-d3a0ac9f5930</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppLicenses/StoreLicenses/{LicenseID}/GetLicenseFromStore</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RemovePackage (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappmanagementremovepackage
  description: Removes a specified Windows app package from the device.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the RemovePackage (User context) MDM command do?
      answer: |
        It uninstalls a Windows app package (MSIX or AppX). It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/RemovePackage`, available on Windows 10, version 1703 and later.

        The `<Data>` body is a `<Package>` element. `Name` is the package full name, and `RemoveForAllUsers` controls the scope.
    - question: What does RemoveForAllUsers do?
      answer: |
        With `RemoveForAllUsers="1"`, Windows removes the package for all users, but only if it's a provisioned package. Microsoft's docs list `0` as un-provisioning the app for new users while leaving it for current users, and note that option isn't currently supported.

        You can also add an optional `User` attribute with a user's SID to remove the package for that user only.
    - question: How often is RemovePackage (User context) used?
      answer: |
        Occasionally. Admins use it to remove built-in or unwanted Store apps, like consumer apps that ship with Windows.

        Fleet doesn't send it automatically. Fleet uninstalls software it deployed through fleetd using uninstall scripts. You can send RemovePackage as a custom MDM command.
    - question: How do I run RemovePackage (User context) with Fleet?
      answer: |
        Find the package full name on the host with `Get-AppxPackage -AllUsers`. Put it in the `Name` attribute, save the `<Exec>` element as XML, and run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-package.xml`.

        You can also send the base64-encoded XML to `POST /api/v1/fleet/commands/run`.
    - question: Why do I need the package full name and not the package family name?
      answer: |
        RemovePackage targets one exact installed package, so it needs the full name, which includes version, architecture, and publisher ID. The family name used by HostedInstall doesn't include the version.

        If the app updates before your command runs, the full name changes and the command fails. Look up the name right before you send it.
    - question: How do I know RemovePackage (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the removal.

        Then check that `Get-AppxPackage` no longer lists the package, or confirm in the host's software inventory in Fleet after a refetch.
    - question: What errors does RemovePackage (User context) return?
      answer: |
        A `404` or `500` often means the package full name doesn't match an installed package. A `400` points to a malformed `<Package>` element.

        Some system apps can't be removed and fail with a deployment error. Commands on `./User/` paths also fail when no enrolled user is signed in.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>70fe3f35-ce6f-484d-a14f-1f8ceb9edda3</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/RemovePackage</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>
              <Package Name="{PackageFullName}" RemoveForAllUsers="1" />
            </Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetPackage (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappmanagementresetpackage
  description: Restores a specified Windows app to its initial state by resetting all configurations and data associated with the package.
  supportedDeviceTypes:
    - Windows 10.0.22000
  faq:
    - question: What does the ResetPackage (User context) MDM command do?
      answer: |
        It resets a Windows app to its initial state, clearing its settings and local data. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage`.

        It's the MDM version of **Settings > Apps > Advanced options > Reset** for a single app.
    - question: Which Windows versions support ResetPackage?
      answer: |
        Windows 11, version 21H2 (build 22000) and later. Windows 10 hosts don't have this node and return an error.

        It also requires Windows Pro, Enterprise, or Education.
    - question: How often is ResetPackage (User context) used?
      answer: |
        Rarely. It's a troubleshooting tool for a misbehaving Store or MSIX app, not part of routine management.

        Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run ResetPackage (User context) with Fleet?
      answer: |
        Add the XML `<Data>` body Microsoft documents for ResetPackage that identifies the package, then save the `<Exec>` element as a file.

        Run `fleetctl mdm run-command --hosts=<hostname> --payload=reset-package.xml`, or send the base64-encoded file to `POST /api/v1/fleet/commands/run`.
    - question: Will ResetPackage delete the user's data in the app?
      answer: |
        Yes. Resetting removes the app's local settings and data for that user. Files the user saved elsewhere, like in Documents, aren't affected.

        The user context version only resets the app for the user who owns the MDM enrollment, not for other users on the computer.
    - question: How do I check if ResetPackage (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` status means the reset succeeded.

        On the host, the app opens with first-run defaults.
    - question: What errors does ResetPackage (User context) return?
      answer: |
        A `404` usually means the host runs Windows 10 or the package isn't installed for that user. A `400` or `500` points to a bad `<Data>` body or a failed reset.

        If no enrolled user is signed in, `./User/` commands fail.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ceeeeabd-f3d0-4c15-bdf2-07326cf27bbd</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/ResetPackage</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpdateScan (User context)
  platform: windows
  category: EnterpriseModernAppManagement
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/enterprisemodernappmanagement-csp#userappmanagementupdatescan
  description: Starts a Windows Update scan under the user context to check for available app updates.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the UpdateScan (User context) MDM command do?
      answer: |
        It starts a scan for updates to the signed-in user's Store and MSIX apps. It's an `<Exec>` on `./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan` with a `null` format and empty `<Data>`.

        It doesn't install Windows OS updates. Those are managed with the Update policy CSP.
    - question: What's the difference between UpdateScan in user context and device context?
      answer: |
        The user context scans for updates to apps registered to the user who owns the MDM enrollment. The `./Device/` version scans for apps provisioned at the device level.

        If the app was installed per user, use the user context.
    - question: How often is UpdateScan (User context) used?
      answer: |
        Rarely. Store apps update on their own schedule, so most admins never send it. It's useful when you need a fix to land faster.

        Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run UpdateScan (User context) with Fleet?
      answer: |
        The command needs no data. Save the `<Exec>` element as an XML file and run `fleetctl mdm run-command --hosts=<hostname> --payload=update-scan-user.xml`.

        To target many hosts, pass a comma-separated list to `--hosts`, or use `POST /api/v1/fleet/commands/run` with a base64-encoded payload.
    - question: Does UpdateScan (User context) need a signed-in user?
      answer: |
        Yes. Windows only accepts `./User/` commands while a user associated with the MDM enrollment is signed in. On shared computers, the scan runs for whoever is signed in.
    - question: How do I know UpdateScan (User context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the scan started. It doesn't tell you which apps updated.

        Check app versions in the host's software inventory in Fleet after the next refetch.
    - question: What errors does UpdateScan (User context) return?
      answer: |
        A `404` or `405` usually means the path is wrong or no enrolled user is signed in. A `500` means Windows couldn't start the scan.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>f4a37fe3-e8f4-4961-a80e-e4d33550d496</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/EnterpriseModernAppManagement/AppManagement/UpdateScan</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: TriggerAttestation
  platform: windows
  category: HealthAttestation
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/healthattestation-csp#triggerattestation
  description: Triggers an asynchronous device health attestation session, prompting the device to collect and submit its current health status for verification.
  supportedDeviceTypes:
    - Windows 10.0.22000
  faq:
    - question: What does the TriggerAttestation MDM command do?
      answer: |
        It starts a device health attestation session using Microsoft Azure Attestation (MAA). It's an `<Exec>` on `./Vendor/MSFT/HealthAttestation/TriggerAttestation`.

        The host collects TPM-backed boot evidence, sends it to your MAA instance, and caches the signed report locally.
    - question: How is TriggerAttestation different from VerifyHealth?
      answer: |
        TriggerAttestation is the newer Windows 11 flow. The device talks to your Azure Attestation instance directly.

        VerifyHealth is the older flow. The device prepares health data for the MDM server, which forwards it to the Device Health Attestation service.
    - question: What do I need before sending TriggerAttestation?
      answer: |
        A Microsoft Azure Attestation instance with a policy, Windows 11 (build 22000 or later), and a TPM.

        The `<Data>` body is JSON with `rpid`, the MAA `endpoint`, a `nonce`, a Microsoft Entra `aadToken`, and a correlation vector `cv`. The sample on this page has no `<Data>`, so add one before sending.
    - question: How often is TriggerAttestation used?
      answer: |
        Rarely. It's used by MDMs that build compliance or conditional access decisions on boot integrity.

        Fleet doesn't send it automatically. Fleet's Windows health checks use osquery data and policies instead. You can send it as a custom MDM command.
    - question: How do I run TriggerAttestation with Fleet?
      answer: |
        Add the JSON `<Data>` body, save the `<Exec>` element as an XML file, and run `fleetctl mdm run-command --hosts=<hostname> --payload=trigger-attestation.xml`.

        Or base64-encode it and send it to `POST /api/v1/fleet/commands/run`.
    - question: How do I know TriggerAttestation worked?
      answer: |
        A `202` status in `fleetctl get mdm-command-results --id=<command-uuid>` means the session started. It runs asynchronously.

        The result lives in the `AttestStatus` and `GetAttestReport` nodes. Fleet's custom command feature only sends `<Exec>`, so you can't read those nodes through it.
    - question: What errors does TriggerAttestation return?
      answer: |
        Any status other than `202` means the session didn't start. Common causes are missing or malformed JSON, Windows 10 hosts (`404`), or no usable TPM.

        Failures after a `202`, like a rejected Entra token or an unreachable MAA endpoint, show up in `AttestStatus` on the host.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>47b2a850-2c56-4044-b2de-98e49d9cfcb9</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/HealthAttestation/TriggerAttestation</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: VerifyHealth
  platform: windows
  category: HealthAttestation
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/healthattestation-csp#verifyhealth
  description: Notifies the device to prepare a device health verification request.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the VerifyHealth MDM command do?
      answer: |
        It tells the device to prepare a device health attestation request. It's an `<Exec>` on `./Vendor/MSFT/HealthAttestation/VerifyHealth` with `null` format and empty `<Data>`.

        The device gathers TPM-protected boot data (DHA-Data), which the MDM server then retrieves and forwards to the Device Health Attestation service.
    - question: How is VerifyHealth different from TriggerAttestation?
      answer: |
        VerifyHealth is the original flow, available since Windows 10, version 1511. The MDM server reads the health data and does the round trip to Microsoft's attestation service.

        TriggerAttestation is the Windows 11 flow where the device talks to Microsoft Azure Attestation itself.
    - question: How often is VerifyHealth used?
      answer: |
        Rarely. It's only useful to an MDM server that implements the full Device Health Attestation flow.

        Fleet doesn't send it automatically or process the attestation data. You can still send it as a custom MDM command.
    - question: How do I run VerifyHealth with Fleet?
      answer: |
        It needs no data. Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=verify-health.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: Can I see the health attestation result in Fleet?
      answer: |
        No. VerifyHealth only prepares the data. Getting a result requires reading `Status`, `Nonce`, and `Certificate` nodes and calling the attestation service, and Fleet's custom commands only send `<Exec>`.

        For device health signals in Fleet, use [policies](https://fleetdm.com/guides/what-are-fleet-policies) built on osquery data, like TPM and Secure Boot status.
    - question: How do I know VerifyHealth was accepted?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the device accepted the request.
    - question: What errors does VerifyHealth return?
      answer: |
        A `500` typically means the device couldn't prepare the request, for example because it has no TPM or the TPM isn't ready. A `404` means the path is wrong.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>b442558e-a685-48c4-9fa1-71e5c6c9338f</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/HealthAttestation/VerifyHealth</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetPassword
  platform: windows
  category: Local Administrator Password Solution (LAPS)
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/laps-csp#actionsresetpassword
  description: Immediately generates and securely stores a new random password for the managed local administrator account on the device using Local Administrator Password Solution (LAPS).
  supportedDeviceTypes:
    - Windows 10.0.25145
    - Windows 10.0.22621.1480
    - Windows 10.0.22000.1754
    - Windows 10.0.20348.1663
    - Windows 10.0.19041.2784
    - Windows 10.0.17763.4244
  faq:
    - question: What does the LAPS ResetPassword MDM command do?
      answer: |
        It tells Windows LAPS to immediately rotate the password of the managed local administrator account and back up the new one. It's an `<Exec>` on `./Device/Vendor/MSFT/LAPS/Actions/ResetPassword` with empty `<Data>`.

        The new password goes to the backup directory you configured, Microsoft Entra ID or Active Directory. It isn't returned to the MDM server.
    - question: What do I need before ResetPassword works?
      answer: |
        Windows LAPS policy must already be configured on the host, especially `BackupDirectory`. Without a backup directory, LAPS has nowhere to store the password and the rotation fails.

        You can deliver LAPS policy settings from Fleet with a Windows configuration profile that uses the LAPS CSP. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: Which Windows versions support ResetPassword?
      answer: |
        Windows LAPS is built into Windows 11 22H2 and 21H2, Windows 10 21H2 and later, and Windows Server 2019 and 2022, once the April 11, 2023 cumulative update or later is installed. It's also in Windows 11 24H2 and later.

        Legacy Microsoft LAPS, the separate MSI, doesn't support this CSP.
    - question: How often is ResetPassword used?
      answer: |
        Occasionally. LAPS rotates passwords on its own schedule, so admins send ResetPassword after the password was used for support, or after a suspected exposure.

        Fleet doesn't send it automatically and doesn't manage LAPS. You can send it as a custom MDM command.
    - question: How do I run ResetPassword with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=laps-reset.xml`. You can also base64-encode it and send it to `POST /api/v1/fleet/commands/run`.

        It's a device-scope command, so it works on any Windows host enrolled in Fleet's MDM.
    - question: How do I know ResetPassword worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means Windows accepted the request.

        Confirm the rotation in Microsoft Entra ID or Active Directory, where the password's update time changes. The Windows LAPS event log on the host also records each rotation.
    - question: What errors does ResetPassword return?
      answer: |
        A `404` usually means the host's Windows build doesn't include Windows LAPS. A `500` usually means LAPS policy isn't configured or the password couldn't be backed up, for example because the host can't reach Entra ID or a domain controller.
    - question: Where do I read the new password after ResetPassword?
      answer: |
        In the backup directory. For Microsoft Entra ID, use the Entra admin center or Microsoft Graph. For Active Directory, use `Get-LapsADPassword` or the LAPS tab in Active Directory Users and Computers.

        Fleet doesn't store or display LAPS passwords.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>fa8a8f93-b3ed-48ef-940f-6232e74c087a</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/LAPS/Actions/ResetPassword</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Install (User context)
  platform: windows
  category: Office
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/office-csp#deviceinstallationidinstall
  description: Installs Microsoft Office for the user based on the provided XML configuration.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the Office Install (User context) MDM command do?
      answer: |
        It installs Microsoft 365 Apps (Office) for the user who owns the MDM enrollment, using an Office Deployment Tool configuration XML. The user context node is `./User/Vendor/MSFT/Office/Installation/{id}/Install`.

        The `{id}` is a name you choose for the installation. The configuration XML in `<Data>` sets products, languages, channel, and excluded apps.
    - question: Why does the sample on this page target a ./Device path?
      answer: |
        The sample payload on this page uses `./Device/Vendor/MSFT/Office/Installation/{id}/Install`, which is the device context node. For a user context install, change the `<LocURI>` to start with `./User/`.

        Microsoft's Office CSP documents both paths. They differ only in scope.
    - question: What's the difference between the user and device context Office install?
      answer: |
        The user context runs the install for the signed-in user. Windows only accepts it while a user associated with the MDM enrollment is signed in.

        The device context installs Office for the whole computer and doesn't depend on who is signed in. Most admins use the device context.
    - question: How often is Office Install (User context) used?
      answer: |
        Rarely. Office is usually installed once per host, and most organizations use the device context or a packaged installer.

        Fleet doesn't send it automatically. Fleet can also install Office through fleetd with a package or script. See [Deploy software packages](https://fleetdm.com/guides/deploy-software-packages).
    - question: How do I run Office Install (User context) with Fleet?
      answer: |
        Change the `<LocURI>` to the `./User/` path, replace `{id}`, and put your Office configuration XML in `<Data>`. Save the `<Exec>` element as a file.

        Run `fleetctl mdm run-command --hosts=<hostname> --payload=office-install-user.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I know Office Install (User context) worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means Windows accepted the request. The download and install run in the background and can take a while.

        Microsoft's CSP exposes install progress in the `Installation/{id}/Status` node. Confirm the result in the host's software inventory in Fleet after a refetch.
    - question: What errors does Office Install (User context) return?
      answer: |
        A `400` or `500` usually means invalid configuration XML. A `404` or `405` can mean the path is wrong or no enrolled user is signed in.

        If the command is accepted but Office never appears, the host may not reach the Office content delivery network, or an existing Office version may conflict.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>b06743fc-3682-4aba-9f65-90a134b3dd6d</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Office/Installation/{id}/Install</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Install (Device context)
  platform: windows
  category: Office
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/office-csp#userinstallationidinstall
  description: Installs Microsoft Office on the device using the provided XML configuration data.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the Office Install (Device context) MDM command do?
      answer: |
        It installs Microsoft 365 Apps (Office) on the whole computer using an Office Deployment Tool configuration XML. The device context node is `./Device/Vendor/MSFT/Office/Installation/{id}/Install`.

        Choose any value for `{id}`. Put the configuration XML in `<Data>` to set products, update channel, languages, and apps to exclude.
    - question: Why does the sample on this page target a ./User path?
      answer: |
        The sample payload on this page uses `./User/Vendor/MSFT/Office/Installation/{id}/Install`, which is the user context node. For a device context install, change the `<LocURI>` to start with `./Device/`.
    - question: Why choose the device context over the user context?
      answer: |
        The device context installs Office for every user and doesn't need anyone signed in when the command arrives.

        The user context only installs for the signed-in user and fails when no enrolled user is signed in.
    - question: How often is Office Install (Device context) used?
      answer: |
        Occasionally, during initial setup. Office is installed once and then keeps itself updated through its update channel.

        Fleet doesn't send it automatically. You can send it as a custom MDM command, or install Office through fleetd. See [Deploy software packages](https://fleetdm.com/guides/deploy-software-packages).
    - question: How do I run Office Install (Device context) with Fleet?
      answer: |
        Set the `<LocURI>` to the `./Device/` path, replace `{id}`, and add your configuration XML to `<Data>`. Save only the `<Exec>` element.

        Run `fleetctl mdm run-command --hosts=<hostname> --payload=office-install.xml`. To target a group, list hosts with commas, or use `POST /api/v1/fleet/commands/run` with the base64-encoded payload.
    - question: How do I know Office Install (Device context) worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the install request was accepted, not that Office finished installing.

        Microsoft's CSP reports progress in `Installation/{id}/Status`. In Fleet, check the host's software inventory after the next refetch.
    - question: What errors does Office Install (Device context) return?
      answer: |
        A `400` or `500` usually means the configuration XML is invalid. A failure after a `200` is often a network block on the Office CDN or a conflict with an existing MSI-based Office install.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>2e9f2aba-db2e-44a4-9c78-6d05fd5ef4a4</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/Office/Installation/{id}/Install</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: Install
  platform: windows
  category: PrinterProvisioning
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/printerprovisioning-csp#upprinterinstallsprintersharedidinstall
  description: Installs a Universal Print printer for the user asynchronously.
  supportedDeviceTypes:
    - Windows 10.0.22000
    - Windows 10.0.19044.1806
    - Windows 10.0.19043.1806
    - Windows 10.0.19042.1806
  faq:
    - question: What does the PrinterProvisioning Install MDM command do?
      answer: |
        It installs a Universal Print printer for the signed-in user. It's an `<Exec>` on `./User/Vendor/MSFT/PrinterProvisioning/UPPrinterInstalls/{PrinterSharedID}/Install`.

        The install runs asynchronously. The printer shows up for that user once Windows finishes connecting to Universal Print.
    - question: What do I need before sending the printer Install command?
      answer: |
        The printer must be registered and shared in Universal Print, which is a Microsoft 365 service. The user needs a Universal Print license and a Microsoft Entra ID account, and that user must be signed in when the command arrives.

        Microsoft's docs also require you to create the `{PrinterSharedID}` node with the printer's `CloudDeviceID` and `PrinterSharedName` before the `Install` exec.
    - question: Can Fleet deploy printers without Universal Print?
      answer: |
        Yes, with a script instead of this command. Windows has no CSP for installing a network printer with a vendor driver, aside from Universal Print.

        See [Deploy printers on Windows](https://fleetdm.com/guides/deploy-printers-on-windows) for the script-based approach.
    - question: How often is the printer Install command used?
      answer: |
        Occasionally, and only by organizations that use Universal Print. It's sent once per printer per user.

        Fleet doesn't send it automatically. You can send it as a custom MDM command.
    - question: How do I run the printer Install command with Fleet?
      answer: |
        Replace `{PrinterSharedID}` with the printer's share ID, save the `<Exec>` element as XML, and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-printer.xml`.

        Fleet's run-command feature only accepts a single `<Exec>`. Set the prerequisite `CloudDeviceID` and `PrinterSharedName` nodes another way, such as a Windows configuration profile. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I know the printer Install command worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` or `202` means Windows accepted the request.

        On the host, the printer appears in **Settings > Bluetooth & devices > Printers & scanners** for that user.
    - question: What errors does the printer Install command return?
      answer: |
        A `404` usually means the `{PrinterSharedID}` node doesn't exist yet or the path is wrong. A `500` usually means the install failed, often because the user isn't licensed for Universal Print or the printer isn't shared with them.

        `./User/` commands also fail when no enrolled user is signed in.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>0d2f967d-2c8b-45a6-9a5e-6969cb58b10a</CmdID>
          <Item>
            <Target>
              <LocURI>./User/Vendor/MSFT/PrinterProvisioning/UPPrinterInstalls/{PrinterSharedID}/Install</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RebootNow
  platform: windows
  category: Reboot
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/reboot-csp#rebootnow
  description: Triggers an immediate device reboot, typically within 5 minutes to allow the user to finish active work. If executed during a sync session, the device will reboot at the end of the session.
  supportedDeviceTypes:
    - Windows 10.0.14393
  faq:
    - question: What does the RebootNow MDM command do?
      answer: |
        It restarts the Windows host. It's an `<Exec>` on `./Device/Vendor/MSFT/Reboot/RebootNow` with `null` format and empty `<Data>`.

        If the command arrives during an MDM sync, Windows reboots when the session ends. Microsoft says the reboot usually happens within 5 minutes so the user can save work.
    - question: How often is RebootNow used?
      answer: |
        Often, as custom commands go. Admins use it after installing software or updates, or to finish applying settings that need a restart.

        Fleet doesn't send it automatically. It's the Windows example in Fleet's [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: How do I restart a Windows host with Fleet?
      answer: |
        Save the `<Exec>` element as an XML file and run `fleetctl mdm run-command --hosts=<hostname> --payload=windows-restart-device.xml`.

        You can also base64-encode the file and send it to `POST /api/v1/fleet/commands/run`. Fleet's run-command accepts `RebootNow` in Fleet Free and Fleet Premium.
    - question: Will the user be warned before RebootNow restarts the computer?
      answer: |
        Windows typically shows a notification and gives the user a few minutes. It doesn't wait for the user to approve, and unsaved work can be lost.

        Tell users in advance, or schedule the restart with the Reboot CSP's `Schedule` nodes in a configuration profile.
    - question: Can I schedule a reboot instead of rebooting now?
      answer: |
        Yes. The Reboot CSP also has `Schedule/Single` and `Schedule/DailyRecurrent` nodes. Those are settings, not commands, so deliver them in a Windows configuration profile. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I know RebootNow worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the host accepted the reboot.

        In Fleet, the host's uptime resets after the next refetch.
    - question: What errors does RebootNow return?
      answer: |
        Errors are uncommon. A `400` points to a malformed payload, like a missing `<Meta>` format. A `404` points to a typo in the `<LocURI>`.

        If the status stays pending, the host hasn't checked in with Fleet yet, for example because it's offline.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d21ff8f2-a1ae-43c9-8763-26d7554f4a94</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/Reboot/RebootNow</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doAutomaticRedeployment
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#automaticredeploymentdoautomaticredeployment
  description: Triggers an Autopilot reset on the device. Unlike a standard reset, the device remains enrolled in Azure AD and MDM, and preserves Wi-Fi profiles, region, language, keyboard settings, and other key configurations.
  supportedDeviceTypes:
    - Windows 10.0.17763
  faq:
    - question: What does the doAutomaticRedeployment MDM command do?
      answer: |
        It triggers Windows Autopilot Reset. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/AutomaticRedeployment/doAutomaticRedeployment`.

        Windows removes personal files, apps, and settings. It keeps the device joined to Microsoft Entra ID, enrolled in MDM, and keeps Wi-Fi profiles, region, language, and keyboard settings.
    - question: How is Autopilot Reset different from doWipe?
      answer: |
        doWipe removes everything, including the MDM enrollment, so the host must enroll again. doAutomaticRedeployment keeps the Entra ID join and the MDM enrollment.

        That makes it a good fit for handing a computer to a new user without a full reprovision.
    - question: How often is doAutomaticRedeployment used?
      answer: |
        Occasionally, in environments that reassign computers often, like schools and shared devices.

        Fleet doesn't send it from the UI. Fleet's **Wipe** action uses `doWipeProtected`. You can send Autopilot Reset as a custom MDM command.
    - question: Is doAutomaticRedeployment available in Fleet Free?
      answer: |
        No. Fleet treats every RemoteWipe CSP command, including Autopilot Reset, as a wipe. Sending it as a custom command requires Fleet Premium.
    - question: How do I run doAutomaticRedeployment with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=autopilot-reset.xml`. You can also send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        It needs Windows 10, version 1809 or later and a working Windows Recovery Environment.
    - question: How do I know doAutomaticRedeployment worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the host accepted the reset.

        Windows tracks progress in the `AutomaticRedeployment/Status` node: `10` is scheduled, `20` is waiting for a reboot, and `1` is complete. Fleet's custom commands only send `<Exec>`, so check progress on the host or wait for it to check in again.
    - question: What errors does doAutomaticRedeployment return?
      answer: |
        Microsoft documents these failure states in `AutomaticRedeployment/Status`: `30` failed during exec, `40` power requirements not met, and `50` reset internals failed. The error itself, usually an HRESULT, is in `AutomaticRedeployment/LastError`.

        A disabled Windows Recovery Environment is a common cause. Plug laptops into power before resetting.
    - question: Will the host show as wiped in Fleet after doAutomaticRedeployment?
      answer: |
        No. Fleet only tracks the wipe status of wipes started with the **Wipe** action or `fleetctl mdm wipe`. A custom Autopilot Reset doesn't change the host's lock or wipe status.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>1259012e-3aa2-4f65-a191-eee74d7208c1</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/AutomaticRedeployment/doAutomaticRedeployment</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipe
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipe
  description: Performs a remote wipe on the device. The return status indicates whether the device accepted the command. When used with OMA Client Provisioning, include a dummy value of "1" for this element.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the doWipe MDM command do?
      answer: |
        It resets the Windows host and removes all user accounts and data. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipe`.

        Microsoft says it's equivalent to **Reset this PC > Remove everything** with files deleted but the drive not fully cleaned. The host loses its MDM enrollment.
    - question: How is doWipe different from doWipeProtected?
      answer: |
        doWipe can be interrupted. If someone power cycles the host mid-reset, Windows tries to roll back to the previous state.

        doWipeProtected fully cleans the drive and keeps retrying after power cycles, but can leave some devices unable to boot. Use doWipe to repurpose a device you have in hand, and doWipeProtected for lost or stolen devices.
    - question: Does Fleet use doWipe?
      answer: |
        Yes, as an option. Fleet's **Wipe** action sends `doWipeProtected` by default. To use doWipe, call the [Wipe host](https://fleetdm.com/docs/rest-api/rest-api#wipe-host) API with `{ "windows": { "wipe_type": "doWipe" } }`.

        Wiping through the API or UI shows "Wipe pending" and "Wiped" on the host. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How often is doWipe used?
      answer: |
        Occasionally. It's used when retiring or reassigning a computer, not as part of routine management.
    - question: Is doWipe available in Fleet Free?
      answer: |
        No. Wipe is a Fleet Premium feature, whether you use the **Wipe** action, the API, or send doWipe as a custom command.
    - question: How do I know doWipe worked?
      answer: |
        If you used the Wipe host API, the host shows "Wipe pending" until Windows acknowledges, then "Wiped." For a custom command, run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the host accepted the wipe.

        Wait for the wipe to finish before deleting the host from Fleet.
    - question: What if doWipe fails?
      answer: |
        A `500` status means Windows couldn't start the reset. The most common cause is a broken or disabled Windows Recovery Environment.

        Fleet provides a [fallback wipe script](https://github.com/fleetdm/fleet/blob/main/docs/solutions/windows/scripts/wipe-windows-device.ps1) that repairs WinRE, suspends BitLocker, and triggers the wipe locally.
    - question: Can I cancel doWipe after sending it?
      answer: |
        No. Fleet can't cancel a pending Windows wipe. If the host re-enrolls in MDM before it receives the wipe, Fleet cancels it.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d85af4e3-ed77-4b4e-8a6f-d50ae80d35e4</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipe</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipeCloud
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipecloud
  description: Performs a cloud-based remote wipe on the device. The return status indicates whether the device accepted the command.
  supportedDeviceTypes:
    - Windows 10.0.22621
  faq:
    - question: What does the doWipeCloud MDM command do?
      answer: |
        It performs a cloud-based remote wipe. Windows removes user accounts and data and reinstalls the OS from an image downloaded from Microsoft, instead of rebuilding from local files. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeCloud`.
    - question: How is doWipeCloud different from doWipe?
      answer: |
        The outcome is the same: an empty, unenrolled computer. The difference is the source. doWipeCloud downloads a fresh copy of Windows, which helps when local system files are damaged.

        doWipeCloud needs Windows 11, version 22H2 or later. doWipe works on Windows 10, version 1511 and later.
    - question: When should I use doWipeCloud?
      answer: |
        Use it when a local reset fails or the OS is corrupt. A cloud reinstall doesn't rely on the local component store.

        Expect a large download. The host needs a reliable internet connection for the reset to complete.
    - question: How often is doWipeCloud used?
      answer: |
        Rarely. Fleet's **Wipe** action uses `doWipeProtected`, and the API supports `doWipe`. doWipeCloud is only available as a custom MDM command.
    - question: How do I run doWipeCloud with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=wipe-cloud.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Like all RemoteWipe commands, it requires Fleet Premium.
    - question: How do I know doWipeCloud worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. A `200` means the host accepted the wipe.

        A custom doWipeCloud doesn't update the host's wipe status in Fleet. The host stops checking in, and if it enrolls again it shows up as a fresh enrollment.
    - question: What errors does doWipeCloud return?
      answer: |
        A `404` usually means the host runs a Windows version older than 11 22H2. A `500` means the reset couldn't start, often because of a Windows Recovery Environment problem.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>f1b40cb3-d964-4378-bdd8-132305dcc879</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeCloud</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipeCloudPersistProvisionedData
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipecloudpersistprovisioneddata
  description: Performs a cloud-based remote wipe while preserving provisioning data by backing it up to a persistent location. The backed-up data is restored and applied when the device resumes. The return status indicates whether the device accepted the command.
  supportedDeviceTypes:
    - Windows 10.0.22621
  faq:
    - question: What does the doWipeCloudPersistProvisionedData MDM command do?
      answer: |
        It backs up provisioning data, then performs a cloud-based wipe. After Windows reinstalls from a downloaded image, it reapplies the saved provisioning data. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistProvisionedData`.
    - question: What provisioning data is preserved?
      answer: |
        Provisioning packages (`.ppkg`) applied to the host. Microsoft stores them in `%SystemDrive%\ProgramData\Microsoft\Provisioning` and applies them again when the device resumes.

        User accounts, user files, and apps aren't preserved.
    - question: How is it different from doWipePersistProvisionedData?
      answer: |
        Both keep provisioning packages. This command reinstalls Windows from the cloud and needs Windows 11, version 22H2 or later.

        doWipePersistProvisionedData rebuilds from local files and works on Windows 10, version 1511 and later.
    - question: When is doWipeCloudPersistProvisionedData useful with Fleet?
      answer: |
        When a provisioning package installs fleetd or sets up enrollment. Keeping the package lets the host come back into Fleet without hands-on work. See [Preinstall Fleet's agent on Windows with a provisioning package](https://fleetdm.com/guides/preinstall-fleets-agent-on-windows-with-a-provisioning-package).
    - question: How often is doWipeCloudPersistProvisionedData used?
      answer: |
        Rarely. Fleet doesn't send it from the **Wipe** action. You can send it as a custom MDM command in Fleet Premium.
    - question: How do I run doWipeCloudPersistProvisionedData with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=wipe-cloud-keep-ppkg.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I know doWipeCloudPersistProvisionedData worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the host accepted the command. Fleet's wipe status doesn't change for custom wipe commands.

        Success looks like the host returning with your provisioning package reapplied.
    - question: What errors does doWipeCloudPersistProvisionedData return?
      answer: |
        A `404` usually means the host runs a version older than Windows 11 22H2. A `500` means the reset couldn't start, often because the Windows Recovery Environment is disabled.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>d07f227f-74c1-4a0d-8e79-f0a9bcf1ffe2</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistProvisionedData</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipeCloudPersistUserData
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipecloudpersistuserdata
  description: Performs a cloud-based remote reset while preserving user accounts and data. The return status indicates whether the device accepted the command.
  supportedDeviceTypes:
    - Windows 10.0.22621
  faq:
    - question: What does the doWipeCloudPersistUserData MDM command do?
      answer: |
        It reinstalls Windows from a cloud-downloaded image while keeping user accounts and their files. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistUserData`.

        It's the remote version of **Reset this PC > Keep my files** with **Cloud download** selected.
    - question: Does doWipeCloudPersistUserData remove apps?
      answer: |
        Yes. Installed apps and settings are removed, and Windows is reinstalled. User accounts and personal files stay.

        Plan to reinstall software afterward. In Fleet, software set to install automatically or through policies can be installed again once fleetd is back.
    - question: How is it different from doWipePersistUserData?
      answer: |
        Both keep user accounts and data. This one downloads Windows from the cloud and needs Windows 11, version 22H2 or later. doWipePersistUserData uses local files and works on Windows 10, version 1709 and later.
    - question: When should I use doWipeCloudPersistUserData?
      answer: |
        Use it to repair a broken Windows install without destroying the user's files, especially when local recovery files are damaged. Don't use it for lost or stolen devices, because the data stays on the drive.
    - question: How often is doWipeCloudPersistUserData used?
      answer: |
        Rarely. Fleet doesn't send it automatically. You can send it as a custom MDM command in Fleet Premium.
    - question: How do I run doWipeCloudPersistUserData with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset-cloud-keep-files.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.
    - question: How do I know doWipeCloudPersistUserData worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the host accepted the command. Fleet doesn't change the host's wipe status for custom wipe commands.

        After the reset, users sign in and find their files in place.
    - question: What errors does doWipeCloudPersistUserData return?
      answer: |
        A `404` usually means the host runs a version older than Windows 11 22H2. A `500` means Windows couldn't start the reset. Check that the Windows Recovery Environment is enabled with `reagentc /info`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ef6fd567-f6ac-43c9-854d-c8df66684f0d</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeCloudPersistUserData</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: doWipePersistProvisionedData
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipepersistprovisioneddata
  description: Performs a remote wipe while preserving provisioning data by backing it up to a persistent location. The backed-up data is restored and applied when the device resumes. The return status indicates whether the device accepted the command. When using OMA Client Provisioning, include a dummy value of "1" for this element.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the doWipePersistProvisionedData MDM command do?
      answer: |
        It backs up provisioning packages, wipes the device from local recovery files, and reapplies the packages when Windows starts again. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipePersistProvisionedData`.

        User accounts, files, and apps are removed.
    - question: Where does Windows keep the provisioning data during the wipe?
      answer: |
        In `%SystemDrive%\ProgramData\Microsoft\Provisioning`. Windows restores and reapplies those packages after the reset.
    - question: How is it different from doWipe?
      answer: |
        doWipe removes everything. doWipePersistProvisionedData keeps your provisioning packages, so Wi-Fi, certificates, or agent installs delivered by a `.ppkg` come back after the reset.

        If you use a package to install fleetd, the host can rejoin Fleet without hands-on setup. See [Preinstall Fleet's agent on Windows with a provisioning package](https://fleetdm.com/guides/preinstall-fleets-agent-on-windows-with-a-provisioning-package).
    - question: How often is doWipePersistProvisionedData used?
      answer: |
        Occasionally, by teams that provision computers with packages instead of Autopilot. Fleet doesn't send it from the **Wipe** action. It's available as a custom MDM command in Fleet Premium.
    - question: How do I run doWipePersistProvisionedData with Fleet?
      answer: |
        Save the `<Exec>` element as XML and run `fleetctl mdm run-command --hosts=<hostname> --payload=wipe-keep-ppkg.xml`, or send it base64-encoded to `POST /api/v1/fleet/commands/run`.

        Microsoft's note about a dummy value of `1` only applies to OMA Client Provisioning, not to MDM commands sent through Fleet.
    - question: How do I know doWipePersistProvisionedData worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<command-uuid>` means the host accepted the command. Fleet doesn't update the host's wipe status for custom wipe commands.

        The real test is the host returning with your provisioning package applied.
    - question: What errors does doWipePersistProvisionedData return?
      answer: |
        A `500` means Windows couldn't start the reset, most often because of a Windows Recovery Environment problem. A `400` points to a malformed payload.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>505af1a0-407c-4971-a193-1a25a94abb2b</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipePersistProvisionedData</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

