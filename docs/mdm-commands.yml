        <string>0001_UnlockUserAccount</string>
    </dict>
    </plist>

- name: Set local admin password
  platform: apple
  category: Passwords
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/set-auto-admin-password-command
  description: Update the local administrator account password.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the SetAutoAdminPassword MDM command do?
      answer: |
        The `SetAutoAdminPassword` command changes the password of a local administrator account that MDM created on a Mac during Automated Device Enrollment (ADE).

        The payload has two keys. `GUID` identifies the admin account. `passwordHash` is a salted SHA-512 PBKDF2 password hash, base64-encoded as plist data. The plain-text password is never sent to the Mac.
    - question: Does Fleet use SetAutoAdminPassword?
      answer: |
        Yes. Fleet uses it to rotate the password for its managed local admin account, `_fleetadmin`. Fleet creates this hidden account during macOS setup when **Controls > Setup experience > Users** is set to create a managed admin account.

        Fleet sends `SetAutoAdminPassword` when you click **Rotate password** in **Host details > Actions > Show managed account**. It also sends it automatically about an hour after someone views the password. Learn more in the [setup experience guide](https://fleetdm.com/guides/setup-experience).
    - question: How often is SetAutoAdminPassword sent?
      answer: |
        Only when a password rotation happens. It isn't part of enrollment or regular refreshes. In Fleet, that means after a manual rotation or after someone views the password.
    - question: Can I send SetAutoAdminPassword as a custom command?
      answer: |
        Yes, with `fleetctl mdm run-command --hosts=<hostname> --payload=<file>` or `POST /api/v1/fleet/commands/run`. You need the account's GUID and a correctly formatted PBKDF2 password hash.

        For Fleet's `_fleetadmin` account, use the built-in **Rotate password** action instead. If you change that password with a custom command, Fleet won't know the new password. The password shown in **Show managed account** will be wrong.
    - question: Which accounts does SetAutoAdminPassword work on?
      answer: |
        Only admin accounts that MDM created during ADE, using `AutoSetupAdminAccounts` in the `AccountConfiguration` command. If the `GUID` doesn't match one of those accounts, the command returns an error.

        It can't change the password of the end user's account or any other local account.
    - question: Does SetAutoAdminPassword require a supervised Mac?
      answer: |
        Yes. Apple lists it as requiring supervision, on the device channel. In practice, the Mac must have been enrolled through ADE, because that's the only way MDM can create the admin account the command targets.

        Fleet's managed local admin account is a Fleet Premium feature. It isn't created during [MDM migration](https://fleetdm.com/guides/mdm-migration).
    - question: How do I know the admin password rotation worked?
      answer: |
        In Fleet, open **Host details > Actions > Show managed account**. After the Mac acknowledges the command, Fleet shows the new password. If the Mac returns an error, Fleet logs a "failed to rotate managed local account password" activity.

        For custom commands, run `fleetctl get mdm-command-results --id=<command-uuid>`. `NotNow` means the Mac will retry at a later check-in.
    - question: Why is Fleet's password rotation deferred on a new Mac?
      answer: |
        Fleet needs the managed account's GUID before it can send `SetAutoAdminPassword`. Right after ADE enrollment, Fleet may not have it yet. Fleet holds the rotation and sends it automatically once the host reports the GUID, usually after its first check-in.
