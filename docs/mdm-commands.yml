- name: Device configured
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-configured-command
  description: Inform the device that it can allow the user to continue in Setup Assistant.
  supportedDeviceTypes:
    - iOS 9.0+
    - iPadOS 9.0+
    - macOS 10.11+
    - tvOS 10.2+
    - visionOS 2.0+
  faq:
    - question: What does the DeviceConfigured MDM command do?
      answer: |
        `DeviceConfigured` tells a device that's waiting in Setup Assistant that the MDM has finished its setup work. The device then lets the user continue through the rest of Setup Assistant.

        It only works on devices enrolled through Automated Device Enrollment (ADE) whose enrollment profile has `await_device_configured` set to `true`.
    - question: Why would an MDM hold a device in Setup Assistant?
      answer: |
        To make sure the device is ready before anyone uses it. While the device waits, the MDM can install configuration profiles, apps, and scripts, so security settings and key software are in place at the first login.

        The MDM sends `DeviceConfigured` once per setup, after that work is done.
    - question: Which Fleet features use DeviceConfigured?
      answer: |
        Fleet's [setup experience](https://fleetdm.com/guides/setup-experience) does, in Fleet Premium. Fleet holds automatically enrolled Macs, iPhones, and iPads in Setup Assistant while it delivers configuration profiles and, on Macs, installs setup software and runs the setup script.

        Fleet sends `DeviceConfigured` when that work finishes. iPhones, iPads, and Macs with no setup software or script are released after about 15 minutes even if some profiles are still pending, so users aren't stuck.
    - question: How do I release a device stuck in Setup Assistant?
      answer: |
        Send `DeviceConfigured` to it. With Fleet, run `fleetctl mdm run-command --hosts=<serial-number> --payload=device-configured.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Before you do, check **Host details** for the profile, install, or script that's still pending. Releasing the device lets the user in even if that item never finished.
    - question: Can I release devices manually instead of letting Fleet do it?
      answer: |
        Yes, in Fleet Premium. Set `apple_enable_release_device_manually: true` in the [setup_experience](https://fleetdm.com/docs/configuration/yaml-files#setup-experience) settings, or select **Release device manually** in **Controls > Setup experience > Setup Assistant**. Fleet then stops sending `DeviceConfigured`.

        Users stay in Setup Assistant until you send it, so automate the release with a script or workflow that calls the Fleet API.
    - question: What happens if I send DeviceConfigured to a device that's already set up?
      answer: |
        Nothing useful. The command only applies while a device is waiting in Setup Assistant, so the device rejects it or ignores it. You can check whether a device is waiting with a `DeviceInformation` command and the `AwaitingConfiguration` key.
    - question: How do I know if DeviceConfigured worked?
      answer: |
        `Acknowledged` means the device received the release. In Fleet, run `fleetctl get mdm-command-results --id=<command-uuid>`. On the device, Setup Assistant moves past the remote management screen.
    - question: What's the difference between DeviceConfigured and UserConfigured?
      answer: |
        `DeviceConfigured` releases a whole device from Setup Assistant after Automated Device Enrollment (ADE). `UserConfigured` is only for Shared iPad: it lets a user finish signing in after the MDM has configured their session. Fleet uses `DeviceConfigured` only.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DeviceConfigured</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DeviceConfigured</string>
    </dict>
    </plist>

- name: User configured
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/user-configured-command
  description: Inform the device that it can allow the user to continue in Setup Assistant.
  supportedDeviceTypes:
    - iOS 9.0+
    - iPadOS 9.0+
  faq:
    - question: What does the UserConfigured MDM command do?
      answer: |
        `UserConfigured` tells a Shared iPad that the MDM has finished configuring a user's session, so the user can get past Setup Assistant and finish signing in.

        It's the per-user counterpart of `DeviceConfigured`. It was added in iPadOS 17.
    - question: When is UserConfigured used?
      answer: |
        Only on Shared iPad with the `AwaitUserConfiguration` setting turned on. With that setting, a Shared iPad stops in Setup Assistant each time a user signs in, so the MDM can configure that user first. The user can't use the iPad until the MDM sends `UserConfigured`.

        Outside Shared iPad deployments, like schools, it's rarely used.
    - question: What are the requirements for UserConfigured?
      answer: |
        According to Apple, the iPad must:

        - Be in Shared iPad mode on iPadOS 17 or later.
        - Be supervised and enrolled through Automated Device Enrollment (ADE).
        - Have `AwaitUserConfiguration` enabled through the `Settings` command.
        - Receive the command on the user's MDM channel.

        It isn't available on Mac, iPhone, or devices enrolled with User Enrollment.
    - question: Does Fleet use UserConfigured?
      answer: |
        No. Fleet doesn't send `UserConfigured` for any feature. Fleet's setup experience releases Macs, iPhones, and iPads with `DeviceConfigured` instead.
    - question: Can I send UserConfigured as a custom command in Fleet?
      answer: |
        Not in a way that works. Fleet sends custom Apple commands on the device channel, and `UserConfigured` must go to the Shared iPad user's channel.

        If you deploy Shared iPads that wait for user configuration, use an MDM that supports that workflow. Otherwise, leave `AwaitUserConfiguration` off so users aren't blocked at sign-in.
    - question: What's the difference between UserConfigured and DeviceConfigured?
      answer: |
        `DeviceConfigured` releases a whole device from Setup Assistant once, after Automated Device Enrollment (ADE). `UserConfigured` releases one user's sign-in on a Shared iPad, and can be needed each time a user signs in.
    - question: What happens if UserConfigured is never sent?
      answer: |
        The user stays at the Setup Assistant pane after signing in and can't use the Shared iPad. Apple also requires the iPad to have network access during sign-in for this flow.

        To unblock users, send `UserConfigured` on their channel, or turn off `AwaitUserConfiguration` in the Shared iPad settings.
    - question: What errors can UserConfigured return?
      answer: |
        Expect an `Error` if the iPad isn't a Shared iPad waiting for user configuration, or if the command arrives on the device channel instead of the user channel. `CommandFormatError` means the plist is malformed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>UserConfigured</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_UserConfigured</string>
    </dict>
    </plist>

