- name: Provisioning profile list
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/provisioning-profile-list-command
  description: Get a list of installed provisioning profiles on a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ProvisioningProfileList MDM command do?
      answer: |
        `ProvisioningProfileList` asks an Apple device for the app provisioning profiles it has installed. The response includes each profile's name, UUID, and expiration date.

        Set `ManagedOnly` to `true` to list only profiles installed by MDM.
    - question: When would I use ProvisioningProfileList?
      answer: |
        Rarely. It's most useful if you deploy in-house apps and need to find provisioning profiles that are about to expire. When a profile expires, apps that depend on it stop launching.
    - question: Does Fleet send ProvisioningProfileList automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run ProvisioningProfileList with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=provisioning-profile-list.xml`. Or base64-encode it and send it with the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's read-only and available in Fleet Free.
    - question: How do I read the results of ProvisioningProfileList?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the result plist contains a `ProvisioningProfileList` array. Each entry's `UUID` is the value you pass to `RemoveProvisioningProfile`.
    - question: Which devices support ProvisioningProfileList?
      answer: |
        iPhone and iPad, Apple TV, Apple Vision Pro, Apple Watch, and Macs on macOS 11 or later.
    - question: What errors can ProvisioningProfileList return?
      answer: |
        Errors are uncommon because the command is read-only. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until its next check-in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedOnly</key>
            <false/>
            <key>RequestType</key>
            <string>ProvisioningProfileList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ProvisioningProfileList</string>
    </dict>
    </plist>

- name: Remove provisioning profile
  platform: apple
  category: Profile managment
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/remove-provisioning-profile-command
  description: Remove a previously installed provisioning profile from a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the RemoveProvisioningProfile MDM command do?
      answer: |
        `RemoveProvisioningProfile` deletes an app provisioning profile from a device. You identify it by the profile's `UUID`.

        Apps that rely on that profile stop launching until a valid profile is installed again.
    - question: When would I use RemoveProvisioningProfile?
      answer: |
        Rarely. Use it to clean up expired profiles, or to stop an in-house app from running without uninstalling it. Most organizations never send it.
    - question: Does Fleet send RemoveProvisioningProfile automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature. You can send it as a custom MDM command.
    - question: How do I run RemoveProvisioningProfile with Fleet?
      answer: |
        First, send `ProvisioningProfileList` to get the profile's `UUID`. Put that value in the `UUID` key of this command, then run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-provisioning-profile.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.
    - question: How do I know if RemoveProvisioningProfile worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the profile was removed. Send `ProvisioningProfileList` again to confirm it's gone.
    - question: What errors can RemoveProvisioningProfile return?
      answer: |
        The usual error is that no provisioning profile with that UUID is installed. Copy the UUID from a fresh `ProvisioningProfileList` response. `CommandFormatError` means the command plist is malformed.
    - question: Will RemoveProvisioningProfile uninstall the app?
      answer: |
        No. The app stays on the device, but it won't launch without a valid provisioning profile. To remove the app, use the `RemoveApplication` command or uninstall it through Fleet.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>RemoveProvisioningProfile</string>
            <key>UUID</key>
            <string>493d9dc8-e4c0-4fd8-bd8e-8fd4c0dc7b0c</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RemoveProvisioningProfile</string>
    </dict>
    </plist>

- name: Device information
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-information-command
  description: Get detailed information about a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the DeviceInformation MDM command do?
      answer: |
        `DeviceInformation` asks an Apple device to report details about itself. You list the keys you want in the `Queries` array, like `OSVersion`, `SerialNumber`, `DeviceName`, `BatteryLevel`, `IsSupervised`, or `AvailableDeviceCapacity`.

        The device returns a `QueryResponses` dictionary with a value for each key it supports.
    - question: How often is DeviceInformation used?
      answer: |
        Constantly. It's the main way an MDM collects inventory from iPhones and iPads, so most MDMs send it on a schedule and right after enrollment.
    - question: Which Fleet features use DeviceInformation?
      answer: |
        Fleet sends `DeviceInformation` to iPhone and iPad hosts to collect host vitals, like OS version, storage, device name, Wi-Fi MAC address, and Lost Mode status. It sends it on a recurring schedule (about once an hour by default) and when you click **Refetch** on the host details page.

        Fleet doesn't use it for macOS. Mac vitals come from fleetd and osquery.
    - question: How do I run DeviceInformation with Fleet?
      answer: |
        Edit the `Queries` array to include the keys you need, then run `fleetctl mdm run-command --hosts=<hostname> --payload=device-information.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API with a base64-encoded payload.

        For iPhone and iPad vitals, clicking **Refetch** in **Host details** is usually easier.
    - question: How do I see DeviceInformation results?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the `result` field contains the `QueryResponses` dictionary. Keys the device doesn't support, or doesn't share, are left out.
    - question: Why are some DeviceInformation keys missing from the response?
      answer: |
        Not every key applies to every device. Cellular keys like `IMEI` and `ICCID` only come from devices with cellular hardware. Some keys are only returned on supervised devices or certain OS versions.

        Personally owned devices enrolled with User Enrollment return a much smaller set to protect the user's privacy. Fleet asks those hosts for fewer keys.
    - question: What errors can DeviceInformation return?
      answer: |
        Errors are uncommon, since unsupported keys are skipped instead of failing the command. `CommandFormatError` means the plist is malformed, for example a `Queries` value that isn't an array of strings.
    - question: Does DeviceInformation work on macOS?
      answer: |
        Yes. Macs respond to `DeviceInformation` too, but some keys are iOS-only. With Fleet, macOS inventory comes from fleetd, so you'd mainly use this command on a Mac to check an MDM-specific value, like `IsSupervised` or `MDMOptions`.
