- name: doWipeProtected
  platform: windows
  category: RemoteWipe
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/remotewipe-csp#dowipeprotected
  description: Performs a remote wipe that fully cleans the internal drive and continues retrying until complete, even after power cycles. Unlike doWipe, which can be interrupted by a simple power cycle, doWipeProtected ensures the wipe finishes. May render the device unbootable on some configurations.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the doWipeProtected MDM command do?
      answer: |
        It wipes a Windows computer and fully cleans the internal drive. It's an `<Exec>` on `./Device/Vendor/MSFT/RemoteWipe/doWipeProtected`.

        Unlike `doWipe`, power cycling the computer doesn't stop it. Windows keeps retrying until the wipe is done.
    - question: What's the difference between doWipeProtected and doWipe?
      answer: |
        doWipeProtected cleans the drive and survives power cycles, so someone holding the device can't stop it. doWipe deletes files without fully cleaning the drive, and an interrupted reset tries to roll back.

        Microsoft recommends doWipeProtected for lost or stolen devices. For computers you plan to reuse, doWipe avoids the small risk of an unbootable device.
    - question: Can doWipeProtected leave a device unable to boot?
      answer: |
        Yes. Microsoft warns that in some device configurations, doWipeProtected may leave the device unable to boot. That's an acceptable tradeoff for a lost or stolen device, where a guaranteed wipe matters more.

        If that happens to a device you have in hand, reinstall Windows from installation media.
    - question: Does Fleet use doWipeProtected?
      answer: |
        Yes. It's the default command behind **Host details > Actions > Wipe** and `fleetctl mdm wipe` for Windows hosts. To send `doWipe` instead, call the [Wipe host](https://fleetdm.com/docs/rest-api/rest-api#wipe-host) API with `wipe_type` set to `doWipe`.

        Wipe requires Fleet Premium. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: How often is doWipeProtected used?
      answer: |
        Occasionally. It's the default wipe in several MDMs, including Fleet, so it's the most common Windows wipe. Wipes are still rare compared to routine commands.
    - question: How do I know doWipeProtected worked?
      answer: |
        In Fleet, the host shows "Wipe pending," then "Wiped" once Windows acknowledges the command with a `2xx` status. You can also check `fleetctl get mdm-command-results --id=<command-uuid>`.

        Wait for the wipe to finish before deleting the host from Fleet. If you plan to enroll it again, delete the host first so Fleet escrows a new BitLocker key.
    - question: What if doWipeProtected fails with a 500 error?
      answer: |
        A `500` usually means Windows couldn't start the reset because the Windows Recovery Environment is broken or disabled.

        Run Fleet's [fallback wipe script](https://github.com/fleetdm/fleet/blob/main/docs/solutions/windows/scripts/wipe-windows-device.ps1) on the host. It repairs WinRE, suspends BitLocker, and starts the wipe locally through the WMI bridge to the RemoteWipe CSP.
    - question: Can I cancel a doWipeProtected command?
      answer: |
        No. Fleet doesn't let you cancel a pending Windows wipe. If the host re-enrolls in MDM before it receives the wipe, Fleet cancels it.
    - question: What should I do before wiping a lost Windows computer?
      answer: |
        Disable the user's account in Microsoft Entra ID or your identity provider first, so the device can't be used to reach company data. Then send the wipe. If the device has an eSIM, send `ResetToFactoryState` before the wipe, since the wipe ends MDM management.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>0d0f7e7b-82b7-4fff-a4d1-101c9edb795d</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/RemoteWipe/doWipeProtected</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: InstallWindowsDefenderApplicationGuard
  platform: windows
  category: WindowsDefenderApplicationGuard
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowsdefenderapplicationguard-csp#installwindowsdefenderapplicationguard
  description: Remotely installs the Windows Defender Application Guard feature on the device.
  supportedDeviceTypes:
    - Windows 10.0.16299
  faq:
    - question: What does the InstallWindowsDefenderApplicationGuard MDM command do?
      answer: |
        It installs or uninstalls the Microsoft Defender Application Guard Windows feature. It's an `<Exec>` on `./Device/Vendor/MSFT/WindowsDefenderApplicationGuard/InstallWindowsDefenderApplicationGuard`, with `Install` or `Uninstall` in `<Data>`.

        Application Guard opens untrusted websites and Office files in an isolated, Hyper-V based container.
    - question: Is Microsoft Defender Application Guard deprecated?
      answer: |
        Yes. Microsoft deprecated Application Guard for Microsoft Edge for Business, and it's no longer available starting with Windows 11, version 24H2.

        Microsoft recommends Microsoft Edge for Business security features instead. This command is only useful on older Windows versions that still include the feature.
    - question: What does a computer need to run Application Guard?
      answer: |
        Hardware that can run a Hyper-V container: a 64-bit CPU with virtualization extensions turned on, plus enough memory and disk space. Configuring Application Guard through MDM requires Windows Enterprise or Education.

        The CSP's `Status` node is a bitmask that reports whether the computer meets the hardware, license, and network isolation prerequisites.
    - question: Does installing Application Guard turn it on?
      answer: |
        No. The command only installs the Windows feature. To turn it on, set `Settings/AllowWindowsDefenderApplicationGuard` to `1` (Edge), `2` (isolated Windows environments), or `3` (both) in a Windows configuration profile.

        Application Guard also needs network isolation settings that define your trusted sites. Without them, it can't tell which sites to isolate.
    - question: How often is InstallWindowsDefenderApplicationGuard used?
      answer: |
        Rarely, and less every year because of the deprecation.
    - question: How do I run InstallWindowsDefenderApplicationGuard with Fleet?
      answer: |
        As a custom command. Add `<Data>Install</Data>` to the `<Item>`, save only the `<Exec>` element with a new, unique `<CmdID>`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-mdag.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Deliver the `Settings` nodes in a Windows configuration profile in **Controls > OS settings** so Fleet keeps them enforced. See [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: How do I check if Application Guard is installed?
      answer: |
        On the computer, run `Get-WindowsOptionalFeature -Online -FeatureName Windows-Defender-ApplicationGuard` in PowerShell. A restart may be needed before the feature is enabled.

        Across many hosts, an osquery report or policy on the `windows_optional_features` table with `name = 'Windows-Defender-ApplicationGuard'` shows where it's installed. Fleet's custom commands can't read the CSP's `Status` node, because they only support `<Exec>`.
    - question: What errors does InstallWindowsDefenderApplicationGuard return?
      answer: |
        A `404` usually means the feature isn't available on that Windows version, including Windows 11, version 24H2 and later. A `500` usually means the install couldn't run, often because the hardware doesn't support virtualization or it's turned off in the firmware.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>be527684-1679-449f-b4f1-7d2f6fe48ce7</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/WindowsDefenderApplicationGuard/InstallWindowsDefenderApplicationGuard</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ChangeProductKey
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#changeproductkey
  description: Installs a new Windows product key on the device without requiring a reboot.
  supportedDeviceTypes:
    - Windows 10.0.15063
  faq:
    - question: What does the ChangeProductKey MDM command do?
      answer: |
        It installs a new Windows product key without restarting the computer. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/ChangeProductKey` with the key as a string in `<Data>`.

        It's available on Windows 10, version 1703 and later.
    - question: What's the difference between ChangeProductKey and UpgradeEditionWithProductKey?
      answer: |
        Both take a product key. ChangeProductKey never restarts the computer. UpgradeEditionWithProductKey restarts the computer when the key changes the edition, like Pro to Enterprise, and is the command Microsoft documents for edition upgrades.

        Use ChangeProductKey to swap or correct a key without interrupting the user, for example when moving computers to a volume license key. Use UpgradeEditionWithProductKey when you need a supported edition upgrade.
    - question: What format does the product key need?
      answer: |
        All 29 characters, including dashes, like `XXXXX-XXXXX-XXXXX-XXXXX-XXXXX`. Microsoft says product key changes fail without the dashes. Put the key in a `<Data>` element inside `<Item>`, with `chr` as the format.
    - question: How often is ChangeProductKey used?
      answer: |
        Rarely. It's used to fix activation problems or move computers onto volume licensing. Most organizations that use Windows Enterprise E3 or E5 rely on subscription activation instead, which needs no key.
    - question: How do I run ChangeProductKey with Fleet?
      answer: |
        Add `<Data>` with your key, save only the `<Exec>` element with a new, unique `<CmdID>`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=change-key.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet keeps the command payload, including the key, in the command's results. To keep the key out of that history, run `slmgr /ipk` with a [Fleet secret variable](https://fleetdm.com/guides/secrets-in-scripts-and-configuration-profiles) in a script instead.
    - question: How do I know ChangeProductKey worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the key.

        On the computer, `slmgr /dli` shows the last five characters of the installed key and the activation status. **Settings > System > Activation** shows the same.
    - question: What errors does ChangeProductKey return?
      answer: |
        Usually a `4xx` or `5xx` status when the key is invalid, mistyped, missing its dashes, or not valid for the installed edition. Check the key, then try it on one computer with `slmgr /ipk` to see Windows' full error message.
    - question: Will the user notice when ChangeProductKey runs?
      answer: |
        Usually not. Changing the key is silent and doesn't restart the computer. If the new key changes activation status, the user may see that in **Settings > System > Activation**.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>e416bea9-8407-4a72-a7db-415cd4dcf622</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/ChangeProductKey</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: CheckApplicability
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#checkapplicability
  description: Checks if the provided product key is valid for upgrading the Windows edition on the device, returning TRUE if applicable.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the CheckApplicability MDM command do?
      answer: |
        It checks whether a product key can be used to upgrade the Windows edition on a computer. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/CheckApplicability` with the key in `<Data>`.

        Microsoft says it returns TRUE when the key applies. It doesn't install or activate anything.
    - question: Why run CheckApplicability before an edition upgrade?
      answer: |
        To avoid a failed upgrade. `UpgradeEditionWithProductKey` prompts the user and restarts the computer, so checking the key first avoids disrupting users on computers where the upgrade won't work.
    - question: What's the difference between CheckApplicability and UpgradeEditionWithProductKey?
      answer: |
        CheckApplicability only tests the key and changes nothing. UpgradeEditionWithProductKey installs the key and, for an edition change, restarts the computer to finish the upgrade. Both use the same 29-character key format.
    - question: Does CheckApplicability use up or activate the key?
      answer: |
        No. It only checks whether the key works for an edition upgrade on that computer. Nothing is installed or activated.
    - question: How often is CheckApplicability used?
      answer: |
        Rarely, and usually right before an edition upgrade. Many admins skip it and instead test the upgrade on one pilot computer.
    - question: How do I run CheckApplicability with Fleet?
      answer: |
        Add `<Data>` with the 29-character key, including dashes. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=check-key.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet keeps the payload, including the key, in the command's results.
    - question: Where do I see the CheckApplicability result?
      answer: |
        In the command result. In Fleet, run `fleetctl get mdm-command-results --id=<CmdID>` to see the status code and any result the device returned.

        Microsoft doesn't document exactly how the TRUE value is reported. If the result isn't conclusive, run the upgrade on one pilot computer before sending it to a group.
    - question: What errors does CheckApplicability return?
      answer: |
        A `4xx` status usually means the key or payload is malformed, for example a key without dashes. A `5xx` status means the device couldn't evaluate the key.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>e3f7b84a-1984-4511-843f-c33001392d14</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/CheckApplicability</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: SwitchFromSMode
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#smodeswitchfromsmode
  description: Switches the device from Windows 10/11 S mode to a standard edition, if eligible. No reboot is required.
  supportedDeviceTypes:
    - Windows 10.0.17763
  faq:
    - question: What does the SwitchFromSMode MDM command do?
      answer: |
        It switches a Windows computer out of S mode to the full edition, for example from Windows 11 Pro in S mode to Windows 11 Pro. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/SMode/SwitchFromSMode` with `null` format and an empty `<Data>`.

        No restart is needed. It requires Windows 10, version 1809 or later.
    - question: Can I switch back to S mode afterward?
      answer: |
        No. Leaving S mode is one-way. To get S mode back, reinstall Windows with an S mode image.
    - question: Why switch out of S mode?
      answer: |
        S mode only runs apps from the Microsoft Store. That blocks most management agents, security tools, and line-of-business apps. Organizations that buy computers shipped in S mode usually switch them out before deploying them.
    - question: Can I stop users from leaving S mode themselves?
      answer: |
        Yes. Set `SMode/SwitchingPolicy` to `1` in a Windows configuration profile. Then only an admin can switch the computer out of S mode, using this command. A value of `0` lets users switch on their own.
    - question: How often is SwitchFromSMode used?
      answer: |
        Rarely. It's mostly used during rollout of computers that shipped in S mode.
    - question: Can a Windows computer in S mode enroll in Fleet?
      answer: |
        Only through MDM, not through fleetd. Fleet's agent installer isn't a Store app, so S mode blocks it. A computer in S mode can turn on MDM through [Microsoft Entra automatic enrollment](https://fleetdm.com/guides/windows-mdm-setup#automatic-enrollment).

        Once enrolled, send SwitchFromSMode so fleetd, scripts, software installs, and osquery reports can work.
    - question: How do I run SwitchFromSMode with Fleet?
      answer: |
        As a custom command. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=switch-from-s-mode.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        To block users from switching on their own, add `SMode/SwitchingPolicy` to a Windows configuration profile in **Controls > OS settings**.
    - question: How do I know SwitchFromSMode worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the request.

        Windows records the outcome in `SMode/Status`: `0` switched, `1` in progress, `3` already out of S mode, `4` failed. Fleet's custom commands can't read that node, so check **Settings > System > Activation** on the computer, which no longer mentions S mode.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>848dc97d-0d6d-489e-bb32-9a90fa2e3afb</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/SMode/SwitchFromSMode</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: RemoveSubscription
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#subscriptionsremovesubscription
  description: Removes the subscription license from the device and resets the subscription type to a user-based subscription.
  supportedDeviceTypes:
    - Windows 99.9.99999
  faq:
    - question: What does the RemoveSubscription MDM command do?
      answer: |
        It removes the Windows subscription license from the device and resets the subscription type to user-based. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/Subscriptions/RemoveSubscription` with `null` format.
    - question: Which Windows versions support RemoveSubscription?
      answer: |
        Microsoft lists it only for Windows Insider Preview builds, which is why this page shows a placeholder version. Release versions of Windows may return an error. Behavior can change before it ships.
    - question: What's the difference between user-based and device-based subscriptions?
      answer: |
        Windows Enterprise subscription activation steps a computer up from Pro to Enterprise based on a license. With a user-based subscription, the license comes from the user who signs in. With a device-based subscription, the computer gets Enterprise without a licensed user signing in.

        RemoveSubscription removes the subscription license and switches the device back to user-based.
    - question: How do I remove a Windows Enterprise subscription on release builds?
      answer: |
        Through licensing, not MDM. Remove the Windows Enterprise license assignment from the user or device in your Microsoft 365 admin tools. Windows then returns to the underlying edition, usually Pro.
    - question: How often is RemoveSubscription used?
      answer: |
        Rarely. It's a preview feature for organizations testing device-based subscriptions.
    - question: How do I run RemoveSubscription with Fleet?
      answer: |
        As a custom command. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-subscription.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. Test on an Insider build first.
    - question: How do I know RemoveSubscription worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the command. Windows records details in the `Subscriptions/SubscriptionStatus` and `Subscriptions/SubscriptionLastError` nodes.

        Fleet's custom commands can't read those nodes. Check the edition in **Settings > System > Activation**, or in the host's operating system details in Fleet after a refetch.
    - question: What errors does RemoveSubscription return?
      answer: |
        A `404` usually means the host isn't running an Insider build that has this node. Other failures are described in `Subscriptions/SubscriptionLastError` and `Subscriptions/SubscriptionLastErrorDescription`.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>da9c456a-2f0e-4d8a-9748-0fbde572ee76</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/Subscriptions/RemoveSubscription</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">null</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data></Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpgradeEditionWithLicense
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#upgradeeditionwithlicense
  description: Upgrades the Windows edition on the device by applying a provided license. No reboot is required to complete the upgrade.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the UpgradeEditionWithLicense MDM command do?
      answer: |
        It upgrades the Windows edition with an XML license, without a restart. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithLicense` with `xml` format.

        Microsoft designed it for Windows 10 Mobile, which used a license file instead of a product key.
    - question: Is UpgradeEditionWithLicense still supported?
      answer: |
        No. Microsoft marks it as deprecated and says it may be removed in a future release. Windows 10 Mobile, the platform it was built for, is no longer supported.

        For Windows desktop edition upgrades, use `UpgradeEditionWithProductKey`.
    - question: What's the difference between UpgradeEditionWithLicense and UpgradeEditionWithProductKey?
      answer: |
        UpgradeEditionWithLicense takes an XML license and was meant for mobile devices. UpgradeEditionWithProductKey takes a 29-character product key, works on Windows desktop computers, and restarts the computer to finish an edition upgrade.

        Microsoft says Windows desktop computers require a product key for edition upgrades. The `LicenseKeyType` node reports which one a device expects.
    - question: How do I upgrade Windows 10 or 11 to Enterprise without this command?
      answer: |
        Use `UpgradeEditionWithProductKey` with a volume license key, or use Windows Enterprise subscription activation. With subscription activation, an Entra-joined computer running Pro steps up to Enterprise when a licensed user signs in, with no key or restart.
    - question: How often is UpgradeEditionWithLicense used?
      answer: |
        Almost never today, because it only applied to Windows 10 Mobile.
    - question: Can I send UpgradeEditionWithLicense with Fleet?
      answer: |
        Yes, as a custom command, but expect desktop computers to reject it. Put the license XML in `<Data>`, save only the `<Exec>` element with a new, unique `<CmdID>`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=upgrade-license.xml`.

        For a real edition upgrade, send `UpgradeEditionWithProductKey` instead.
    - question: What errors does UpgradeEditionWithLicense return?
      answer: |
        On Windows desktop computers, it usually fails because they expect a product key, not a license. A `4xx` status can also mean the license XML is malformed.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>472afd03-6963-4c7b-aebb-99d561724086</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithLicense</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">xml</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: UpgradeEditionWithProductKey
  platform: windows
  category: WindowsLicensing
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/windowslicensing-csp#upgradeeditionwithproductkey
  description: Upgrades the Windows edition on the device by applying a specified product key. A reboot is required to complete the upgrade.
  supportedDeviceTypes:
    - Windows 10.0.10586
  faq:
    - question: What does the UpgradeEditionWithProductKey MDM command do?
      answer: |
        It upgrades the Windows edition with a product key, like Pro to Enterprise. It's an `<Exec>` on `./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithProductKey` with the key in `<Data>`.

        Windows runs `changepk.exe` with the key, then restarts to finish the upgrade. If the key matches the current edition, it just changes or activates the key, silently and without a restart.
    - question: Which edition upgrades does UpgradeEditionWithProductKey support?
      answer: |
        Microsoft lists these upgrade paths through MDM, for Windows 10 and 11:

        - Pro to Enterprise
        - Pro to Education
        - Home to Education
        - Enterprise to Education

        Changing or activating a key on the current edition works on Home, Pro, Enterprise, and Education.
    - question: Will UpgradeEditionWithProductKey restart the computer?
      answer: |
        Yes, for an edition upgrade. Windows tells the user a new edition is available. The user can restart right away, or Windows restarts automatically after two hours, with a reminder 10 minutes before.

        If another policy forces a restart while `changepk.exe` is running, the upgrade fails. Avoid sending updates or other restart-triggering changes at the same time.
    - question: Do I need a product key to upgrade Windows Pro to Enterprise?
      answer: |
        Not always. With Windows Enterprise E3 or E5 subscription activation, an Entra-joined computer running Pro steps up to Enterprise when a licensed user signs in, with no key or restart.

        This command is for organizations with volume license keys. Microsoft says the key comes from the Volume Licensing Service Center, which requires a Volume Licensing agreement.
    - question: How often is UpgradeEditionWithProductKey used?
      answer: |
        Occasionally, when an organization standardizes on Enterprise or Education and uses volume licensing.
    - question: How do I run UpgradeEditionWithProductKey with Fleet?
      answer: |
        Replace the placeholder in `<Data>` with your 29-character key, including dashes. Save only the `<Exec>` element with a new, unique `<CmdID>` and run `fleetctl mdm run-command --hosts=<hostname> --payload=upgrade-edition.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet keeps the payload, including the key, in the command's results. To find hosts still on the old edition, create a policy on the `os_version` table, for example `SELECT 1 FROM os_version WHERE name LIKE '%Enterprise%';`.
    - question: How do I know UpgradeEditionWithProductKey worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the key. The upgrade isn't done until the computer restarts.

        After the restart, the user sees a notification that the upgrade succeeded. In Fleet, the new edition appears in the host's operating system after the next refetch.
    - question: What errors does UpgradeEditionWithProductKey return?
      answer: |
        A failure status usually means an invalid key, a key without dashes, or an upgrade path Microsoft doesn't support, like Home to Enterprise. Run `CheckApplicability` with the same key first to catch these before any user is interrupted.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>3d13b6f6-5e79-4a28-b8f5-062f884a1de1</CmdID>
          <Item>
            <Target>
              <LocURI>./Vendor/MSFT/WindowsLicensing/UpgradeEditionWithProductKey</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
            <Data>XXXXX-XXXXX-XXXXX-XXXXX-XXXXX</Data>
          </Item>
        </Exec>
       </syncbody>
     </syncml>

- name: ResetToFactoryState
  platform: windows
  category: eUICCs
  externalDocumentationUrl: https://learn.microsoft.com/en-us/windows/client-management/mdm/euiccs-csp#euiccactionsresettofactorystate
  description: Triggers an eUICC (embedded Universal Integrated Circuit Card) factory reset, permanently deleting all eSIM (embedded Subscriber Identity Module) profiles stored on the eUICC.
  supportedDeviceTypes:
    - Windows 10.0.16299
  faq:
    - question: What does the eUICC ResetToFactoryState MDM command do?
      answer: |
        It triggers an eUICC memory reset, which erases every eSIM profile on the device's embedded SIM chip. It's an `<Exec>` on `./Device/Vendor/MSFT/eUICCs/{eUICC}/Actions/ResetToFactoryState`.

        The rest of Windows isn't affected. Only the cellular profiles are removed.
    - question: Which devices does ResetToFactoryState apply to?
      answer: |
        Only Windows devices with a cellular modem and an eSIM, like some LTE or 5G laptops. It's available on Windows 10, version 1709 and later. On devices without an eUICC, the node doesn't exist and the command fails.
    - question: What do I put in place of {eUICC}?
      answer: |
        The eUICC's identifier (EID), or `Default`. Microsoft says the node name `Default` represents the currently active eUICC, which avoids looking up the EID on each device. For example: `./Device/Vendor/MSFT/eUICCs/Default/Actions/ResetToFactoryState`.
    - question: Can I undo ResetToFactoryState?
      answer: |
        No. Erased eSIM profiles can't be restored. To get cellular service back, the user needs a new eSIM activation from the mobile carrier.
    - question: Does wiping a Windows device also remove its eSIM profiles?
      answer: |
        Don't rely on it. RemoteWipe commands reset Windows but aren't documented to erase the eUICC. To retire a cellular laptop, send ResetToFactoryState first, then wipe the device, because the wipe ends MDM management.
    - question: How often is ResetToFactoryState used?
      answer: |
        Rarely. It's used when retiring, reassigning, or recovering a lost cellular-capable laptop.
    - question: How do I run ResetToFactoryState with Fleet?
      answer: |
        As a custom command. Replace `{eUICC}` with `Default` or the device's EID, save only the `<Exec>` element with a new, unique `<CmdID>`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=reset-euicc.xml`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Fleet's **Wipe** action doesn't send this command, so send it yourself before wiping.
    - question: How do I know ResetToFactoryState worked?
      answer: |
        A `200` in `fleetctl get mdm-command-results --id=<CmdID>` means Windows accepted the reset. Windows records the outcome as an HRESULT in `{eUICC}/Actions/Status`, which Fleet's custom commands can't read.

        On the device, the cellular settings in **Settings > Network & internet** show no eSIM profiles.
    - question: What errors does ResetToFactoryState return?
      answer: |
        A `404` usually means the `{eUICC}` value is wrong or the device has no eUICC. A `500` means the reset failed on the modem side. Check that the modem is turned on and try again.
  command: |
     <syncml xmlns="SYNCML:SYNCML1.2">
       <syncbody>
         <Exec>
          <CmdID>ebb2aec5-4865-4419-9fa1-3458d32fcab6</CmdID>
          <Item>
            <Target>
              <LocURI>./Device/Vendor/MSFT/eUICCs/{eUICC}/Actions/ResetToFactoryState</LocURI>
            </Target>
            <Meta>
              <Format xmlns="syncml:metinf">chr</Format>
              <Type>text/plain</Type>
            </Meta>
          </Item>
        </Exec>
       </syncbody>
     </syncml>
