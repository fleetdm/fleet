- name: Device configured
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-configured-command
  description: Inform the device that it can allow the user to continue in Setup Assistant.
  supportedDeviceTypes:
    - iOS 9.0+
    - iPadOS 9.0+
    - macOS 10.11+
    - tvOS 10.2+
    - visionOS 2.0+
  faq:
    - question: What does the DeviceConfigured MDM command do?
      answer: |
        `DeviceConfigured` tells a device that's waiting in Setup Assistant that the MDM has finished its setup work. The device then lets the user continue through the rest of Setup Assistant.

        It only applies to devices enrolled through Automated Device Enrollment (ADE) with `await_device_configured` set in the enrollment profile.
    - question: How often is DeviceConfigured used?
      answer: |
        Once per device setup. MDMs that hold devices in Setup Assistant send it once for each automatic enrollment, after the initial configuration is done.
    - question: Which Fleet features use DeviceConfigured?
      answer: |
        Fleet's [setup experience](https://fleetdm.com/guides/setup-experience) uses it. Fleet holds every automatically enrolled Mac, iPhone, and iPad in Setup Assistant while it installs configuration profiles and setup software and runs setup scripts.

        When those finish, Fleet sends `DeviceConfigured` to release the device. If setup takes too long (about 15 minutes), Fleet releases the device anyway so the user isn't stuck.
    - question: Can I release devices manually instead of letting Fleet do it?
      answer: |
        Yes, in Fleet Premium. Set `apple_enable_release_device_manually: true` in the [setup_experience](https://fleetdm.com/docs/configuration/yaml-files#setup-experience) settings. Fleet then stops sending `DeviceConfigured`, and you're responsible for sending it.

        End users stay in Setup Assistant until you do, so automate it.
    - question: How do I send DeviceConfigured with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=device-configured.xml`. Or base64-encode it and call the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API, which is easier to automate with a webhook or script.
    - question: What happens if I send DeviceConfigured to a device that's already set up?
      answer: |
        The device returns an `Error`. `DeviceConfigured` is only valid while the device is waiting in Setup Assistant. You can check that state with a `DeviceInformation` command and the `AwaitingConfiguration` key.
    - question: How do I know if DeviceConfigured worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device was released. On the device, Setup Assistant moves past the remote management screen.
    - question: What's the difference between DeviceConfigured and UserConfigured?
      answer: |
        `DeviceConfigured` releases the whole device from Setup Assistant and goes on the device channel. `UserConfigured` goes on the user channel and releases a user's setup. Fleet only uses `DeviceConfigured`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>DeviceConfigured</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DeviceConfigured</string>
    </dict>
    </plist>

- name: User configured
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/user-configured-command
  description: Inform the device that it can allow the user to continue in Setup Assistant.
  supportedDeviceTypes:
    - iOS 9.0+
    - iPadOS 9.0+
  faq:
    - question: What does the UserConfigured MDM command do?
      answer: |
        `UserConfigured` is the user-channel counterpart of `DeviceConfigured`. It tells the device that the MDM has finished configuring a user, so that user's setup can continue.

        Apple designed it for setups where each user gets their own MDM channel, like Shared iPad.
    - question: How often is UserConfigured used?
      answer: |
        Rarely. Most MDM deployments never send it. It only matters when a device is set up to wait for user-level configuration.
    - question: Does Fleet use UserConfigured?
      answer: |
        No. Fleet doesn't send `UserConfigured` for any feature. Fleet's setup experience releases devices with `DeviceConfigured` instead.
    - question: Can I send UserConfigured as a custom command in Fleet?
      answer: |
        You can send the payload with `fleetctl mdm run-command` or the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. But Fleet sends custom commands on the device channel only, and this command is meant for the user channel, so it won't have the intended effect.
    - question: Which devices support UserConfigured?
      answer: |
        iPhone and iPad on iOS and iPadOS 9 or later.
    - question: What errors can UserConfigured return?
      answer: |
        Expect an `Error` if the device or user isn't waiting for configuration, or if the command arrives on the wrong channel. `CommandFormatError` means the plist is malformed.
    - question: What's the difference between UserConfigured and DeviceConfigured?
      answer: |
        `DeviceConfigured` releases the device from Setup Assistant after automatic enrollment. `UserConfigured` releases a single user's setup on the user channel. For releasing devices held by Fleet's setup experience, use `DeviceConfigured`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>UserConfigured</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_UserConfigured</string>
    </dict>
    </plist>

- name: Restrictions
  platform: apple
  category: Device details
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/restrictions-command
  description: Get a list of restrictions on the device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - tvOS 9.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the Restrictions MDM command do?
      answer: |
        The `Restrictions` command asks an iPhone, iPad, Apple TV, Apple Vision Pro, or Apple Watch for the restrictions currently in effect. The response shows the combined result of every restrictions payload installed on the device.

        Set `ProfileRestrictions` to `true` to also get the restrictions broken down by profile.
    - question: When would I use the Restrictions command?
      answer: |
        Occasionally, for troubleshooting. When two profiles set the same restriction, the device applies the most restrictive value. This command shows which value actually won.
    - question: Does Fleet send the Restrictions command automatically?
      answer: |
        No. Fleet doesn't use it for any built-in feature. Fleet verifies iPhone and iPad profiles by their install acknowledgment. You can send `Restrictions` yourself as a custom MDM command.
    - question: How do I run the Restrictions command with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=restrictions.xml`, or base64-encode it and send it with the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's read-only and available in Fleet Free.
    - question: Does the Restrictions command work on macOS?
      answer: |
        No. Apple doesn't support it on macOS. To check restriction settings on a Mac, use a `ProfileList` command or an osquery report.
    - question: How do I read the Restrictions command results?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. When the status is `Acknowledged`, the result contains a `GlobalRestrictions` dictionary with the effective values. If you set `ProfileRestrictions`, it also includes a `ProfileRestrictions` dictionary keyed by profile identifier.
    - question: What errors can the Restrictions command return?
      answer: |
        Errors are uncommon because the command is read-only. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ProfileRestrictions</key>
            <false/>
            <key>RequestType</key>
            <string>Restrictions</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_Restrictions</string>
    </dict>
    </plist>

- name: Erase device
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/erase-device-command
  description: Remotely and immediately erase a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the EraseDevice MDM command do?
      answer: |
        `EraseDevice` remotely wipes an Apple device and returns it to factory settings. All user data, settings, and apps are erased, and the device is no longer managed until it enrolls again.

        This can't be undone. Make sure you target the right host before you send it.
    - question: How often is EraseDevice used?
      answer: |
        Rarely, and on purpose. Teams send it when a device is lost or stolen, or to prepare a device for a new user. It's not part of routine management.
    - question: Which Fleet features use EraseDevice?
      answer: |
        The **Wipe** action does. In Fleet Premium, go to **Host details**, click **Actions**, then **Wipe**. Fleet sends `EraseDevice` to Macs, iPhones, and iPads and shows a "Wipe pending" badge until the device acknowledges it. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: Is EraseDevice available in Fleet Free?
      answer: |
        No. The **Wipe** action and running `EraseDevice` as a custom command both require Fleet Premium.
    - question: How do I send EraseDevice as a custom command in Fleet?
      answer: |
        In Fleet Premium, save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=erase-device.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        Use a custom command when you need options the **Wipe** action doesn't set, like `PreserveDataPlan` or `DisallowProximitySetup` on iPhone and iPad.
    - question: What should I know before wiping a device?
      answer: |
        - Activation Lock still applies after the wipe, so a locked device may ask for the previous user's Apple Account.
        - Wiping cancels the host's upcoming activities in Fleet.
        - Wait for the wipe to finish before you delete the host, or Fleet can't confirm it completed.
        - If the host is assigned to Fleet in Apple Business, it re-enrolls after setup.
    - question: How do I know if EraseDevice worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device accepted the command and started erasing. In Fleet, the host's badge changes from "Wipe pending" to "Wiped".
    - question: What errors can EraseDevice return?
      answer: |
        An `Error` usually means the device can't be erased by MDM in its current state. For example, iPhones and iPads enrolled with User Enrollment (personally owned) always reject `EraseDevice`. Older Intel Macs may also reject the command if a required `PIN` is missing. `CommandFormatError` means the plist is malformed.
    - question: Does EraseDevice work on personally owned iPhones?
      answer: |
        No. Apple doesn't allow MDM to erase devices enrolled with User Enrollment. Only company-owned devices, enrolled through automatic enrollment or device enrollment, can be wiped.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>DisallowProximitySetup</key>
            <false/>
            <key>PreserveDataPlan</key>
            <true/>
            <key>RequestType</key>
            <string>EraseDevice</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_EraseDevice</string>
    </dict>
    </plist>

- name: Device lock
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/device-lock-command
  description: Remotely and immediately lock a device.
  supportedDeviceTypes:
    - iOS 4.0+
    - iPadOS 4.0+
    - macOS 10.7+
    - visionOS 2.0+
    - watchOS 10.0+
  faq:
    - question: What does the DeviceLock MDM command do?
      answer: |
        `DeviceLock` immediately locks an Apple device. On iPhone and iPad, it locks the screen and the user unlocks with their passcode. On a Mac, it restarts the computer to a lock screen that requires a six-digit `PIN` to unlock.

        You can add a `Message` and `PhoneNumber` to show on the lock screen.
    - question: How often is DeviceLock used?
      answer: |
        Rarely. It's an incident-response command for lost, stolen, or compromised devices, or when someone leaves the organization.
    - question: Which Fleet features use DeviceLock?
      answer: |
        The **Lock** action for Macs uses it. In Fleet Premium, go to **Host details**, click **Actions**, then **Lock**. Fleet generates a random six-digit PIN, which you can view in Fleet when you unlock the host.

        For iPhone and iPad, Fleet's **Lock** action uses Lost Mode (`EnableLostMode`) instead, which only works on supervised devices. See [Lock and wipe hosts](https://fleetdm.com/guides/lock-wipe-hosts).
    - question: Is DeviceLock available in Fleet Free?
      answer: |
        No. The **Lock** action and running `DeviceLock` as a custom command both require Fleet Premium.
    - question: How do I send DeviceLock as a custom command in Fleet?
      answer: |
        In Fleet Premium, save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=device-lock.xml`, or use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API.

        For Macs, add a six-digit `PIN` to the payload and store it somewhere safe. Fleet doesn't know a PIN you set in a custom command, so it can't show it to you later.
    - question: What happens if I lose the PIN for a locked Mac?
      answer: |
        The Mac stays locked. Without the PIN, recovery usually requires Apple support and proof of ownership. When you use Fleet's **Lock** action, Fleet stores the PIN for you, which is why the built-in action is the safer option.
    - question: How do I know if DeviceLock worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device locked. In Fleet, the host's badge changes from "Lock pending" to "Locked". A Mac shows the lock screen after it restarts.
    - question: What errors can DeviceLock return?
      answer: |
        On a Mac, an `Error` often means the `PIN` is missing or isn't six digits. iPhones and iPads enrolled with User Enrollment always reject `DeviceLock`. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
    - question: What's the difference between DeviceLock and Lost Mode?
      answer: |
        `DeviceLock` locks the screen, and on iPhone and iPad the user can unlock with their passcode. Lost Mode (`EnableLostMode`) keeps a supervised iPhone or iPad locked until the MDM disables it, and lets you request the device's location. Fleet uses Lost Mode for iPhone and iPad locks.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Message</key>
            <string>Lock Message</string>
            <key>PhoneNumber</key>
            <string>408-555-5555</string>
            <key>RequestType</key>
            <string>DeviceLock</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_DeviceLock</string>
    </dict>
    </plist>

- name: Restart device
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/restart-device-command
  description: Remotely and immediately restart a device.
  supportedDeviceTypes:
    - iOS 10.3+
    - iPadOS 10.3+
    - macOS 10.13+
    - tvOS 10.2+
  faq:
    - question: What does the RestartDevice MDM command do?
      answer: |
        `RestartDevice` restarts an Apple device remotely. By default, the restart happens immediately, without asking the user.

        On macOS 11.3 or later, set `NotifyUser` to `true` to prompt the user to restart instead of forcing it.
    - question: How often is RestartDevice used?
      answer: |
        Occasionally. Admins send it to finish an update, apply a setting that needs a restart, or recover an unresponsive device. It isn't part of routine check-ins.
    - question: Does Fleet send RestartDevice automatically?
      answer: |
        No. Fleet doesn't send `RestartDevice` for any built-in feature, and there's no **Restart** action in the Fleet UI for Apple hosts. Send it as a custom MDM command. The [MDM commands guide](https://fleetdm.com/guides/mdm-commands) uses it as its example.
    - question: How do I restart a Mac, iPhone, or iPad with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=restart-device.xml`. To restart several hosts, pass a comma-separated list to `--hosts`. You can also use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's available in Fleet Free.
    - question: Does RestartDevice require a supervised device?
      answer: |
        On iPhone and iPad, yes. Unsupervised iOS and iPadOS devices reject the command. Macs don't need to be supervised.
    - question: Will the user lose unsaved work?
      answer: |
        They can. A forced restart doesn't wait for the user to save. On macOS 11.3 or later, set `NotifyUser` so the user can choose when to restart.
    - question: How do I know if RestartDevice worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device accepted the command and is restarting. On a Mac, the host's uptime in Fleet resets after fleetd reports in again.
    - question: What errors can RestartDevice return?
      answer: |
        The most common `Error` is sending it to an unsupervised iPhone or iPad. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>RestartDevice</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RestartDevice</string>
    </dict>
    </plist>

- name: Shut down device
  platform: apple
  category: Device state
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/shut-down-device-command
  description: Remotely and immediately shut down a device.
  supportedDeviceTypes:
    - iOS 10.3+
    - iPadOS 10.3+
    - macOS 10.13+
  faq:
    - question: What does the ShutDownDevice MDM command do?
      answer: |
        `ShutDownDevice` powers off a Mac, iPhone, or iPad remotely and immediately. The user doesn't get a prompt to save their work.

        The device stays off until someone turns it on again.
    - question: How often is ShutDownDevice used?
      answer: |
        Rarely. Teams use it for things like powering down devices before a move, or turning off a compromised device. Most organizations prefer a restart or lock.
    - question: Does Fleet send ShutDownDevice automatically?
      answer: |
        No. Fleet doesn't send `ShutDownDevice` for any built-in feature, and there's no shutdown action in the Fleet UI. You can send it as a custom MDM command.
    - question: How do I shut down a device with Fleet?
      answer: |
        Save the payload and run `fleetctl mdm run-command --hosts=<hostname> --payload=shut-down-device.xml`, or base64-encode it and use the [Run MDM command](https://fleetdm.com/docs/rest-api/rest-api#run-mdm-command) API. It's available in Fleet Free.
    - question: Can I turn a device back on with MDM after ShutDownDevice?
      answer: |
        No. MDM can't power on a device. After it shuts down, the host stays offline in Fleet and won't receive commands until someone powers it on.
    - question: Does ShutDownDevice require a supervised device?
      answer: |
        On iPhone and iPad, yes. Unsupervised iOS and iPadOS devices reject the command. Macs don't need to be supervised.
    - question: How do I know if ShutDownDevice worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device accepted the command. The host then goes offline in Fleet.
    - question: What errors can ShutDownDevice return?
      answer: |
        Most errors come from sending it to an unsupervised iPhone or iPad. `CommandFormatError` means the plist is malformed. If the device is offline, the command stays `Pending` until it checks in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ShutDownDevice</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ShutDownDevice</string>
    </dict>
    </plist>

- name: Install application
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-application-command
  description: Install a third-party app on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 10.9+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the InstallApplication MDM command do?
      answer: |
        `InstallApplication` tells an Apple device to install an app and, optionally, manage it. You identify the app with an `iTunesStoreID` (App Store app), an `Identifier` (bundle ID), or a `ManifestURL` (in-house .ipa app hosted on your server).

        Optional keys control how the app is managed. `ManagementFlags` set to `1` removes the app when MDM is removed, `ChangeManagementState` takes over an app the user already installed, and `Configuration` delivers managed app configuration on iOS and iPadOS.
    - question: How often is InstallApplication used?
      answer: |
        Often. It's the standard way every Apple MDM installs App Store and in-house apps on iPhone, iPad, and Mac. Every app install, retry, and update of a managed App Store app starts with this command.
    - question: Does Fleet send InstallApplication automatically?
      answer: |
        Yes. Fleet sends `InstallApplication` when you install an [App Store (VPP) app](https://fleetdm.com/guides/install-app-store-apps) on macOS, iOS, or iPadOS, and when you install an in-house .ipa app on iOS or iPadOS. That includes installs from **Host details**, self-service, policy automations, and setup experience.

        For VPP apps, Fleet first assigns the license through Apple Business, then sends the command with the app's `iTunesStoreID`. For .ipa apps, Fleet sends a `ManifestURL` that points back to Fleet. On iOS and iPadOS, Fleet sets `ManagementFlags` to `1` so the app is removed when MDM is turned off.
    - question: How do I run InstallApplication with Fleet?
      answer: |
        In most cases, add the app to Fleet and install it from **Host details** instead. That handles licensing, retries, and verification for you.

        To send it as a custom command, save the plist with the `iTunesStoreID` or `ManifestURL` and run `fleetctl mdm run-command --hosts=<hostname> --payload=install-app.xml`, or base64-encode it and call `POST /api/v1/fleet/commands/run`. For App Store apps, the device must already have a license for the app, or the install fails. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: Does InstallApplication prompt the end user?
      answer: |
        It depends on the device. On supervised iPhones and iPads with a device-assigned license, the install is silent. On unsupervised or personal (BYOD) devices, the user is asked to approve the install.

        Taking over an app the user already installed works the same way. Company-owned hosts convert silently, while BYOD and manually enrolled hosts prompt the user, who can decline.
    - question: How do I know if InstallApplication worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the device accepted the command and queued the install, not that the app is installed yet. The response usually includes a `State` such as `Queued`, `Installing`, or `Managed`.

        To confirm the app is present, check the host's software inventory or send `InstalledApplicationList`. Fleet does this for you after its own installs and marks the install as verified or failed.
    - question: What errors can InstallApplication return?
      answer: |
        Common failures include a missing license for the app, an app that requires a newer OS than the device runs, and an app the user already installed on a BYOD device. Fleet's guide notes that an `ErrorCode` of 301 with "Invalid Status Code" usually means the app's minimum OS version is higher than the host's.

        An "already installed" error (`MCMDMErrorDomain` 12042) is treated as success by Fleet on company-owned hosts. On personal hosts, Fleet fails the install, since Apple won't let MDM manage an app the user installed. `NotNow` means the device is busy or locked and will retry later.
    - question: What's the difference between InstallApplication and InstallEnterpriseApplication?
      answer: |
        `InstallApplication` installs App Store apps and iOS/iPadOS .ipa apps, and works across iOS, iPadOS, macOS, and other Apple platforms. `InstallEnterpriseApplication` is macOS only and installs a signed distribution package (.pkg), such as a bootstrap package or Fleet's agent.
    - question: Is InstallApplication available in Fleet Free?
      answer: |
        You can send `InstallApplication` as a custom MDM command in Fleet Free. Fleet's built-in App Store app and software install features are part of Fleet Premium.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagementFlags</key>
            <integer>0</integer>
            <key>ManifestURL</key>
            <string>https://yourmdmhost.example.com/files/myenterpriseapp.plist</string>
            <key>RequestType</key>
            <string>InstallApplication</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstallApplication</string>
    </dict>
    </plist>

- name: Install enterprise application
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-enterprise-application-command
  description: Install an enterprise app on a device.
  supportedDeviceTypes:
    - macOS 10.13.6+
  faq:
    - question: What does the InstallEnterpriseApplication MDM command do?
      answer: |
        `InstallEnterpriseApplication` tells a Mac to download and install a signed distribution package (.pkg) from a URL. You point to the package with a `ManifestURL` (a manifest plist describing the package) or an embedded `Manifest` dictionary. The package installs silently as root.
    - question: How often is InstallEnterpriseApplication used?
      answer: |
        Mostly during enrollment. MDMs use it to install their agent and the organization's bootstrap package right after a Mac enrolls. Outside of setup, it's less common, since most teams install software with an agent instead.
    - question: Does Fleet send InstallEnterpriseApplication automatically?
      answer: |
        Yes. Fleet uses it in two places on macOS:

        - Installing Fleet's agent (fleetd) after a Mac turns on MDM, unless you deploy a custom agent.
        - Installing your [bootstrap package](https://fleetdm.com/guides/setup-experience#bootstrap-package) during automatic enrollment, and optionally during manual enrollment or migration.

        Custom packages you add under **Software** are installed by fleetd, not by this command.
    - question: How do I run InstallEnterpriseApplication with Fleet?
      answer: |
        Host your package and a manifest plist on an HTTPS server the Mac can reach. Put the manifest URL in the `ManifestURL` key, then run `fleetctl mdm run-command --hosts=<hostname> --payload=install-pkg.xml`. You can also base64-encode the plist and call `POST /api/v1/fleet/commands/run`. See the [MDM commands guide](https://fleetdm.com/guides/mdm-commands).
    - question: What package requirements does InstallEnterpriseApplication have?
      answer: |
        Apple requires a distribution package (product archive), not a component package, and it must be signed with a Developer ID Installer certificate. Fleet's [setup experience guide](https://fleetdm.com/guides/setup-experience#bootstrap-package) covers how to build and sign one. The manifest must include the package URL and a hash that matches the file.
    - question: How do I know if InstallEnterpriseApplication worked?
      answer: |
        Check `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the Mac accepted the command and started the download. It doesn't prove the package's postinstall scripts succeeded.

        To confirm, check the host's software inventory, run a report for the installed app or receipt (for example, the `package_receipts` table), or check `/var/log/install.log` on the Mac.
    - question: What errors can InstallEnterpriseApplication return?
      answer: |
        Typical failures are an unreachable or expired `ManifestURL`, a hash mismatch between the manifest and the package, an unsigned or component package, and a TLS problem when `PinningRevocationCheckRequired` is on. These come back as `Error` with an `ErrorChain` that describes the download or validation failure.
    - question: Does InstallEnterpriseApplication work on iPhone or iPad?
      answer: |
        No. It's macOS only. To install in-house apps on iOS or iPadOS, use `InstallApplication` with a `ManifestURL` that points to an .ipa manifest.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManifestURL</key>
            <string>https://yourmdmhost.example.com/files/myenterpriseapp.plist</string>
            <key>PinningRevocationCheckRequired</key>
            <false/>
            <key>RequestType</key>
            <string>InstallEnterpriseApplication</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstallEnterpriseApplication</string>
    </dict>
    </plist>

- name: Installed application list
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/installed-application-list-command
  description: Get a list of the installed apps on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 10.7+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the InstalledApplicationList MDM command do?
      answer: |
        `InstalledApplicationList` asks an Apple device for its installed apps. Each entry includes the bundle `Identifier`, `Name`, `ShortVersion`, `Version`, and size. Set `ManagedAppsOnly` to `true` to return only apps installed by MDM, or pass `Identifiers` to ask about specific apps.
    - question: How often is InstalledApplicationList used?
      answer: |
        Constantly. It's how MDMs collect software inventory from iPhones and iPads, which can't run an agent. Most MDMs send it on a regular schedule and after every app install.
    - question: Does Fleet send InstalledApplicationList automatically?
      answer: |
        Yes. Fleet sends it to iOS and iPadOS hosts about once an hour to refresh software inventory, and when you click **Refetch** on **Host details**. On personal (BYOD) hosts, Fleet asks for managed apps only.

        Fleet also sends it after App Store and in-house app installs to verify the app is present. On macOS, Fleet collects software inventory with fleetd instead.
    - question: How do I run InstalledApplicationList with Fleet?
      answer: |
        Save the sample plist, choose `ManagedAppsOnly` `true` or `false`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=installed-apps.xml`. Then read the app list with `fleetctl get mdm-command-results --id=<command-uuid>`. You can also use `POST /api/v1/fleet/commands/run` with a base64-encoded payload.
    - question: Why does InstalledApplicationList show fewer apps on BYOD devices?
      answer: |
        Apple limits what MDM can see on personal devices. With User Enrollment, the device returns only apps installed by MDM, no matter what you set `ManagedAppsOnly` to. That's a privacy protection, not a Fleet setting.
    - question: How do I know if InstalledApplicationList worked?
      answer: |
        The result is `Acknowledged` and the response contains an `InstalledApplicationList` array. Read it with `fleetctl get mdm-command-results --id=<command-uuid>` or `GET /api/v1/fleet/commands/results?command_uuid=<uuid>`. Results for commands you run yourself are kept for 30 days by default.
    - question: What errors can InstalledApplicationList return?
      answer: |
        This command rarely fails. The usual issues are `NotNow`, when the device is locked or busy and will answer later, and a host that's offline and never checks in. A `CommandFormatError` means the plist is malformed, for example a typo in a key name.
    - question: What's the difference between InstalledApplicationList and ManagedApplicationList?
      answer: |
        `InstalledApplicationList` reports what's on the device, with names and versions. `ManagedApplicationList` reports the management status of each MDM app, such as `Managed`, `PromptingForManagement`, or `ManagementRejected`. Use the second one to find out whether MDM actually controls an app.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>ManagedAppsOnly</key>
            <true/>
            <key>RequestType</key>
            <string>InstalledApplicationList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstalledApplicationList</string>
    </dict>
    </plist>

- name: Managed application list
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-list-command
  description: Get the status of all managed apps on a device.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ManagedApplicationList MDM command do?
      answer: |
        `ManagedApplicationList` returns the status of each app MDM has installed or tried to manage. For every bundle ID, the device reports a `Status` (for example `Managed`, `Installing`, `PromptingForManagement`, `ManagementRejected`, or `Failed`), its `ManagementFlags`, and whether it has configuration or feedback. You can pass `Identifiers` to limit the list.
    - question: How often is ManagedApplicationList used?
      answer: |
        Occasionally. Some MDMs use it to track app installs, but many rely on `InstalledApplicationList` instead. It's most useful for troubleshooting why an app isn't behaving as managed.
    - question: Does Fleet send ManagedApplicationList automatically?
      answer: |
        No. Fleet verifies installs with `InstalledApplicationList`. Fleet's [App Store apps guide](https://fleetdm.com/guides/install-app-store-apps) recommends sending `ManagedApplicationList` as a custom command to confirm whether an iOS or iPadOS app is really managed.
    - question: How do I run ManagedApplicationList with Fleet?
      answer: |
        Save the sample plist and run `fleetctl mdm run-command --hosts=<hostname> --payload=managed-apps.xml`. No other keys are required. Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I tell if an end user declined app management?
      answer: |
        Send `ManagedApplicationList` and look at the app's `Status`. `ManagementRejected` means the user declined the prompt, and `PromptingForManagement` means they haven't answered yet.

        This matters because Fleet can't yet detect a declined prompt from `InstalledApplicationList`. If the user declined, install the app again from **Host details** to prompt them again.
    - question: How do I know if ManagedApplicationList worked?
      answer: |
        The result shows `Acknowledged` and includes a dictionary keyed by bundle ID. An empty result means MDM manages no apps on that device.
    - question: What errors can ManagedApplicationList return?
      answer: |
        Errors are rare. Expect `NotNow` if the device is locked or busy, and `CommandFormatError` if the plist is malformed. On macOS, the command needs macOS 11 or later.
    - question: Does ManagedApplicationList work on macOS?
      answer: |
        Yes, on macOS 11 and later. It's most useful on iPhone and iPad, where app management state changes when users accept or decline prompts.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ManagedApplicationList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationList</string>
    </dict>
    </plist>

- name: Remove application
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/remove-application-command
  description: Remove an app.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the RemoveApplication MDM command do?
      answer: |
        `RemoveApplication` uninstalls a managed app from an Apple device. You pass the app's bundle ID in the `Identifier` key. The app and its data are removed.
    - question: How often is RemoveApplication used?
      answer: |
        Occasionally. Admins use it to pull an app that's no longer approved, or to clean up after a license is reclaimed. It's less common than installs.
    - question: Does Fleet send RemoveApplication automatically?
      answer: |
        No. Fleet doesn't currently send `RemoveApplication` for Apple hosts, and App Store (VPP) apps can't be uninstalled from the Fleet UI. You can send it yourself as a custom MDM command.

        Apps installed by Fleet on iOS and iPadOS are also removed automatically when the host turns MDM off, because Fleet installs them with `ManagementFlags` set to `1`.
    - question: How do I run RemoveApplication with Fleet?
      answer: |
        Set `Identifier` to the app's bundle ID, for example `com.acme.myenterpriseapp`, and run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-app.xml`. You can also use `POST /api/v1/fleet/commands/run` with a base64-encoded plist. Find bundle IDs in the host's software inventory.
    - question: Can RemoveApplication remove apps the user installed?
      answer: |
        No. It only removes apps that MDM manages. To remove a user-installed app, first take over management with `InstallApplication`, which prompts on unsupervised devices, then send `RemoveApplication`.
    - question: Does removing an App Store app free up the VPP license?
      answer: |
        No. Removing the app doesn't revoke the license in Apple Business. Fleet's [App Store apps guide](https://fleetdm.com/guides/install-app-store-apps) links to a script you can use to revoke licenses.
    - question: How do I know if RemoveApplication worked?
      answer: |
        Check `fleetctl get mdm-command-results --id=<command-uuid>` for `Acknowledged`. Then confirm the app is gone from the host's software inventory, or send `InstalledApplicationList`.
    - question: What errors can RemoveApplication return?
      answer: |
        The most common error is that the app isn't managed or isn't installed, which returns `Error` with a message saying the app couldn't be found. Also expect `NotNow` when the device is busy, and `CommandFormatError` for a malformed plist.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifier</key>
            <string>com.acme.myenterpriseapp</string>
            <key>RequestType</key>
            <string>RemoveApplication</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_RemoveApplication</string>
    </dict>
    </plist>

- name: Apply redemption code
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/apply-redemption-code-command
  description: Remove an app.
  supportedDeviceTypes:
    - iOS 5.0+
    - iPadOS 5.0+
  faq:
    - question: What does the ApplyRedemptionCode MDM command do?
      answer: |
        `ApplyRedemptionCode` gives an iPhone or iPad a redemption code for a paid app that MDM is installing. You pass the app's `Identifier` and the `RedemptionCode`. The device uses the code to buy and install the app.
    - question: When do I need ApplyRedemptionCode?
      answer: |
        Only when an install is waiting for a code. If `ManagedApplicationList` shows an app in the `NeedsRedemption` state, send this command with a valid code to finish the install.
    - question: How often is ApplyRedemptionCode used?
      answer: |
        Rarely. Redemption codes are a legacy way to distribute paid apps. Most organizations now assign licenses through Apple Business (Apps and Books), which doesn't need codes.
    - question: Does Fleet send ApplyRedemptionCode automatically?
      answer: |
        No. Fleet installs App Store apps with licenses from Apple Business, so it doesn't use redemption codes. You can send this command yourself as a custom MDM command.
    - question: How do I run ApplyRedemptionCode with Fleet?
      answer: |
        Fill in `Identifier` and `RedemptionCode` in the sample plist, then run `fleetctl mdm run-command --hosts=<hostname> --payload=redeem.xml`. You can also base64-encode it and call `POST /api/v1/fleet/commands/run`. Each code works once, so target one host per code.
    - question: How do I know if ApplyRedemptionCode worked?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows `Acknowledged` when the device accepts the code. Then check that the app moves out of `NeedsRedemption` with `ManagedApplicationList`, and appears in the host's software inventory.
    - question: What errors can ApplyRedemptionCode return?
      answer: |
        Expect errors when the code was already used, is for a different app, or there's no pending install for that `Identifier`. A `CommandFormatError` means the plist is malformed.
    - question: Does ApplyRedemptionCode work on macOS?
      answer: |
        No. It's supported on iOS and iPadOS only.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifier</key>
            <string>com.example.app</string>
            <key>RedemptionCode</key>
            <string>SB56LT7YX8RH</string>
            <key>RequestType</key>
            <string>ApplyRedemptionCode</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ApplyRedemptionCode</string>
    </dict>
    </plist>

- name: Validate applications
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/validate-applications-command
  description: Force validation of developer and universal provisioning profiles for enterprise apps.
  supportedDeviceTypes:
    - iOS 9.2+
    - iPadOS 9.2+
    - tvOS 10.2+
    - visionOS 1.1+
  faq:
    - question: What does the ValidateApplications MDM command do?
      answer: |
        `ValidateApplications` tells an iPhone or iPad to check the provisioning profiles of its in-house (enterprise) apps with Apple right away. You can pass `Identifiers` to validate specific apps, or omit them to validate all.
    - question: Why would I need ValidateApplications?
      answer: |
        iOS periodically checks that in-house apps are still trusted. If a device can't complete that check, for example on a network that blocks Apple's servers, the app may stop launching. Sending this command forces the check so the app keeps working.
    - question: How often is ValidateApplications used?
      answer: |
        Rarely. It's only relevant if you deploy in-house apps signed with an enterprise or developer certificate. App Store apps don't need it.
    - question: Does Fleet send ValidateApplications automatically?
      answer: |
        No. Fleet installs in-house .ipa apps with `InstallApplication`, but doesn't send `ValidateApplications`. You can send it as a custom MDM command.
    - question: How do I run ValidateApplications with Fleet?
      answer: |
        Run `fleetctl mdm run-command --hosts=<hostname> --payload=validate-apps.xml` with the sample plist. Add an `Identifiers` array if you only want to validate certain apps. Make sure the device can reach Apple's servers.
    - question: How do I know if ValidateApplications worked?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows `Acknowledged` when the device accepted the request. The best evidence is that the in-house app launches without a trust warning.
    - question: What errors can ValidateApplications return?
      answer: |
        The command itself rarely errors. If validation still fails, check that the signing certificate and provisioning profile haven't expired or been revoked, and that the device has network access to Apple. Expect `NotNow` if the device is locked.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ValidateApplications</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ValidateApplications</string>
    </dict>
    </plist>

- name: Managed application attributes
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-attributes-command
  description: Query attributes in managed apps on a device.
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ManagedApplicationAttributes MDM command do?
      answer: |
        `ManagedApplicationAttributes` asks a device for the attributes set on its managed apps. You pass bundle IDs in `Identifiers`. The response lists attributes such as a per-app VPN UUID, associated domains, and whether the app is removable.
    - question: How do I set managed app attributes instead of reading them?
      answer: |
        Attributes are set with the `Settings` command, using an `ApplicationAttributes` item. `ManagedApplicationAttributes` only reads them back so you can confirm what's applied.
    - question: How often is ManagedApplicationAttributes used?
      answer: |
        Rarely. It's mostly used to troubleshoot per-app VPN or associated domains on iPhone and iPad.
    - question: Does Fleet send ManagedApplicationAttributes automatically?
      answer: |
        No. Fleet doesn't send it. You can send it as a custom MDM command.
    - question: How do I run ManagedApplicationAttributes with Fleet?
      answer: |
        Put the app's bundle ID in the `Identifiers` array and run `fleetctl mdm run-command --hosts=<hostname> --payload=app-attributes.xml`. Read the response with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I know if ManagedApplicationAttributes worked?
      answer: |
        The result shows `Acknowledged` and an `ApplicationAttributes` array with one entry per app. An app with no attributes set returns no attribute values.
    - question: What errors can ManagedApplicationAttributes return?
      answer: |
        Expect an error or empty result if the app isn't managed by MDM. A `CommandFormatError` usually means `Identifiers` is missing or isn't an array.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifiers</key>
            <array>
                <string>com.acme.myenterpriseapp</string>
            </array>
            <key>RequestType</key>
            <string>ManagedApplicationAttributes</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationAttributes</string>
    </dict>
    </plist>

- name: Managed application configuration
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-attributes-command
  description: Get app configurations from managed apps on a device.
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - macOS 10.15+
    - tvOS 10.2+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the ManagedApplicationConfiguration MDM command do?
      answer: |
        `ManagedApplicationConfiguration` returns the managed app configuration (App Config) currently applied to managed apps. You pass bundle IDs in `Identifiers`, and the device returns each app's configuration dictionary.
    - question: How often is ManagedApplicationConfiguration used?
      answer: |
        Rarely. It's a troubleshooting command for checking that an app received the configuration you expected.
    - question: Does Fleet send ManagedApplicationConfiguration automatically?
      answer: |
        No. Fleet delivers [managed configuration](https://fleetdm.com/guides/install-app-store-apps) for iOS and iPadOS apps inside the `InstallApplication` command, but doesn't read it back. Send this command yourself to confirm what the device has.
    - question: How do I run ManagedApplicationConfiguration with Fleet?
      answer: |
        Put the app's bundle ID in `Identifiers` and run `fleetctl mdm run-command --hosts=<hostname> --payload=app-config.xml`. Read the configuration with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: Why isn't my app using the new configuration?
      answer: |
        Many apps only read configuration when they launch. Fleet's guide notes that new or updated configuration isn't applied until the end user fully quits and reopens the app. If the command shows the right values, the delivery worked and the app needs a restart.
    - question: How do I know if ManagedApplicationConfiguration worked?
      answer: |
        The result shows `Acknowledged` and an `ApplicationConfigurations` array. Each entry has the app's `Identifier` and its `Configuration`. Fleet variables are already replaced with each host's values, so you'll see the final strings.
    - question: What errors can ManagedApplicationConfiguration return?
      answer: |
        An app that isn't managed, or has no configuration, returns no configuration dictionary. A `CommandFormatError` usually means `Identifiers` is missing.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Identifiers</key>
            <array>
                <string>com.acme.myenterpriseapp</string>
            </array>
            <key>RequestType</key>
            <string>ManagedApplicationConfiguration</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationConfiguration</string>
    </dict>
    </plist>

- name: Managed application feedback
  platform: apple
  category: Managed apps
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-application-attributes-command
  description: Get app feedback from a managed app on the device.
  supportedDeviceTypes:
    - iOS 7.0+
    - iPadOS 7.0+
    - macOS 11.0+
    - tvOS 10.2+
    - visionOS 1.1+
  faq:
    - question: What does the ManagedApplicationFeedback MDM command do?
      answer: |
        `ManagedApplicationFeedback` collects feedback that managed apps have written for MDM. Apps write this data to the `com.apple.feedback` key in their managed app defaults. You pass bundle IDs in `Identifiers`, and set `DeleteFeedback` to `true` to clear the feedback after reading it.
    - question: What kind of feedback can I collect?
      answer: |
        Whatever the app's developer chooses to report, such as setup status, license state, or error details. Most apps don't write feedback at all, so check the app's documentation first.
    - question: How often is ManagedApplicationFeedback used?
      answer: |
        Rarely. It's mostly used with in-house apps built to report status back to MDM.
    - question: Does Fleet send ManagedApplicationFeedback automatically?
      answer: |
        No. Fleet doesn't send it. You can send it as a custom MDM command.
    - question: How do I run ManagedApplicationFeedback with Fleet?
      answer: |
        Add the app's bundle ID to `Identifiers`, choose a `DeleteFeedback` value, and run `fleetctl mdm run-command --hosts=<hostname> --payload=app-feedback.xml`. Read the feedback with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I know if ManagedApplicationFeedback worked?
      answer: |
        The result shows `Acknowledged` and a `ManagedApplicationFeedback` array. An app that hasn't written feedback returns an entry with no feedback dictionary.
    - question: What errors can ManagedApplicationFeedback return?
      answer: |
        Errors are rare. An app that isn't managed returns no feedback. A `CommandFormatError` means the plist is malformed, often because `Identifiers` isn't an array.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>DeleteFeedback</key>
            <false/>
            <key>Identifiers</key>
            <array>
                <string>com.acme.myenterpriseapp</string>
            </array>
            <key>RequestType</key>
            <string>ManagedApplicationFeedback</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedApplicationFeedback</string>
    </dict>
    </plist>


- name: Install media
  platform: apple
  category: Managed media
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/install-media-command
  description: Install a book on a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
    - macOS 10.19+
  faq:
    - question: What does the InstallMedia MDM command do?
      answer: |
        `InstallMedia` installs a book, such as a PDF or ePub, on an Apple device as managed media. It appears in the Books app. You provide a `MediaURL` and a `PersistentID` for your own files, or an `iTunesStoreID` for a store book. `Title`, `Author`, and `Version` describe it.
    - question: How often is InstallMedia used?
      answer: |
        Rarely. It's used to push handbooks, training material, or manuals to iPhones and iPads. Most teams share documents through other apps instead.
    - question: Does Fleet send InstallMedia automatically?
      answer: |
        No. Fleet doesn't send `InstallMedia`. You can send it as a custom MDM command.
    - question: How do I run InstallMedia with Fleet?
      answer: |
        Host the file on an HTTPS server the device can reach, then fill in `MediaURL`, `PersistentID`, `Kind`, and `Title` in the sample plist. Run `fleetctl mdm run-command --hosts=<hostname> --payload=install-book.xml`. Use the same `PersistentID` later to update or remove the book.
    - question: Will the end user see the book?
      answer: |
        Yes. The book appears in the Books app. Managed books are removed when the device turns MDM off.
    - question: How do I know if InstallMedia worked?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows `Acknowledged` when the device accepts the command. To confirm the book installed, send `ManagedMediaList` and check its `State`.
    - question: What errors can InstallMedia return?
      answer: |
        Common causes are a `MediaURL` the device can't download, an unsupported file type, or a missing `PersistentID`. Store books also need a license assigned to the device or user.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>Author</key>
            <string>Acme, Inc.</string>
            <key>Kind</key>
            <string>pdf</string>
            <key>MediaType</key>
            <string>Book</string>
            <key>MediaURL</key>
            <string>https://yourmdmhost.example.com/files/myenterprisebook.pdf</string>
            <key>PersistentID</key>
            <string>com.acme.pdf.myenterprisebook</string>
            <key>RequestType</key>
            <string>InstallMedia</string>
            <key>Title</key>
            <string>My Enterprise Book</string>
            <key>Version</key>
            <string>1.0</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_InstallMedia</string>
    </dict>
    </plist>

- name: List managed media
  platform: apple
  category: Managed media
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-media-list-command
  description: Get a list of the managed books on a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
  faq:
    - question: What does the ManagedMediaList MDM command do?
      answer: |
        `ManagedMediaList` returns the books MDM has installed on an iPhone or iPad. Each entry includes the `PersistentID` (or `iTunesStoreID`), `Title`, `Author`, `Version`, `Kind`, and install `State`.
    - question: How often is ManagedMediaList used?
      answer: |
        Rarely. It's only useful if you distribute books with `InstallMedia`.
    - question: Does Fleet send ManagedMediaList automatically?
      answer: |
        No. Fleet doesn't send it. You can send it as a custom MDM command.
    - question: How do I run ManagedMediaList with Fleet?
      answer: |
        No extra keys are needed. Run `fleetctl mdm run-command --hosts=<hostname> --payload=list-books.xml` with the sample plist, then read the list with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: How do I know if ManagedMediaList worked?
      answer: |
        The result shows `Acknowledged` and a `Books` array. An empty array means no managed books are on the device. Books the user added themselves aren't listed.
    - question: What errors can ManagedMediaList return?
      answer: |
        This command rarely fails. Expect `NotNow` if the device is locked or busy, and `CommandFormatError` if the plist is malformed.
    - question: Does ManagedMediaList work on macOS?
      answer: |
        Apple documents it for iOS and iPadOS. Use it on iPhone and iPad.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>ManagedMediaList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_ManagedMediaList</string>
    </dict>
    </plist>

- name: Remove media
  platform: apple
  category: Managed media
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/managed-media-list-command
  description: Remove a previously installed book from a device.
  supportedDeviceTypes:
    - iOS 8.0+
    - iPadOS 8.0+
  faq:
    - question: What does the RemoveMedia MDM command do?
      answer: |
        `RemoveMedia` deletes a managed book from an iPhone or iPad. You set `MediaType` to `Book` and identify it with the `PersistentID` (or `iTunesStoreID`) used when it was installed.
    - question: How often is RemoveMedia used?
      answer: |
        Rarely. It's used to pull outdated documents you distributed with `InstallMedia`.
    - question: Does Fleet send RemoveMedia automatically?
      answer: |
        No. Fleet doesn't send it. You can send it as a custom MDM command.
    - question: How do I run RemoveMedia with Fleet?
      answer: |
        Put `MediaType`, `PersistentID`, and `RequestType` inside a `Command` dictionary, the same structure as other Apple MDM commands. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=remove-book.xml`. If these keys sit at the top level of the plist, Fleet can't decode the command.
    - question: Can RemoveMedia delete books the user added?
      answer: |
        No. It only removes managed books installed by MDM.
    - question: How do I know if RemoveMedia worked?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows `Acknowledged`. Then send `ManagedMediaList` to confirm the book is gone.
    - question: What errors can RemoveMedia return?
      answer: |
        Expect an error if the `PersistentID` doesn't match a managed book on the device. A `CommandFormatError` means the plist is malformed, often because the `Command` dictionary is missing.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>MediaType</key>
        <string>Book</string>
        <key>PersistentID</key>
        <string>com.acme.pdf.myenterprisebook</string>
        <key>RequestType</key>
        <string>RemoveMedia</string>
    </dict>
    </plist>

- name: Account configuration
  platform: apple
  category: Accounts
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/account-configuration-command
  description: Create and configure a local administrator account on a device.
  supportedDeviceTypes:
    - macOS 10.11+
  faq:
    - question: What does the AccountConfiguration MDM command do?
      answer: |
        `AccountConfiguration` tells a Mac in Setup Assistant how to create its local accounts. It can create hidden admin accounts (`AutoSetupAdminAccounts`), prefill and lock the user's account name and full name, make the user a standard account (`SetPrimarySetupAccountAsRegularUser`), or skip creating the user account (`SkipPrimarySetupAccountCreation`).
    - question: When can I send AccountConfiguration?
      answer: |
        Only during automatic enrollment (ADE), while the Mac waits in Setup Assistant for MDM to finish. After setup completes, the command has no effect. That's why changes to these settings only apply to Macs that are wiped and set up again.
    - question: How often is AccountConfiguration used?
      answer: |
        Routinely during setup. Many MDMs send it to every Mac that enrolls through Apple Business, but only once per setup.
    - question: Does Fleet send AccountConfiguration automatically?
      answer: |
        Yes, during macOS [setup experience](https://fleetdm.com/guides/setup-experience) for hosts that enroll through Apple Business. Fleet sends it when you turn on:

        - End user authentication, to fill in the account name and full name from your IdP, locked if `lock_end_user_info` is on.
        - The [managed local account](https://fleetdm.com/guides/setup-experience#managed-local-account), which creates the hidden `_fleetadmin` account with a unique password.
        - An end user account type of **Standard** or **Skip (no account)**.
    - question: Can I run AccountConfiguration as a custom command with Fleet?
      answer: |
        You can send it with `fleetctl mdm run-command`, but it only works on a Mac that's still in Setup Assistant awaiting configuration. In practice, use Fleet's setup experience settings instead. Fleet sends the command at the right time and stores the managed account password.
    - question: What format does the passwordHash need?
      answer: |
        A SALTED-SHA512-PBKDF2 hash, wrapped in a plist and base64-encoded into the `passwordHash` data field. A plain-text password won't work. Fleet generates this hash for you when it creates the managed local account.
    - question: How do I know if AccountConfiguration worked?
      answer: |
        `fleetctl get mdm-command-results --id=<command-uuid>` shows `Acknowledged`. On the Mac, the admin account exists after setup (hidden accounts don't appear at the login window), and the user's account name matches what you sent. In Fleet, **Host details > Actions > Show managed account** shows the managed account password.
    - question: What errors can AccountConfiguration return?
      answer: |
        The most common problem is timing: sending it outside Setup Assistant means nothing is created. Other failures come from an invalid `passwordHash` or a malformed plist (`CommandFormatError`). If the Mac restarts during setup, the IdP name fields may not be filled in.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>AutoSetupAdminAccounts</key>
            <array>
                <dict>
                    <key>fullName</key>
                    <string>Administrator</string>
                    <key>hidden</key>
                    <false/>
                    <key>shortName</key>
                    <string>admin</string>
