- name: NSExtensions mappings
  platform: apple
  category: Extensions
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/nsextension-mappings-command
  description: Get a list of the installed extensions for a user on a device.
  supportedDeviceTypes:
    - macOS 10.13+
  faq:
    - question: What does the NSExtensionMappings MDM command do?
      answer: |
        It lists every app extension installed for a user on a Mac. Each entry in the `NSExtensionMappings` response includes the extension's `Identifier`, `DisplayName`, and `ExtensionPoint`, along with the user's name and ID.
    - question: How often is NSExtensionMappings used?
      answer: |
        Rarely. It's a special-purpose inventory command, mostly used to find extensions before allowing or blocking them with a configuration profile.
    - question: Does Fleet send NSExtensionMappings automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature.
    - question: Can I run NSExtensionMappings with Fleet?
      answer: |
        Not effectively. Apple only accepts `NSExtensionMappings` on the user channel, and Fleet's custom MDM commands are sent on the device channel. The Mac returns an error if you send it with `fleetctl mdm run-command`.

        To inventory extensions across Macs, write a Fleet report with osquery instead. See the [osquery table docs](https://fleetdm.com/tables).
    - question: Does NSExtensionMappings require a supervised Mac?
      answer: |
        Yes. Apple requires supervision, the user channel, and the `QueryInstalledApps` access right. It isn't available in user enrollment.
    - question: Why does NSExtensionMappings list extensions the user can't use?
      answer: |
        It returns every installed extension, including ones the system never turns on because of restrictions. To see only extensions in use, Apple provides `ActiveNSExtensions`.
    - question: What's the difference between NSExtensionMappings and ActiveNSExtensions?
      answer: |
        `NSExtensionMappings` is the full list of installed extensions for a user. `ActiveNSExtensions` is the subset the user has turned on, with more detail like path and version.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>NSExtensionMappings</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_NSExtensionMappings</string>
    </dict>
    </plist>

- name: List users
  platform: apple
  category: User management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/user-list-command
  description: Get a list of users with active accounts on a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
    - macOS 10.13+
  faq:
    - question: What does the UserList MDM command do?
      answer: |
        It lists user accounts on a device. Each entry in the `UserList` response includes the `UserName`, whether the user `IsLoggedIn`, whether they have data waiting to sync (`HasDataToSync`), and storage quota and usage.

        On iPad, it's used with Shared iPad to see which users have accounts cached on the device.
    - question: How often is UserList used?
      answer: |
        Occasionally. It's common in Shared iPad deployments and before deleting a user. Most single-user devices don't need it.
    - question: Does Fleet send UserList automatically?
      answer: |
        No. Fleet doesn't use `UserList` for any built-in feature. For macOS, Fleet collects local user accounts with osquery and shows them on **Host details**.

        You can send `UserList` as a custom MDM command. It's available in Fleet Free and Fleet Premium.
    - question: How do I run UserList with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=user-list.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run`. Then get the list with `fleetctl get mdm-command-results --id=<command-uuid>`.
    - question: Does UserList require a supervised device?
      answer: |
        On macOS, yes. Apple requires supervision on macOS 10.13 and later. On iOS and iPadOS, Apple doesn't list supervision as a requirement, but the command is designed for Shared iPad.

        It runs on the device channel only and isn't available in user enrollment.
    - question: How do I read the UserList results?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. The result shows the `Users` array the device returned.

        Check `IsLoggedIn` and `HasDataToSync` before sending `DeleteUser`. Deleting a logged-in user, or a user with unsynced data, fails by default.
    - question: What errors can UserList return?
      answer: |
        On macOS, the most common error is that the Mac isn't supervised. A `CommandFormatError` means the plist couldn't be parsed.

        Check the `ErrorChain` in the command results for details.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>UserList</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_UserList</string>
    </dict>
    </plist>

- name: Log out user
  platform: apple
  category: User management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/log-out-user-command
  description: Force the current user to log out of a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
  faq:
    - question: What does the LogOutUser MDM command do?
      answer: |
        It signs the current user out of a Shared iPad. The `LogOutUser` request type has no options and ends the active user session so the next person can sign in.
    - question: How often is LogOutUser used?
      answer: |
        Occasionally, in Shared iPad deployments like classrooms, labs, and shift-based work. It isn't used on single-user iPhones or iPads.
    - question: Does Fleet send LogOutUser automatically?
      answer: |
        No. Fleet doesn't use this command for any built-in feature.

        You can send it as a custom MDM command to iPadOS hosts enrolled in Fleet with MDM turned on. It's available in Fleet Free and Fleet Premium.
    - question: How do I run LogOutUser with Fleet?
      answer: |
        The command has no options. Save the sample payload as a file and run `fleetctl mdm run-command --hosts=<hostname> --payload=log-out-user.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run`. You can target many iPads at once, for example at the end of a class period.
    - question: Does LogOutUser work on a Mac?
      answer: |
        No. Apple only supports `LogOutUser` on iOS and iPadOS, on the device channel. To log users out of a Mac, use a script instead.
    - question: Why don't other commands run right after LogOutUser?
      answer: |
        Per Apple, MDM commands aren't available on the device for up to 2 minutes after a user is logged out. Commands sent during that window stay `Pending` and run once the device is ready.

        If you plan to send `DeleteUser` next, wait for the device to check in again.
    - question: How do I know LogOutUser worked?
      answer: |
        Run `fleetctl get mdm-command-results --id=<command-uuid>`. `Acknowledged` means the iPad logged out the user. The iPad also returns to its sign-in screen.

        An `Error` status usually means the device isn't a Shared iPad or no user was logged in. A `CommandFormatError` means the plist couldn't be parsed.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>LogOutUser</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LogOutUser</string>
    </dict>
    </plist>

- name: Delete user
  platform: apple
  category: User management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/log-out-user-command
  description: Delete a user’s account from a device.
  supportedDeviceTypes:
    - iOS 9.3+
    - ipadOS 9.3+
    - macOS 10.13+
  faq:
    - question: What does the DeleteUser MDM command do?
      answer: |
        It deletes a user account and its data from a device. The `DeleteUser` request takes a `UserName`, and an optional `ForceDeletion` boolean that deletes the user even if they have data waiting to sync.

        On iPad, it removes cached users from a Shared iPad. On macOS, it removes a local user account.
    - question: Is the sample payload on this page correct?
      answer: |
        Use `DeleteUser`, not `LogOutUser`, as the `RequestType`. A working payload sets `RequestType` to `DeleteUser`, sets `UserName` to the account to delete, and optionally sets `ForceDeletion` to `true`.

        See [Apple's Delete User command reference](https://developer.apple.com/documentation/devicemanagement/delete-user-command) for the full example.
    - question: How often is DeleteUser used?
      answer: |
        Occasionally. It's common in Shared iPad deployments to free up storage. On Macs, it's used when offboarding a user or cleaning up shared machines.
    - question: Does Fleet send DeleteUser automatically?
      answer: |
        No. Fleet doesn't delete user accounts as part of any built-in feature.

        You can send it as a custom MDM command. It's available in Fleet Free and Fleet Premium. For Macs, you can also delete users with a script. See [Delete macOS local user accounts with Fleet](https://fleetdm.com/guides/delete-macos-local-user-accounts-with-fleet).
    - question: How do I run DeleteUser with Fleet?
      answer: |
        Save a payload with `RequestType` set to `DeleteUser` and the right `UserName`, then run `fleetctl mdm run-command --hosts=<hostname> --payload=delete-user.xml`.

        Or base64-encode the file and send it to `POST /api/v1/fleet/commands/run`. Run `UserList` first to confirm the exact username.
    - question: Does DeleteUser require a supervised device?
      answer: |
        On macOS, yes. Apple requires supervision on macOS 10.13 and later. It runs on the device channel only and isn't available in user enrollment.
    - question: Is DeleteUser reversible?
      answer: |
        No. Deleting a user removes their account and local data. With `ForceDeletion` set to `true`, data that hasn't synced is lost too.

        Back up anything important before sending it.
    - question: What errors can DeleteUser return?
      answer: |
        Apple documents these error codes:

        - `12071`: the user doesn't exist.
        - `12072`: the user is logged in. Log them out first.
        - `12073`: the user has data to sync and `ForceDeletion` is false or missing.
        - `12074`: the device couldn't delete the user. On macOS, this includes trying to delete the last administrator.

        See them with `fleetctl get mdm-command-results --id=<command-uuid>`.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>RequestType</key>
            <string>LogOutUser</string>
        </dict>
        <key>CommandUUID</key>
        <string>0001_LogOutUser</string>
    </dict>
    </plist>

- name: Declarative management
  platform: apple
  category: Declarative management
  externalDocumentationUrl: https://developer.apple.com/documentation/devicemanagement/declarative-management-command
  description: Enable your server to support declarative management or trigger a declarative management synchronization operation on the device.
  supportedDeviceTypes:
    - iOS 15.0+
    - iPadOS 15.0+
    - macOS 13.0+
    - tvOS 16.0+
    - visionOS 1.1+
    - watchOS 10.0+
  faq:
    - question: What does the DeclarativeManagement MDM command do?
      answer: |
        It turns on declarative device management (DDM) on a device, or starts a DDM sync if DDM is already on. After a sync, the device fetches its declarations from the server and applies them on its own.

        An optional `Data` key can include sync tokens, so the device knows whether its declarations changed.
    - question: How often is DeclarativeManagement used?
      answer: |
        Constantly. MDM solutions that support DDM send it whenever declarations change for a device, and often right after enrollment.
    - question: Which Fleet features use DeclarativeManagement?
      answer: |
        Fleet sends it automatically whenever DDM declarations change for a host. This covers declaration (DDM) profiles you add in **Controls > OS settings > Custom settings** and macOS, iOS, and iPadOS update enforcement in **Controls > OS updates**.

        Fleet also sends it right after enrollment, so new hosts don't wait for the next sync. Learn more in [Custom OS settings](https://fleetdm.com/guides/custom-os-settings) and [Enforce OS updates](https://fleetdm.com/guides/enforce-os-updates).
    - question: Do I ever need to send DeclarativeManagement myself?
      answer: |
        Rarely. Fleet already sends it when declarations change. A manual send can help when troubleshooting a host whose declarations look out of date.

        Save a payload with `RequestType` set to `DeclarativeManagement` and no `Data` key, which is what Fleet sends. Then run `fleetctl mdm run-command --hosts=<hostname> --payload=declarative-management.xml`.
    - question: Is DeclarativeManagement available on personal (BYOD) devices?
      answer: |
        Yes. Apple allows it in user enrollment on iOS, iPadOS, macOS, and visionOS. It doesn't require supervision.

        DDM requires iOS and iPadOS 15 or later, or macOS 13 or later.
    - question: How do I know DeclarativeManagement worked?
      answer: |
        `Acknowledged` in `fleetctl get mdm-command-results --id=<command-uuid>` only means the device started a sync. To confirm declarations applied, check the profile status in **Host details > OS settings**.

        Fleet verifies macOS declarations using the device's DDM status report. Learn more in [Custom OS settings](https://fleetdm.com/guides/custom-os-settings).
    - question: What errors can DeclarativeManagement return?
      answer: |
        The command itself rarely fails. A `CommandFormatError` usually means the plist or the base64 `Data` is malformed. Errors in individual declarations show up in the device's DDM status report, not in this command's result.

        If a declaration fails, Fleet shows the profile as **Failed** in **Host details > OS settings**.
    - question: What's the difference between DeclarativeManagement and InstallProfile?
      answer: |
        `InstallProfile` pushes a single configuration profile to a device. `DeclarativeManagement` tells the device to pull its full set of declarations and apply them on its own, then report status back.

        Fleet supports both. Upload a `.mobileconfig` for a configuration profile, or a `.json` for a DDM declaration.
  command: |
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>Command</key>
        <dict>
            <key>CommandUUID</key>
            <string>0001_DeclarativeManagement</string>
            <key>Command</key>
            <dict>
                <key>RequestType</key>
                <string>DeclarativeManagement</string>
                <key>Data</key>
                <data>
                eyJTeW5jVG9rZW5zIjogeyJUaW1lc3RhbXAiOiAiMjAyMS0wNi0wMlQwMToy
                ODowMFoiLCAiRGVjbGFyYXRpb25zVG9rZW4iOiAiYjY1NDQwMjdhMzE1Y2Qw
                MDg1ZDRjZjA4MTc0NjI0YzJkMTQyNDQ0ODA0MzBhODdiMTc2YTI3MjdlNzM2
                NjEzOCJ9fQ==
                </data>
