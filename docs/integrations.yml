    description: "Duo is a multi-factor authentication (MFA) and access platform. Configure Fleet as a Duo SSO application so your team signs in with existing corporate credentials. Use Fleet's conditional access so Duo blocks sign-in from macOS, Windows, and Linux hosts that aren't managed by Fleet."
