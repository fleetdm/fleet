    url: "/integrate/idp/okta"
    category: "identity-provider"
    description: "Okta is an identity and access management (IAM) platform. Configure Fleet as an Okta SAML application so your team signs in with existing corporate credentials, reduces password sprawl, and centralizes access control. Use Fleet's conditional access so Okta blocks sign-in from macOS hosts that are failing Fleet policies."
    summary: "Sign in to Fleet with Okta, and block sign-in from macOS hosts that are failing Fleet policies."
    logo: "logo-okta-85x28@2x.png"
    vendorUrl: "https://www.okta.com/"
    docs:
      - label: "Conditional access: Okta"
        url: "/guides/okta-conditional-access-integration"
      - label: "Single sign-on (SSO) with Okta"
        url: "/docs/deploy/single-sign-on-sso#okta"
      - label: "Deploying Platform SSO with Okta and Fleet"
        url: "/guides/deploying-okta-platform-sso-with-fleet"
    redirectsFrom: ["/integrate/zta/okta"]
    source: "fleetdm.com/integrations card"
