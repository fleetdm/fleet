<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Update required</title>
<!--
  Placeholder for the real My device patch notification page, used to exercise the
  toast display mechanism without a Fleet server. Loaded by
  `FleetDesktop notify --placeholder`.

  It is also the reference for what the real page has to do to sit in this window:

    - Transparent body. The native card draws the background, rounded corners, border
      and drop shadow, so any background set here covers it — and would be the wrong
      colour in dark mode.
    - Send `ready` as soon as it has painted. The window is not shown until then, so
      the user never sees a half-rendered card. Without it, the toast still appears
      after a short grace period.
    - Send `primary` / `dismiss` when the user acts. Both close the toast.
    - Send `resize` if the content height isn't 318px.

  Deliberately no webfont link: this is a file:// page inside a security-sensitive
  binary, and reaching out to fonts.googleapis.com from it would be both an outbound
  network call and a hard dependency on connectivity. -apple-system is fine.
-->
<style>
  :root {
    color-scheme: light dark;
    /* Fleet design tokens (from Figma) — light appearance */
    --fleet-black: #192147;       /* primary text */
    --fleet-black-75: #515774;    /* secondary text */
    --fleet-black-5: #f4f4f6;     /* hairline divider */
    --fleet-green: #009a7d;
    --fleet-red: #c14328;
    --pill-red-bg: rgba(193, 67, 40, 0.10);
    --hover: rgba(0, 0, 0, 0.05);
    --radius: 20px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      /* Readable on the dark frosted material */
      --fleet-black: #f1f1f4;
      --fleet-black-75: #b9bcca;
      --fleet-black-5: rgba(255, 255, 255, 0.12);
      --fleet-green: #1aab8c;
      --fleet-red: #ff9a7e;
      --pill-red-bg: rgba(255, 154, 126, 0.16);
      --hover: rgba(255, 255, 255, 0.08);
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    /* No background — the native card behind the webview draws it. */
    background: transparent;
    color: var(--fleet-black);
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    /* No background and no border: the native card (SolidCardView) draws both, along
       with the rounded corners and drop shadow. Drawing them here too would double
       the rim and tint the card away from the system window colour. */
    border-radius: var(--radius);
  }

  .content {
    flex: 1;
    padding: 24px 24px 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* Header */
  .title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .title {
    font-size: 14px;
    font-weight: 600;
    line-height: 21px;
    color: var(--fleet-black);
  }
  .pill {
    font-size: 12px;
    font-weight: 600;
    line-height: 18px;
    color: var(--fleet-red);
    background: var(--pill-red-bg);
    padding: 5px 16px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .desc {
    font-size: 12px;
    font-weight: 400;
    line-height: 18px;
    color: var(--fleet-black-75);
  }
  .desc strong { font-weight: 600; }

  /* App rows */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .row .left { display: flex; align-items: center; gap: 12px; }
  .row .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    flex-shrink: 0;
    object-fit: cover;
  }
  .row .icon.zoom {
    background-image: linear-gradient(226deg, #3a8fea 2%, #0042bc 100%);
    padding: 8px;
  }
  .row .info { display: flex; flex-direction: column; gap: 4px; }
  .row .name {
    font-size: 12px;
    font-weight: 600;
    line-height: 18px;
    color: var(--fleet-black);
  }
  .row .version {
    font-size: 10px;
    font-weight: 400;
    line-height: 15px;
    color: var(--fleet-black-75);
  }

  /* Footer */
  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-top: 1px solid var(--fleet-black-5);
    min-height: 60px;
  }
  .brandmark { width: 24px; height: 24px; }
  .actions { display: flex; align-items: center; gap: 16px; }
  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    line-height: 20px;
    padding: 4px 8px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    background: transparent;
  }
  button.later { color: var(--fleet-black-75); }
  button.later:hover { background: var(--hover); }
  button.primary { background: var(--fleet-green); color: #fff; }
  button.primary:hover { filter: brightness(1.06); }
</style>
</head>
<body>
  <div class="card">
    <div class="content">
      <div class="header">
        <div class="title-row">
          <div class="title">Save your work 💾</div>
          <div class="pill">Placeholder</div>
        </div>
        <div class="desc">In <strong>1 hour</strong>, these apps will close to update.</div>
      </div>

      <div class="row">
        <div class="left">
          <img class="icon" src="toast-assets/globalprotect.png" alt="" />
          <div class="info"><div class="name">GlobalProtect</div><div class="version">24.2.12</div></div>
        </div>
      </div>

      <div class="row">
        <div class="left">
          <img class="icon" src="toast-assets/chrome.svg" alt="" />
          <div class="info"><div class="name">Google Chrome</div><div class="version">24.2.12</div></div>
        </div>
      </div>

      <div class="row">
        <div class="left">
          <img class="icon zoom" src="toast-assets/zoom.svg" alt="" />
          <div class="info"><div class="name">Zoom</div><div class="version">24.2.12</div></div>
        </div>
      </div>
    </div>

    <div class="footer">
      <img class="brandmark" src="toast-assets/fleet-brandmark.svg" alt="Fleet" />
      <div class="actions">
        <button class="later" id="later">Later</button>
        <button class="primary" id="update">Update now</button>
      </div>
    </div>
  </div>

<script>
  // The native side registers this handler as "fleetDesktop". Falling back to the
  // console keeps the page openable in a browser while iterating on the design.
  function send(action, payload) {
    var handler = window.webkit
      && window.webkit.messageHandlers
      && window.webkit.messageHandlers.fleetDesktop;
    if (handler) {
      handler.postMessage({ v: 1, action: action, payload: payload || {} });
    } else {
      console.log("fleetDesktop:", action, payload || {});
    }
  }

  document.getElementById("later").addEventListener("click", function () {
    send("dismiss", { reason: "later" });
  });

  document.getElementById("update").addEventListener("click", function () {
    send("primary", { id: "update_now" });
  });

  // Tell the native side we've painted, so it can show the window. Waiting for the
  // next frame means the card is actually composited rather than merely parsed.
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      send("ready");
    });
  });
</script>
</body>
</html>
