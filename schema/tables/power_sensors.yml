name: power_sensors
notes: |-
  Intel Macs return many sensors. Apple silicon Macs return only a few, including `PSTR` (System Total), which reports total system power draw in watts.
examples: |-
  See the total power usage of a Mac, in watts.

  ```
  SELECT * FROM power_sensors WHERE key='PSTR';
  ```

  See the total power usage of a Mac alongside its power source. On a Mac running on battery power, the battery's discharge rate is shown for comparison.

  ```
  SELECT
    CAST(p.value AS REAL) AS system_watts,
    b.state AS power_source,
    CASE WHEN b.amperage < 0 THEN ROUND(b.voltage / 1000.0 * -b.amperage / 1000.0, 2) END AS battery_discharge_watts
  FROM power_sensors p
  LEFT JOIN battery b
  WHERE p.key = 'PSTR';
  ```
