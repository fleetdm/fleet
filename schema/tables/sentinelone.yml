    type: text
    required: false
    platforms:
      - darwin
  - name: management_server
    description: URL of the SentinelOne management console this agent reports to.
    type: text
    required: false
    platforms:
      - darwin
      - linux
  - name: management_site_key
    description: Site key the agent enrolled with.
    type: text
    required: false
    platforms:
      - darwin
      - linux
  - name: management_last_seen
    description: Unix timestamp of the agent's last successful check-in with the management console. Empty when the reported date can't be read.
    type: text
    required: false
    platforms:
      - darwin
      - linux
  - name: management_connected
    description: Whether the agent is currently connected to the management console, `yes` or `no`.
    type: text
    required: false
    platforms:
      - darwin
      - linux
  - name: tamper_protection
    description: Whether the agent's self-protection (anti-tamper) is on, `enabled` or `disabled`. This is not the same as `protection`, which reports threat protection on macOS and Linux.
    type: text
    required: false
    platforms:
      - windows
  - name: agent_run_mode
    description: How the agent process is running, e.g. `running as PPL` for Protected Process Light.
    type: text
    required: false
    platforms:
      - windows
  - name: mitigation_policy
    description: Mitigation policy the agent is applying, e.g. `none`.
    type: text
    required: false
    platforms:
      - windows
