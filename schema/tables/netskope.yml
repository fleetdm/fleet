name: netskope
platforms:
  - darwin
  - windows
  - linux
description: |-
  The local Netskope client's state, version, and steering configuration, as reported by `nsdiag -f`.

  Netskope can enter a silently degraded state where the STAgent process and its system extensions still look healthy but traffic is no longer steered. Checks against process state or system extension presence miss this; `client_status` and `tunnel_status` do not.
evented: false
columns:
  - name: client_installed
    description: Whether a Netskope client install was found on this host (1=found, 0=not found). Always populated; when 0, the `error` column says why and the remaining columns are empty.
    required: false
    type: integer
  - name: error
    description: Why the client's state could not be read — `netskope client not installed`, an `nsdiag failed: ...` message (for example a permission failure), or `nsdiag reported no recognized fields`. Empty when the state was read successfully.
    required: false
    type: text
  - name: install_path
    description: The directory the Netskope STAgent was found in. Empty when no install was found.
    required: false
    type: text
  - name: orgname
    description: The Netskope tenant's organization name.
    required: false
    type: text
  - name: tenant_url
    description: The tenant URL this client is enrolled with, for example `company.goskope.com`.
    required: false
    type: text
  - name: addonhost
    description: The addon host endpoint the client connects to.
    required: false
    type: text
  - name: addoncheckerhost
    description: The addon checker host endpoint the client connects to.
    required: false
    type: text
  - name: gateway
    description: The hostname of the Netskope gateway traffic is steered through.
    required: false
    type: text
  - name: gateway_ip
    description: The IP address of the Netskope gateway traffic is steered through.
    required: false
    type: text
  - name: config
    description: The name of the client configuration currently applied.
    required: false
    type: text
  - name: steering_config
    description: The name of the steering configuration currently applied.
    required: false
    type: text
  - name: email
    description: The email address this client is enrolled with.
    required: false
    type: text
  - name: peruser_config
    description: Whether a per-user configuration is in effect (`TRUE`/`FALSE`).
    required: false
    type: text
  - name: tunnel_status
    description: The state of the steering tunnel, for example `NSTUNNEL_CONNECTED`. A value other than connected on a host that should be steered is the degraded state to alert on.
    required: false
    type: text
  - name: client_status
    description: The state of the client, for example `enable`.
    required: false
    type: text
  - name: dynamic_steering
    description: Whether dynamic steering is enabled (`TRUE`/`FALSE`).
    required: false
    type: text
  - name: onpremdetection
    description: The on-premises detection setting, for example `Not Configured`.
    required: false
    type: text
  - name: explicit_proxy
    description: Whether explicit proxy mode is enabled (`TRUE`/`FALSE`).
    required: false
    type: text
  - name: tunnel_protocol
    description: The protocol the steering tunnel uses, for example `TLS`.
    required: false
    type: text
  - name: sni_enable
    description: Whether SNI-based steering is enabled (`TRUE`/`FALSE`).
    required: false
    type: text
  - name: traffic_mode
    description: The traffic steering mode, for example `All Traffic`.
    required: false
    type: text
  - name: client_version
    description: The version of the installed Netskope client.
    required: false
    type: text
examples: |-
  Find hosts where the Netskope client is installed but is no longer enabled and connected — the silently degraded state.
  ```
  SELECT install_path, client_version, client_status, tunnel_status, error
  FROM netskope
  WHERE client_installed = 1
    AND NOT (client_status = 'enable' AND tunnel_status = 'NSTUNNEL_CONNECTED');
  ```
notes: |-
  This table is not a core osquery table. It is included as part of Fleet's agent
  ([fleetd](https://fleetdm.com/docs/get-started/anatomy#fleetd)).

  The table always returns exactly one row, so that "not installed", "installed but degraded", and "installed but state could not be read" stay distinguishable. Check `client_installed` and `error` before treating the remaining columns as the client's real state.

  The fields `nsdiag` reports change between Netskope releases. Fields this table does not recognize are ignored rather than failing the query, and a release that renames every field is reported through the `error` column.
