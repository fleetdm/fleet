name: cli_command
platforms:
  - macos
  - windows
  - linux
description: Allows querying devices using CLI commands.
examples: |-
  Get a host's version of a command line only tool.

  ```
  SELECT cli_command_output FROM cli_command WHERE cli_command_input = "fleetctl -version | awk 'NR==1{print $4}'";
  ```
columns:
  - name: cli_command_input
    type: text
    required: false
    description: The CLI command to execute on the device. If empty, no command is executed.
  - name: cli_command_output
    type: text
    required: false
    description: Value of the CLI command output.
notes: This table is not a core osquery table. It is included as part of Fleet's agent ([fleetd](https://fleetdm.com/docs/get-started/anatomy#fleetd)). This table does not work on Windows Server
evented: false
