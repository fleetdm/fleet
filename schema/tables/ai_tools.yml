name: ai_tools
description: |-
  Surfaces AI tools on the host: MCP servers, AI agent CLIs, AI desktop apps, IDE plugins, live AI/MCP network sockets, agent instruction files, and browser extensions. Every row is an AI tool. Type-specific extras live in a compact JSON `detail` column.
platforms:
  - darwin
  - windows
  - linux
evented: false
examples: |-
  Count AI tools per type on the host.

  ```
  SELECT type, count(*) FROM ai_tools GROUP BY type;
  ```

  List outbound AI/MCP connections to see where data is going.

  ```
  SELECT name, endpoint FROM ai_tools WHERE type = 'sockets' AND location = 'remote';
  ```

  List running MCP servers and their transport.

  ```
  SELECT name, source AS client, location, running, pid FROM ai_tools WHERE type = 'mcp_server' AND running = 1;
  ```

  Find anything carrying a security risk flag across every type.

  ```
  SELECT type, name, risk_flags, path FROM ai_tools WHERE risk_flags != '';
  ```

  List AI editor plugins with versions.

  ```
  SELECT name, identifier, version, category FROM ai_tools WHERE type = 'ide_plugins';
  ```

  List AI browser extensions and their risk flags.

  ```
  SELECT name, identifier, source, risk_flags FROM ai_tools WHERE type = 'browser_extension';
  ```

  Find AI agents that aren't recognized tools, and see what they were detected by.

  ```
  SELECT name, path, confidence, evidence FROM ai_tools WHERE type = 'agents' AND confidence < 100 ORDER BY confidence DESC;
  ```
notes: |-
  - One table covers seven kinds of AI tool, discriminated by `type`. Each column lists the types that populate it; a column that doesn't apply to a row's `type` is an empty string.
  - The extension enumerates all home directories on the host (`/Users/*`, `/home/*`, `/root`, `C:\Users\*`), not just the daemon account's. Running as root provides full visibility across all users.
  - This table is not a core osquery table. It is included as part of Fleet's agent ([fleetd](https://fleetdm.com/docs/get-started/anatomy#fleetd)).
columns:
  - name: type
    description: "Options are `mcp_server`, `ide_plugins`, `agents`, `apps`, `sockets`, `agent_instruction`, or `browser_extension`."
    type: text
    required: false
  - name: name
    description: Server, plugin, agent, app, process, or instruction-file name. Populated for all types.
    type: text
    required: false
  - name: identifier
    description: "Unique identifier varying by type: MCP server name, plugin ID (`publisher.name`), agent binary, bundle ID, socket service, or instruction tool. Populated for all types."
    type: text
    required: false
  - name: category
    description: "Classification bucket (e.g. `coding-assistant`, `agent-runtime`, `inference-api-local`, `mcp-remote-egress`, `ai-api-egress`, `mcp-server`, `agent-instruction`). Populated for all types except `apps`."
    type: text
    required: false
  - name: location
    description: "`local` or `remote`. Populated for all types."
    type: text
    required: false
  - name: source
    description: "Provenance: MCP client, editor, install method, platform source, socket direction, or instruction tool. Populated for all types."
    type: text
    required: false
  - name: version
    description: Version of the tool, if available. Populated for `ide_plugins`, `agents`, `apps`, and `browser_extension`.
    type: text
    required: false
  - name: path
    description: Config, install, binary, app, process, or instruction-file path. Populated for all types.
    type: text
    required: false
  - name: endpoint
    description: Remote MCP URL or socket remote `addr:port`. Populated for `mcp_server` and `sockets`.
    type: text
    required: false
  - name: running
    description: Whether the tool is currently running (1 = yes, 0 = no). Populated for `mcp_server`, `agents`, `apps`, and `sockets` (always 1 for `sockets`).
    type: integer
    required: false
  - name: pid
    description: Process ID if the tool is running. Populated for `mcp_server`, `agents`, `apps`, and `sockets`.
    type: integer
    required: false
  - name: port
    description: "Listening port, API port, or local port (varies by type). Populated for `mcp_server`, `apps`, and `sockets`."
    type: integer
    required: false
  - name: risk_flags
    description: "Comma-separated security risk tokens (empty string = none). Populated for `mcp_server`, `agents`, `agent_instruction`, and `browser_extension`. Possible values: `remote_fetch_exec`, `unpinned_dependency`, `mcp_shell_exec`, `mcp_fs_write`, `plaintext_secret`, `world_readable_config`, `cleartext_endpoint`, `bypass_permissions`, `auto_accept_edits`, `skip_permissions_runtime`, `injection_markers`, `hidden_unicode`, `world_writable`, `broad_host_permissions`, `sideloaded_unverified`."
    type: text
    required: false
  - name: sha256
    description: SHA-256 content hash of the primary artifact (config file, binary, or instruction file) for change detection and threat-intel matching. Populated for all types except `ide_plugins` and `sockets`.
    type: text
    required: false
  - name: confidence
    description: "Detection confidence from 0 to 100. Populated for `agents`. [Known agents](https://github.com/fleetdm/fleet/blob/main/orbit/pkg/table/ai_tools/internal/agents/agents.go) always score 100. Everything else is scored from the `evidence` tokens by [weighted signal family](https://github.com/fleetdm/fleet/blob/main/orbit/pkg/table/ai_tools/internal/evidence/score.go), and a row is only reported once the score clears the emit threshold."
    type: integer
    required: false
  - name: evidence
    description: "Comma-separated tokens naming the signals behind the detection — the proof Fleet used to decide this is an agent and not a folder named `claude`. Populated for `agents`. Possible values: `catalog`, `running`, `binary`, `tool_home`, `workspace_shape`, `workspace_shape_weak`, `mcp_config`, `instructions`, and `framework:<name>` (for example `framework:crewai`)."
    type: text
    required: false
  - name: uid
    description: User ID of the owner. Populated for all types except `apps` and `sockets`.
    type: text
    required: false
  - name: username
    description: Username of the owner. Populated for all types except `apps`.
    type: text
    required: false
  - name: detail
    description: "Compact JSON with type-specific extras (empty fields omitted). Populated for all types. Examples: `transport`, `command`, `args`, `env_keys`, `capabilities`, `launch_hash`, `permission_mode`, `markers`, `scope`, `publisher`, `editor_family`, `runtime`, `protocol`, `remote_host`, `cmdline`."
    type: text
    required: false
