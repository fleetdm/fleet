# Small things admins do to single hosts from the host page.
kind: action
id: W-UNINSTALL-01
feature: software
title: Uninstall a Fleet-managed package from a host
verb: software.uninstall
with: {tries: 10}
rate: {start: 20/day, profile: activity.uninstalled_software}
curve: business_hours
check:
  request: {status: ok, took: "<= 2s"}
