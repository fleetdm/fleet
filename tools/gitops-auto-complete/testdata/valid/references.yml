# File-reference forms that must validate: path on section values and packages, and
# path/paths (a single glob string) on policies, labels, reports, yara_rules,
# app_store_apps, and fleet_maintained_apps.
org_settings:
  yara_rules:
    - path: ../lib/yara/rule.yar
policies:
  - path: ../lib/policies/one.yml
  - paths: "../lib/policies/*.yml"
labels:
  - paths: "../lib/labels/*.yml"
reports:
  - path: ../lib/reports/one.yml
software:
  packages:
    - path: ../lib/software/pkg.yml
  app_store_apps:
    - path: ../lib/software/apps.yml
  fleet_maintained_apps:
    - paths: "../lib/software/fma-*.yml"
