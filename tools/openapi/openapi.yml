  /api/v1/fleet/reports:
    get:
      summary: List reports
      description: Returns a list of reports. To see each report's data, use the [get report data](#get-report-data) endpoint.
      operationId: listReports
      tags:
        - Reports
      parameters:
        - name: order_key
          in: query
          description: What to order results by. Can be any column in the reports table.
          schema:
            type: string
        - name: order_direction
          in: query
          description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.'
          schema:
            type: string
        - name: fleet_id
          in: query
          description: _Available in Fleet Premium_. The ID of the fleet for the reports to be listed. When omitted, returns global reports.
          schema:
            type: integer
        - name: query
          in: query
          description: Search query keywords. Searchable fields include `name`.
          schema:
            type: string
        - name: merge_inherited
          in: query
          description: _Available in Fleet Premium_. If `true`, will include global reports in addition to fleet-level reports when filtering by `fleet_id`. (If no `fleet_id` is provided, this parameter is ignored.)
          schema:
            type: boolean
        - name: platform
          in: query
          description: 'Return reports that are scheduled to run on this platform. One of: `"macos"`, `"windows"`, `"linux"` (case-insensitive). (Since reports cannot be scheduled to run on `"chrome"` hosts, it''s not a valid value here)'
