  /api/v1/fleet/software/titles:
    get:
      summary: List software
      description: Get a list of all software.
      operationId: listSoftware
      tags:
        - Software
      parameters:
        - name: page
          in: query
          description: Page number of the results to fetch.
          schema:
            type: integer
        - name: per_page
          in: query
          description: Results per page.
          schema:
            type: integer
        - name: order_key
          in: query
          description: What to order results by. Allowed fields are `name` and `hosts_count`. Default is `hosts_count` (descending).
          schema:
            type: string
        - name: order_direction
          in: query
          description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.'
          schema:
            type: string
        - name: query
          in: query
          description: Search query keywords. Searchable fields include `title` and `cve`.
          schema:
            type: string
        - name: fleet_id
          in: query
          description: _Available in Fleet Premium_. Filters the software to only include the software installed on the hosts that are assigned to the specified fleet. Use `0` to filter by "Unassigned" hosts.
          schema:
            type: integer
        - name: vulnerable
          in: query
          description: If true or 1, only list software that has detected vulnerabilities. Default is `false`.
          schema:
            type: boolean
        - name: available_for_install
          in: query
          description: If `true` or `1`, only list software that is available for install (added by the user). Default is `false`.
          schema:
            type: boolean
        - name: self_service
          in: query
          description: If `true` or `1`, only lists self-service software. Default is `false`.
          schema:
            type: boolean
        - name: packages_only
          in: query
          description: _Available in Fleet Premium_. If `true` or `1`, only lists packages available for install (without app store apps).
          schema:
            type: boolean
        - name: min_cvss_score
          in: query
          description: _Available in Fleet Premium_. Filters to include only software with vulnerabilities that have a CVSS version 3.x base score higher than the specified value.
          schema:
            type: integer
        - name: max_cvss_score
          in: query
          description: _Available in Fleet Premium_. Filters to only include software with vulnerabilities that have a CVSS version 3.x base score lower than what's specified.
          schema:
            type: integer
        - name: exploit
          in: query
          description: '_Available in Fleet Premium_. If `true`, filters to only include software with vulnerabilities that have been actively exploited in the wild (`cisa_known_exploit: true`). Default is `false`.'
          schema:
            type: boolean
        - name: platform
          in: query
          description: 'Filters software titles available for install by platforms. `fleet_id` must be specified to filter by platform. Options are: `"macos"` (alias of `"darwin"`), `"darwin"` `"windows"`, `"linux"`, `"chrome"`, `"ios"`, `"ipados"`. To show titles from multiple platforms, separate the platforms with commas (e.g. `?platform=darwin,windows`).'
          schema:
            type: string
        - name: hash_sha256
          in: query
          description: Filters to only include custom software packages (uploaded installers) with the specified SHA-256 hash. `fleet_id` must be specified to filter by hash. This allows checking if a specific package already exists before uploading.
          schema:
            type: string
        - name: package_name
          in: query
          description: Filters to only include custom software packages (uploaded installers) with the specified package filename. `fleet_id` must be specified to filter by package name. This allows checking if a specific package already exists before uploading.
          schema:
            type: string
        - name: exclude_fleet_maintained_apps
          in: query
          description: If `true` or `1`, Fleet maintained apps will not be included in the list of `software_titles`. Default is `false`
          schema:
            type: boolean
        - name: after
          in: query
          description: The value to get results after. This needs `order_key` defined, as that's the column that would be used.
          schema:
            type: string
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  count:
                    type: integer
                  counts_updated_at:
                    format: date-time
                    type: string
                  meta:
                    properties:
                      has_next_results:
                        type: boolean
