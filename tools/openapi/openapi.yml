                  description: The query's description.
                  type: string
                discard_data:
                  description: 'Whether to skip saving the latest results for each host. If set to `true`, data is still sent to the configured log destination if `automations_enabled`. Default: `false`.'
                  type: boolean
                fleet_id:
                  description: _Available in Fleet Premium_. The fleet to which the new report should be added. If omitted, the report will be global.
                  type: integer
                interval:
                  description: 'The amount of time, in seconds, the report waits before running. Can be set to `0` to never run. Default: 0.'
                  type: integer
                labels_include_all:
                  description: _Available in Fleet Premium_. Labels, specified by label name, to target with this report. If specified, the report will run on hosts that match **all of these** labels.
                  items:
                    type: string
                  type: array
                labels_include_any:
                  description: _Available in Fleet Premium_. Labels, specified by label name, to target with this report. If specified, the report will run on hosts that match **any of these** labels.
                  items:
                    type: string
                  type: array
                logging:
                  description: 'The type of log output for this report. Valid values: `"snapshot"`(default), `"differential"`, or `"differential_ignore_removals"`.'
                  type: string
                min_osquery_version:
                  description: The minimum required osqueryd version installed on a host. If omitted, all osqueryd versions are acceptable.
                  type: string
                name:
                  description: '**Required**. The name of the report.'
                  type: string
                observer_can_run:
                  description: Whether or not users with the `observer` role can run the report as a live report. This field is only relevant for the `observer` role. The `observer_plus` role can run any report and is not limited by this flag.
                  type: boolean
                platform:
                  description: The OS platforms where this report will run (other platforms ignored). Comma-separated string. If omitted, runs on all compatible platforms.
                  type: string
                query:
                  description: '**Required**. The SQL query for collecting report data.'
                  type: string
              required:
                - name
