openapi: 3.1.0
info:
  title: Fleet REST API (pilot)
  description: Pilot OpenAPI specification generated from Fleet's canonical REST API reference (docs/REST API/rest-api.md). Covers a subset of endpoints. The Markdown reference remains the source of truth.
  version: main
servers:
  - url: https://fleet.example.com
    description: Your Fleet server URL.
tags:
  - name: Commands
  - name: Fleets
  - name: Hosts
  - name: Policies
  - name: Reports
  - name: Software
paths:
  /api/v1/fleet/commands:
    get:
      summary: List MDM commands
      description: This endpoint returns the list of custom MDM commands that have been executed.
      operationId: listMDMCommands
      tags:
        - Commands
      parameters:
        - name: host_identifier
          in: query
          description: '**Required.** The host''s `hostname`, `uuid`, or `hardware_serial`. Returns only commands that target the specified host. Omitting `host_identifier` is deprecated (see the deprecation notice below). Requests w/o it continue to work for backward compatibility but are not recommended; the underlying query is not performant at scale and may time out on large fleets. Support will be removed in Fleet 5.'
          schema:
            type: string
        - name: page
          in: query
          description: Page number of the results to fetch. Maximum is `100`.
          schema:
            type: integer
        - name: per_page
          in: query
          description: Results per page. Default is `10`. Maximum is 1,000 records.
          schema:
            type: integer
        - name: order_key
          in: query
          description: 'What to order results by. Allowed values: `host_uuid`, `command_uuid`, `status`, `updated_at`, `request_type`, `hostname`. Default is `updated_at`.'
          schema:
            type: string
        - name: order_direction
          in: query
          description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.'
          schema:
            type: string
        - name: request_type
          in: query
          description: The request type to filter commands by.
          schema:
            type: string
        - name: command_status
          in: query
          description: 'Comma-separated string of one of the following options: ''ran'', ''pending'', or ''failed''.'
          schema:
            type: string
        - name: after
          in: query
          description: The value to get results after. This needs `order_key` defined, as that's the column that would be used.
          schema:
            type: string
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  count: {}
                  meta:
                    properties:
                      has_next_results:
                        type: boolean
                      has_previous_results:
                        type: boolean
                    type: object
                  results:
                    items:
                      properties:
                        command_status:
                          type: string
                        command_uuid:
                          type: string
                        host_uuid:
                          type: string
                        hostname:
                          type: string
                        name: {}
                        request_type:
                          type: string
                        status:
                          type: string
                        updated_at:
                          format: date-time
                          type: string
                      type: object
                    type: array
                type: object
              example:
                count: null
                meta:
                  has_next_results: true
                  has_previous_results: false
                results:
                  - command_status: ran
                    command_uuid: a3650ec9-6dd0-40e9-b5d8-feffe9939461
                    host_uuid: A1B2C3D4-E5F6-7890-1234-567890ABCDEF
                    hostname: Mac-mini.local
                    name: null
                    request_type: DeclarativeManagement
                    status: Acknowledged
                    updated_at: "2026-03-20T19:45:27Z"
                  - command_status: failed
                    command_uuid: 97ceaa39-eadc-4953-98a8-2ffe72ab120d
                    host_uuid: A1B2C3D4-E5F6-7890-1234-567890ABCDEF
                    hostname: Mac-mini.local
                    name: null
                    request_type: InstallProfile
                    status: Error
                    updated_at: "2026-03-24T21:37:32Z"
  /api/v1/fleet/commands/run:
    post:
      summary: Run MDM command
      description: This endpoint tells Fleet to run a custom MDM command on the targeted macOS, iOS, iPadOS, or Windows hosts the next time they come online.
      operationId: runMDMCommand
      tags:
        - Commands
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                command:
                  description: A Base64 encoded MDM command as described in [Apple's documentation](https://developer.apple.com/documentation/devicemanagement/commands_and_queries) or [Windows's documentation](https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-mdm/0353f3d6-dbe2-42b6-b8d5-50db9333bba4). Supported formats are standard and raw (unpadded). You can paste your Base64 code to the [online decoder](https://devpal.co/base64-decode/) to check if you're using the valid format.
                  type: string
                host_uuids:
                  description: An array of host UUIDs enrolled in Fleet on which the command should run.
                  items:
                    type: string
                  type: array
              type: object
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  command_uuid:
                    type: string
                  request_type:
                    type: string
                type: object
              example:
                command_uuid: a2064cef-0000-1234-afb9-283e3c1d487e
                request_type: ProfileList
  /api/v1/fleet/fleets:
    get:
      summary: List fleets
      description: _Available in Fleet Premium_
      operationId: listFleets
      tags:
        - Fleets
      parameters:
        - name: page
          in: query
          description: Page number of the results to fetch.
          schema:
            type: integer
        - name: per_page
          in: query
          description: Results per page.
          schema:
            type: integer
        - name: order_key
          in: query
          description: What to order results by. Can be any column in the `fleets` table.
          schema:
            type: string
        - name: order_direction
          in: query
          description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.'
          schema:
            type: string
        - name: query
          in: query
          description: Search query keywords. Searchable fields include `name`.
          schema:
            type: string
        - name: after
          in: query
          description: The value to get results after. This needs `order_key` defined, as that's the column that would be used.
          schema:
            type: string
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  fleets:
                    items:
                      properties:
                        agent_options:
                          properties:
                            command_line_flags:
                              properties: {}
                              type: object
                            config:
                              properties:
                                decorators:
                                  properties:
                                    load:
                                      items:
                                        type: string
                                      type: array
                                  type: object
                                options:
                                  properties:
                                    disable_distributed:
                                      type: boolean
                                    distributed_interval:
                                      type: integer
                                    distributed_plugin:
                                      type: string
                                    distributed_tls_max_attempts:
                                      type: integer
                                    logger_tls_endpoint:
                                      type: string
                                    logger_tls_period:
                                      type: integer
                                    pack_delimiter:
                                      type: string
                                  type: object
                              type: object
                            overrides:
                              properties: {}
                              type: object
                          type: object
                        created_at:
                          format: date-time
                          type: string
                        description:
                          type: string
                        host_count:
                          type: integer
                        id:
                          type: integer
                        name:
                          type: string
                        secrets:
                          items:
                            properties:
                              created_at:
                                format: date-time
                                type: string
                              secret:
                                type: string
                              team_id:
                                type: integer
                            type: object
                          type: array
                        user_count:
                          type: integer
                      type: object
                    type: array
                type: object
              example:
                fleets:
                  - agent_options:
                      command_line_flags: {}
                      config:
                        decorators:
                          load:
                            - SELECT uuid AS host_uuid FROM system_info;
                            - SELECT hostname AS hostname FROM system_info;
                        options:
                          disable_distributed: false
                          distributed_interval: 10
                          distributed_plugin: tls
                          distributed_tls_max_attempts: 3
                          logger_tls_endpoint: /api/v1/osquery/log
                          logger_tls_period: 10
                          pack_delimiter: /
                      overrides: {}
                    created_at: "2021-07-28T15:58:21Z"
                    description: ""
                    host_count: 0
                    id: 1
                    name: workstations
                    secrets:
                      - created_at: "2021-07-28T15:58:21Z"
                        secret: ""
                        team_id: 10
                    user_count: 0
                  - agent_options:
                      host_count: 0
                      secrets:
                        - created_at: "2021-08-05T21:41:42Z"
                          secret: +ncixtnZB+IE0OrbrkCLeul3U8LMVITd
                          team_id: 15
                      spec:
                        command_line_flags: {}
                        config:
                          decorators:
                            load:
                              - SELECT uuid AS host_uuid FROM system_info;
                              - SELECT hostname AS hostname FROM system_info;
                          options:
                            disable_distributed: false
                            distributed_interval: 10
                            distributed_plugin: tls
                            distributed_tls_max_attempts: 3
                            logger_tls_endpoint: /api/v1/osquery/log
                            logger_tls_period: 10
                            pack_delimiter: /
                        overrides: {}
                      user_count: 0
                    created_at: "2021-08-05T21:41:42Z"
                    description: ""
                    id: 2
                    name: servers
  /api/v1/fleet/global/policies:
    get:
      summary: List policies
      operationId: listPolicies
      tags:
        - Policies
      parameters:
        - name: page
          in: query
          description: Page number of the results to fetch.
          schema:
            type: integer
        - name: per_page
          in: query
          description: Results per page.
          schema:
            type: integer
        - name: order_key
          in: query
          description: What to order results by. Allowed fields are `id`, `name`, `team_id`, `created_at`, `updated_at`, `failing_host_count`, and `passing_host_count`.
          schema:
            type: string
        - name: order_direction
          in: query
          description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.'
          schema:
            type: string
        - name: after
          in: query
          description: The value to get results after. This needs `order_key` defined, as that's the column that would be used.
          schema:
            type: string
        - name: platform
          in: query
          description: Filters policies by targeted platform. Accepts `"darwin"`, `"windows"`, `"linux"`, or `"chrome"`. Policies that target all platforms (empty `platform` field) are always included.
          schema:
            type: string
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  policies:
                    items:
                      properties:
                        author_email:
                          type: string
                        author_id:
                          type: integer
                        author_name:
                          type: string
                        created_at:
                          format: date-time
                          type: string
                        critical:
                          type: boolean
                        description:
                          type: string
                        failing_host_count:
                          type: integer
                        host_count_updated_at:
                          format: date-time
                          type: string
                        id:
                          type: integer
                        labels_include_any:
                          items:
                            type: string
                          type: array
                        name:
                          type: string
                        passing_host_count:
                          type: integer
                        platform:
                          type: string
                        query:
                          type: string
                        resolution:
                          type: string
                        team_id: {}
                        updated_at:
                          format: date-time
                          type: string
                      type: object
                    type: array
                type: object
              example:
                policies:
                  - author_email: john@example.com
                    author_id: 42
                    author_name: John
                    created_at: "2021-12-15T15:23:57Z"
                    critical: false
                    description: Checks if gatekeeper is enabled on macOS devices
                    failing_host_count: 300
                    host_count_updated_at: "2023-12-20T15:23:57Z"
                    id: 1
                    labels_include_any:
                      - Macs on Sonoma
                    name: Gatekeeper enabled
                    passing_host_count: 2000
                    platform: darwin
                    query: SELECT 1 FROM gatekeeper WHERE assessments_enabled = 1;
                    resolution: Resolution steps
                    team_id: null
                    updated_at: "2021-12-15T15:23:57Z"
                  - author_email: alice@example.com
                    author_id: 43
                    author_name: Alice
                    created_at: "2021-12-31T14:52:27Z"
                    critical: true
                    description: Checks if the hard disk is encrypted on Windows devices
                    failing_host_count: 0
                    host_count_updated_at: "2023-12-20T15:23:57Z"
                    id: 2
                    labels_exclude_any:
                      - Compliance exclusions
                      - Workstations (Canary)
                    name: Windows machines with encrypted hard disks
                    passing_host_count: 2300
                    platform: windows
                    query: SELECT 1 FROM bitlocker_info WHERE protection_status = 1;
                    resolution: Resolution steps
                    team_id: null
                    updated_at: "2022-02-10T20:59:35Z"
    post:
      summary: Create policy
      operationId: createPolicy
      tags:
        - Policies
      requestBody:
        required: false
        content:
          application/json:
            schema:
              properties:
                critical:
                  description: _Available in Fleet Premium_. Mark policy as critical/high impact.
                  type: boolean
                description:
                  description: The policy's description.
                  type: string
                labels_exclude_all:
                  description: _Available in Fleet Premium_. Labels, specified by label name, to target with this policy. If specified, the policy will **not** run on hosts that match **all of these** labels.
                  items:
                    type: string
                  type: array
                labels_exclude_any:
                  description: _Available in Fleet Premium_. Labels, specified by label name, to target with this policy. If specified, the policy will **not** run on hosts that match **any of these** labels.
                  items:
                    type: string
                  type: array
                labels_include_all:
                  description: _Available in Fleet Premium_. Labels, specified by label name, to target with this policy. If specified, the policy will run on hosts that match **all of these** labels.
                  items:
                    type: string
                  type: array
                labels_include_any:
                  description: _Available in Fleet Premium_. Labels, specified by label name, to target with this policy. If specified, the policy will run on hosts that match **any of these** labels.
                  items:
                    type: string
                  type: array
                name:
                  description: The policy's name.
                  type: string
                platform:
                  description: Comma-separated target platforms, currently supported values are "windows", "linux", "darwin". The default, an empty string means target all platforms.
                  type: string
                query:
                  description: The policy's query in SQL.
                  type: string
                resolution:
                  description: The resolution steps for the policy.
                  type: string
              type: object
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  policy:
                    properties:
                      author_email:
                        type: string
                      author_id:
                        type: integer
                      author_name:
                        type: string
                      created_at:
                        format: date-time
                        type: string
                      critical:
                        type: boolean
                      description:
                        type: string
                      failing_host_count:
                        type: integer
                      host_count_updated_at: {}
                      id:
                        type: integer
                      labels_include_any:
                        items:
                          type: string
                        type: array
                      name:
                        type: string
                      passing_host_count:
                        type: integer
                      platform:
                        type: string
                      query:
                        type: string
                      resolution:
                        type: string
                      team_id: {}
                      updated_at:
                        format: date-time
                        type: string
                    type: object
                type: object
              example:
                policy:
                  author_email: john@example.com
                  author_id: 42
                  author_name: John
                  created_at: "2022-03-17T20:15:55Z"
                  critical: true
                  description: Checks if gatekeeper is enabled on macOS devices
                  failing_host_count: 0
                  host_count_updated_at: null
                  id: 43
                  labels_include_any:
                    - Macs on Sonoma
                  name: Gatekeeper enabled
                  passing_host_count: 0
                  platform: darwin
                  query: SELECT 1 FROM gatekeeper WHERE assessments_enabled = 1;
                  resolution: Resolution steps
                  team_id: null
                  updated_at: "2022-03-17T20:15:55Z"
  /api/v1/fleet/hosts:
    get:
      summary: List hosts
      operationId: listHosts
      tags:
        - Hosts
      parameters:
        - name: page
          in: query
          description: Page number of the results to fetch.
          schema:
            type: integer
        - name: per_page
          in: query
          description: Results per page.
          schema:
            type: integer
        - name: order_key
          in: query
          description: What to order results by. Can be any column in the hosts table.
          schema:
            type: string
        - name: after
          in: query
          description: The value to get results after. This needs `order_key` defined, as that's the column that would be used. **Note:** Use `page` instead of `after`
          schema:
            type: string
        - name: order_direction
          in: query
          description: '**Requires `order_key`**. The direction of the order given the order key. Options include `"asc"` and `"desc"`. Default is `"asc"`.'
          schema:
            type: string
        - name: status
          in: query
          description: Indicates the status of the hosts to return. Can either be 'new', 'online', 'offline', 'mia' or 'missing'.
          schema:
            type: string
        - name: query
          in: query
          description: Search query keywords. Searchable fields include `hostname`, `hardware_serial`, `uuid`, `ipv4`, and end user email addresses.
          schema:
            type: string
        - name: additional_info_filters
          in: query
          description: A comma-delimited list of fields to include in each host's `additional` object. This query is populated by the `additional_queries` in the `features` section of the configuration YAML.
          schema:
            type: string
        - name: fleet_id
          in: query
          description: _Available in Fleet Premium_. Filters to only include hosts in the specified fleet. Use `0` to filter by "Unassigned" hosts.
          schema:
            type: integer
        - name: policy_id
          in: query
          description: The ID of the policy to filter hosts by.
          schema:
            type: integer
        - name: policy_response
          in: query
          description: '**Requires `policy_id`**. Valid options are ''passing'' or ''failing''.'
          schema:
            type: string
        - name: software_version_id
          in: query
          description: The ID of the software version to filter hosts by.
          schema:
            type: integer
        - name: software_title_id
          in: query
          description: The ID of the software title to filter hosts by.
          schema:
            type: integer
        - name: software_status
          in: query
          description: 'The status of the software install to filter hosts by. One of: `pending_install`, `failed_install`, `installed`, `pending_uninstall`, `failed_uninstall`, `pending`, or `failed`. Mutually exclusive with `software_version_id`, and must be supplied if `software_title_id` is set.'
          schema:
            type: string
        - name: os_version_id
          in: query
          description: The ID of the operating system version to filter hosts by.
          schema:
            type: integer
        - name: os_name
          in: query
          description: The name of the operating system to filter hosts by. `os_version` must also be specified with `os_name`. See note below for filtering Windows hosts.
          schema:
            type: string
        - name: os_version
          in: query
          description: The version of the operating system to filter hosts by. `os_name` must also be specified with `os_version`. See note below for filtering Windows hosts.
          schema:
            type: string
        - name: vulnerability
          in: query
          description: The cve to filter hosts by (including "cve-" prefix, case-insensitive).
          schema:
            type: string
        - name: device_mapping
          in: query
          description: Indicates whether `device_mapping` should be included for each host.
          schema:
            type: boolean
        - name: mdm_id
          in: query
          description: The ID of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts that use a specific MDM provider and URL).
          schema:
            type: integer
        - name: mdm_name
          in: query
          description: The name of the _mobile device management_ (MDM) solution to filter hosts by (that is, filter hosts that use a specific MDM provider).
          schema:
            type: string
        - name: mdm_enrollment_status
          in: query
          description: The _mobile device management_ (MDM) enrollment status to filter hosts by. Valid options are 'manual', 'manual-personal', 'automatic', 'enrolled', 'pending', or 'unenrolled'. 'pending' only includes Apple (macOS, iOS, iPadOS) hosts in Apple Business (AB) that are not yet enrolled to Fleet.
          schema:
            type: string
        - name: connected_to_fleet
          in: query
          description: Filter hosts that are talking to this Fleet server for MDM features. In rare cases, hosts can be enrolled to one Fleet server but talk to a different Fleet server for MDM features. In this case, the value would be `false`. Always `false` for Linux hosts.
          schema:
            type: boolean
        - name: macos_settings
          in: query
          description: 'Filters the hosts by the status of the _mobile device management_ (MDM) profiles applied to hosts. Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
          schema:
            type: string
        - name: munki_issue_id
          in: query
          description: The ID of the _munki issue_ (a Munki-reported error or warning message) to filter hosts by (that is, filter hosts that are affected by that corresponding error or warning message).
          schema:
            type: integer
        - name: low_disk_space
          in: query
          description: _Available in Fleet Premium_. Filters the hosts to only include hosts with less GB of disk space available than this value. Must be a number between 1-100.
          schema:
            type: integer
        - name: disable_failing_policies
          in: query
          description: If `true`, hosts will return failing policies as 0 regardless of whether there are any that failed for the host. This is meant to be used when increased performance is needed in exchange for the extra information.
          schema:
            type: boolean
        - name: macos_settings_disk_encryption
          in: query
          description: Filters the hosts by disk encryption status. Valid options are 'verified', 'verifying', 'action_required', 'enforcing', 'failed', or 'removing_enforcement'.
          schema:
            type: string
        - name: bootstrap_package
          in: query
          description: _Available in Fleet Premium_. Filters the hosts by the status of the MDM bootstrap package on the host. Valid options are 'installed', 'pending', or 'failed'.
          schema:
            type: string
        - name: os_settings
          in: query
          description: 'Filters the hosts by the status of the operating system settings applied to the hosts. Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''. **Note: If this filter is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
          schema:
            type: string
        - name: os_settings_disk_encryption
          in: query
          description: 'Filters the hosts by disk encryption status. Valid options are ''verified'', ''verifying'', ''action_required'', ''enforcing'', ''failed'', or ''removing_enforcement''.  **Note: If this filter is used in Fleet Premium without a fleet ID filter, the results include only "Unassigned" hosts.**'
          schema:
            type: string
        - name: populate_software
          in: query
          description: If `false` (or omitted), omits installed software details for each host. If `"without_vulnerability_details"`, include a list of installed software for each host, including which CVEs apply to the installed software versions. `true` adds vulnerability description, CVSS score, and other details when using Fleet Premium. See notes below on performance.
          schema:
            type: string
        - name: populate_policies
          in: query
          description: If `true`, the response will include policy data for each host, including Fleet-maintained policies.
          schema:
            type: boolean
        - name: populate_users
          in: query
          description: If `true`, the response will include user data for each host.
          schema:
            type: boolean
        - name: populate_labels
          in: query
          description: If `true`, the response will include labels for each host.
          schema:
            type: boolean
        - name: include_device_status
          in: query
          description: If `true`, the response will include lock and wipe status (`mdm.device_status`) and `mdm.pending_action` information for each host.
          schema:
            type: boolean
        - name: profile_uuid
          in: query
          description: '**Requires `profile_status`**. The UUID of the profile to download.'
          schema:
            type: string
        - name: profile_status
          in: query
          description: '**Requires `profile_uuid`**. Valid options are ''verified'', ''verifying'', ''pending'', or ''failed''.'
          schema:
            type: string
        - name: dep_profile_error
          in: query
          description: 'If `true`, the response will only include Apple MDM hosts with DEP profile assignment errors(`mdm.dep_profile_error: true`).'
          schema:
            type: boolean
        - name: dep_assign_profile_response
          in: query
          description: Filters the hosts by DEP profile assignment status. Valid options are 'SUCCESS', 'FAILED', 'THROTTLED' or 'NOT_ACCESSIBLE'. Only Apple hosts which are, or were assigned to Fleet in ABM will be returned.
          schema:
            type: string
      responses:
        "200":
          description: Default response.
          content:
            application/json:
              schema:
                properties:
                  hosts:
                    items:
