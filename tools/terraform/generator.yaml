provider:
  name: fleetdm_teams
  schema_ref: '#/components/schemas/Team'

resources:
  team:
    create:
      path: /api/v1/fleet/fleets
      method: POST
    read:
      path: /api/v1/fleet/fleets/{id}
      method: GET
    update:
      path: /api/v1/fleet/fleets/{id}
      method: PUT
    delete:
      path: /api/v1/fleet/fleets/{id}
      method: DELETE
    schema:
      attributes:
        overrides:
          name:
            description: Team name
