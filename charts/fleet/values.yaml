## Section: Kubernetes
# All settings related to how Fleet is deployed in Kubernetes
hostName: fleet.localhost
replicas: 3 # The number of Fleet instances to deploy
revisionHistoryLimit: 10 # Number of old ReplicaSets for Fleet deployment to retain for rollback (set to 0 for unlimited)
imageRepository: fleetdm/fleet
imageTag: v4.81.2 # Version of Fleet to deploy
# imagePullSecrets is optional.
# imagePullSecrets:
#   - name: docker
#   - name: internal
deploymentAnnotations: {} # Additional annotations to add to the Fleet Deployment  # OPENFRAME(helm): fork-added Deployment annotations — openframe/docs/helm-chart.md
podAnnotations: {} # Additional annotations to add to the Fleet pod
serviceAnnotations: {} # Additional annotations to add to the Fleet service
serviceAccountAnnotations: {} # Additional annotations to add to the Fleet service account
resources:
  limits:
    cpu: 1 # 1 CPU Core
    memory: 4Gi
  requests:
    cpu: 0.1 # 0.1 CPU Core
    memory: 50Mi

# Node labels for pod assignment
# ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}

# Tolerations for pod assignment
# ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []

# Configurable affinity for pod assignment
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - fleet
          topologyKey: kubernetes.io/hostname
        weight: 100

ingress:
  enabled: false
  className: ""
  annotations:
    {}
    # kubernetes.io/tls-acme: "true"
    # nginx.ingress.kubernetes.io/proxy-body-size: 10m
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

## Section: Fleet
# All of the settings relating to configuring the Fleet server
fleet:
  # Will also be the targetPort for the service
  listenPort: 8080
  # servicePort is optional.  Use if the service port needs to differ from the listenPort above.
  # servicePort: 9080
  # Name of the Secret resource storing S3 bucket and optionally TLS secrets
  secretName: fleet
  # Whether or not to run `fleet db prepare` to run SQL migrations before starting Fleet
  autoApplySQLMigrations: true
  # Add extra annotations to the migration Job
  migrationJobAnnotations:
  # >>> OPENFRAME(helm): fork-added migration gate — openframe/docs/helm-chart.md
  # Init container that blocks the migration Job until MySQL accepts TCP connections.
  waitForMysql:
    enabled: true
    image: busybox:1.36
  # <<< OPENFRAME(helm)
  # >>> OPENFRAME(helm): upstream sets no probe timings and the defaults kill too early — openframe/docs/helm-chart.md
  probes:
    # 24 × 15 = 6 min
    startup:
      periodSeconds: 15
      failureThreshold: 25
      timeoutSeconds: 10
    # 8 × 15 = 2 min, keep it above readiness
    liveness:
      periodSeconds: 15
      failureThreshold: 9
      timeoutSeconds: 10
    # 4 × 15 = 1 min
    readiness:
      periodSeconds: 15
      failureThreshold: 5
      timeoutSeconds: 10
  # <<< OPENFRAME(helm)
  tls:
    enabled: true
    # Set to true if you need a separate secret for just TLS data.
    # Useful with cert-manager and similar deployments.
    uniqueTLSSecret: false
    secretName: fleet-tls
    compatibility: modern
    certSecretKey: server.cert
    keySecretKey: server.key
  auth:
    bcryptCost: 12
    saltKeySize: 24
  app:
    tokenKeySize: 24
    inviteTokenValidityPeriod: 120h # 5 days
  session:
    keySize: 64
    duration: 2160h # 90 days
  logging:
    debug: false
    json: false
    disableBanner: false
  # Fleet initial setup configuration
  setup:
    adminEmail: ""
    openframeMode: "0"  # OPENFRAME(helm): fork-added OpenFrame mode toggle — openframe/docs/helm-chart.md
    adminPassword:
      existingSecret: ""  # Name of a K8s Secret. If set, secretKeyValue is ignored.
      secretKeyKey: "FLEET_SETUP_ADMIN_PASSWORD"  # Key name within the secret to read the value from.
      secretKeyValue: "fleet"  # Plain text password (for dev/test only). Ignored if secret is set.
  # >>> OPENFRAME(mysql-multitenancy): OpenFrame feature block.
  openframe:
    multiTenancy:
      enabled: false
      tenantUuid: ""          # pinned mode: tenant UUID, stored in the chart-managed ConfigMap
      existingConfigMap: ""   # optional: read the tenant UUID from your own ConfigMap instead
      tenantUuidKey: "FLEET_OPENFRAME_TENANT_UUID"  # key holding the UUID in either ConfigMap
      teamId: ""              # escape hatch: direct FLEET_OPENFRAME_TEAM_ID pin (prefer tenantUuid)
      # shared mode only: comma-separated Fleet user e-mails allowed to run UNPINNED, i.e. across
      # every tenant on the shared DB. Empty (the default) means no such caller exists and shared
      # mode stays fail closed. Use a dedicated research account, never the per-tenant admin whose
      # token the gateway holds.
      superuserEmails: ""
  # <<< OPENFRAME(mysql-multitenancy)
  mdm:
    windows:
      wstepIdentityCertKey: ""
      wstepIdentityKeyKey: ""
  carving:
    s3:
      bucketName: ""
      prefix: ""
      accessKeyID: ""
      secretKey: s3-bucket
      region: ""
      endpointURL: ""
      forceS3PathStyle: false
      stsAssumeRoleARN: ""
  softwareInstallers:
    s3:
      bucketName: ""
      prefix: ""
      accessKeyID: ""
      secretKey: software-installers
      region: ""
      endpointURL: ""
      forceS3PathStyle: false
      stsAssumeRoleARN: ""
  license:
    secretName: ""
    licenseKey: license-key
  extraVolumes: []
  extraVolumeMounts: []

  # >>> OPENFRAME(hardening): non-root + read-only rootfs for every fleet container
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 3333
    runAsGroup: 3333
    fsGroup: 3333
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    runAsNonRoot: true
    runAsUser: 3333
    runAsGroup: 3333
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    privileged: false
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault
  # <<< OPENFRAME(hardening)
  # >>> OPENFRAME(helm): fork-added custom CA truststore support — openframe/docs/helm-chart.md
  # Add additional CA's to the Fleet container truststore
  # To add CA's, set enabled: true
  # Supports adding CA's from Config maps and Secrets
  # configMaps:
  #   - name: fleet-ca-config
  #   - name: ca-config-map-2
  #   - name: ca-config-map-3
  #   - name: ca-config-map-N
  # secrets:
  #   - name: fleet-ca-secret
  #   - name: ca-secret-2
  #   - name: ca-secret-3
  #   - name: ca-secret-N
  additionalCAs:
    enabled: false
    configMaps:
    # - name: fleet-ca-config
    secrets:
    # - name: fleet-ca-secret
  # <<< OPENFRAME(helm)

# Whether to make fleet vulnerability processing run in a dedicated container
# if you set dedicated=false, you need to increase the main resources section
# to 4Gi or the fleet container will be OOMKilled when vulnerability processing
# tries to run.
vulnProcessing:
  dedicated: false
  schedule: "0 * * * *"
  # >>> OPENFRAME(vuln-persistence): fork-added feed-cache persistence for the vuln cron — openframe/docs/helm-chart.md
  # When true, `schedule` is ignored and the job runs hourly at a minute derived
  # from `staggerKey`, so releases sharing a feed mirror or a database don't all
  # fire at :00.
  staggerSchedule: false
  # Hash input for the stagger; empty means the release namespace. Set it to
  # something that differs per release (cluster id, tenant id) whenever every
  # release lands in an identically named namespace — otherwise every release
  # derives the same minute and the stagger is a no-op.
  staggerKey: ""
  # Persist FLEET_VULNERABILITIES_DATABASES_PATH (/tmp/vuln) across runs so each
  # run only fetches feed deltas instead of the full ~800MB. Requires dedicated=true.
  persistence:
    enabled: false
    # existingClaim: ""  # reuse a pre-created PVC instead of the chart-managed one
    storageClassName: ""  # empty = cluster default
    size: 5Gi
    annotations: {}
    # One-shot Job mounting the claim at install so WaitForFirstConsumer classes
    # bind immediately instead of at the first cron tick (argo-cd issue #22940).
    bindJob:
      enabled: true
      image: busybox:1.36  # anything that can exit 0; same default as fleet.waitForMysql
      annotations: {}  # Argo CD users: argocd.argoproj.io/sync-options: Replace=true,Force=true
  # <<< OPENFRAME(vuln-persistence)
  resources:
    limits:
      cpu: 1 # 1GHz
      memory: 4Gi
    requests:
      cpu: 0.1 # 100Mhz
      memory: 50Mi

## Section: osquery
# All of the settings related to osquery's interactions with the Fleet server
osquery:
  # Name of the secret resource containing optional secrets for AWS credentials
  secretName: osquery
  nodeKeySize: 24
  labelUpdateInterval: 30m
  detailUpdateInterval: 30m

  # To change where Fleet store the logs sent from osquery, set the values below
  logging:
    statusPlugin: filesystem
    resultPlugin: filesystem

    # To congigure the filesystem logger, change the values below
    filesystem:
      statusLogFile: osquery_status # will be placed in the /logs volume
      resultLogFile: osquery_result # will be placed in the /logs volume
      enableRotation: false
      enableCompression: false
      volumeSize: 20Gi # the maximum size of the volume

    # To configure the AWS Firehose logger, change the values below
    firehose:
      region: ""
      accessKeyID: ""
      secretKey: firehose
      stsAssumeRoleARN: ""
      statusStream: ""
      resultStream: ""

    # To configure the AWS Kinesis logger, change the values below
    kinesis:
      region: ""
      accessKeyID: ""
      secretKey: kinesis
      stsAssumeRoleARN: ""
      statusStream: ""
      resultStream: ""

    # To configure the AWS Lambda logger, change the values below
    lambda:
      region: ""
      accessKeyID: ""
      secretKey: lambda
      stsAssumeRoleARN: ""
      statusFunction: ""
      resultFunction: ""

    # To configure the GCP PubSub logger, change the values below
    pubsub:
      project: ""
      statusTopic: ""
      resultTopic: ""

## Section: database
# All of the connection settings for MySQL
database:
  # Name of the Secret resource containing MySQL password and TLS secrets.
  # Only used when existingSecret is empty — see existingSecret below.
  secretName: mysql
  # >>> OPENFRAME(helm): fork-externalized DB connection config (ConfigMap/Secret refs) — openframe/docs/helm-chart.md
  # To read connection details from a ConfigMap instead of using static values below:
  existingConfigMap: ""  # Name of a K8s ConfigMap. If set, host/port/database/username values are ignored.
  configMapAnnotations: {}  # Annotations for the chart-managed fleet-database ConfigMap. Argo CD users making
                            # the migration Job a PreSync hook must put the ConfigMap in the same phase:
                            # argocd.argoproj.io/hook: PreSync + hook-delete-policy: HookFailed
  hostKey: "FLEET_MYSQL_HOST"
  portKey: "FLEET_MYSQL_PORT"
  databaseKey: "MYSQL_DATABASE"
  usernameKey: "MYSQL_USER"
  # To read password from a Secret instead of the chart-created one:
  existingSecret: ""  # Name of a K8s Secret. If set, secretName is ignored for password.
  secretAnnotations: {}  # Annotations for the chart-managed fleet-database Secret. Same PreSync note as above.
  secretKey: "MYSQL_PASSWORD"
  host: 127.0.0.1
  port: "3306"
  database: fleet
  username: fleet
  password: fleet  # Plain text password. Used only when secret is not set.
  # <<< OPENFRAME(helm)
  passwordKey: mysql-password
  maxOpenConns: 50
  maxIdleConns: 50
  connMaxLifetime: 0
  tls:
    enabled: false
    ## Commented options below are optional.  Uncomment to use.
    # caCertKey: ca.cert
    ## Client certificates require both the certKey and keyKey
    # certKey: client.cert
    # keyKey: client.key
    config: ""
    serverName: ""

