## Section: cache
# All of the connection settings for Redis
cache:
  address: 127.0.0.1:6379
  # >>> OPENFRAME(helm): fork-externalized Redis address config (ConfigMap ref) — openframe/docs/helm-chart.md
  # To read address from a ConfigMap instead of using the static value above:
  existingConfigMap: ""  # Name of a K8s ConfigMap. If set, address value is ignored.
  addressKey: "FLEET_REDIS_ADDRESS"  # Key name within the ConfigMap to read the value from.
  # <<< OPENFRAME(helm)
  database: "0"
  usePassword: false
  secretName: redis
  passwordKey: redis-password
  # >>> OPENFRAME(helm): upstream defaults this to 0, so a boot without Redis dies at once — openframe/docs/helm-chart.md
  connectRetryAttempts: 10
  # <<< OPENFRAME(helm)
  # >>> OPENFRAME(helm): fork-added Redis TLS, mirrors database.tls — openframe/docs/helm-chart.md
  # Managed Redis (Memorystore) answers only over TLS. The CA rides in an externally managed Secret,
  # mounted whole at /secrets/redis, exactly like the MySQL server CA.
  tls:
    enabled: false
    existingSecret: ""  # defaults to cache.secretName
    caCertKey: ""       # key inside that Secret holding the server CA in PEM
    serverName: ""      # only when the certificate names a host the address does not
  # <<< OPENFRAME(helm)
  # >>> OPENFRAME(redis-key-prefix): fork-added per-tenant Redis key prefix — openframe/docs/redis-key-prefix.md
  # When set, wires FLEET_REDIS_KEY_PREFIX from existingConfigMap[keyPrefixKey].
  # Required when sharing one Redis across multiple Fleet servers (multi-tenant).
  keyPrefixKey: ""
  # <<< OPENFRAME(redis-key-prefix)

## Section: GKE
# Settings that make running on Google Kubernetes Engine easier
gke:
  # The CloudSQL Proxy runs as a container in the Fleet Pod that proxies connections to a Cloud SQL instance
  cloudSQL:
    enableProxy: false
    imageRepository: gcr.io/cloud-sql-connectors/cloud-sql-proxy
    imageTag: 2.25.0-alpine
    verbose: true
    instanceName: "" # my-proj:us-central1:fleet-db, append ?private-ip=true for a private instance
    # >>> OPENFRAME(hardening): proxy image ships its own nonroot uid
    # uid and gid 65532 nonroot user in the proxy image
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      privileged: false
      readOnlyRootFilesystem: true
      seccompProfile:
        type: RuntimeDefault
    # <<< OPENFRAME(hardening)
  # The GKE Ingress requires a few changes that other ingress controllers don't
  ingress:
    useManagedCertificate: false
    useGKEIngress: false
    # 0 to allow the nodeport to be automatically selected, otherwise allowed range (30000-32767)
    nodePort: 0
  # Workload Identity allows the K8s service account to assume the IAM permissions of a GCP service account
  workloadIdentityEmail: ""

## Section: Environment Variables
# All of the environment variables that can be set for Fleet
environments:
  # MDM Settings
  # The following environment variable is required if you are using
  # Fleet's macOS MDM features.  In a production environment, it is recommended that
  # you store this private key in a secret and use envsFrom to reference the secret below.
  # For more information, check out the docs: https://fleetdm.com/docs/configuration/fleet-server-configuration#server-private-key
  FLEET_SERVER_PRIVATE_KEY: ""
  # >>> OPENFRAME(osquery-schema-search): keep the query-generation schema current in OpenFrame deployments
  FLEET_OSQUERY_SCHEMA_REFRESH_ENABLED: "false"
  FLEET_OSQUERY_SCHEMA_REFRESH_INTERVAL: "24h"
  FLEET_OSQUERY_SCHEMA_REFRESH_URL: "https://raw.githubusercontent.com/flamingo-stack/fleetmdm/main/schema/osquery_fleet_schema.json"
  # <<< OPENFRAME(osquery-schema-search)

