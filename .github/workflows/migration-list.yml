name: Migration list (using /tools/migration-list/migration-list.sh)

on:
  pull_request:
    paths:
      - 'server/datastore/mysql/migrations/tables/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  migration-list:
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      # Fetch full history so the script can read release tags, RC branches and the merge base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run migration-list.sh
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          ./tools/migration-list/migration-list.sh -b "origin/$BASE_REF" > migration_list.txt
          cat migration_list.txt

      - name: Comment on PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('migration_list.txt', 'utf8').trim();

            // Skip the comment when the PR changed migration files without adding or renaming one, such as test-only changes
            if (!/<-- NEW$/m.test(output)) {
              console.log('No added or renamed migrations, skipping comment');
              return;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Migration list\n\n\`\`\`\n${output}\n\`\`\``
            });
            console.log('Posted comment with migration list');
