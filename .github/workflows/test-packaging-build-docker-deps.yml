# This workflow tests packaging of fleetd with the
# `fleetctl package` command using a locally built fleetdm/wix image.
#
# It fetches the targets: orbit, osquery and fleet-desktop from the default
# (Fleet's) TUF server, https://tuf.fleetctl.com.
name: Test packaging with local fleetdm/wix

on:
  push:
    branches:
      - main
      - patch-*
      - prepare-*
    paths:
      - "tools/wix-docker/**"
      - ".github/workflows/test-packaging-build-docker-deps.yml"
  pull_request:
    paths:
      - "tools/wix-docker/**"
      - ".github/workflows/test-packaging-build-docker-deps.yml"
  workflow_dispatch: # Manual

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions:
  contents: read

jobs:
  test-packaging:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-4core]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: "go.mod"

      - name: Build fleetctl
        run: make fleetctl

      - name: Build fleetdm/wix
        run: make wix-docker

      #
      # Only testing MSI because PKG/RPM/DEB have no docker dependency.
      #

      - name: Build MSI
        run: ./build/fleetctl package --type msi --enroll-secret=foo --fleet-url=https://localhost:8080

      - name: Build MSI with Fleet Desktop
        run: ./build/fleetctl package --type msi --enroll-secret=foo --fleet-url=https://localhost:8080 --fleet-desktop
