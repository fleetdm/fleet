name: OpenAPI spec

on:
  pull_request:
    paths:
      - "docs/REST API/**"
      - "tools/openapi/**"
      - ".github/workflows/openapi.yml"
      - "Makefile"
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: "tools/openapi/go.mod"
          cache-dependency-path: "tools/openapi/go.sum"

      - name: Run generator tests
        run: cd tools/openapi && go test ./...

      - name: Generate and validate spec
        run: make openapi

      - name: Upload spec artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: openapi-spec
          path: tools/openapi/openapi.yml
          retention-days: 30

  contract-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: "go.mod"

      - name: Start Infra Dependencies
        run: docker compose up -d mysql redis

      - name: Generate go code
        run: make generate-go

      - name: Build fleet
        run: make fleet fleetctl

      - name: Run Fleet server
        env:
          FLEET_SERVER_ADDRESS: 0.0.0.0:1337
          FLEET_SERVER_TLS: false
        run: |
          mkdir ./fleet_log
          for i in {1..10}; do
            if make db-reset; then break; fi
            if [[ "$i" -eq 10 ]]; then echo "db-reset failed after 10 attempts"; exit 1; fi
            sleep 5
          done
          ./build/fleet serve --dev --dev_license 1>./fleet_log/stdout.log 2>./fleet_log/stderr.log &
          ./build/fleetctl config set --address http://localhost:1337 --tls-skip-verify
          for i in {1..30}; do
            if ./build/fleetctl setup --email admin@example.com --name Admin --password preview1337# --org-name Example; then break; fi
            if [[ "$i" -eq 30 ]]; then echo "fleetctl setup failed after 30 attempts"; exit 1; fi
            echo "Retrying setup in 5s..."
            sleep 5
          done

      - name: Verify endpoints against the live server
        run: |
          cd tools/openapi
          go run . generate
          go run . verify --server http://localhost:1337 --email admin@example.com --password 'preview1337#'

      - name: Upload fleet logs on failure
        if: failure()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: fleet-logs
          path: fleet_log
