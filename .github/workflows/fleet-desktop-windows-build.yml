name: Build Fleet Desktop (Windows)

# Builds the native Windows Fleet Desktop app (apps/fleet-desktop-windows/),
# code signs it with Fleet's DigiCert KeyLocker certificate via
# code-sign-windows.yml, and uploads the signed MSI as a workflow artifact. No
# GitHub Release is created. Also callable as a reusable workflow
# (workflow_call), which is how release-fleet-desktop-windows.yml produces the
# MSI it publishes to download.fleetdm.com.
#
# The EXE is signed before it's packaged, so both the MSI and the installed
# FleetDesktop.exe carry Fleet's signature:
#   build-exe -> sign-exe -> build-msi (packages the signed EXE) -> sign-msi
#
# This workflow always signs. If the signing secrets are unavailable (e.g. a
# fork PR that can't read secrets), it fails rather than producing an unsigned
# artifact.

on:
  push:
    branches:
      - main
    paths:
      - 'apps/fleet-desktop-windows/**'
      - '.github/workflows/fleet-desktop-windows-build.yml'
  pull_request:
    paths:
      - 'apps/fleet-desktop-windows/**'
      - '.github/workflows/fleet-desktop-windows-build.yml'
  workflow_dispatch:
  workflow_call:
    secrets:
      DIGICERT_KEYLOCKER_CERTIFICATE:
        required: true
      DIGICERT_KEYLOCKER_PASSWORD:
        required: true
      DIGICERT_KEYLOCKER_HOST_URL:
        required: true
      DIGICERT_API_KEY:
        required: true
      DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT:
        required: true

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh
    working-directory: apps/fleet-desktop-windows

permissions:
  contents: read

jobs:
  build-exe:
    name: Build FleetDesktop.exe
    runs-on: windows-2022
    outputs:
      version: ${{ steps.build.outputs.VERSION }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Publish EXE
        id: build
        run: .\build.ps1 -Configuration Release -SkipMsi

      - name: Upload unsigned EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-fleet-desktop-exe
          path: ${{ steps.build.outputs.EXE_PATH }}
          if-no-files-found: error
          retention-days: 1

  sign-exe:
    name: Sign FleetDesktop.exe
    needs: build-exe
    uses: ./.github/workflows/code-sign-windows.yml
    permissions:
      contents: read
      id-token: write # required for attestations
      attestations: write # required for attestations
    with:
      filename: FleetDesktop.exe
      download_name: unsigned-fleet-desktop-exe
      upload_name: signed-fleet-desktop-exe
    secrets:
      DIGICERT_KEYLOCKER_CERTIFICATE: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE }}
      DIGICERT_KEYLOCKER_PASSWORD: ${{ secrets.DIGICERT_KEYLOCKER_PASSWORD }}
      DIGICERT_KEYLOCKER_HOST_URL: ${{ secrets.DIGICERT_KEYLOCKER_HOST_URL }}
      DIGICERT_API_KEY: ${{ secrets.DIGICERT_API_KEY }}
      DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT }}

  build-msi:
    name: Build MSI
    needs: sign-exe
    runs-on: windows-2022
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'

      # build.ps1 -MsiOnly packages whatever is in the publish dir, so the
      # signed EXE must land exactly there.
      - name: Download signed EXE into publish dir
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-fleet-desktop-exe
          path: apps/fleet-desktop-windows/FleetDesktop/bin/Release/net8.0-windows/win-x64/publish

      - name: Verify EXE is signed
        run: |
          $sig = Get-AuthenticodeSignature FleetDesktop\bin\Release\net8.0-windows\win-x64\publish\FleetDesktop.exe
          if ($sig.Status -ne 'Valid') { throw "FleetDesktop.exe signature status is $($sig.Status)" }
          Write-Host "Signed by: $($sig.SignerCertificate.Subject)"

      - name: Build MSI
        id: build
        run: .\build.ps1 -Configuration Release -MsiOnly

      - name: Upload unsigned MSI
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-fleet-desktop-msi
          path: ${{ steps.build.outputs.MSI_PATH }}
          if-no-files-found: error
          retention-days: 1

  sign-msi:
    name: Sign MSI
    needs: [build-exe, build-msi]
    uses: ./.github/workflows/code-sign-windows.yml
    permissions:
      contents: read
      id-token: write # required for attestations
      attestations: write # required for attestations
    with:
      attest: true
      filename: fleet_desktop-v${{ needs.build-exe.outputs.version }}.msi
      download_name: unsigned-fleet-desktop-msi
      upload_name: fleet-desktop-windows-msi
    secrets:
      DIGICERT_KEYLOCKER_CERTIFICATE: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE }}
      DIGICERT_KEYLOCKER_PASSWORD: ${{ secrets.DIGICERT_KEYLOCKER_PASSWORD }}
      DIGICERT_KEYLOCKER_HOST_URL: ${{ secrets.DIGICERT_KEYLOCKER_HOST_URL }}
      DIGICERT_API_KEY: ${{ secrets.DIGICERT_API_KEY }}
      DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT }}
