# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # GHSA-mh99-v99m-4gvg (brace-expansion CVE-2026-14257) only lists 5.0.8 as
          # patched, but the fix was backported in 1.1.16 and 2.1.2, which is what we
          # install. Remove once the advisory's patched ranges are corrected upstream.
          # GHSA-j965-2qgj-vjmq (aws-sdk v2 region validation) has no fixed v2
          # release; the guidance is to migrate to SDK v3. skipper-s3 (used by the
          # fleet-agent-downloader) supports only v2.
          allow-ghsas: GHSA-mh99-v99m-4gvg, GHSA-j965-2qgj-vjmq
