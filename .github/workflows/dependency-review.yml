# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required,
# PRs introducing known-vulnerable packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
name: 'Dependency Review'
on: [pull_request]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 'Checkout Repository'
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false

      - name: 'Dependency Review'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # GHSA-mh99-v99m-4gvg (brace-expansion CVE-2026-14257) only lists 5.0.8 as
          # patched, but the fix was backported in 1.1.16 and 2.1.2, which is what we
          # install. Remove once the advisory's patched ranges are corrected upstream.
          # GHSA-j965-2qgj-vjmq (aws-sdk v2 region validation) has no fixed v2
          # release; the guidance is to migrate to SDK v3. skipper-s3 (used by the
          # fleet-agent-downloader) supports only v2.
          # Every entry from GHSA-qh2h-chj9-jffq onward is one class: sails-hook-grunt's
          # published npm-shrinkwrap.json wrongly includes its devDependencies (the
          # eslint 4 and mocha 3 subtrees, dev-only lint/test tooling never loaded at
          # runtime), and npm 10+ lockfile regeneration records parts of that subtree
          # as runtime scope. Affects the website/ and ee/fleet-agent-downloader/
          # lockfiles, which both use sails-hook-grunt. The set below is every active
          # advisory affecting the shrinkwrapped packages (growl, acorn, ansi-regex,
          # cross-spawn, debug, diff, eslint, ajv, ms, tmp), enumerated via the GitHub
          # advisory API so CI doesn't surface them one at a time.
          # TEMPORARY: remove the whole class once the upstream fix
          # (https://github.com/sailshq/sails-hook-grunt/pull/12) is published and
          # both lockfiles are regenerated.
          allow-ghsas: >-
            GHSA-mh99-v99m-4gvg, GHSA-j965-2qgj-vjmq, GHSA-qh2h-chj9-jffq,
            GHSA-6chw-6frg-f759, GHSA-93q8-gq69-wqmw, GHSA-3xgq-45jj-v275,
            GHSA-2g4f-4pwh-qvx6, GHSA-v88g-cgmw-v5xw, GHSA-9vvw-cc9w-f27h,
            GHSA-gxpj-cx7g-858c, GHSA-73rr-hh4g-fpgx, GHSA-h6ch-v84p-w6p9,
            GHSA-jcgq-xh2f-2hfm, GHSA-w9mr-4mfr-499f, GHSA-52f5-9888-hmc6,
            GHSA-ph9p-34f9-6g65
