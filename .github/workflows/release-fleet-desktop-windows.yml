name: Release Fleet Desktop (Windows)

# Publishes a tagged build of the native Windows Fleet Desktop app
# (apps/fleet-desktop-windows/) to download.fleetdm.com.
#
# Run manually from the Actions tab, selecting a fleet-desktop-windows-v* tag in
# the "Use workflow from" dropdown. The workflow:
# 1. Fails fast unless the ref is a fleet-desktop-windows-v<x>.<y>.<z> tag whose
#    commit is on main, the tag version matches <Version> in
#    FleetDesktop.csproj, and that version is not already uploaded
#    (releases are immutable).
# 2. Builds and signs the EXE and MSI via fleet-desktop-windows-build.yml.
# 3. Uploads to R2:
#    - fleet-desktop-windows/v<version>/fleet_desktop-v<version>.msi
#    - fleet-desktop-windows/v<version>/meta.json (version, fleet_desktop_msi_sha256, fleet_desktop_msi_url)
# 4. Downloads the MSI back from the public URL and verifies its SHA256
#    matches the built artifact, then writes the checksum to the run summary.
#
# No GitHub Release is created; the git tag is the release marker.

on:
  workflow_dispatch:
    inputs:
      testing:
        description: "Upload to download-testing.fleetdm.com instead of production."
        required: false
        default: false
        type: boolean

# Serialize releases so two runs can't race past the already-released check.
# Never cancel a release mid-upload; queue instead.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    # fail-fast using bash -eo pipefail. See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#exit-codes-and-error-action-preference
    shell: bash

permissions:
  contents: read

env:
  R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
  R2_ACCESS_KEY_ID: ${{ inputs.testing && secrets.R2_DOWNLOAD_TESTING_ACCESS_KEY_ID || secrets.R2_DOWNLOAD_ACCESS_KEY_ID }}
  R2_ACCESS_KEY_SECRET: ${{ inputs.testing && secrets.R2_DOWNLOAD_TESTING_ACCESS_KEY_SECRET || secrets.R2_DOWNLOAD_ACCESS_KEY_SECRET }}
  R2_BUCKET: ${{ inputs.testing && 'download-testing' || 'download' }}
  BASE_URL: ${{ inputs.testing && 'https://download-testing.fleetdm.com' || 'https://download.fleetdm.com' }}
  RELEASE_PREFIX: fleet-desktop-windows

jobs:
  checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Verify ref is a release tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must be dispatched from a fleet-desktop-windows-v* tag, not a $GITHUB_REF_TYPE ('$GITHUB_REF_NAME'). Select the release tag in the 'Use workflow from' dropdown."
            exit 1
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^fleet-desktop-windows-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match fleet-desktop-windows-v<major>.<minor>.<patch>."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main."
            exit 1
          fi

      - name: Verify tag version matches the app version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#fleet-desktop-windows-v}"
          app_version=$(python3 -c 'import xml.etree.ElementTree as ET; print(ET.parse("apps/fleet-desktop-windows/FleetDesktop/FleetDesktop.csproj").find("./PropertyGroup/Version").text)')
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::Tag version ($tag_version) does not match <Version> ($app_version) in apps/fleet-desktop-windows/FleetDesktop/FleetDesktop.csproj."
            exit 1
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

      - name: Verify version is not already released
        env:
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_REGION: auto
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ env.R2_ACCESS_KEY_SECRET }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ env.R2_ENDPOINT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sudo .github/scripts/rclone-install.sh
          : # Check via the R2 API rather than the public URL: it's authoritative,
          : # and a pre-upload GET of the URL could prime the CDN with a cached 404
          : # that the post-upload verification then trips over.
          : # Surface broken credentials/endpoint as their own failure before the
          : # exit-code handling below.
          rclone lsf "r2:${R2_BUCKET}" --max-depth 1 > /dev/null
          rc=0
          existing=$(rclone lsf "r2:${R2_BUCKET}/${RELEASE_PREFIX}/v${VERSION}/" 2>rclone-stderr.log) || rc=$?
          : # rclone exit 3 = directory not found, i.e. this version was never
          : # uploaded. Any other failure means we could not check; fail rather
          : # than risk overwriting an existing release.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then
            cat rclone-stderr.log >&2
            echo "::error::Could not determine whether v${VERSION} is already released (rclone exit code $rc)."
            exit 1
          fi
          if [ -n "$existing" ]; then
            echo "::error::${RELEASE_PREFIX}/v${VERSION}/ already exists at ${BASE_URL}. Releases are immutable; bump the version to publish a new build."
            exit 1
          fi

  build:
    name: Build and sign
    needs: checks
    permissions:
      contents: read
      id-token: write # required for attestations
      attestations: write # required for attestations
    uses: ./.github/workflows/fleet-desktop-windows-build.yml
    secrets:
      DIGICERT_KEYLOCKER_CERTIFICATE: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE }}
      DIGICERT_KEYLOCKER_PASSWORD: ${{ secrets.DIGICERT_KEYLOCKER_PASSWORD }}
      DIGICERT_KEYLOCKER_HOST_URL: ${{ secrets.DIGICERT_KEYLOCKER_HOST_URL }}
      DIGICERT_API_KEY: ${{ secrets.DIGICERT_API_KEY }}
      DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT: ${{ secrets.DIGICERT_KEYLOCKER_CERTIFICATE_FINGERPRINT }}

  upload:
    name: Upload MSI to R2
    needs: [checks, build]
    runs-on: ubuntu-latest
    outputs:
      msi_sha256: ${{ steps.prepare.outputs.msi_sha256 }}
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout code needed for R2 upload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/r2-upload/action.yml
            .github/scripts/rclone-install.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download built MSI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fleet-desktop-windows-msi

      - name: Prepare files for R2 upload
        id: prepare
        run: |
          MSI_NAME="fleet_desktop-v${VERSION}.msi"
          if [ ! -f "$MSI_NAME" ]; then
            echo "::error::Build artifact does not contain $MSI_NAME; the built app version disagrees with the tag."
            ls -la
            exit 1
          fi
          msi_sha256=$(shasum -a 256 "$MSI_NAME" | cut -d ' ' -f 1)
          RELEASE_DIR="${RELEASE_PREFIX}/v${VERSION}"
          mkdir -p "$RELEASE_DIR"
          mv "$MSI_NAME" "$RELEASE_DIR/"
          echo "{
            \"fleet_desktop_msi_url\": \"${BASE_URL}/${RELEASE_DIR}/${MSI_NAME}\",
            \"fleet_desktop_msi_sha256\": \"${msi_sha256}\",
            \"version\": \"${VERSION}\"
          }" > "$RELEASE_DIR/meta.json"
          : # Check that meta.json is valid
          jq -e . "$RELEASE_DIR/meta.json" > /dev/null
          echo "msi_sha256=$msi_sha256" >> "$GITHUB_OUTPUT"
          echo "upload_filenames=${RELEASE_DIR}/${MSI_NAME},${RELEASE_DIR}/meta.json" >> "$GITHUB_OUTPUT"

      - name: Upload MSI
        uses: ./.github/actions/r2-upload
        with:
          filenames: ${{ steps.prepare.outputs.upload_filenames }}

  verify:
    name: Verify uploaded MSI
    needs: [checks, upload]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      EXPECTED_SHA256: ${{ needs.upload.outputs.msi_sha256 }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Download release and verify checksum
        run: |
          RELEASE_DIR="${RELEASE_PREFIX}/v${VERSION}"
          MSI_URL="${BASE_URL}/${RELEASE_DIR}/fleet_desktop-v${VERSION}.msi"

          : # Retry to ride out CDN/object propagation right after upload.
          downloaded=false
          for attempt in $(seq 1 10); do
            if curl -fsSL -o downloaded.msi "$MSI_URL"; then
              downloaded=true
              break
            fi
            echo "Attempt $attempt: $MSI_URL not available yet, retrying in 30s..."
            sleep 30
          done
          if [ "$downloaded" != "true" ]; then
            echo "::error::Could not download $MSI_URL after 10 attempts."
            exit 1
          fi

          actual_sha256=$(shasum -a 256 downloaded.msi | cut -d ' ' -f 1)
          echo "Expected SHA256: $EXPECTED_SHA256"
          echo "Actual SHA256:   $actual_sha256"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Checksum mismatch for $MSI_URL."
            exit 1
          fi

          curl -fsS -o meta.json "${BASE_URL}/${RELEASE_DIR}/meta.json"
          if [ "$(jq -r '.fleet_desktop_msi_sha256' meta.json)" != "$EXPECTED_SHA256" ]; then
            echo "::error::meta.json sha256 does not match the built MSI."
            exit 1
          fi

      - name: Write release summary
        run: |
          RELEASE_DIR="${RELEASE_PREFIX}/v${VERSION}"
          {
            echo "## Fleet Desktop (Windows) v${VERSION} released"
            echo ""
            echo "- MSI: ${BASE_URL}/${RELEASE_DIR}/fleet_desktop-v${VERSION}.msi"
            echo "- meta.json: ${BASE_URL}/${RELEASE_DIR}/meta.json"
            echo "- SHA256: \`${EXPECTED_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
