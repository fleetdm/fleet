services:
  - type: web
    name: fleet-mcp
    runtime: go
    plan: standard
    # No rootDir: the build needs ../../schema (see the go.mod replace) and
    # Render hides files outside rootDir. buildFilter keeps autodeploys
    # scoped to what affects this binary.
    buildFilter:
      paths:
        - cmd/fleet-mcp/**
        - schema/**
    buildCommand: cd cmd/fleet-mcp && go build -o fleet-mcp .
    startCommand: ./cmd/fleet-mcp/fleet-mcp
    healthCheckPath: /healthz
    envVars:
      - key: FLEET_BASE_URL
        sync: false
      - key: FLEET_API_KEY
        sync: false
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
      # Upper bound run_live_query waits for hosts to report (Go duration).
      # Keep >= the Fleet server's FLEET_LIVE_QUERY_REST_PERIOD. The code default
      # when unset stays 25s; a hosted deployment targets whole fleets, where
      # enough hosts are asleep or offline that 25s returns a misleading
      # near-empty result before they check in.
      - key: FLEET_LIVE_QUERY_REST_PERIOD
        value: 900s
