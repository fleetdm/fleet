# This configuration is for incremental linting of new/experimental linters.
# It is used with --new-from-rev to only lint changed code.
# See .golangci.yml for the main linter configuration.
version: "2"

issues:
  max-issues-per-linter: 0 # show all issues
  max-same-issues: 0 # show all issues

linters:
  default: none
  enable:
    - gosec
    - modernize
    - testifylint
    - nilaway
    - setboolcheck
    - depguard
    - apiparamcheck
    - staticcheck
  settings:
    staticcheck:
      # Only enable SA1019 (deprecated function/method/field usage) here. It is disabled in the full
      # lint (.golangci.yml) because existing code has many deprecated usages, but we want to catch new
      # ones. All other staticcheck rules are owned by the full lint to avoid duplicate findings.
      checks:
        - "-all"
        - "SA1019"
    gosec:
      # Only enable rules that are too noisy on existing code but valuable for new code.
      # Existing violations were audited during the v2.7.1 -> v2.11.3 upgrade and found
      # to be false positives or safe patterns, but we want to catch real issues going forward.
      includes:
        - G101 # Potential hardcoded credentials.
        - G115 # Integer overflow conversion.
        - G117 # Marshaled struct field matches secret pattern.
        - G118 # Goroutine uses context.Background/TODO while request-scoped context is available.
        - G122 # Filesystem race in filepath.Walk/WalkDir callback.
        - G202 # SQL string concatenation.
        - G602 # Slice index out of range.
        - G704 # SSRF via taint analysis.
        - G705 # XSS via taint analysis.
        - G706 # Log injection via taint analysis.
        # Added by the v2.11.3 -> v2.13.2 upgrade (Go 1.27); excluded from the full lint in
        # .golangci.yml because existing code has not been audited against them yet.
        - G120 # Unbounded form parsing in HTTP handlers.
        - G124 # http.Cookie missing or insecure Secure/HttpOnly/SameSite attribute.
        - G404 # Weak random number generator.
        - G709 # Unsafe deserialization via taint analysis.
        - G710 # Open redirect via taint analysis.
    depguard:
      rules:
        no-old-rand:
          list-mode: lax
          deny:
            - pkg: math/rand$
              desc: Use math/rand/v2 instead
        no-plist-forks:
          list-mode: lax
          deny:
            - pkg: howett.net/plist
              desc: Use github.com/micromdm/plist instead
            - pkg: github.com/groob/plist
              desc: Use github.com/micromdm/plist instead
    custom:
      nilaway:
        type: module
        description: Static analysis tool to detect potential nil panics in Go code.
        settings:
          # Settings must be a "map from string to string" to mimic command line flags: the keys are
          # flag names and the values are the values to the particular flags.
          include-pkgs: "github.com/fleetdm/fleet/v4"
      setboolcheck:
        type: module
        description: Flags map[T]bool used as sets; suggests map[T]struct{} instead.
      apiparamcheck:
        type: module
        description: Flags json/url/query struct tags using deprecated "team"/"teams" and "query"/"queries" terms.
  exclusions:
    generated: strict
